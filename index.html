input,select,textarea{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--ln);border-radius:8px;padding:6px 8px;max-width:100%}textarea{width:100%;box-sizing:border-box}

<script>
/* ===== KONFIGURASI: tempel URL Web App Apps Script (berakhiran /exec) di bawah ini ===== */
const API_URL='https://script.google.com/macros/s/AKfycbzsv_6Y9_NfviWIjKKF-hqfcDeeBhP7Avt3rW4GEL9UMRDSKIzPgL8qo1ldxXE27siHHQ/exec';
/* ======================================================================================= */
const cloudOn=()=>/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[^\/]+\/exec$/.test(API_URL);
let AH='',CV=0,CT=null,CB=0,CF=0,CE=0,CPW=null,SN2={};
const cloudStatus=t=>{const e=document.getElementById('cs');if(e)e.textContent=t};
const cloudSaveAH=h=>{try{h?sessionStorage.setItem('kompre_ah',h):sessionStorage.removeItem('kompre_ah')}catch(e){}};
async function cloudApi(a,d){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({a},d||{}))});return r.json()}
function cloudSnap(){SN2=Object.fromEntries(S.pe.map(x=>[x.id,JSON.stringify([x.sc,x.h])]))}
function cloudQueue(ms){if(!cloudOn()||!ROLE)return;clearTimeout(CT);CT=setTimeout(cloudPush,ms==null?1200:ms);cloudStatus('Menyimpan…')}
async function cloudPush(){CT=null;if(!cloudOn()||!ROLE)return;if(CB){cloudQueue(800);return}CB=1;cloudStatus('Menyimpan…');
try{let r,sent={};
if(ROLE==='admin'){const s=Object.assign({},S);delete s.ak;const d={ah:AH,s,v:CV};if(CE)d.ak=S.ak;if(CPW)d.nak=CPW;r=await cloudApi('save',d)}
else{const ch=S.pe.filter(x=>SN2[x.id]!==JSON.stringify([x.sc,x.h]));if(!ch.length){CB=0;CF=0;cloudStatus('Tersinkron');return}ch.forEach(x=>sent[x.id]=JSON.stringify([x.sc,x.h]));r=await cloudApi('scores',{pe:ch.map(x=>({id:x.id,sc:x.sc,h:x.h}))})}
if(!r||!r.ok)throw new Error((r&&r.err)||'Gagal menyimpan');
CV=r.v;CE=0;CF=0;if(CPW){AH=CPW;CPW=null;cloudSaveAH(AH)}Object.assign(SN2,sent);cloudStatus('Tersinkron')
}catch(er){CF=1;cloudStatus('⚠ Belum tersimpan, ketuk untuk coba lagi');toast(String(er&&er.message||'Gagal menyimpan ke server'))}
CB=0}
async function cloudLoad(q){if(!cloudOn()||CB||CT)return;if(!q)cloudStatus('Memuat…');
try{const r=await cloudApi('get',{v:CV});if(CB||CT)return;
if(r.empty){CE=1;if(ROLE==='admin')cloudQueue(0);else cloudStatus('Server belum berisi data');return}
if(!r.ok)throw 0;CE=0;if(r.same){cloudStatus('Tersinkron');return}
S=r.s;CV=r.v;fix();try{localStorage.setItem('kompre25',JSON.stringify(S))}catch(e){}cloudSnap();R();cloudStatus('Tersinkron')
}catch(er){cloudStatus('⚠ Offline, memakai data di browser')}}
function cloudTap(){if(CF)cloudQueue(0);else cloudLoad()}
setInterval(()=>{if(!cloudOn()||!ROLE||CB||CT||document.hidden)return;const a=document.activeElement,d=document.getElementById('dlg');if(d&&d.open)return;if(a&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable))return;cloudLoad(true)},20000);
const M=[['NAHWU','Nahwu Shorof','NAH'],['SEJARAH','Sejarah','SEJ'],['NU','Aswaja / Ke-NU-an','NU'],['HADIS','Ilmu Hadis','HAD'],['FIQIH','Fiqih','FIQ']],SN={NAHWU:'NAHWU SHOROF'};
const PCSS='.sh{font:12px/1.4 Georgia,serif;color:#000;background:#fff;padding:16px;page-break-after:always}.sh h3{text-align:center;margin:8px 0}.kop{text-align:center;border-bottom:2px solid #000;padding-bottom:6px}.sh table{width:100%;border-collapse:collapse;margin:8px 0}.sh td,.sh th{border:1px solid #000;padding:4px;vertical-align:top;text-align:left}.pq{white-space:pre-wrap;unicode-bidi:plaintext}.ky{margin-top:4px;padding-top:3px;border-top:1px dashed #666;font-size:11px;white-space:pre-wrap}.tt{display:flex;justify-content:space-around;margin-top:14px;text-align:center}.tt div{width:30%;height:80px}.rh{white-space:normal}.rh ul,.rh ol{margin:3px 0;padding-left:22px}';
const DATA={"b": [{"id": "NAHWU-1", "m": "NAHWU", "n": 1, "q": "Menasobkan mubtadak dan khobar sekaligus  merupakan tugasnya, ini adalah pengertian dari apa?\nJawab : \nitu adalah pengertian dari amil nawasikh dzonna dan saudara-saudaranya . contohnya adalah : ظَنَنْتُ زَيْدًا ذَاهِبًا  yang semula  susunan mubtadak khobar : زَيْدٌ ذَاهِبٌ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-2", "m": "NAHWU", "n": 2, "q": "Dalam hukum bacaanya , ada beberapa kalimat isim yang selamanya di baca nasob? , Sebutkan 5 saja , beserta contohnya !\nJawab:  \nisim yang selamanya di baca nasob itu ada 15 :\n• Maf'ul Bih   contoh :  ضَرَبْتُ زَيْدًا \n• Masdar    contoh :  ضَرَبَ يَضْرِبُ ضَرْبًا\n• Dharaf Zaman  contoh : نام احمد ليلا \n• Dharaf Makan    contoh : جلست امام الفصل \n• Hal     contoh :   جَاءَ زَيْدٌ رَكِبًا", "t": "Susah", "k": "A"}, {"id": "NAHWU-3", "m": "NAHWU", "n": 3, "q": "Dalam ilmu tashrif terdapat istilah shighot , jelaskan apa maksudnya dan sebutkan macam-macamnya! \nJawab :\nShighot adalah bentuk suatu kata melihat makna dan zaman serta posisinya. Sedangkan pembagianya adalah  :\nFi’il Madzi, Fi’il Mudhori’ , Masdar, , Isim Fa’il  , Isim Maf’ul ,Fi’il Amar , Fi’il Nahi, Isim Zaman, Isim Makan, Isim Alat.", "t": "Mudah", "k": "A"}, {"id": "NAHWU-4", "m": "NAHWU", "n": 4, "q": "Untuk mengetahui Posisi sebuah Kata tentu kita mengenal dengan Isim Masdar  , jelaskan pengertiannya serta sebutkan klasifikasinya beserta contohnya !\nJawab :  \nIsim Masdar adalah kalimat isim yang di baca nasob yang dalam urutan pentashrifan jatuh pada urutan ketiga setelah fi’ilnya. Sedangkan pembagiannya isim masdra itu ada Dua, yakni :\n1. Masdar Lafdzi : Masdar yang secara lafadz dan maknanya sama dengan fi’ilnya , contoh : قَتَلْتُهُ قَتْلًا\n2. Masdar Ma’nawi : Masdar yang secara makna sama dengan fiilnya, sedangkan lafadznya berbeda, contoh : جَلَسْتُ قُعُوْدًا", "t": "Susah", "k": "A"}, {"id": "NAHWU-5", "m": "NAHWU", "n": 5, "q": "Perhatikan Firman Alloh Berikut Ini : إِنَّ اللهَ لَا يُحْلِفُ المِيْعَادَ , Silahkan Kamu Tashrif Lafadz yg bergaris bawah dengan tashrif Istilahi !: \nJawab :احلف يحلف احلافا ومحلفا فهو محلف وذاك  محلف احلف لاتحلف محلف محلف", "t": "Susah", "k": "A"}, {"id": "NAHWU-6", "m": "NAHWU", "n": 6, "q": "Dalam hokum bacaanya , ada beberapa kalimat isim yang  selamanya di baca Rofak,  sebutkan beserta contohnya : \nJawab : \nIsim yang selamanya di baca Rofak itu ada 7 :\n Fa’il      contoh : يَنْصُرُ زَيْدٌ عَمْرًا\n Naibul Fa’il     contoh :نُصِرَ عَمْرٌ\n Mubtadak     contoh : زَيْدٌ قَاءِمُ\n Khobar Mubtadak    contoh : زَيْدٌ قَاءِمُ\n Isimnya Kaana Dan Saudaranya contoh : : كَانَ زَيْدٌ قاءِمًا\n Khobarnya Inna Dan Saudaranya contoh : اَنَّ زَيْدًا قَاءمٌ\n Isim Tabi’", "t": "Susah", "k": "A"}, {"id": "NAHWU-7", "m": "NAHWU", "n": 7, "q": "Perhatikan Hadist Berikut ini :خَيْرُكُمْ مَنْ تَعَلَّمَ اْلقُرْآنَ وَعَلَّمَهُ , silahkan anda Tashrif kalimat yg bergaris bawah dengan tashrif istilahi ! \nJawab :ومتعلما فهو متعلم وذاك  متعلم تعلم لاتعلم متعلم متعلم تعلم يتعلم تعلما", "t": "Susah", "k": "A"}, {"id": "NAHWU-8", "m": "NAHWU", "n": 8, "q": "Ketika ada dua kata dijadikan menjadi sebuah kalimat yang utuh dalam disipilin ilmu nahwunya di sebut apa? Jelaskan beserta contohnya !\nJawab : \nDua kata yang di jadikan satu kalimat di sebut : Susunan Idofah. sedangkan idofah itu terdiri dari Mudof ( kata yg pertama) dan Mudof Ilaih (kata yg kedua ). Contoh :صِرَاطَ المُسْتَقِيْمِ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-9", "m": "NAHWU", "n": 9, "q": "Perhatikan Ayat berikut ini  وَلَاۤ اَنَا عَابِدٌ مَّا عَبَدْتُّمْ  jelaskan kedudukan Lafadz yang bergaris bawah , serta tashrifkan dengan tashrrif lughowi !\nJawab : \nLafadz tersebut kedudukannya sebagai Fa’il / pelaku  , sedangkan Tashrifannya adalah :\nعابد عابدان عابدون وعباد وعبد وعبده عابداه عابدتان عابداه وعوابد", "t": "Susah", "k": "A"}, {"id": "NAHWU-10", "m": "NAHWU", "n": 10, "q": "Amil nawasikh memiliki pengaruh terhadap susunan dan I’rob bacaan dari mubtadak dan khobar, dari beberapa amil nawasikh , ada amil Kanaa Dan Saudaranya , jelaskan apa pengaruh dari Amil Kaanaa Dan saudaranya tersebut !\nJawab : \nPengaruh Amil nawasikh Kanaa dan saudaranya adalah merofakkan mubtadak menjadi isimnya Kanaa dan menasobkan khobar menjadi khobarnya Kanaa. Contoh :وَكَا نَ اللّٰهُ غَفُوْرًا رَّحِيْمًا", "t": "Mudah", "k": "A"}, {"id": "NAHWU-11", "m": "NAHWU", "n": 11, "q": "Perhatikan hadist rosul  berikutكُلُّ مَعْرُوْفٍ صَدَقَةٌ , jelaskan kedudukan dari kalimat yang bergaris bawah , serta tashrifkan dengan tashrif istilahi !\nJawab : \nKalimat tersebut kedudukannya sebagai isim maf’ul. Dari fi’il   عرف  , sedangkan tashrifannya adalah : عرف يعرف عرفا ومعرفا فهو عارف وذاك معروف اعرف لاتعرف معرف معرف", "t": "Susah", "k": "A"}, {"id": "NAHWU-12", "m": "NAHWU", "n": 12, "q": "Tidak semua kalimat    bisa di kategorikan sebuah kalimat yang bisa memiliki arti yang bisa di fahami maksud dan tujuannya, bagaimanakah system sebuah kalimat dalam disiplin ilmu nahwu ,sehingga bisa difahami pendengarnya ?\nJawab : \nKalimat tersebut harus memenuhi syarat –syarat bisa dikatakan sebuah kalimat, diantaranya\n  Lafadz  : bunyi suara terdiri dari huruf hijaiyyah \n Murokkab  : Harus tersusun dari dua suku kata atau lebih \n Mufid  : Mengandung arti yang bisa di fahami\n Wadlo’ : Pengucapannya dalam keadaan di  sengaja . contoh :  استاذ حاضر", "t": "Mudah", "k": "A"}, {"id": "NAHWU-13", "m": "NAHWU", "n": 13, "q": "Silahkan anda jelaskan  lafadzاكرم   itu sighotnya (bentuknya) sebagai apa? Mujarrod atau mazidkah? kemudian Tashrifkan dengan tashrif Istilahi !\nJawab : \nLafadz اكرم   Shighotnya adalah fi’il Madzi  dan berupa Tsulasi Mazid yang mengalami penambahan hurufnya, sedangkan huruf asalnya adalah كرم . Tashrifnya :\nاكرم يكرم اكراما ومكرما فهو مكرم وذك مكرم اكرم لاتكرم مكرم مكرم مكرم", "t": "Susah", "k": "A"}, {"id": "NAHWU-14", "m": "NAHWU", "n": 14, "q": "Jelaskan pengertian dari mubtadak serta ada berapa macamkah klasifikasinya !\nJawab : \nMubtadak adalah isim yang di baca rofak yang menjadi awalan sebuah kalimat dan di sunyikan dari amil lafdzi. Sedangkan pembagiannya ada 2 :\na. Mubtadak isim dhohir ( Mubtadak yang terbuat dari isim dhohir ) contoh :استاذ جالس \nb. Mubtadak isim dlomir ( Mubtadak yang terbuat dari isim dlomir ) contoh :انا طالب \nSedangkan pengertian Amil Lafdzi adalah amil yang Nampak keberadaannya dalam kalimat secara lafadznya.\nSedangkan Isim dlomir itu banyaknya ada 14 yakni :\nهو هما هم هی هما هن انت انتما انتم انت انتما انتن انا نحن", "t": "Susah", "k": "A"}, {"id": "NAHWU-15", "m": "NAHWU", "n": 15, "q": "Jelaskan devinisi dari tashrif serta sebutkan klasifikasinya !\nJawab :  \nSecara umum tashrif adalah perubahan suatu bentuk kata dalam bahasa arab dengan memandang makna yang berbeda-beda serta pelaku yang berbeda-beda. Sedangkan tasrihf terbagi menjadi dua bagian ;\na. Tashrif istilahi : Perubahan suatu kata yang terjadi karna pengalihan waktu kejadiannya, seperti waktu yang sudah lampau hingga waktu yang sedang terjadi , dari kata kerja hingga menjadi kata perintah.\nb. Tashrif lughowi :  Perubahan suatu kata yang terjadi karena pengalihan bentuk dan pelakunya , seperti perubahan dari bentuk mufrod, muannas dan jamaknya , serta dari mutakallim , mukhotob dan mudzakar muannasnya.", "t": "Mudah", "k": "A"}, {"id": "NAHWU-16", "m": "NAHWU", "n": 16, "q": "Dalam disiplin ilmu Nahwu setiap ada Mubtadak pasti ada khobar, Jelaskan Pengertian dari khobar serta pembagiannya !\nJawab : \nKhobar adalah Kalimat isim yang di baca rofak yang maknanya di sandarkan kepada mubtadak. Sedangkan pembagian khobar ada dua :\na. Khobar mufrod : Khobar yang terbuat dari kalimat yang bukan terdiri dari jumlah . \nContoh :طالب کاتب \nb. Khobar Ghoiru mufrod : Khobar yang terbuat dari Jumlah,  contoh  : طالب فی الفصل", "t": "Mudah", "k": "A"}, {"id": "NAHWU-17", "m": "NAHWU", "n": 17, "q": "Kita tahu dalam disiplin ilmu tashrif terbagi menjadi beberapa bab , baik stulasi maupun ruba’I, sebutkan dan contohkan !\nJawab : \nDalam tsulasi terbagi menjadi dua bab yakni, :\na. Tsulasi mujarrod ada 6 bab yakni :فعل یفعل ‍‍٬ فعل یفعل ‍‍٬ فعل یفعل ‍‍٬ فعل یفعل ‍‍٬ فعل یفعل ‍‍٬ فعل یفعل ‍‍   \nb. Tsulasi mazid ada 12 bab yakni : فعل یفعل ‍‍٬ فاعل یفاعل ٬ افعل یفعل ٬ تفاعل یتفاعل ٬ تفعل یتفعل ٬ افتعل یفتعل٬ انفعل ینفعل ٬ افعل یفعل ٬استفعل یستفعل ٬ افعوعل یفعوعل ٬ افعال یفعال ٬ افعول یفعول\nc. Ruba’I mujarrod ada 1 bab, yakni :  فعلل یفعلل \n\nd. Ruba’I mazid ada 3 bab, yakni :تفعلل یتفعلل٬ افعنلل یفعنلل ٬ افعلل یفعلل", "t": "Susah", "k": "A"}, {"id": "NAHWU-18", "m": "NAHWU", "n": 18, "q": "Silahkan anda tarkib kalimat berikut ini :بسم الله الرحمن الرحیم sebutkan ada kalimat apa saja beserta tanda2nya dan I’robnya !\nJawab : \n'a. اسم  adalah kalimat isim tandanya bisa dimasuki salah satu tandanya kalimat isim yang berupa huruf jer. Sedangkan I’robnya adalah jer, tanda jer nya adalah kasroh sebab dia isim mufrod . \nb. الله kalimat isim tandanya bisa menerima tandanya kalimat isim, sedangkan I’robnya adalah jer sebab posisinya sebagai mudof ilaih .\nc. الرحمن  adalah kalimat isim sebab kemasukan salah satu tandanya isim yakni kemasukan al, I’robnya jer sebab menjadi sifat dari mausuf الله tanda jernya kasroh sebab isim mufrod. \nd. الرحیم  keterangannya sama dengan lafadz ar rohman.", "t": "Susah", "k": "A"}, {"id": "NAHWU-19", "m": "NAHWU", "n": 19, "q": "Dalam ilmu tashrif ada bab yang menerangkan tentang cara mengklarifikasi  bentuk kalimat dan tata letak nya , apa nama bab tersebut dan sebutkan pembagiannya!\nJawab : \nBab BINAK, sedangkan binak dalam ilmu tasrif itu terbagi menjadi 7 macam:\n1. Binak Shohih : Kalimat yang huruf asalnya ( fak fi’il, ain fi’il dan lam fi’il)tidak berupa huruf illat, huruf yang dobel dan tidak berupa hamzah. Contoh :نصر    .جلس\n2. Binak Mitsal : Kalimat yang fa’ fi’ilnya berupa huruf illat, jikalau berupa huruf illat wawu di sebut mitsal wawi , contoh :وعد., jikalau berupa huruf illat yak di sebut mistal ya’I, contoh :یسر\n3. Binak Ajwaf : Kalimat yang a’in fi’ilnya berupa huruf illat, contoh : صان  asalnya صون \n4. Binak Naqis :  Kalimat yang Lam fi’il nya berupa huruf illat . contoh :  غزو    رمی\n5. Binak Lafif: Binak lafif terbagi menjadi 2:\na. Lafif Mafruq : Kalimat yang fa’ fi’il dan lam fi’il berupa huruf illat, contoh :وقی\nb. Lafif Maqrun : Kalimat yang a’in fi’il dan lam fi’ilnya berupa huruf illat, contoh :قویؤ.", "t": "Susah", "k": "A"}, {"id": "NAHWU-20", "m": "NAHWU", "n": 20, "q": "Dalam disiplin ilmu nahwu kalimat terbagi menjadi tiga bagian, yakni isim , fi’il dan huruf  jelaskan maksud dari ke tiga nya serta sebutkan hal2 yang berkaitan dengan nya !\nJawab :  \nkalimat isim adalah : Kalimat yang menunjukkan arti benda, nama-nama yang tidak terikat dengan waktu. Sedangkan tanda-tandanya kalimat isim adalah :\n1. Bisa kemasukan Tanwin contoh :   کتاب    قلام    dll.\n2. Bisa kemasukan Al , contoh  : الکبیر   المسجید dll.\n3. Bisa kemasukan huruf jer contoh :فی البیتdll.\n4. Berakhiran kasroh contoh : رسول الله\nb.  Kalimat fi’il adalah : Kalimat  yang menunjukkan arti pekerjaan yang terikat dengan waktu , baik sudah di kerjakan atau sedang dikerjakan. Sedangkan tanda-tandanya adalah \n1. Bisa kemasukan Qod , contoh:قد قام\n2.  Bisa kemasukan Saufa , contoh :سوف یقوم \n3. Bisa Kemasukan Tak taknis sakinah , contoh :   قد قامت الصلا‍ \nc.  Kalimat Huruf adalah ; Kalimat yang tidak bisa kemasukan tandanya kalimat isim dan tandanya kalimat fiil. Contoh :فی  علی   dll.", "t": "Susah", "k": "A"}, {"id": "NAHWU-21", "m": "NAHWU", "n": 21, "q": "Bagaimanakah tasrifhan  dari fiil mudori’يَقْرَأُ? ( Tashrif lughowi )\n\nJawab :يَقْرَآنِيَقْرَأُوْنَتَقْرَأُتَقْرَآنِيَقْرَأْنَتَقْرَأُتَقْرَآنِ  تَقْرَأُوْنَ تَقْرَئِيْنَتَقْرَآنِتَقْرَأْنَأَقْرَأُنَقْرَأيَقْرَأُ", "t": "Susah", "k": "A"}, {"id": "NAHWU-22", "m": "NAHWU", "n": 22, "q": "Silahkan anda klarifikasi hadist  berikut ini, :    اُطْلُبِ العِلْمَ مِنَ المَهْدِ إِلىَ اللَّحْدِtentukan jenis kalimatnya, I’rob  dan kedudukannya!. \nJawab : \na.  lafadz اُطْلُبِ : berupa kalimat fiil amar tandanya bisa kemasukan tandanya fi’il , sedangkan I’robnya jazem , tanda jazemnya sukun sebab berupa fi’il yang akhir salim .\nb. lafadz العِلْمَ : berupa kalimat isim , tandanya kemasukan “al” dan berakhiran kasroh. I’robnya nashob sebab kedudukannya sebagai maf’ul bih ( obyek) tanda nashobnya fathah sebab isim mufrod.\nc.  lafadz مِنَ المَهْدِ إِلىَ اللَّحْد : lafadz min dan ilaa sama-sama kalimat huruf sebab tidak bisa kemasukan tandanya isim dan fiil. Lafadz Mahdi dan lahdi  sama – sama kalimat isim, sebab mereka kemasukan tandanya kalimat isim berupa kemasukan huruf jer. Sedangkan I’rob keduanya adalah jer, tanda jernya kasroh sebab keduanya berupa isim mufrod.", "t": "Susah", "k": "A"}, {"id": "NAHWU-23", "m": "NAHWU", "n": 23, "q": "Silahkan anda tasrif  secara lughowi fi’il amarya  dari fiil  : کتب  !\nJawab :اُكْتُباَ   كْتُبُوْا  اُكْتُبِيْ  اُكْتُباَ  اُكْتُبْنَ ْ اُكْتُبْ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-24", "m": "NAHWU", "n": 24, "q": "Dalam disiplin ilmu nahwu terdapat istilah kalimat isim mu’rob dan Mabni, Jelaskan maksud dari keduanya dan sebutkan klasifikasinya !\nJawab : \nkalimat isim yang mu’rob adalah kalimat isim yang mengalami perubahan bacaan di akhirnya di sebabkan amil yang masuk. Sedangkan mabni adalah kalimat isim yang tidak berubah bacaan akhirnya walaupun ada amil yang masuk .sedangkan isim yang mabni itu berupa  :\n1. Isim  dlomir,  contoh  :     نَحْنُ ,  أَنَا\n2. Isim maushul, contoh  :الَّذِى\n3. Isim isyaroh, contoh :هَذّا\n4. Isim istifham, contoh :كَمْ\n5. Isim Syarat, contoh  :مَنْ\n6. Isim fi’il, contoh : حَيَّ", "t": "Susah", "k": "A"}, {"id": "NAHWU-25", "m": "NAHWU", "n": 25, "q": "Silahkan anda tashrif fiil tsulasi mazid dari wazan فعل  dengan tashrif istilahi !\nJawab :نور ینور تنویرا تنوره تنوارا تنوارا منوارا فهو منور وذاک منور نورلاتنور  منور۲", "t": "Susah", "k": "A"}, {"id": "NAHWU-26", "m": "NAHWU", "n": 26, "q": "Silahkan anda tarkib Firman Alloh suroh Al Mulk berikut ini dengan menentukan jenis kalimat ,kedudukannya , juga  I’rob beserta alasannya: تَبٰرَكَ الَّذِىۡ بِيَدِهِ الۡمُلۡكُ وَهُوَ عَلٰى كُلِّ شَىۡءٍ قَدِيۡرُۙ\nJawab : \n1. تَبٰرَكَ merupakan kalimat fi’il madzi tandanya bisa kemasukan salah satu tandanya kalimat fiil. I’robnya mabni ‘ala fathin.\n2. الَّذِىۡ merupakan kalimat isim yakni isim maushul , irobnya mabni, berfungsi sebagai penyambung dari fiil dan fa’il supaya menjadi satu kesatuan. \n3. بِيَدِهِ merupakan susunan jer majrur , I’robnya jer tanda jernya kasroh sebab isim mufrod.\n4. الۡمُلۡكُ Merupakan kalimat isim, tanda isimnya kemasukan al .sedangkan I’robnya adalah rofak, sebab berkedudukan sebagai faa’il ( subyek ) dari  fi’il (kata kerja) تَبٰرَكَ. Sedangkan tanda rofaknya dlomah sebab isim mufrod.\n5. وَهُو Merupakan isim dlomir munfashil ,irobnya mabni.sedangkan kedudukannya sebagai mubtadak . \n6. كُلِّ شَىۡءٍ Merupakan susunan idofah , mudofnya( كُلِّ) I’robnya jer sebab kemasukan huruf jer عَلٰى. Dan mudof ilaihnya( شَىۡء) I’robnya selamanya di baca jer.\n7. قَدِيۡرُ Merupakan kalimat isim, tandanya kemasukan salah satu tandanya isim yakni tanwin. I’robnya Rofak sebab berkedudukan sebagai khobar dari mubtadak وَهُو, tanda rofaknya domah sebab isim mufrod.", "t": "Susah", "k": "A"}, {"id": "NAHWU-27", "m": "NAHWU", "n": 27, "q": "Silahkan anda tashrif secara lughowi fiil mudloriknya dari fiil :یخاف ! \nJawab :\n  يَخَفْنَ    تَخَافُ تَخَافَانِ   تَخَافُوْنَ      تَخَافِيْنَ     تَخَافَانِ      تَخَفْنَ أَخَاف    نَخَافُ     تَخَافَانِ   تَخَافُ   يَخَافُوْن    يَخَافَانِ يَخَافُ", "t": "Susah", "k": "A"}, {"id": "NAHWU-28", "m": "NAHWU", "n": 28, "q": "Dalam disiplin ilmu nahwu ada istilah” jumlah”  dan “Syibhul jumlah”  , Jelaskan apa maksud dari keduanya dan sebutkan pembagaianya !\nJawab :\nJumlah adalah nama lain dari kalimat , yakni sebuah susunan kata yang mufidah / berfaidah. Sedangkan jumlah terbagi menjadi 2 bagian , yakni :\na. Jumlah Ismiyah : Susunan kaliamat yang di terdiri dari mubtadakdan khobar.\nb. Jumlah Fi’liyah : Susunan kalimat yang terdiri dari fi’il dan faa’il.\nSedangkan Syibhul jumlah adalah : kalimat yang sudah tersusun namun belum mufidah/berfaidah. Sedangkan Syibhul jumlah itu seperti :\na. Berupa susunan dlorof dengan mudof ilaih , contoh :  جَا نِبَ الْمَسْجِد\nb. Berupa susunan jer majrur , contoh : عَلَى الْمَكْتَب", "t": "Mudah", "k": "A"}, {"id": "NAHWU-29", "m": "NAHWU", "n": 29, "q": "Perhatikan penggalan ayat berikut ini :اِيَّاكَ نَعْبُدُ وَاِيَّاكَ نَسْتَعِيْنُ  , lafadz نَعْبُد silahkan anda tentukan apakah mujarrod atau mazid dan tashrifkan dengan tashrif  istilahi !\nJawab : \nlafadz fiil tsb stulasi  mujarrod bab 1 , عبد یعبد عبدا ومعبدا فهو عابد وذاک معبود اعبد لاتعبد معبد۲ معبد", "t": "Susah", "k": "A"}, {"id": "NAHWU-30", "m": "NAHWU", "n": 30, "q": "Dalam pembahasan ilmu nahwu dintemukan istilah isim taabi’ , jelaskan pengertiannya dan sebutkan klasifikasinya !\nJawab : \nIsim tabi’ adalah kalimat isim yang mengikuti kata sebelumnya (matbu’) dalam hal I’robnya, jenis kalimatnya. Sedangkan banyaknya isim tabi”  itu ada 4 :\n1. Naat ( sifat ) contoh :هَذَا بَيْتٌ كَبِيْرٌ\n2. Athof ,contoh :اِشْتَرَيْتُ كِتَابًا وَقَلَمًا\n3. Badal , contoh :جَاءَ الْمُحَاضِرُ اَحْمَدُ\n4. Taukid , contoh :جَاءَ اَحْمَدُ عَيْنُهُ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-31", "m": "NAHWU", "n": 31, "q": "Perhatikan penggalan ayat berikut ini :قُلْ اَعُوْذُ بِرَبِّ النَّاسِۙ , Silahkan  lafadz اَعُوْذُ tashrifkan dengan tashrif  istilahi !\nJawab :عاد یعود عودا ومعادا فهو عا۶د وذاک معود عذ لاتعذ معاذ۲ معوذ", "t": "Susah", "k": "A"}, {"id": "NAHWU-32", "m": "NAHWU", "n": 32, "q": "Mubtadak dan khobar selamanya selalu bersama , selama tidak ada amil yang mengganggu,  siapakah amil pengganggu itu ? \nJawab : \nAmil pengganggu tersebut di sebut amil nawasikh . sedangkan banyaknya amil    nawasikh itu ada 3, :\n1. كَانَ وَاَخْوَاتُهَا (kaana dan saudara-saudaranya)\n2. إِنَّ وَاَخْوَاتُهَا (Inna dan saudara-saudaranya)\n3. ظَنَّ وَاَخْوَاتُهَا (dzonna dan saudara-saudaranya )", "t": "Mudah", "k": "A"}, {"id": "NAHWU-33", "m": "NAHWU", "n": 33, "q": "Dalam disiplin ilmu shorof terdapat istilah binak lafif, jelaskan pengertian dan sebutkan macam-macamnya !\nJawab : \nBinak lafif adalah kaliamat yang huruf asalnya berupa huruf illat, sedangkan binak lafif itu terbagi menjadi dua macam :\n1. Lafif Maqrun : kalimat yang ‘ain dan lam fiilnya berupa huruf illat , contoh : شوی \n2. Lafif Mafruq : kalimat yang fa’ dan lam fiilnya berupa huruf illat, contoh : وقی", "t": "Mudah", "k": "A"}, {"id": "NAHWU-34", "m": "NAHWU", "n": 34, "q": "Dalam  lafadzإِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ ini merupakan  contoh dari implementasi ilmu nahwu dalam bab apa ?\nJawab : \nlafadz إِنَّ ٱللَّهَ غَفُورٌ merupakan contoh daripenerapan bab amil nawasikh, inna . yang tugasnya adalah menasobkan mubtadak menjadi isimnya dan merofakkan khobar mubtadak menjadi khobarnya. Adapun saudara saudaranya inna itu ada \n 1. إنَّ, contoh : \nإِنَّ اللَّهَ عَلَى كُلِّ شَيءٍ قَدِيرٌ    \n 2. أَنَّ  , contoh :\nأَشْهَدُ أَنَّ مُحَمَّدًا رَسُوْلُ الله\n 3. كَأَنَّ  , Contoh : \n كَأَنَّكَ نَاءِلٌ مَرَامَكَ\n 4. لَكِنَّ  Contoh :\nهُوَ عَالِمٌ لَكِنَّهُ غَيرُعَامِلٍ \n 5. لَعَلَّ , Contoh :\nلَعَلَّ عَلِيٌّ مَرِيضٌ \n 6. لَيْتَ , Contoh :\nلَيْتَ الشَّباَّ يَعُودُ يَوماً", "t": "Susah", "k": "A"}, {"id": "NAHWU-35", "m": "NAHWU", "n": 35, "q": "Silahkan anda tashrif kalimat قرا۶  dengan tasrif istilahi ! \nJawab :قرا۶ یقرا۶ قرا۶ ومقرا۶ فهو قار۶ وذاک مقرو۶ اقرا۶ لاتقرا۶ مقرا۶ ۲ مقرا۶", "t": "Susah", "k": "A"}, {"id": "NAHWU-36", "m": "NAHWU", "n": 36, "q": "Silahkan anda tarkib ayat berikut ini :إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ , tentukan kalimatnya, I’rob serta kedudukannya!\nJawab :إِنَّ adalah kalimat huruf , tandanya tidak bisa kemasukan tandanya isim dan tandanya fiil. Dan statusnya sebagai amil nawasikh . sedangkan lafadz ٱللَّهَ adalah kalimat isim jalalah tandanya kemasukan \"al “, I’robnya nashob sebab kedudukannya sebagai isimnya inna, alamat nashobnya menggunakan fathah , sebab isim mufrod. Sedangkan lafadz غَفُورٌ adalah kalimat isim, tanda isimnya kemasukan salah satu tanda isim yaitu tanwin, sedangkan I’robnya rofak sebab kedudukannya sebagai khobarnya inna , tanda rofaknya dlomah sebab isim mufrod. Lafadz رَّحِيم adalah kalimat isim tandanya sama dengan ghofurun ,I’robnya rofak sebab menjadi taukid dari lafadz ghofurun", "t": "Susah", "k": "A"}, {"id": "NAHWU-37", "m": "NAHWU", "n": 37, "q": "Perhatikan ayat berikut ini  :اِذَا وَقَعَتِ الْوَاقِعَةُۙ, kalimat yang bergaris bawah, itu kalimat apa? Serta tashrifkan  dengan tashrif lughowi !\nJawab :\nkalimat tesebut adalah kalimat fi’il , fi’il madzi , tashrifannya adalah :                           \n وقع وقع وقعوا وقعت وقعتا وقعن وقعت وقعتما وقعتم وقعت وقعتما وقعتمن وقعت وقعنا", "t": "Susah", "k": "A"}, {"id": "NAHWU-38", "m": "NAHWU", "n": 38, "q": "= اِذَا وَقَعَتِ الْوَاقِعَةُ lafadz al waqi’ah  kalimat apa, tandanya apa  dan irobnya apa ?\nJawab : \nlafadz al waqi’ah  adalah kalimat isim , tanda isimnya kemasukan salah satu tanda isim berupa ‘al’,I’robnya rofak sebab menjadi faa’il (subyek ) dari fiil وَقَعَتِ , sedangkan tanda rofaknya adalah dlomah , sebab isim mufrod. ( isim bermakna satu ).", "t": "Mudah", "k": "A"}, {"id": "NAHWU-39", "m": "NAHWU", "n": 39, "q": "Perhatikan ayat berikut ini  فَصَلِّ لِرَبِّكَ وَانْحَرْ , kalimat yang bergaris bawah berupa kalimat apa, Coba tashrifkan dengan tashrif istilahi !\nJawab :  \nKalimat tersebut adalah kalimat Fi’il , fi’ilnya fi’il Amar ( perintah ) dari fi’il madzi    صَلَّى\nSedangkan tashrifannya adalah :\nصَلَّى  يُصَلِّي  صَلاَةً فهو  مُصَلٍّ  وذاك  مُصلَّى صَلِّ  لا تصلى مصلى مصلى", "t": "Susah", "k": "A"}, {"id": "NAHWU-40", "m": "NAHWU", "n": 40, "q": "Kalimat isim itu dihukumi Mu’rob, namun ada kalimat isim yang selamanya di baca Jer / khofad, sebutkan ada berapa berikut contohnya !\nJawab :\nKalimat isim yang selamanya di baca Jer , itu ada 3 keadaan :\n1) Di Jer kan dengan Huruf jer , contoh : فِيْ القُرْآنِ\n2) Di Jer kan karna sebab susunan idofah , contoh : قِرَاءَةُ القُرْآنِ\n3) Di Jer kan sebab mengikuti  ( Tabi’). Contoh : قِرَاءَةُ القُرْآنِ الكَرِيْـمِ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-41", "m": "NAHWU", "n": 41, "q": "Dia sebagai kata ganti baik untuk orang pertama , kedua, ghoib, mutakallim dsb, dalam kaidahnya dia disebut apa ? Sebutkan pembagiannya, berikut contohnya !\nJawab : \nDalam kaidahnya dia di sebut isim Dlomir , Sedangkan secara garis besar isim dlomir itu terbagi menjadi 2, yaitu:\n1) Dlomir mustatir, Dlomir yang tersembunyi , contoh : اُفْعُلْ\n2) Dlomir Bariz , Dlomir yang tampak ,  sedangkan dlomir bariz terbagi menjadi 2 macam, yakni \n• Dlomir muttasil contoh : كتابُنَا\n• Dlomir Munfasil contoh : هي مُدَرِّسَةٌ", "t": "Susah", "k": "A"}, {"id": "NAHWU-42", "m": "NAHWU", "n": 42, "q": "Untuk mengetahui bacaan akhir sebuah kata , kita harus mengklarifikasi jenis I’robnya , tandanya serta alasannya, coba kamu klarifikasi kata berikut ini,     مُسْلِمُوْنَ  tentukan I’rob, tandanya dan alasannya. !\nJawab : \nKata tersebut I’robnya adalah irob Rofak , sedangkan tanda rofaknya adalah huruf wawu sebab dia berkedudukan sebagai jamak mudzakar salim.Sebab wawu menjadi tandanya I’rob rofak bertempat pada 2 tempat, yakni jamak mudzakar salim dan asmaul khomsah.", "t": "Mudah", "k": "A"}, {"id": "NAHWU-43", "m": "NAHWU", "n": 43, "q": "Silahkan anda tashrif secara lughowi fiil mudloriknya dari fiil :یخاف ! \nJawab :\n  يَخَفْنَ    تَخَافُ  تَخَافَانِ   تَخَافُوْنَ      تَخَافِيْنَ     تَخَافَانِ      تَخَفْنَ أَخَاف    نَخَافُ   تَخَافَانِ   تَخَافُ   يَخَافُوْنَ    يَخَافَانِ   يَخَافُ", "t": "Susah", "k": "A"}, {"id": "NAHWU-44", "m": "NAHWU", "n": 44, "q": "Ketika ada dua kata dijadikan menjadi sebuah kalimat yang utuh dalam disipilin ilmu nahwunya di sebut apa? Jelaskan beserta contohnya !\nJawab : \nDua kata yang di jadikan satu kalimat di sebut : Susunan Idofah. sedangkan idofah itu terdiri dari Mudof ( kata yg pertama) dan Mudof Ilaih (kata yg kedua ). Contoh :صِرَاطَ المُسْتَقِيْمِ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-45", "m": "NAHWU", "n": 45, "q": "Perhatikan ayat berikut ini, هُوَ الْمَسِيْحُ ابْنُ مَرْيَمَ , disitu di awali dengan isim dlomir, jelaskan jenis isim dlomirnya, serta tashrifkan !\nJawab :\njenis isim dlomir nya adalah dlomir munfasil , tashrifannya adalah :\n                                             نَحْنُ    أَنَا   أَنْتُنَّ   أَنْتُمَا   أَنْتِ  أَنْتُمْ  أَنْتُمَا   أَنْتَ     هُنَّ  هُمَا  هِيَ  هُمْ  هُمَا   هُوَ", "t": "Susah", "k": "A"}, {"id": "NAHWU-46", "m": "NAHWU", "n": 46, "q": "Secara garis besar nahwu shorof  membahas tata letak sebuah kata atau kalimat ,tak beda jauh dengan ilmu bahasa yang lain. Contoh, mengenai bentuk kata untuk arti satu, dua atau lebih. Dalam ilmu nahwunya , di istilahkan apa? Berikan contohnya !\nJawab : \nDalam ilmu nahwu shorofnya untuk mengetahuinya , ada 3 macam :\n1. Mufrod : untuk kata yang bermakna satu, contoh :كِتَابٌ\n2. Tasniyah : untuk kata yang bermakna dua, contoh :   'كِتَابَانِ  / كِتَابَيْنِ\n3. Jamak :\n Kalau untuk laki-laki di sebut Jamak Mudzakar , contoh : مُؤْمِنُوْنَ / مُؤْمِنِيْنَ\n Kalau untuk perempuan di sebut Jamak Muannas ,contoh : مُؤْمِنَاتٌ\n4. Jamak Taksir : Bentuk jamak yg tidak beraturan , contoh : كُتُبٌ dari mufrod كِتَابٌ", "t": "Susah", "k": "A"}, {"id": "NAHWU-47", "m": "NAHWU", "n": 47, "q": "= ذٰلِكَ بِاَنَّهُمْ كَانُوْا يَكْفُرُوْنَ بِاٰيٰتِ اللّٰهِ dalam ayat ini manakah  yang di sebut dengan isim isyaroh ? Silahkan tashrif isim isyaroh tersebut !\nJawab : \nDalam ayat tersebut isim isyarohnya adalah : ذٰلِكَ, sedangkan tashrifnya adalah :\nذَاكَ  ذَاكُمَا  ذَاكُمْ  ذَاكِي  ذَاكُمَا  ذَاكُنَّ تَاكَ تَاكُمَا  تَاكُمْ  تَاكِيْ  تَاكُمَا  تَاكُنَّ  هَؤُلآءِ", "t": "Susah", "k": "A"}, {"id": "NAHWU-48", "m": "NAHWU", "n": 48, "q": "Kata kerja ( predikat ) dalam Nahwu di sebut Fi’il , merupakan sebuah patokan kita bisa mengetahui sebuah pekerjaan atau peristiwa yang sedang, akan atau sudah terlaksana. Namun dalam realisasinya ternyata dalam nahwu banyak sekali macam dan bentuk kalimat fi’il, sebutkan berikut contohnya !\nJawab : \nDalam penerapannya , fiil terbagi menjadi 3 bentuk :\n Fi’il Madzi , kata kerja yang menunjukan pekerjaan yang sudah terjadi , contoh : فَتَحَ\n Fi’il mudhorik, kata kerja yang menunjukkan pekerjaan yang akan atau sedang terjadi, contoh : يَفْتَحُ\n Fi’il Amar , kata kerja yang menunjukkan arti perintah , contoh : اِفْتَحْ", "t": "Susah", "k": "A"}, {"id": "NAHWU-49", "m": "NAHWU", "n": 49, "q": "Belajar ilmu shorof sudah pasti mendengar istilah Wazan dan Mauzun, sebab keduanya merupakan standarisasi dan  istilah yang tidak bisa di pisahkan, dimana ada wazan pasti ada mauzun, begitupun sebaliknya. Jelaskan maksud keduanya,   berikit contohnya !\nJawab :\n• Wazan adalah suatu kata yang di jadikan patokan untuk membuat sebuat kata, yakni berupa fak fi’il, ain fi’il dan  lam fi’il . contoh : فَـــــــــعَـــــــــلَ         إِفْــــتَـــعَـــلَ\n• Mauzun adalah kata yang dipolakan mengikuti patokannya , contoh : جَـــــــمَــــــــــعَ         إِجْـــــتَــمَــعَ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-50", "m": "NAHWU", "n": 50, "q": "Silahkan anda tarkib ayat berikut ini :وَّاَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا اَبَابِيۡلَۙ   tentukan jenis kalimatnya, I’rob serta kedudukannya !\nJawab:\n• Lafadz اَرۡسَلَ adalah kalimat f’iil, tandanya bisa kemasukan tandanya kalimat fi’il.  fi’ilnya fi’il madzi mengikuti wazan أَفْعَلَ , I’robnya Mabni fathah.\n• Fafadz عَلَيۡهِمۡ , berupa susunan jer majrur , huruf jernya berupa على, sedangkan majrurnya berupa isim dlomir .\n• Lafadz طَيۡرًا adalah kalimat isim, tandanya kemasukan tanwin, sedangkan I’robnya adalah I’rob nasob , alamatnya fathah sebab berupa isim mufrod. Sedangkan kedudukannya sebagai maf’ul bih ( sasaran ).\n• Lafadz اَبَابِيۡلَ adalah kalimat isim , berupa isim ghoiru munshorif ( isim yang tidak menerima tanwin), I’robnya nasob , alamat nasobnya fathah, sebab berupa isim mufrod. Kedudukannya sebagai na’at / sifat dari lafadz طَيۡرًا.", "t": "Susah", "k": "A"}, {"id": "NAHWU-51", "m": "NAHWU", "n": 51, "q": "Silahkan kamu tashrif lafadz yg bergaris bawah dari ayat berikut :وَّاَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا اَبَابِيۡلَۙ  ! dengan tashrif istilahi !\nJawab :\nأَرْسَلَ  يُرْسِلُ  إِرْسَالاً فهو  مُرْسِلٌ  وذاك مُرْسَلٌ  أَرْسِلْ  لاَتُرْسِلْ مُرْسَلٌ  مُرْسَلٌ", "t": "Susah", "k": "A"}, {"id": "NAHWU-52", "m": "NAHWU", "n": 52, "q": "Klasifikasi I’rob dalam disiplin ilmu nahwu, oleh ulamak ahli nahwu di bagi menjadi 4 macam, yakni irob rofak, nasob, jer dan jazem. Dan dari masing2 I’rob tersebut ada harokat yang identic dengan nya, contoh , I’rob rofak itu identic dengan harokat domah. Namun ternyata ada lagi tandanya selain dlomah, sebutkan  ,berikut contohnya !\nJawab :\nTandanya I’rob Rofak itu ada 4 , yakni :\n• Dlomah ,    contoh : المؤمن \n• Wawu  ,   contoh :المُؤْمِنُوْنَ\n• Alif ,    contoh : المؤمنان \n• Tetapnya Nun contoh :   يفعلان", "t": "Susah", "k": "A"}, {"id": "NAHWU-53", "m": "NAHWU", "n": 53, "q": "Perhatikan Maqollah berikut :مَنْ جَدَّ وَجَدَ artinya siapa yang bersungguh-sungguh pasti akan berhasil, tolong anda tashrif lafad yg bergaris bawah dengan tashrif lughowi ( kebawah ) !\nJawab :\nTashrifannya adalah : \nوجد وجدا وجدوا وجدت وجدتا وجدن وجدت وجدتما وجدتم وجدت جدتما وجدتن وجدت وجدنا", "t": "Susah", "k": "A"}, {"id": "NAHWU-54", "m": "NAHWU", "n": 54, "q": "Dalam sebuah pekerjaan , pasti ada pelakunya , kalau dalam bahasanya  Subyeknya. Dalam tatanan bahasa arab pun demikian , hanya beda istilah saja, jelaskan apa istilah dalam nahwunya, beserta sesuatu yang berkaitan dengannya !\nJawab :\nDalam ilmu nahwunya subyek di istilahkan dengan Faa’il , Faa’il adalah isim yang di baca rofak yang di sebutkan setelah fi’ilnya , sedangkan faa’il terbagi menjadi dua :\n• Faa’il isim dhohir , contoh : ذَهَبَ مُحَمَّدٌ  ( Muhammad telah pergi )\n• Faa’il Isim Dlomir , contoh : تَــذْهَبُ ( Kamu lk2 sedang pergi )", "t": "Mudah", "k": "A"}, {"id": "NAHWU-55", "m": "NAHWU", "n": 55, "q": "Ada maqolah yang berbunyi  :     ﻓَﻜِّﺮْ ﻗَﺒْﻞَ ﺃَﻥْ ﺗَﻌْﺰِﻡَ   yang artinya, berfikirlah sebelum bertindak. Maqolah tersebut di awali dgn kalimat apa? Kemudian tashrifkan !\nJawab :\ndi awali dengan kalimat fi’il amar ( kata perintah ) yang mengikuti wazan فعل , sedangkan tashrifannya adalah :\nفكر فكرا فكروا            فكري فكرا فكرن", "t": "Mudah", "k": "A"}, {"id": "NAHWU-56", "m": "NAHWU", "n": 56, "q": "Isim  tabi’ adalah  , suatu lafadz yang mengikuti matbu’nya / kata yang di ikuti dalam segalannya, salah satunya adalah Na’at /sifat, Na’at dalam mengikuti man’utnya dalam apa saja, Sebutkan !\nJawab :\nNa’at /Sifat mengikuti Man’ut nya dalam 4 hal :\n• I’robnya ( rofak, nasob dan jernya ) \n• Bentuk kalimatnya ( Mufrod, tasniyah dan Jamaknya ) \n• Jenis kalimatnya ( Mudzakar dan Muannastnya )\n• Ma’rifat dan nakirohnya", "t": "Mudah", "k": "A"}, {"id": "NAHWU-57", "m": "NAHWU", "n": 57, "q": "Perhatikan potongan ayat berikut ini  مٰلِكِ يَوْمِ الدِّيْنِ  , pada lafadz مٰلِكِ  kedudukannya adalah sebagai isim fa’il , tolong tashrifkan isim faa’il tersebut !\nJawab :\nمالك         مالكان        مالكون      وملاك    وملك    وملكة     مالكة    مالكتان     مالكات     ومواكل", "t": "Susah", "k": "A"}, {"id": "NAHWU-58", "m": "NAHWU", "n": 58, "q": "Jelaskan apa maksud dari potongan nadzom  ini : \n\nلِلنَّصْبِ خَمْسٌ وَهْيَ فَتْحَةٌ أَلِفْ ¤ كَسْرٌ وَيَاءٌ ثُمَّ نُونٌ تَنْحَذِفْ\nJawab \nNadzom tersebut menerangkan tentang tanda-tandanya I’rob nasob .irob nasob memiliki  5 tanda , yaitu :\n• Fathah ,   contoh : رَأَيْتُ زَيْدًا\n• Alif ,    contoh :رَأَيْتُ أَبَا بَكْرٍ\n• Yak,   contoh :رَأَيْتُ رَجُلَيْنِ\n• Kasroh ,  contoh : السَّمَوَاتِ\n• Membuang Nun,  contoh :لَنْ تَذْهَبَا", "t": "Susah", "k": "A"}, {"id": "NAHWU-59", "m": "NAHWU", "n": 59, "q": "Silahkan perhatikan  potongan hadist berikut : مَنْ لَمْ يَشْكُرِ الْقَلِيلَ لَمْ يَشْكُرِ الْكَثِيرَ orang yang tak mensyukuri yang sedikit maka dia pun tak kan bisa mensyukuri yang banyak. Silahkan kamu tasyrif lafadz لَمْ يَشْكُرِdengan tashrif istilahi !\nJawab: \nشَكَرَ يَشْكُرُ شُكْرًا وَ مَشْكُوْرٌ فَهُوَ شاكِرٌ وَذَاكَ مَشْكُوْرٌ اُشْكُرْ لَاتَشْكُرْ مَشْكَرٌ مَشْكَرٌ مِشْكَرٌ", "t": "Susah", "k": "A"}, {"id": "NAHWU-60", "m": "NAHWU", "n": 60, "q": "Jelaskan maksud potongan nadzom berikut ini !\n\nالْمُبْتُدَا اسْمُ رَفْعُهُ مُؤَبَّدُ ¤ عَنْ كَلِّ لَفْظٍ عَامِلٍ مُجَرَّدُ\nJawab :\nNadzom tersebut menerangkan tentang pengertian Mubtadak.Mubtadak adalah kalimat isim yang selamanya di baca rofak yang sepi dari amil lafdzi.Contoh :الزَّيْدَانِ قائِمَانِ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-61", "m": "NAHWU", "n": 61, "q": "Fiil mudorik adalah kalimat fiil yang menujukkan pekerjaan yang sedang di lakukan, disamping itu, kita juga harus mengetahui bentuk pelaku siapa saja yang melakukan pekerjaan tsb. Dalam hal ini tashrifllah yang bisa menjawabnya, silahkan kamu tashrif fiil mudorik     يَكْتُبُ       dengan tashrif lugwowi beserta jelaskan bentuk  pelakunya !\nJawab :\nيَكْتُبُ :  Dia (laki-laki satu) \nيَكْتُبَانِ : Dia ( laki-laki dua)\nيَكْتُبُوْنَ : Mereka ( laki-laki banyak )\nتَكْتُبُ : Dia ( perempuan satu) \nتَكْتُبَانِ : Dia  ( perempuan dua ) \nتَكْتُبْنَ : Mereka ( perempuan banyak ) \nتَكْتُبُ : Kamu ( laki-laki satu) \nتَكْتُبَانِ : Kalian (dua orang laki-laki).\nتَكْتُبُوْنَ : Kalian ( lelaki banyak) \nتَكْتُبِيْنَ : Kamu (seorang perempuan) \nتَكْتُبَانِ : Kalian (dua orang perempuan) \nتَكْتُبْنَ : Kalian ( perempuan banyak ) \nأَكْتُبُ : Saya ( laki/prmpuan)\nنَكْتُبُ : Kami (laki / prmpuan )", "t": "Susah", "k": "A"}, {"id": "NAHWU-62", "m": "NAHWU", "n": 62, "q": "Kalimat adalah suatu lafadz  yang tersusun dari 2 kata atau lebih serta dapat memberikan kefahaman bagi pendengarnya. Bunyikan Nadzom Imritinya yang sesuai dengan diskripsi di atas !\n\nJawab :كَلاَمُهُمْ لَفْظُ مُفِيدٌ مُسْنَدُ ¤ وَالْكِلْمَةُ اللَّفْظُ المُفِيدُ المُفْرَدُ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-63", "m": "NAHWU", "n": 63, "q": "Silahkan  anda tashrif salah satu amil nawasikh yang tugasnya merofakkan mubtadak dan menasobkan khobar,  dengan tashrif  lughowi !\nJawab :\n   كُنَّا  كُنْتُ    كُنْتُنَّ   كُنْتُمَا   كُنْتِ   كُنْتُمْ   كُنْتُمَا   كُنْتَ   كُنَّ   كَانَتَا كَانَتْ  كَانُوْ    كَانَا  كَانَ", "t": "Susah", "k": "A"}, {"id": "NAHWU-64", "m": "NAHWU", "n": 64, "q": "Jelaskan apa maksud dari nadzom berikut !\nفَالضَّمُّ فِي اسْمٍ مُفْرَدٍ كَأَحْمَدِ ¤ وَجَمْعِ تَكْسِيرٍ كَجَاءَ الأَعْبُدِ\nJawab :\nMaksud nadzom tersebut adalah , dlommah menjadi tandanya I’rob rofak bertempat pada , isim mufrod , contoh : احمد     . dan bertempat pada jamak taksir , contoh : جَاءَ الأَعْبُد . Jamak  taksir adalah jamak yang tidak beraturan.", "t": "Mudah", "k": "A"}, {"id": "NAHWU-65", "m": "NAHWU", "n": 65, "q": "Lafadz قَامَ secara bentuk dan maknanya adalah berupa fi’il Madzi yang berarti telah berdiri siapa orang, silahkan anda tashrif lafadz tersebut dengan tahsrif lughowi!\nJawab :\nقَامَ – قَامَا – قَامُوْا – قَامَتْ – قَامَتَا – قُمْنَ - قُمْتَ – قُمْتُمَا – قُمْتُمْ – قُمْتِ - قُمْتُمَا – قُمْتُنَّ - قُمْتُ - قُمْنَا.", "t": "Susah", "k": "A"}, {"id": "NAHWU-66", "m": "NAHWU", "n": 66, "q": "Dalam hukum bacaanya , ada beberapa kalimat isim yang selamanya di baca nasob? , Sebutkan 5 saja , beserta contohnya !\nJawab:  \nisim yang selamanya di baca nasob itu ada 15 :\n• Maf'ul min Ajlih  contoh : قَامَ زَيْدٌ إجلالا لِعَمْر\n• Maf'ul Ma'ah   contoh:   جَاءَ اَلْأَمِيرُ وَالْجَيْشَ\n• Khabar Kaana dan Saudaranya  contoh :  كَانَ زَيْدٌ قَائِمًا\n• Isim Inna dan Saudaranya   contoh :  إِنَّ زَيْدًا قَائِمٌ\n• Dzonna dan Saudaranya   contoh :ظَنَنْتُ زَيْدًا مُنْطَلِقًا", "t": "Susah", "k": "A"}, {"id": "NAHWU-67", "m": "NAHWU", "n": 67, "q": "Ilmu tashrif adalah ilmu yang mempelajari cara membentuk sebuah kata , mulai dari kata yg tidak ada tambahan ( mujarrod ) sampai kata yang terdapat penambahan( mazid ). Jelaskan devinisi dari fi’il Tsulasi Mazid beserta pembagian dan contohnya !\nJawab :\nTsulasi mazid adalah fi’il atau kata kerja yang terdiri dari 3 huruf asli dan ketambahan dengan 1 huruf, 2 huruf, 3 huruf.  Dalam Tsulasi mazid ada 3 wazan, \nContoh wazan ketiganya adalah :اسْتَفْعَلَ  تَفَعَّلَ فْعَلَ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-68", "m": "NAHWU", "n": 68, "q": "Amil nawasikh adalah amil yang merusak susunan mubtadak dan khobar, salah satunya adalah dzonna dan saudara-saudaranya, apa tugas dari amil dzonna tersebut !berikan contohnya !\nJawab :\nTugas dari amil nawasikh dzonna dan saudara2nya adalah  menasobkan mubtadak dan khobar sekaligus ,sehingga keduanya menjadi isimnya dzonna. Contoh :ظَنَنْتُ زَيْدًا قَائِمًا", "t": "Mudah", "k": "A"}, {"id": "NAHWU-69", "m": "NAHWU", "n": 69, "q": "Ilmu tashrif adalah ilmu yang mempelajari cara membentuk sebuah kata , mulai dari kata yg tidak ada tambahan ( mujarrod ) sampai kata yang terdapat penambahan( mazid ). Jelaskan devinisi dari fi’ilT Ruba’i Mazid beserta pembagian dan contohnya !\nJawab :\nFi’il Ruba’i Mazid adalah kalimah yang fi’il atau kata kerjanya memuat lebih dari empat huruf, dengan pembagian jika dirinci maka empat berupa huruf asal , sedangkan huruf yang lain berupa huruf ziyadah atau tambahaan.  Dalam Ruba’i mazid ada 3 wazan, \nContoh wazan ketiganya adalah :افْعَلَلَّ افْعَنْلَلَ تَفَعْلَلَ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-70", "m": "NAHWU", "n": 70, "q": "Amil nawasikh adalah amil yang merusak susunan mubtadak dan khobar, salah satunya adalah Inna dan saudara-saudaranya, apa tugas dari amil Inna tersebut !berikan contohnya !\nJawab :\nTugas dari amil Nawasikh Inna dan saudara2nya adalah menasobkan mubtadak menjadi isimnya dan merofakkan khobar menjadi khobarnya.Contoh :أَنَّ مُحَمَّدًا رَسُوْلُ اللَّهِ", "t": "Mudah", "k": "A"}, {"id": "NAHWU-71", "m": "NAHWU", "n": 71, "q": "Ilmu tashrif adalah ilmu yang mempelajari cara membentuk sebuah kata , mulai dari kata yg tidak ada tambahan ( mujarrod ) sampai kata yang terdapat penambahan( mazid ). Jelaskan devinisi dari fi’il Tsulasi Mujarrod beserta pembagian dan contohnya !\nJawab :\nFi'il Tsulatsi mujarrad itu adalah setiap fi'il yang berjumlah tiga dengan tidak adanya tambahan huruf sama sekali. Dengan kata lain kalimat fi'il yang jumlahnya hanya tiga huruf. Dalam tsulasi mujarrod ada 6 wazan , yaitu;  فَعِلَ يَفْعِلُ  -  فَعُلَ يَفْعُلُ   -  فَعِلَ يَفْعَلُ  -  فَعَلَ يَفْعَلُ  - فَعَلَ يَفْعِلُ  - فَعَلَ يَفْعُلُ", "t": "Susah", "k": "A"}, {"id": "NAHWU-72", "m": "NAHWU", "n": 72, "q": "Silahkan anda tentukan I’rob dari  ayat berikut ini :         عَلٰى صِرَاطٍ مُّسۡتَقِيۡمٍؕ !\nJawab :\nLafadz عَلٰى صِرَاطٍ I’robnya Jer , karna kemasukan huruf  jer  عَلٰى  alamat jernya adalah kasroh sebab berupa isim mufrod, sedangkan lafadz مُّسۡتَقِيۡمٍ  I’robnya juga Jer, karna menjadi sifat dari lafadz\nصِرَاطٍ sedangkan alamat jernya  kasroh sebab isim mufrod.", "t": "Susah", "k": "A"}, {"id": "NAHWU-73", "m": "NAHWU", "n": 73, "q": "Silahkan anda Tashrif  kata yang bergaris bawah dari hadist berikut اطْلَبِ العِلْمَ مِنَ المَهْدِ إِلىَ اللَحْ  dengan tashrif istilahi ! \nJawab :مَطلَبٌ مَطلَبٌ مِطلَبٌ طَلَبَ يَطلُبُ طَلَبًا فهو طَالِبٌ وذاك مَطلُوبٌ اُطلُبْ لَا تَطلُبْ", "t": "Susah", "k": "A"}, {"id": "NAHWU-74", "m": "NAHWU", "n": 74, "q": "Kalian tentu sudah hafal surat Al Waqi’ah , coba klarifikasi kalimat dan I’rob dari potongan surat Al Waqi’ah berikut : وَّبُسَّتِ الۡجِبَالُ بَسًّا!\nJawab :\nLafadz وَّبُسَّتِ adalah kalimat Fi’il Madzi yang mabni Majhul, I’robnya Mabni. Sedangkan lafadz الۡجِبَالُ adalah kalimat isim , tandanya kemasukan Al , I’robnya rofak ,  karna menjadi Faa’il dari fiil sebelumnya ,alamat rofaknya Dlomah sebab isim mufrod. Sedangkan lafadz بَسًّ adalah kalimat isim , tandanya Tanwin. I’robnya nasob karna menjadi maf’ul ( obyek) dari fiilsebelumnya. Alamat nasobnya Fathah sebab isim mufrod", "t": "Susah", "k": "A"}, {"id": "NAHWU-75", "m": "NAHWU", "n": 75, "q": "Kalian tentu sudah hafal surat Al Waqi’ah , coba tashrif potongan ayat dari surat Al Waqi’ah berikut : يَطُوۡفُ عَلَيۡهِمۡ وِلۡدَانٌ مُّخَلَّدُوۡنَۙ‏ !\nJawab :\nطاف يطوف طوفا ومطافا فهوطاءف  وذاك  مطوف  طف  لاتطف  مطوف  مطوف   مطوف", "t": "Susah", "k": "A"}, {"id": "NAHWU-76", "m": "NAHWU", "n": 76, "q": "Dalam disilpin ilmu nahwu terdapat istilah isim Ghoiru Munshorif , jelaskan Berikut contohnya !\nJawab :\nisim ghairu munsharif adalah: isim yang tidak bisa dibaca tanwin. Ada juga yang menyebutkan isim ghairu munsharif adalah isim yang tidak menerima tanwin di sebabkan adanya illat.contoh :أَحْمَدُ nama orang , illatnya adalah berupa wazan Fi’il .", "t": "Susah", "k": "B"}, {"id": "NAHWU-77", "m": "NAHWU", "n": 77, "q": "Perhatikan potongan ayat dari surat Al Ma’un ini : \nاَرَءَيْتَ الَّذِيْ يُكَذِّبُ بِالدِّيْنِ  silahkan tashrif lafadz yg bergaris bawah dengan tashrif istilahi !\nJawab :\nكذب يكذب تكذيبا مكذبا فهو مكذب وذاك مكذب كذب لاتكذب مكذبمكذب", "t": "Susah", "k": "B"}, {"id": "NAHWU-78", "m": "NAHWU", "n": 78, "q": "Jelaskan maksud diskripsi berikut :     فَالْاِسْمُ يُعْرَفُ بِالْخَفْضِ وَالتَّنْوِيْنِ وَدُخُوْلُ الْاَلِفِ والْلَامِ وَحُرُوْفِ الْخَفْضِ\nJawab :\nDiskripsi tersebut menjelaskan tentang tanda-tanda kalimat isim, yakni tanwin, kemasukan alif lam, I’rob jer dan kemasukan huruf jer.", "t": "Mudah", "k": "B"}, {"id": "NAHWU-79", "m": "NAHWU", "n": 79, "q": "Kata Faa’il ( pelaku) dari sebuah pekerjaan memiliki ciri-ciri khusus  yang harus di ketahui, yakni berupa kalimat isim yang marfu’ yang fi’ilnya telah di sebutkan sebelumnya. Silahkan bunyikan keterangan dalam kitab jurumiyyah yg sesui dengan pernyataan tadi !\nJawab :\nاَلْفَاعِلُ هُوَ الاسم اَلْمَرْفُوعُ اَلْمَذْكُورُ قَبْلَهُ فِعْلُهُ. وَهُوَ عَلَى قِسْمَيْنِ ظَاهِرٍ, وَمُضْمَرٍ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-80", "m": "NAHWU", "n": 80, "q": "Perhatikan  hadist berikut : العلم قبل القول و العمل   artinya , berilmulah sebelum kamu bicara dan bertindak. Silahkan kamu tashrif kata  القول dengan tashrif istilahi ! \nJawab :\nقَالَ يَقُوْلُ قَوْلًا وَمَقَلًا فَهُوَ قَائِلٌ وَذَاكَ مَقُوْلٌ قُلْ لا تَقُلْ مَقَالٌ٢ مِقْوَلٌ", "t": "Susah", "k": "B"}, {"id": "NAHWU-81", "m": "NAHWU", "n": 81, "q": "Jelaskan maksud dari nadzom berikut  :    هُوَ اسْمُ وَقْتٍ أَوْ مَكَانٍ انْتَصَبْ ¤ كُلُّ عَلَى تَقْدِيرِ فِي عِنْدَ العَرَبْ\nJawab :\nMaksud dari nadzom tersebut adalah menerangkan tentang dhorof, dhorof adalah kalimat isim yang selamanya di baca nasob yang menunjukkannwaktu dan tempanya sebuah pekerjaan. Sedangkan dhorof terbagi menjadi dua :\n• Dhorof makan  contoh : جلستُ امامَ زيدٍ\n• Dhorof zaman   contoh : صمتُ يومَ الاثنيْنِ", "t": "Susah", "k": "B"}, {"id": "NAHWU-82", "m": "NAHWU", "n": 82, "q": "Sebagai pengikut semestinya harus senada dengan yang di ikuti dalam hal apapun ,  dalam disiplin ilmu tatabahasa nahwu, apakah ada istilah pengikut dan yang di ikuti? Kalau ada , sebutkan jumlahnya!\nJawab : \ndalam ilmu nahwu ada istilah pengikut dan yg dikuti,  biasanya di sebut dengan isim tabi’ , sedangkan isim tabi’ jumlahnya ada 4, yaitu ;\n1. Athof ma’thuf\n2. Na’at man’ut\n3. Badal mubdal\n4. Taukid muakkad", "t": "Mudah", "k": "B"}, {"id": "NAHWU-83", "m": "NAHWU", "n": 83, "q": "Dalam setiap pekerjaan , pasti ada pelaku dan sasarannya, dalam ilmu shorof dikenal dengan istilah apa? Berikan contohny a !\nJawab : \ndalam ilmu tashrifnya kalau  pelaku di istilahkan dengan FA’IL , sedangkan sasarannya di istilahkan dengan MAF’UL . contohnya : يَقْرَأُ صَالِحٌ الكِتَابَ  lafadz   sholihun sebagai fa’ilnya sedangkan lafadz kitaba sebagai maf’ulnya .", "t": "Mudah", "k": "B"}, {"id": "NAHWU-84", "m": "NAHWU", "n": 84, "q": "Ada salah satu amil nawasikh yang tugasnya  adalah menasobkan mubtadak sebagai isimnya dan merofakan khobar sebagai khobarnya, amil nawasikh yang manakah itu? Serta sebutkan saudara2nya beserta faedahnya !\nJawab : \namil nawasikh tersebut adalah amil INNA dan saudara2nya , sedangnkan saudara2nya adalah :\n1. أن: توكيد  fungsinya adalah sebagi penguat.\n2. لكن: الاستدراك  fungsinya sebagain penyangkal \n3. كأن: تشبيه   fungsinya sebagai penyerupaan\n4. ليت: تمني   fungsinya sebagai angan – angan yang tidak mungkin terjadi\n5. لعل: ترجي     fungsinya sebagai pengharapan yang bisa terjadi.", "t": "Susah", "k": "B"}, {"id": "NAHWU-85", "m": "NAHWU", "n": 85, "q": "Athof adalah salah satu isim tabi, yang mengikuti matbu’nya, dalam disiplinya, athof terklasifikasi menjadi berapa macam ? sebutkan !\nJawab : Athof terbagi menjadi dua macam, yaitu :\n1. Athof nasaq , yakni athof yang mengikuti ma’thufnya dengan perantara huruf athof.\n2. Athof bayan , yakni athof yang mengikuti ma’thufnya dengan tanpa menggunakan perantara huruf athof.", "t": "Mudah", "k": "B"}, {"id": "NAHWU-86", "m": "NAHWU", "n": 86, "q": "Kalimat yang mengikuti kalimat lainnya yang menggunakn perantara huruf, merupakan pengertian dari athof nasaq, ada berpakah huruf athof nasaq tersebut ?\nJawab : huruf athof nasaq banyaknya ada  9 , yaitu :\n1. Huruf   Wau (و) ,      contoh : جَاءَ عُمَرُ وَ عُثْمَانُ\n2. Huruf    Fa' (ف)\n3. Huruf  Summa (ثُمَّ)\n4. Huruf  Aw (أَوْ)\n5. Huruf  Am (أَمْ)\n6. Huruf  La (لَا)\n7. Huruf  Lakin (لَكِنْ)\n8. Huruf  Bal (بَلْ)\n9. Huruf Hatta (حَتَّى)", "t": "Mudah", "k": "B"}, {"id": "NAHWU-87", "m": "NAHWU", "n": 87, "q": "Na’at , merupakan salah satu dari isim tabi’, atau sering kita sebut dengan shifat. Dalam disiplinnya , na’at/ shifat itu terklasikikasi menjadi berapa bagian ? sebutkan !\nJawab : dalam disiplinnya na’at/ shifat itu terbagi menjadi dua macam, yaitu :\n1. Na’at Haqiqi  yaitu Naat yang  menunjukkan makna sifat pada diri matbu’ nya,\n contoh : جَاءَ الطَّالِبُ الْفَاضِلُ\n2. Na’at Sababi  yaitu Naat yang mensifati makna yang ada kaitannya dengan matbu’nya.\nContoh : جَاءَ الرَّجُلُ الْكَرِيْمُ أَبُوْهُ", "t": "Susah", "k": "B"}, {"id": "NAHWU-88", "m": "NAHWU", "n": 88, "q": "Secara umum , kalimat isim itu ada yang menunjukkan makna secara khusus ( Ma’rifat ), dan pula ada yang menunjukkan makna Umum ( Nakiroh ), ada  berapakah isim yang memiliki makna khusus \n( ma’rifat ) ? \nJawab : Kalimat isim yang menunjukkan makna khusus itu ada 5, yaitu :\n1. Isim dhomir\n2. Isim alam\n3. Isim mubham\n4. Isim yang kemasukan alif laam\n5. Isim yang di idofahkan", "t": "Mudah", "k": "B"}, {"id": "NAHWU-89", "m": "NAHWU", "n": 89, "q": "Kalimat yang mengikuti kata sebelumnya baik dalam segi bacaannya dan bentuknya, baik menggunakan perantara huruf atau tidak, ini pengertian dari apa ?\nJawab : ini pengertian dari ATHOF , sedangkan athof terbagi menjadi dua macam,\n Athof bayan : Kata yang mengikuti kata sebelumnya  ( Ma’thuf ) dengan tanpa perantara huruf ,  contoh :  أكرمت محمداً أخاك\n Athof Nasaq : Kata yang mengikuti kata sebelumnya ( ma’thuf ) dengan menggunakan perantara huruf , contoh : جَاءَ مُحَمَّدٌ وَ زَيْدٌ", "t": "Susah", "k": "B"}, {"id": "NAHWU-90", "m": "NAHWU", "n": 90, "q": "Perhatikan lafadz berikut ini :        إِنَّ ٱللَّهَ غَفُورٌ رَّحِيمٌ   , ini adalah implementasi dari disiplin nahwu dalam baba apa ?\nJawab : ini adalah penerapan dari Bab amil nawasikh inna dkk, yang bertugas menasobkan mubtadak menjadi isimnya serta merofakkan khobar menjadi khobarnya.", "t": "Mudah", "k": "B"}, {"id": "NAHWU-91", "m": "NAHWU", "n": 91, "q": "Sebagai kata kerja, kalimah fiil memiliki beberapa macam sesuai fungsi dan masa kinerjanya, coba anda klasifikasikan ada berapa macamkah kalimah fiil beserta waktu kinerja serta contohkan !\nJawab : dalam pembagiannya , kalimah fiil itu ada :\na. Fiil Madhi  : kata kerja yang pekerjaannya sudah di kerjakan , contoh :  فَعَلَ، ضَرَبَ، فَتَحَ \nb. Fiil Mudore’ : Kata kerja yang pekerjaannya sedang atau akan di kerjakan , contoh :\nيَكْتُبُ   . يَقْرَأُ      يَذْهَبُ\nc. Fiil  Amar : Kata kerja yang pekerjaannya seketika di kerjakan atau kata perintah. Contoh : اذْهَبْ", "t": "Susah", "k": "B"}, {"id": "NAHWU-92", "m": "NAHWU", "n": 92, "q": "Kalimat isim yang berfungsi sebagai subyek atau pelaku dalam sebuah pekerjaan, dalam kedudukannya disebut apa ? berikan contoh dan pembagiannya !\nJawab : kalimat tersebut dinamakan ISIM FA’IL . sedangkan dalam pembagiannya isim terbagi 2 :\n• Faa’il isim dhohir , contoh : ذَهَبَ مُحَمَّدٌ  ( Muhammad telah pergi )\n• Faa’il Isim Dlomir , contoh : تَــذْهَبُ ( Kamu lk2 sedang pergi )", "t": "Mudah", "k": "B"}, {"id": "NAHWU-93", "m": "NAHWU", "n": 93, "q": "Dalam susunan tashrifnya ada kalimat yang menunjukkan arti tempat dan waktu sebuah pekerjaan di lakukan, di sebut kalimat apakah itu ? jikalau kata kerjanya berupa كتبَ, maka bentuknya bagaimana ?\nJawab : Kalimat tersebut di namakan ISIM ZAMAN dan ISIM MAKAN,  jikalau fiilnya lafadz “ kataba” maka isim zaman dan isim makan nya adalah : مَكْتَبٌ  mengikuti wazan مَفعَلٌ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-94", "m": "NAHWU", "n": 94, "q": "Sudah maklum bagi kita bahwa kalimat huruf itu yang asal hurufnyakurang dari tiga dan jika ada kalimat huruf yang jumlah hurufnya tiga danmenyerupai isim seperti   “na’am “     apakah dihukumi mu’rob seperti isim ?\nJawab : Tidak, sebab I’rob itu didatangkan untuk menunjukkan ma’na padahal huruf itu tidak mempunyai ma’na, maka tidak boleh di mu’robkan.", "t": "Susah", "k": "B"}, {"id": "NAHWU-95", "m": "NAHWU", "n": 95, "q": "Luar biasanya bahasa arab, dalam menyikapi bentuk sebuah kata yang menunjukkan arti satu, dua dan arti banyak, itu memiliki pembahasan yang terperinci.  Kata yang menunjukkan arti lebih dari satu / banyak dalam pembahasannya di sebut apa?  Serta rincikan pembagiannya !\nJawab : Dalam pembahsannya di sebut JAMAK , sedangkan rinciannya adalah :\na. Jamak mudzakar : kalimat yang menunjukan arti banyak  yang beraturan dan mengarah kepada laki laki . contoh : الْمُؤْمِنُوْنَ\nb. Jamak Muannas : Kalimat yang menunjukkan arti banyak yang beraturan dan mengarah kepada perempuan , contoh : الْمُسْلِمَاتُ\nc. Jamak taksir    : Kalimat yang menunjukkan arti banyak dan tidak beraturan bentuk serta tandanya, contoh : أَبْوَابٌ ( beberapa pintu )", "t": "Susah", "k": "B"}, {"id": "NAHWU-96", "m": "NAHWU", "n": 96, "q": "Dalam ilmu nahwu , untuk merubah suatu kata ke bentuk kata yang lain karna menghendaki makna yang berbeda, biasanya dengan cara menambah huruf dalam kata tersebut. Coba jelaskan cara membuat jamak mudzakar dan muannas !\nJawab : Caranya adalah , Untuk :\na. Jamak mudzakar :  ketika keadaan Rofak, maka di tambah huruf wawu dan nun di akhirnya, contoh : قَدْ اَفْلَحَ الْمُؤْمِنُوْنَ\nDan ketika keadaan Nasob dan jer, maka di tambahi huruf yak dan nun di akhirnya , contoh : هُدًى لِلْمُتَّقِيْنَ\nb. Jamak Muannas : Ketika keadaan Rofa, maka di tambah huruf alif dan ta yang berharokat dhomah, contoh : جَاءَتِ الْمُسْلِمَاتُ\nDan ketika keadaan nasob dan jer, maka di tambah huruf alif dan ta yang berharokat kasroh, contoh : رَاَيْتُ الْمُسْلِمَاتِ", "t": "Susah", "k": "B"}, {"id": "NAHWU-97", "m": "NAHWU", "n": 97, "q": "Dlomah menjadi tandanya I’rob rofak bertempat pada berapa tempat ?\nJawab : dlomah menjandi tandanya I’rob rofak bertempat pada 4 tempat :\n1. Pada isim mufrod,  contoh : جاء زيدٌ\n2. Pada jamak taksir , contoh : جاء الرجالُ\n3. Pada jamak muannas salim, contoh  : جائت الهنداتُ \n4. Pada fi’il mudorek akhir salim, contoh : يضربُ", "t": "Susah", "k": "B"}, {"id": "NAHWU-98", "m": "NAHWU", "n": 98, "q": "Jelaskan apa itu asmaul khomsah , berikut alamat I’robnya , serta  contohnya bagaimana ?\nJawab : Asmaul khomsah adalah nama-nama dalam bahasa arab yang jumlahnya ada 5, yang memiliki ciri dan karakteristik yang berbeda dengan kalimat isim lainnya.\n Sedangkan ketika I’rob rofak, asmaul khomsah di andai dengan huruf wawu, contoh :  أبُوْكَ   \nSedangkan ketika I’rob nasob, ditandai dengan huruf alif , contoh : أَبَاكَ\nSedangkan ketika jer, di tandai dengan huruf yak, contoh : بَأَبِيْكَ", "t": "Susah", "k": "B"}, {"id": "NAHWU-99", "m": "NAHWU", "n": 99, "q": "Jamak taksir adalah suatu bentuk kata yang menunjukkan arti banyak, namun tidak beraturan sebagaimana  ketentuan pembuatan jamak, ketika dalam keadaan rofak, nasob dan jer, apakah tandanya? Berikan contohnya yang terdapat di dalam al qur’an  !\nJawab : Jamak taksir ketika :\n Ketika Irob rofak, di tandai dengan harokat dlomah, contoh : فِيهَا كُتُبٌ قَيِّمَةٌ\n Ketika Irob nasob, di tandai dengan harokat fathah, contoh : يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا\n Ketika Irob jer, di tandai dengan harokat kasroh, contoh : فِي صُدُورِ النَّاسِ", "t": "Susah", "k": "B"}, {"id": "NAHWU-100", "m": "NAHWU", "n": 100, "q": "Kalimat yang menunjukan arti banyak yang mengarah kepada makna laki-laki , biasa di sebut dengan jamak mudzakar salim, coba anda sebutkan tanda irobnya , serta berikan contoh di al qur’annya !\nJawab : jamak mudzakar salim ketika :\n Ketika irob rofak, di tandai dengan huruf wawu, contoh : قَدْ أَفْلَحَ الْمُؤْمِنُونَ\n Ketika irob nasob, di tandai dengan huruf yak , contoh : وَيُبَشِّرَ الْمُؤْمِنِينَ\n Ketika irob jer , juga ditandai dengan huruf yak , contoh : وَمَا هُمْ بِمُؤْمِنِينَ", "t": "Susah", "k": "B"}, {"id": "NAHWU-101", "m": "NAHWU", "n": 101, "q": "Kalimat yang menunjukkan arti dua biasanya dalam disiplin nahwunya di sebut dengan apa? Serta apa sajakah tanda-tanda irobnya ? berikan contohnya :\nJawab : kalimat tersebut di namakan isim tasniyah . sedangkan tanda irobnya adalah :\n Ketika irob rofak, di tandai dengan huruf alif, contoh : الزَّيْدَانِ \n Ketika I’rob nasob , di tandai dengan huruf yak, contoh : يَقْرَأُ كِتَبَيْنِ\n Ketika irob jer, di tandai dengan huruf yak, contoh : شَهَادَةَ امْرَأَتَيْنِ", "t": "Susah", "k": "B"}, {"id": "NAHWU-102", "m": "NAHWU", "n": 102, "q": "Kalimat isim itu dihukumi Mu’rob, namun ada kalimat isim yang selamanya di baca Jer / khofad, sebutkan ada berapa berikut contohnya !\nJawab :Kalimat isim yang selamanya di baca Jer , itu ada 3 keadaan :\n1. Di Jer kan dengan Huruf jer , contoh : فِيْ القُرْآنِ\n2. Di Jer kan karna sebab susunan idofah , contoh : قِرَاءَةُ القُرْآنِ\n3. Di Jer kan sebab mengikuti  ( Tabi’). Contoh : قِرَاءَةُ القُرْآنِ الكَرِيْـمِ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-103", "m": "NAHWU", "n": 103, "q": "Silahkan anda tasrif  secara lughowi fi’il amarya  dari fiil  : کتب  !\nJawab :اُكْتُباَ   كْتُبُوْا  اُكْتُبِيْ  اُكْتُباَ  اُكْتُبْنَ ْ اُكْتُبْ", "t": "Susah", "k": "B"}, {"id": "NAHWU-104", "m": "NAHWU", "n": 104, "q": "Tidak semua kalimat    bisa di kategorikan sebuah kalimat yang bisa memiliki arti yang bisa di fahami maksud dan tujuannya, bagaimanakah system sebuah kalimat dalam disiplin ilmu nahwu ,sehingga bisa difahami pendengarnya ?\nJawab : Kalimat tersebut harus memenuhi syarat –syarat bisa dikatakan sebuah kalimat, diantaranya\n  Lafadz  : bunyi suara terdiri dari huruf hijaiyyah \n Murokkab  : Harus tersusun dari dua suku kata atau lebih \n Mufid  : Mengandung arti yang bisa di fahami\n Wadlo’ : Pengucapannya dalam keadaan di  sengaja . contoh :  استاذ حاضر", "t": "Susah", "k": "B"}, {"id": "NAHWU-105", "m": "NAHWU", "n": 105, "q": "Ketika  ada dua kata dijadikan menjadi sebuah kalimat yang utuh dalam disipilin ilmu nahwunya di sebut apa? Jelaskan beserta contohnya !\nJawab : Dua kata yang di jadikan satu kalimat di sebut : Susunan Idofah. sedangkan idofah itu terdiri dari Mudof ( kata yg pertama) dan Mudof Ilaih (kata yg kedua ). Contoh :صِرَاطَ المُسْتَقِيْمِ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-106", "m": "NAHWU", "n": 106, "q": "Dalam disiplin ilmu Nahwu setiap ada Mubtadak pasti ada khobar, Jelaskan Pengertian dari khobar serta pembagiannya !\nJawab : Khobar adalah Kalimat isim yang di baca rofak yang maknanya di sandarkan kepada mubtadak. Sedangkan pembagian khobar ada dua :\na. Khobar mufrod : Khobar yang terbuat dari kalimat yang bukan terdiri dari jumlah . \nContoh :طالب کاتب \nb. Khobar Ghoiru mufrod : Khobar yang terbuat dari Jumlah,  contoh  : طالب فی الفصل", "t": "Mudah", "k": "B"}, {"id": "NAHWU-107", "m": "NAHWU", "n": 107, "q": "Dalam disiplin ilmu shorof terdapat istilah binak lafif, jelaskan pengertian dan sebutkan macam-macamnya !\nJawab : Binak lafif adalah kaliamat yang huruf asalnya berupa huruf illat, sedangkan binak lafif itu terbagi menjadi dua macam :\n1. Lafif Maqrun : kalimat yang ‘ain dan lam fiilnya berupa huruf illat , contoh : شوی \n2. Lafif Mafruq : kalimat yang fa’ dan lam fiilnya berupa huruf illat, contoh : وقی", "t": "Mudah", "k": "B"}, {"id": "NAHWU-108", "m": "NAHWU", "n": 108, "q": "Amil nawasikh memiliki pengaruh terhadap susunan dan I’rob bacaan dari mubtadak dan khobar, dari beberapa amil nawasikh , ada amil Kanaa Dan Saudaranya , jelaskan apa pengaruh dari Amil Kaanaa Dan saudaranya tersebut !\nJawab : Pengaruh Amil nawasikh Kanaa dan saudaranya adalah merofakkan mubtadak menjadi isimnya Kanaa dan menasobkan khobar menjadi khobarnya Kanaa. Contoh :وَكَا نَ اللّٰهُ غَفُوْرًا رَّحِيْمًا", "t": "Mudah", "k": "B"}, {"id": "NAHWU-109", "m": "NAHWU", "n": 109, "q": "Na’at , merupakan salah satu dari isim tabi’, atau sering kita sebut dengan shifat. Dalam disiplinnya , na’at/ shifat itu terklasikikasi menjadi berapa bagian ? sebutkan !\nJawab : dalam disiplinnya na’at/ shifat itu terbagi menjadi dua macam, yaitu :\n1. Na’at Haqiqi  yaitu Naat yang  menunjukkan makna sifat pada diri matbu’ nya,\n contoh : جَاءَ الطَّالِبُ الْفَاضِلُ\n2. Na’at Sababi  yaitu Naat yang mensifati makna yang ada kaitannya dengan matbu’nya.\nContoh : جَاءَ الرَّجُلُ الْكَرِيْمُ أَبُوْهُ", "t": "Susah", "k": "B"}, {"id": "NAHWU-110", "m": "NAHWU", "n": 110, "q": "Dia sebagai kata ganti baik untuk orang pertama , kedua, ghoib, mutakallim dsb, dalam kaidahnya dia disebut apa ? Sebutkan pembagiannya, berikut contohnya !\nJawab : Dalam kaidahnya dia di sebut isim Dlomir , Sedangkan secara garis besar isim dlomir itu terbagi menjadi 2, yaitu:\n1) Dlomir mustatir, Dlomir yang tersembunyi , contoh : اُفْعُلْ\n2) Dlomir Bariz , Dlomir yang tampak ,  sedangkan dlomir bariz terbagi menjadi 2 macam, yakni \n• Dlomir muttasil contoh : كتابُنَا\n• Dlomir Munfasil contoh : هي مُدَرِّسَةٌ", "t": "Susah", "k": "B"}, {"id": "NAHWU-111", "m": "NAHWU", "n": 111, "q": "Dalam pembahasan ilmu nahwu dintemukan istilah isim taabi’ , jelaskan pengertiannya dan sebutkan klasifikasinya !\nJawab : Isim tabi’ adalah kalimat isim yang mengikuti kata sebelumnya (matbu’) dalam hal I’robnya, jenis kalimatnya. Sedangkan banyaknya isim tabi”  itu ada 4 :\n1. Naat ( sifat ) contoh :هَذَا بَيْتٌ كَبِيْرٌ\n2. Athof ,contoh :اِشْتَرَيْتُ كِتَابًا وَقَلَمًا\n3. Badal , contoh :جَاءَ الْمُحَاضِرُ اَحْمَدُ\n4. Taukid , contoh :جَاءَ اَحْمَدُ عَيْنُهُ", "t": "Susah", "k": "B"}, {"id": "NAHWU-112", "m": "NAHWU", "n": 112, "q": "Secara garis besar nahwu shorof  membahas tata letak sebuah kata atau kalimat ,tak beda jauh dengan ilmu bahasa yang lain. Contoh, mengenai bentuk kata untuk arti satu, dua atau lebih. Dalam ilmu nahwunya , di istilahkan apa? Berikan contohnya !\nJawab : Dalam ilmu nahwu shorofnya untuk mengetahuinya , ada 3 macam :\n1. Mufrod : untuk kata yang bermakna satu, contoh :كِتَابٌ\n2. Tasniyah : untuk kata yang bermakna dua, contoh :   'كِتَابَانِ  / كِتَابَيْنِ\n3. Jamak :\n Kalau untuk laki-laki di sebut Jamak Mudzakar , contoh : مُؤْمِنُوْنَ / مُؤْمِنِيْنَ\n Kalau untuk perempuan di sebut Jamak Muannas ,contoh : مُؤْمِنَاتٌ\n4. Jamak Taksir : Bentuk jamak yg tidak beraturan , contoh : كُتُبٌ dari mufrod كِتَابٌ", "t": "Susah", "k": "B"}, {"id": "NAHWU-113", "m": "NAHWU", "n": 113, "q": "Ketika ada dua kata dijadikan menjadi sebuah kalimat yang utuh dalam disipilin ilmu nahwunya di sebut apa? Jelaskan beserta contohnya !\nJawab : Dua kata yang di jadikan satu kalimat di sebut : Susunan Idofah. sedangkan idofah itu terdiri dari Mudof ( kata yg pertama) dan Mudof Ilaih (kata yg kedua ). Contoh :صِرَاطَ المُسْتَقِيْمِ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-114", "m": "NAHWU", "n": 114, "q": "Mubtadak dan khobar selamanya selalu bersama , selama tidak ada amil yang mengganggu,  siapakah amil pengganggu itu ? \nJawab : Amil pengganggu tersebut di sebut amil nawasikh . sedangkan banyaknya amil    nawasikh itu ada 3, :\n1. كَانَ وَاَخْوَاتُهَا (kaana dan saudara-saudaranya)\n2. إِنَّ وَاَخْوَاتُهَا (Inna dan saudara-saudaranya)\n3. ظَنَّ وَاَخْوَاتُهَا (dzonna dan saudara-saudaranya )", "t": "Susah", "k": "B"}, {"id": "NAHWU-115", "m": "NAHWU", "n": 115, "q": "Coba  anda tashrif fiil tsulasi mazid dari wazan فعل  dengan tashrif istilahi !\nJawab :نور ینور تنویرا تنوره تنوارا تنوارا منوارا فهو منور وذاک منور نورلاتنور  منور۲", "t": "Susah", "k": "B"}, {"id": "NAHWU-116", "m": "NAHWU", "n": 116, "q": "Sebagai ciri atau tanda dari fi’il mudorek adalah, dengan adanya huruf mudhoro’ah di depannya,   Sebutkan huruf mudhoro’ah beserta contohnya!\nJawab : Huruf mudhoroah ada 4 yaitu :\n Hamzah, untuk mutakalim wahdah. Contoh :   أَفْعُلُ\n Nun, untuk mu’adzom binafsih. Contoh :  نَفْعُلُ\n Ya’ , untuk  mudzakar ghoib. Contoh :  يَفْعُلُ\n Ta’, untuk mukhotob. Contoh : تَفْعُلُ", "t": "Susah", "k": "B"}, {"id": "NAHWU-117", "m": "NAHWU", "n": 117, "q": "Silahkan anda tentukan I’rob dari  ayat berikut ini :         عَلٰى صِرَاطٍ مُّسۡتَقِيۡمٍؕ !\nJawab :\nLafadz عَلٰى صِرَاطٍ I’robnya Jer , karna kemasukan huruf  jer  عَلٰى  alamat jernya adalah kasroh sebab berupa isim mufrod, sedangkan lafadz مُّسۡتَقِيۡمٍ  I’robnya juga Jer, karna menjadi sifat dari lafadz\nصِرَاطٍ sedangkan alamat jernya  kasroh sebab isim mufrod.", "t": "Mudah", "k": "B"}, {"id": "NAHWU-118", "m": "NAHWU", "n": 118, "q": "Dalam sebuah pekerjaan , pasti ada pelakunya , kalau dalam bahasanya  Subyeknya. Dalam tatanan bahasa arab pun demikian , hanya beda istilah saja, jelaskan apa istilah dalam nahwunya, beserta sesuatu yang berkaitan dengannya !\nJawab :\nDalam ilmu nahwunya subyek di istilahkan dengan Faa’il , Faa’il adalah isim yang di baca rofak yang di sebutkan setelah fi’ilnya , sedangkan faa’il terbagi menjadi dua :\n• Faa’il isim dhohir , contoh : ذَهَبَ مُحَمَّدٌ  ( Muhammad telah pergi )\n• Faa’il Isim Dlomir , contoh : تَــذْهَبُ ( Kamu lk2 sedang pergi )", "t": "Susah", "k": "B"}, {"id": "NAHWU-119", "m": "NAHWU", "n": 119, "q": "Menurut Ketentuan  bacaanya , ada beberapa kalimat isim yang selamanya di baca nasob? , Sebutkan 5 saja , beserta contohnya !\nJawab:  isim yang selamanya di baca nasob itu ada 15 :\n• Maf'ul Bih   contoh :  ضَرَبْتُ زَيْدًا\n• Masdar    contoh :  ضَرَبَ يَضْرِبُ ضَرْبًا\n• Dharaf Zaman  contoh : نام احمد ليلا \n• Dharaf Makan    contoh :   جلست امام الفصل \n• Hal   contoh:     جَاءَ زَيْدٌ رَكِبً", "t": "Susah", "k": "B"}, {"id": "NAHWU-120", "m": "NAHWU", "n": 120, "q": "Ilmu tashrif adalah ilmu yang mempelajari cara membentuk sebuah kata , mulai dari kata yg tidak ada tambahan ( mujarrod ) sampai kata yang terdapat penambahan( mazid ). Jelaskan devinisi dari fi’il Tsulasi Mazid beserta pembagian dan contohnya !\nJawab :\nTsulasi mazid adalah fi’il atau kata kerja yang terdiri dari 3 huruf asli dan ketambahan dengan 1 huruf, 2 huruf, 3 huruf.  Dalam Tsulasi mazid ada 3 wazan, \nContoh wazan ketiganya adalah :اسْتَفْعَلَ  تَفَعَّلَ فْعَلَ", "t": "Susah", "k": "B"}, {"id": "NAHWU-121", "m": "NAHWU", "n": 121, "q": "Kata kerja ( predikat ) dalam Nahwu di sebut Fi’il , merupakan sebuah patokan kita bisa mengetahui sebuah pekerjaan atau peristiwa yang sedang, akan atau sudah terlaksana. Namun dalam realisasinya ternyata dalam nahwu banyak sekali macam dan bentuk kalimat fi’il, sebutkan berikut contohnya !\nJawab : Dalam penerapannya , fiil terbagi menjadi 3 bentuk :\n Fi’il Madzi , kata kerja yang menunjukan pekerjaan yang sudah terjadi , contoh : فَتَحَ\n Fi’il mudhorik, kata kerja yang menunjukkan pekerjaan yang akan atau sedang terjadi, contoh : يَفْتَحُ\n Fi’il Amar , kata kerja yang menunjukkan arti perintah , contoh : اِفْتَحْ", "t": "Susah", "k": "B"}, {"id": "NAHWU-122", "m": "NAHWU", "n": 122, "q": "Tidak semua kalimat    bisa di kategorikan sebuah kalimat yang bisa memiliki arti yang bisa di fahami maksud dan tujuannya, bagaimanakah system sebuah kalimat dalam disiplin ilmu nahwu ,sehingga bisa difahami pendengarnya ?\nJawab : Kalimat tersebut harus memenuhi syarat –syarat bisa dikatakan sebuah kalimat, diantaranya\n  Lafadz  : bunyi suara terdiri dari huruf hijaiyyah \n Murokkab  : Harus tersusun dari dua suku kata atau lebih \n Mufid  : Mengandung arti yang bisa di fahami\n Wadlo’ : Pengucapannya dalam keadaan di  sengaja . contoh :  استاذ حاضر", "t": "Susah", "k": "B"}, {"id": "NAHWU-123", "m": "NAHWU", "n": 123, "q": "Kalimat yang menunjukan arti banyak yang mengarah kepada makna laki-laki , biasa di sebut dengan jamak mudzakar salim, coba anda sebutkan tanda irobnya , serta berikan contoh di al qur’annya !\nJawab : jamak mudzakar salim ketika :\n Ketika irob rofak, di tandai dengan huruf wawu, contoh : قَدْ أَفْلَحَ الْمُؤْمِنُونَ\n Ketika irob nasob, di tandai dengan huruf yak , contoh : وَيُبَشِّرَ الْمُؤْمِنِينَ\n Ketika irob jer , juga ditandai dengan huruf yak , contoh : وَمَا هُمْ بِمُؤْمِنِينَ", "t": "Susah", "k": "B"}, {"id": "NAHWU-124", "m": "NAHWU", "n": 124, "q": "Dalam bab I’rob terdapat sekelompok fi’il yang jumlahlahnya ada 5, yang memiliki ciri serta ketentuan yang berbeda dengan kalimat fi’il pada umumnya, siapakah mereka ?\nJawab :  mereka dalah Af’alul Khamsah yakni lima fi’il mudhari’ yang disambung dengan dhamir tatsniyah (alif tatsniyah), atau dhamir jama’ muzakar salim (wawu jama’), atau dhamir muannats mukhatabah (nun jama’ niswah) mengikut wazan-wazan berikut:\nيَفْعَلاَنِ – تَفْعَلاَنِ – يَفْعَلُوْنَ – تَفْعَلُوْنَ – تَفْعَلِيْنَ", "t": "Susah", "k": "B"}, {"id": "NAHWU-125", "m": "NAHWU", "n": 125, "q": "=. أَعُوْذُ بِاللهِ مِنَ الشَّيْطَانِ الرَّجِيْم , coba anda perinci, ada kalimat apa saja beserta tandanya dalam lafadz ta’awudz tersebut!\nJawab : \n• Lafadz  أَعُوْذ adalah kalimat fi’il , fi’ilnya fi’il mudhorek, tandanya bisa kemasukan tanda-tanda kalimat fi’il.\n• Lafadz  بِاللهِ adalah kalimat isim, tandanya bisa kemasukan tandanya kalimat isim berupa huruf jer ba’.\n• Lafadz   مِنَ الشَّيْطَانِ adalah kalimat isim, tandanya bisa kemasukan huruf jer min.\n• Lafadz الرَّجِيْم adalah kalimat isim, tandanya bisa kemasukan tandanya kalimat isim berupa “al”.", "t": "Susah", "k": "B"}, {"id": "NAHWU-126", "m": "NAHWU", "n": 126, "q": "Ada maqolah yang berbunyi  :  مَنْ جَدَّ وَجَدَ artinya siapa yang bersungguh-sungguh pasti akan berhasil, tolong anda tashrif lafad yg bergaris bawah dengan tashrif lughowi ( kebawah ) !\nJawab :Tashrifannya adalah : \nوجد وجدا وجدوا وجدت وجدتا وجدن وجدت وجدتما وجدتم وجدت جدتما وجدتن وجدت وجدنا", "t": "Susah", "k": "B"}, {"id": "NAHWU-127", "m": "NAHWU", "n": 127, "q": "Salah satu cara berinteraksi dengan sesama adalah dengan cara memanggil, dalam ilmu nahwunya, cara memanggil mukhotob itu ada ketentuannya, coba jelaskan !\nJawab : dalam ilmu nahwunya di sebut dengan Munada , Munada adalah kalimah isim yang disebutkan sesudah atau jatuh setelah salah satu huruf nida sebagai panggilan. Penggunaan Isim Munada dengan menggunakan huruf-huruf panggilan supaya yang dipanggil menoleh pada yang memanggil. Contoh Munada ياَ عَبْدَ اللهِ yang artinya Wahai, Abdullah", "t": "Mudah", "k": "B"}, {"id": "NAHWU-128", "m": "NAHWU", "n": 128, "q": "Dalam bab munada , terdapat huruf-huruf tertentu yang di gunakan untuk memanggil, coba klasifikasikan !\nJawab : Huruf Nida atau Munada berjumlah enam huruf, yaitu:\n\n• ياَ  digunakan untuk seluruh munada, baik yang dekat, sedang, atau jauh.\n• أ   digunakan untuk memanggil atau menyeru sesuatu yang dekat.\n• أَيْ   digunakan untuk memanggil atau menyeru sesuatu yang dekat\n• هَياَ  digunakan untuk memanggil atau menyeru sesuatu yang jauh.\n• أَياَ  digunakan untuk memanggil atau menyeru sesuatu yang jauh.\n• وَا  digunakan untuk ratapan, biasanya diserukan untuk meratapi sesuatu yang sedang dirasakan seperti sakit.", "t": "Susah", "k": "B"}, {"id": "NAHWU-129", "m": "NAHWU", "n": 129, "q": "Silahkan anda jelaskan  lafadzاكرم   itu sighotnya (bentuknya) sebagai apa? Mujarrod atau mazidkah? kemudian Tashrifkan dengan tashrif Istilahi !\nJawab : Lafadz اكرم   Shighotnya adalah fi’il Madzi  dan berupa Tsulasi Mazid yang mengalami penambahan hurufnya, sedangkan huruf asalnya adalah كرم . Tashrifnya :\nاكرم يكرم اكراما ومكرما فهو مكرم وذك مكرم اكرم لاتكرم مكرم مكرم مكرم", "t": "Susah", "k": "B"}, {"id": "NAHWU-130", "m": "NAHWU", "n": 130, "q": "Fathah menjadi tandanya I’rob nasob bertempat pada berapa tempat? Sebutkan berikut contohnya!\nJawab : fathah menjadi tandanya I’rob nasob bertempat pada tiga tempat  :\n• Pada isim mufrod , contoh : كِتَابًا \n• Pada jamak taksir, contoh : مَلَابِسَ \n• Pada fi’il mudhorik akhir salim , contoh : لن يضربَ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-131", "m": "NAHWU", "n": 131, "q": "Perhatikan  hadist berikut : العلم قبل القول و العمل   artinya , berilmulah sebelum kamu bicara dan bertindak. Silahkan kamu tashrif kata  القول dengan tashrif istilahi ! \nJawab :\nقَالَ يَقُوْلُ قَوْلًا وَمَقَلًا فَهُوَ قَائِلٌ وَذَاكَ مَقُوْلٌ قُلْ لا تَقُلْ مَقَالٌ٢ مِقْوَلٌ", "t": "Susah", "k": "B"}, {"id": "NAHWU-132", "m": "NAHWU", "n": 132, "q": "Hadfun nun ( membuang nun) menjadi tandanya I’rob nasob bertempat pada berapa tempat ? sebutkan berikut contohnya !\nJawab : hadfu nun menjadi tandanya I’rob nasob bertempat pada satu tempat , yakni bertempat pada af’alul khomsah. Contoh : ان يعلموا", "t": "Mudah", "k": "B"}, {"id": "NAHWU-133", "m": "NAHWU", "n": 133, "q": "Silahkan tentukan Irob beserta tanda dan alasannya dari lafadz berikut : الَّذِيْنَ يُؤْمِنُوْنَ بِالْغَيْبِ\nJawab :  lafadz  يُؤْمِنُوْنَ  irobnya adalah rofak, tanda rofaknya adalah wawu , sebab jamak mudzakar salim.  Sedangkan lafadz بِالْغَيْبِ  irobnya adalah jer, tanda jernya adalah kasroh , sebab isim mufrod.", "t": "Mudah", "k": "B"}, {"id": "NAHWU-134", "m": "NAHWU", "n": 134, "q": "Silahkan kamu tashrif lafadz yg bergaris bawah dari ayat berikut :وَّاَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا اَبَابِيۡلَۙ  ! dengan tashrif istilahi !\nJawab :\nأَرْسَلَ  يُرْسِلُ  إِرْسَالاً فهو  مُرْسِلٌ  وذاك مُرْسَلٌ  أَرْسِلْ  لاَتُرْسِلْ مُرْسَلٌ  مُرْسَلٌ", "t": "Susah", "k": "B"}, {"id": "NAHWU-135", "m": "NAHWU", "n": 135, "q": "Dalam klasifikasi I’rob terdapat I’rob jazem, apasajakah tanda-tandanya, serta berikan contohnya !\nJawab : I’rob jazem memiliki dua tanda , yaitu :\n1. Sukun , bertempat pada fi’il mudhorek yang akhir salim  contoh : لَمْ يَكُنْ\n2. Membuang huruf nun / huruf ilat , contoh : لَمْ يَفْعَلَا , لَمْ يَخْشَ", "t": "Susah", "k": "B"}, {"id": "NAHWU-136", "m": "NAHWU", "n": 136, "q": "Tentukan kalimat apa beserta tandanya , ayat berikut  ini : اِهْدِنَا الصِّرَاطَ الْمُسْتَقِيْمَۙ  !\nJawab :  lafadz اِهْدِ adalah kalimat fi'il,  fi'ilnya fi'il amar ( perintah ) tandanya di akhir di harokati sukun, sedangkan lafadz الصِّرَاطَ  dan lafadz  الْمُسْتَقِيْمَ adalah kalimat isim, tandanya kemasukan alif lam. ( al ).", "t": "Mudah", "k": "B"}, {"id": "NAHWU-137", "m": "NAHWU", "n": 137, "q": "Silahkan anda tashrif secara lughowi fiil mudloriknya dari fiil :خاف ! \n  \n  يَخَفْنَ    تَخَافُ تَخَافَانِ   تَخَافُوْنَ      تَخَافِيْنَ     تَخَافَانِ      تَخَفْنَ أَخَاف    نَخَافُ     تَخَافَانِ   تَخَافُ   يَخَافُوْن    يَخَافَانِ يَخَافُ", "t": "Susah", "k": "B"}, {"id": "NAHWU-138", "m": "NAHWU", "n": 138, "q": "Dalam disiplin ilmu nahwu terdapat istilah isim  ghoiru munshorif, jelaskan maksudnya berikut tanda dan contohnya !\nJawab : isim ghoiru munshorif adalah sekelompok kalimat isim yang tidak bisa menerima tanwin yang merupakan tanda utama kalimat isim, di sebabkan adanya illat (alasan ) tertentu , di antaranya adalah illat sighot muntahal jumu’ , contoh : مَسَاجِدُ، مَصَانِعُ،", "t": "Susah", "k": "B"}, {"id": "NAHWU-139", "m": "NAHWU", "n": 139, "q": "Perhatikan potongan ayat berikut ini  مٰلِكِ يَوْمِ الدِّيْنِ  , pada lafadz مٰلِكِ  kedudukannya adalah sebagai isim fa’il , tolong tashrifkan isim faa’il tersebut !\nJawab :\nمالك         مالكان        مالكون      وملاك    وملك    وملكة     مالكة    مالكتان     مالكات     ومواكل", "t": "Susah", "k": "B"}, {"id": "NAHWU-140", "m": "NAHWU", "n": 140, "q": "Sebagaimana kita ketahui bahwa salah satu tanda dari kalimat isim adalah adanya tanwin, Namun, ada beberapa kondisi, suatu isim tidak menerima tanwin, sebutkan kondisi tersebut !\nJawab : hal tersebut ada 4 kondisi , yakni :\n• Di dahului alif lam ( al )\n• Menjadi mudof\n• Isim ghoiru munshorif\n• Mabni.", "t": "Mudah", "k": "B"}, {"id": "NAHWU-141", "m": "NAHWU", "n": 141, "q": "Mengenai jangkauan makna , kalimat isim terbagi menjadi dua , yaitu isim ma’rifat dan isim nakiroh,  tolong devinisiakn berikut tanda dan contohnya !\nJawab :\n Isim nakirah adalah setiap isim yang menunjukkan pada makna yang tidak ditentukan atau makna umum. Biasanya diakhiri dengan tanwin .\n Isim ma’rifah adalah setiap isim yang menunjukkan makna tertentu dan biasanya di awali dengan alif lam ( al ).", "t": "Mudah", "k": "B"}, {"id": "NAHWU-142", "m": "NAHWU", "n": 142, "q": "Perhatikan ayat berikut ini  :اِذَا وَقَعَتِ الْوَاقِعَةُۙ, kalimat yang bergaris bawah, itu kalimat apa? Serta tashrifkan  dengan tashrif lughowi !\nJawab :kalimat tesebut adalah kalimat fi’il , fi’il madzi , tashrifannya adalah :                           \n وقع وقع وقعوا وقعت وقعتا وقعن وقعت وقعتما وقعتم وقعت وقعتما وقعتمن وقعت وقعنا", "t": "Susah", "k": "B"}, {"id": "NAHWU-143", "m": "NAHWU", "n": 143, "q": "Kalimat yang tidak bisa kemasukan tandanya kalimat isim dan tandanya kalimat fiil serta kalimat yang tidak bisa berdiri sendiri, di sebut kalimat apa ?\nJawab : kalimat tersebut adalah kalimat huruf, seperti huruf jer, huruf qosam dll.", "t": "Mudah", "k": "B"}, {"id": "NAHWU-144", "m": "NAHWU", "n": 144, "q": "Perhatikan ayat berikut ini  فَصَلِّ لِرَبِّكَ وَانْحَرْ , kalimat yang bergaris bawah berupa kalimat apa, Coba tashrifkan dengan tashrif istilahi !\nJawab :  Kalimat tersebut adalah kalimat Fi’il , fi’ilnya fi’il Amar ( perintah ) dari fi’il madzi    صَلَّى\nSedangkan tashrifannya adalah :\nصَلَّى  يُصَلِّي  صَلاَةً فهو  مُصَلٍّ  وذاك  مُصلَّى صَلِّ  لا تصلى مصلى مصلى", "t": "Susah", "k": "B"}, {"id": "NAHWU-145", "m": "NAHWU", "n": 145, "q": "Ketika ada dua kata dijadikan menjadi sebuah kalimat yang utuh dalam disipilin ilmu nahwunya di sebut apa? Jelaskan beserta contohnya !\nJawab : Dua kata yang di jadikan satu kalimat di sebut : Susunan Idofah. sedangkan idofah itu terdiri dari Mudof ( kata yg pertama) dan Mudof Ilaih (kata yg kedua ). Contoh :صِرَاطَ المُسْتَقِيْمِ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-146", "m": "NAHWU", "n": 146, "q": "Jelaskan maksud dari nadzom berikut  :    هُوَ اسْمُ وَقْتٍ أَوْ مَكَانٍ انْتَصَبْ ¤ كُلُّ عَلَى تَقْدِيرِ فِي عِنْدَ العَرَبْ\nJawab :\nMaksud dari nadzom tersebut adalah menerangkan tentang dhorof, dhorof adalah kalimat isim yang selamanya di baca nasob yang menunjukkannwaktu dan tempanya sebuah pekerjaan. Sedangkan dhorof terbagi menjadi dua :\n• Dhorof makan  contoh : جلستُ امامَ زيدٍ\n• Dhorof zaman   contoh : صمتُ يومَ الاثنيْنِ", "t": "Susah", "k": "B"}, {"id": "NAHWU-147", "m": "NAHWU", "n": 147, "q": "Perhatikan ayat berikut ini, هُوَ الْمَسِيْحُ ابْنُ مَرْيَمَ , disitu di awali dengan isim dlomir, jelaskan jenis isim dlomirnya, serta tashrifkan !\nJawab :jenis isim dlomir nya adalah dlomir munfasil , tashrifannya adalah :\n                                             نَحْنُ    أَنَا   أَنْتُنَّ   أَنْتُمَا   أَنْتِ  أَنْتُمْ  أَنْتُمَا   أَنْتَ     هُنَّ  هُمَا  هِيَ  هُمْ  هُمَا   هُوَ", "t": "Susah", "k": "B"}, {"id": "NAHWU-148", "m": "NAHWU", "n": 148, "q": "Dalam menvonis sesuatu, biasanya kitav klarifikasi dulu tanda-tandanya, untuk itu bagaimana kita menvonis kalimat fiil ?\nJawab : caranya adalah , kita kenali tanda-tandanya, yaitu :\n• Bisa kemasukan qod , contoh : قد قام زيد\n• Bisa kemasukan saufa , contoh : سوف يقوم خالد\n• Bisa kemasukan huruf siin, contoh : سيقوم خالد\n• Bisa kemasukan ta’ ta’ nis sakinah, contoh :  قامت هند", "t": "Susah", "k": "B"}, {"id": "NAHWU-149", "m": "NAHWU", "n": 149, "q": "Fungsinya adalah menasobkan
