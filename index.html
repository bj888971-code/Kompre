, dalam konteks ekonomi islam riba merujuk pada transaksi yang memberikan keuntungan yang tidak sah  berdasarkan hukum syari'at, yang di peroleh dengan cara yang tidak sesuai dengan prinsip keadilan dan saling menguntungkan", "t": "Mudah", "k": "B"}, {"id": "FIQIH-89", "m": "FIQIH", "n": 89, "q": "Ada berapa pembagian riba? Sebutkan dan jelaskan secara terperinci! \nJawab: \nRiba di bagi menjadi 2,yaitu:riba al-fadl, dan riba al-nasi'ah. Riba al -fadl adalah terjadi ketika ada pertukaran sejenis, dengan perbedaan nilai yang tidak sebanding, misalnya pertukaran emas dan emas, uang dan uang yang lebih banyak tanpa dasar yang jelas, sedangkan riba al-nasi'ah adalah terjadi ketika ada transaksi pinjaman Yang memuat tambahan atau bunga yang harus di bayar oleh pinjaman,  yang biasanya berhubungan dengan jangka waktu tersebut.", "t": "Susah", "k": "B"}, {"id": "FIQIH-90", "m": "FIQIH", "n": 90, "q": "Sebutkan jual beli seperti apakah yang menipu menurut anda! \nJawab: \nJual beli yang menipu seperti, penjual menyembunyikan kekurangan atau kerusakan barang sehingga pembeli tidak mengetahuinya.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-91", "m": "FIQIH", "n": 91, "q": "Apa yang di maksud dengan unta bintu makhod?\nJawab: \nUnta bintu makhod adalah istilah yang menggambarkan unta betina muda, secara harfiyah bahasa Arab, bintu berarti anak perempuan dan makhod mengacu pada unta betina yang melahirkan.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-92", "m": "FIQIH", "n": 92, "q": "Jelaskan apa yang di maksud dengan duunal qullataini? \nJawab: \nDuunal qullataini adalah istilah bahasa arab yang di gunakan dalam konteks hukum islam, khususnya dalam pembahasan fiqih, khususnya terkait dalam bab thoharoh(kesucian), secara harfiah istilah ini berarti \"kurang dua qullah\".", "t": "Mudah", "k": "B"}, {"id": "FIQIH-93", "m": "FIQIH", "n": 93, "q": "Jelaskan apa perbedaan rukun dan wajib dalam bab haji! \nJawab: \nRukun haji adalah bagian yang harus di lakukan dalam ibadah haji, dan jika tidak di kerjakan, hajinya dianggap tidak sah, rukun tidak dapat di ganti dengan denda, dan atau amalan yang lain. Sedangkan wajib haji adalah bagian dari ibadah haji  yang harus di lakukan, tetapi jika tidak di kerjakan hajinya tetap sah dengan syarat membayar denda(dam)", "t": "Mudah", "k": "B"}, {"id": "FIQIH-94", "m": "FIQIH", "n": 94, "q": "Apa yang di maksud dengan haji ifrad? \nJawab: \nkata ifrad berasal dari bahasa arab yang berarti menyendiri(memisahkan), dalam konteks ibadah haji, ini berarti jama'ah memisahkan antara ibadah haji dan umroh, sehingga fokus utama adalah melaksanakan haji saja.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-95", "m": "FIQIH", "n": 95, "q": "Jelaskan yang di maksud dengan haji tamatu'! \nJawab: \nHaji tamatu' yakni jama'ah haji melaksanakan umroh terlebih dahulu, kemudian menyelesaikan ibadah haji pada musim haji dalam tahun yang sama.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-96", "m": "FIQIH", "n": 96, "q": "Jelaskan definisi dari nadzar! \nJawab: \nNadzar adalah janji atau komitmen kepada Allah untuk melakukan suatu ibadah yang perbuatan yang tertentu sebagai bentuk syukur atau pengabdian, biasanya terkait dengan tercapainya suatu keinginan atau harapan.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-97", "m": "FIQIH", "n": 97, "q": "Sebutkan apa saja macamnya talak! \nJawab: \nBerdasarkan kejelasan dan sifatnya:talak roj'i, talak ba'in. Berdasarkan penyampaian, yaitu talak shorih dan talak kinayah. Berdasarkan keadaan yaitu talak sunnah dan talak bid'ah. Berdasarkan. Berdasarkan permintaan yaitu talak atas kehendak suami, khulu', dan talak melalui hakim.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-98", "m": "FIQIH", "n": 98, "q": "Apa hukumnya menggunakan wifi tetangga tanpa izin? \nJawab: \nDalam pandangan islam menggunakan wifi tetangga tanpa izin hukumnya tidak diperbolehkan. Aspek syari'ah dalam islam menggunakan sesuatu yang dimiliki orang lain tanpa izin adalah sebagai bentuk mengambil hal orang lain secara tidak sah, kategori ini termasuk ghosob(merampas), Rosulullah SAW. Bersabda:\" Tidak halal harta seorang muslim kecuali dengan keridhoan dirinya\".(HR. Ahmad dan Abu Dawud).", "t": "Mudah", "k": "B"}, {"id": "FIQIH-99", "m": "FIQIH", "n": 99, "q": "Jelaskan kapan seorang makmum dikatakan sebagai masbuk! \nJawab: \nMakmum di katakan masbuk ketika makmum datang di saat imam sudah membaca al-fatihah kemudian ruku', jika makmum berhasil mengikuti imam sebelum ruku', maka dianggap masih mengikuti roka'at tersebut.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-100", "m": "FIQIH", "n": 100, "q": "Apa hukumnya mengadu domba orang lain? \nJawab: \nDalam islam mengadu domba(namimah) adalah perbuatan yang sangat tercela dan harom. Namimah adalah tindakan menyebarkan ucapan atau informasi dengan tujuan untuk memecah belah, menciptakan permusuhan, dan memperkeruh hubungan antara orang lain.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-101", "m": "FIQIH", "n": 101, "q": "Apa hukumnya memajang patung seseorang didalam rumah? \nJawab: \nHukum memajang patung di dalam rumah dalam pandangan islam memiliki beberapa perincian, yang di dasarkan pada sumber-sumber syari'at, mayoritas ulama' menganggap hal ini makruh bahkan harom tergantung pada jenis dan tujuannya. Patung berbentuk makhluk bernyawa diharomkan berdasarkan hadist Nabi SAW: \"Sesungguhnya orang-orang yang membuat gambar(patung) akan di adzab di hari kiamat, dan akan di katakan kepada mereka \" Hidupkan lah apa yang kamu buat\"(HR. Bukhari dan Muslim).", "t": "Susah", "k": "B"}, {"id": "FIQIH-102", "m": "FIQIH", "n": 102, "q": "Bagaimana hukum jual beli samar atau tidak dilihat? \nJawab: \nJual beli yang samar atau tidak jelas hukumnya harom karena mengandung gharar(tidak ada kepastian). Seperti dalam hadist Nabi: \" Janganlah kalian menjual sesuatu yang tidak ada disisimu\".(HR. Abu Dawud dan At-tirmizi)", "t": "Mudah", "k": "B"}, {"id": "FIQIH-103", "m": "FIQIH", "n": 103, "q": "Jelaskan apa yang di maksud dari khiyar? \nJawab:\nDalam hukum islam khiyar adalah hak pilihan yang diberikan kepada pihak-pihak dalam transaksi jual beli untuk meneruskan atau membatalkan akad.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-104", "m": "FIQIH", "n": 104, "q": "Apa saja macam-macam khiyar? Jelaskan! \nJawab: \nKhiyar dibagi menjadi 4,yaitu: khiyar majlis(hak pembeli dan penjual dalam meneruskan dan membatalkan akad selama keduanya masih dalam satu majlis), khiyar syarat(hal untuk membatalkan atau meneruskan akad yang di syarat kan dalam transaksi selama jangka waktu tertentu yang disepakati kedua belah pihak), khiyar aib(hal untuk membatalkan transaksi jika di temukan cacat pada barang yang tidak diketahui sebelumnya), khiyar ru'yah( hak untuk meneruskan dan membatalkan akad setelah pembeli melihat barang), khiyar ta'yin(  hal pembeli untuk memilih barang yang di tawarkan).", "t": "Susah", "k": "B"}, {"id": "FIQIH-105", "m": "FIQIH", "n": 105, "q": "Orang yang merdeka tidak boleh menikahi budak kecuali dengan 2 syarat, yaitu? \nJawab: \nKetika ketidakmampuan finansial untuk menikah dengan orang merdeka, yakni jika seorang pria merdeka secara finansial tidak mampu menikahi perempuan merdeka yang sederajat, maka ia diperbolehkan menikahi budak. Budak perempuan yang beriman(muslimah) pernikahan dengan budak perempuan hanya diperbolehkan jika budak tersebut seorang muslimah.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-106", "m": "FIQIH", "n": 106, "q": "Berapa lamakah masa 'iddahnya seorang istri yang di tinggal wafat suaminya? \nJawab: \nMasa 'iddahnya adalah apabila wanita tersebut sedang hamil, maka masa iddahnya sampai ia melahirkan. Sedangkan masa iddahnya bagi wanita yang tidak hamil, maka masa iddahnya 4bulan 10hari", "t": "Mudah", "k": "B"}, {"id": "FIQIH-107", "m": "FIQIH", "n": 107, "q": "Apa saja yang di larang bagi seorang istri dalam masa iddahnya? \nJawab: \nTidak di perbolehkan menikah sampai masa iddahnya selesai, dilarang berhias berlebihan atau menggunakan wangi\"an, kecuali untuk kebutuhan dasar, seperti mandi dan kesehatan, dan tidak diperbolehkan keluar rumah tanpa kepentingan.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-108", "m": "FIQIH", "n": 108, "q": "Sebutkan apa saja hukum-hukum islam! \nJawab: \nHukum-hukum islam yaitu, wajib(perbuatan yang harus di lakukan oleh orang muslim), harom(tindakan  larangan untuk di lakukan ), sunnah(perbuatan yang di anjurkan untuk di lakukan), makruh(perbuatan yang di anjurkan untuk ditinggalkan), mubah(tindakan yang netral).", "t": "Mudah", "k": "B"}, {"id": "FIQIH-109", "m": "FIQIH", "n": 109, "q": "Apa saja sumber hukum islam? Sebutkan! \nJawab: \nSumber-sunber hukum islam yaitu: Alquran, hadist, ijma' dan qiyas.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-110", "m": "FIQIH", "n": 110, "q": "Apa yang di maksud dengan ijma'? \nJawab: \nIjma' adalah istilah dalam hukum islam yang berarti kesepakatan para ulama' atau mujtahid dalam suatu generasi mengenai hukum syar'i setelah wafatnya Nabi Muhammad SAW.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-111", "m": "FIQIH", "n": 111, "q": "Jelaskan apa yang di maksud dengan qiyas! \nJawab: \nQiyas adalah suatu metode istinbat hukum dalam islam yang di gunakan untuk menetapkan hukum suatu perkara yang tidak dapat secara langsung  dalam alquran dan hadist.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-112", "m": "FIQIH", "n": 112, "q": "Sebutkan syarat-syarat seseorang boleh menqoshor sholat! \nJawab: \nSeseorang boleh menqoshor sholat fardhu ketika bepergian jauh sekitar sampai 16 pos(77km), tujuan bepergian bukan untuk maksiat, dan tidak bersifat tetap.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-113", "m": "FIQIH", "n": 113, "q": "Bagaimana hukumnya seorang anak yang belum baligh menunaikan ibadah haji bersama orang tuanya? \nJawab: \nSecara umum anak yang belum baligh tidak di wajibkan untuk menunaikan ibadah haji, namun jika seorang anak yang belum baligh ikut bersama orang tuanya dalam perjalanan haji, maka hukumnya sah, tetapi ibadah haji yang di lakukan anak tersebut tidak di anggap sebagai kewajiban haji yang harus dia jalankan ketika baligh nanti.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-114", "m": "FIQIH", "n": 114, "q": "Apa yang di maksud dengan sumpah ila'? \nJawab: \nSumpah ila' adalah sumpah yang di ucapkan oleh suami dalam islam untuk tidak menggauli istrinya selama jangka waktu tertentu, minimal 4 bulan atau lebih.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-115", "m": "FIQIH", "n": 115, "q": "Jelaskan apa yang di maksud dengan dzihar!\nJawab: \nDzihar adalah istilah dalam hukum islam yang merujuk pada ucapan suami kepada istrinya dengan mengatakan sesuatu yang menyerupakan istrinya dengan wanita yang harom dinikahi, seperti ibu, saudara kandung perempuan atau yang lainnya.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-116", "m": "FIQIH", "n": 116, "q": "Apa definisi dari infaq? Jelaskan dan apa tujuannya! \nJawab: \nInfaq adalah pemberian harta secara sukarela untuk kepentingan yang dibenarkan dalam islam, baik bersifat wajib maupun sunnah. Adapun tujuannya ialah sebagai bentuk kedermawanan dan bentuk keperdulian dengan orang lain atau untuk kepentingan agama.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-117", "m": "FIQIH", "n": 117, "q": "Apa saja dampak atau hukuman bagi seseorang yang tidak mengeluarkan zakat? \nJawab: \nDampak dari segi spiritual adalah menolak kewajiban zakat di anggap dosa besar, dalam alquran Allah mengancam orang yang tidak menunaikan zakat dengan azab yang berat(QS.At taubah 34-35), dan dampak secara sosial yaitu tidak menunaikan zakat menghalangi distribusi Kekayaan yang adil, yang seharusnya membantu kaum fakir miskin", "t": "Susah", "k": "B"}, {"id": "FIQIH-118", "m": "FIQIH", "n": 118, "q": "Jelaskan apa yang di maksud dengan qishos! \nJawab: \nQishos adalah salah satu bentuk hukuman dalam islam \nYang ditetapkan atas pelaku tindak pidana tertentu terutama pembunuhan penganiayaan yang mengakibatkan yang menyebabkan hilangnya anggota tubuh atau nyawa", "t": "Mudah", "k": "B"}, {"id": "FIQIH-119", "m": "FIQIH", "n": 119, "q": "Apa saja syarat- syarat qishos? \nJawab: \nSyarat- syarat qishos yaitu: korban dan pelaku sama-sama dewasa dan beramal, kesengajaan dalam kasus pembunuhan, kesetaraan antara korban dan pelaku misalnya sama-sama merdeka, dan tuntutan dari ahli waris korban.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-120", "m": "FIQIH", "n": 120, "q": "Ada berapa macam kafir? Sebutkan! \nJawab: \nMacam-macam kafir ada 6,yaitu: kafir harbi, kafir dzimmi, kafir musta'min, kafir mu'ahad, kafir fasiq dan kafir murtad.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-121", "m": "FIQIH", "n": 121, "q": "Jelaskan apa yang di maksud dengan kafir harbi! \nJawab: \nKafir harbi adalah kafir yang memusuhi islam secara aktif, baik secara peperangan, serangan fisik, maupun propaganda, mereka di anggap sebagai musuh yang harus dihadapi jika mereka menyerang umat islam.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-122", "m": "FIQIH", "n": 122, "q": "Apa yang di maksud kafir dzimmi? \nJawab: \nKafir dzimmi adalah kafir yang hidup dibawah pemerintahan islam dan membayar pajak khusus untuk non muslim, mereka mendapat perlindungan dari negara islam selama memenuhi aturan islam dan tidak memerangi umat islam.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-123", "m": "FIQIH", "n": 123, "q": "Jelaskan apa yang dinamakan kaffarah! \nJawab: \nKaffarah adalah denda yang harus dibayar karena melanggar larangan Allah atau melanggar janji. Kaffarah merupakan asal dari kata kuat yang artinya tertutup. Maksudnya tertutupnya hati seseorang hingga ia berani melakukan pelanggaran terhadap aturan syar'i.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-124", "m": "FIQIH", "n": 124, "q": "Sebutkan macam-macamnya kaffarah! \nJawab: \nYaitu: kaffarah pembunuhan, kaffarah dzihar, kaffarah melakukan hubungan biologis disiang hari bulan Ramadhan, kaffarah karena melanggar sumpah, kaffarah ila', kaffarah karena membunuh binatang buruan pada saat ber ihram.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-125", "m": "FIQIH", "n": 125, "q": "Apa hikmah dari adanya kaffarah? \nJawab: \nHikmahnya adalah manusia benar-benar menyesali perbuatan yang keliru, telah berbuat dosa kepada Allah dan merugikan manusia, menuntun manusia agar segera bertaubat kepada Allah atas tindak maksiat yang ia lakukan, menstabilkan mental manusia, hingga ia merasakan ketenangan diri karena tuntunan agama(mambayar kaffarah) telah ia tunaikan", "t": "Mudah", "k": "B"}, {"id": "FIQIH-126", "m": "FIQIH", "n": 126, "q": "Seseorang yang berhak memandikan jenazah ialah?\nJawab: \nJenazah laki-laki yang memandikan laki-laki, sebaliknya kecuali suami istri, jika tidak ada suami /istri atau mahrom, maka jenazahnya di tayamum kan, jika ada beberapa orang yang berhak maka diutamakan keluarga terdekat dengan jenazah", "t": "Mudah", "k": "B"}, {"id": "FIQIH-127", "m": "FIQIH", "n": 127, "q": "Apa saja ketentuan yang dibutuhkan untuk menkafani jenazah? \nJawab: \nKetentuannya yaitu kain yang di gunakan hendaklah bagus, bersih, dan menutupi seluruh tubuh, kain kafan berwarna putih, jumlah kain kafan bagi laki-laki hendaklah tiga lapis, sedangkan perempuan lima lapis, sebelum digunakan untuk membungkus, kain kafan hendaknya diberi wangi-wangian, dan tidak berlebihan dalam menkafani jenazah", "t": "Susah", "k": "B"}, {"id": "FIQIH-128", "m": "FIQIH", "n": 128, "q": "Apa hukumannya bagi seseorang yang mampu untuk haji namun  menunda-nunda? \nJawab: \nHukuman bagi seseorang yang menunda-nunda haji namun ia mampu, yaitu dosa, karena mengabaikan kewajiban, apabila menunda-nunda tanpa adanya sebab maka ia sama saja melalaikan kewajiban kepada Allah. Terancam meninggal dalam keadaan su'ul khotimah.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-129", "m": "FIQIH", "n": 129, "q": "Apa hukumnya mempelajari ilmu tentang haid bagi wanita? \nJawab: \nMempelajari ilmu haid bagi wanita hukumnya wajib, karena termasuk fardhu 'ain.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-130", "m": "FIQIH", "n": 130, "q": "Kapankah seorang wanita dikatakan baligh? \nJawab: \nSeorang wanita dikatakan baligh ketika berumur 9 tahun, yakni telah mengalami menstruasi sampai umur 16 tahun.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-131", "m": "FIQIH", "n": 131, "q": "Berapakah paling sedikitnya darah haid? \nJawab: \nPaling sedikitnya yaitu satu hari satu malam, dan paling banyaknya 15 hari.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-132", "m": "FIQIH", "n": 132, "q": "Berapakah paling sedikitnya darah nifas? \nJawab: \nPaling sedikitnya darah nifas yaitu satu tetes.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-133", "m": "FIQIH", "n": 133, "q": "Sebutkan apa saja sifat dari darah haid! \nJawab: \nSifat dari darah haid yaitu, dalam segi warnanya(hitam, merah, coklat, kuning dan abu-abu/keruh).", "t": "Mudah", "k": "B"}, {"id": "FIQIH-134", "m": "FIQIH", "n": 134, "q": "Jelaskan pengertian dari hirabah(merampok)! \nJawab:\nHirabah yaitu mengambil harta orang lain dengan kekerasan/ancaman senjata dan kadang-kadang disertai dengan pembunuhan", "t": "Mudah", "k": "B"}, {"id": "FIQIH-135", "m": "FIQIH", "n": 135, "q": "Bagaimana hukum makan dan minum sambil berdiri? \nJawab: \nMakan dan minum sambil berdiri dalam islam tidak di haramkan secara mutlak, tetapi ada beberapa pendapat ulama' yang menganggapnya kurang di anjurkan atau makruh, salah satunya hadist yang diriwayatkan oleh imam Muslim\"janganlah kalian minum dan makan sambil berdiri\"(HR.Imam Muslim). Karena Nabi lebih suka makan dan minum sambil duduk.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-136", "m": "FIQIH", "n": 136, "q": "Bagaimana hukumnya mengghibah orang lain? \nJawab: \nMeng ghibah atau menggunjing keburukan orang lain dalam islam di haromkan dan termasuk dosa besar, dalam al-quran Allah berfirman dalam suroh al-Hujurat( 49:12) :\" Hai orang-orang yang beriman, jauhilah kebanyakan dari prasangka, karena dari prasangka itu dosa, dan janganlah kamu mencari-cari kesalahan orang lain, dan janganlah sebagian kamu menggunjing sebagian yang lain. .. \"", "t": "Mudah", "k": "B"}, {"id": "FIQIH-137", "m": "FIQIH", "n": 137, "q": "Apa yang di maksud dengan  riddah?\nJawab: \nRiddah dalam islam istilah merujuk pada murtad, yakni tindakan keluar dari agama islam setelah sebelumnya memeluknya. Riddah bisa melalui perkataan, perbuatan, atau keyakinan yang bertentangan dengan ajaran islam.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-138", "m": "FIQIH", "n": 138, "q": "Apakah sholatnya seseorang yang sudah meninggal, jika selama hidupnya meninggalkan banyak sholat fardhu wajib di qodlo'? \nJawab: \nBeberapa ulama' berpendapat bahwa keluarga atau orang yang masih hidup bisa menggantikan sholat fardhu yang ditinggalkan  orang yang sudah meninggal, meskipun pendapat ini bukan pendapat yang diterima oleh semua madzhab. Sebagian besar ulama' berpendapat bahwa sholat fardhu yang ditinggalkan oleh orang yang meninggal tidak dapat di qodlo' oleh orang lain.", "t": "Susah", "k": "B"}, {"id": "FIQIH-139", "m": "FIQIH", "n": 139, "q": "Apa hukumnya menghadiri walimatul ursy(pernikahan)? \nJawab: \nDalam sebuah hadist Nabi Muhammad SAW, yang bersabda \" apabila salah seorang diantara kalian diundang ke walimah, maka hendaklah dia memenuhi undangan tersebut.\"(HR. Bukhari dan Muslim). Hadist ini menunjukkan bahwa hadir dalam walimatul ursy adalah perbuatan yang di anjurkan, selama acara tersebut tidak melanggar aturan islam.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-140", "m": "FIQIH", "n": 140, "q": "Jelaskan perbedaan dari wudhu dan wadhu!\nJawab: \nWudhu' adalah proses pembersihan atau mensucikan diri dari sebagian tubuh yang wajib di basuh, seperti wajah, tangan dan sebagainya, sedangkan wadhu' adalah alat untuk berwudhu'.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-141", "m": "FIQIH", "n": 141, "q": "Apa yang di maksud sunnah hai'at? \nJawab: \nSunnah hai'at adalah salah satu jenis  sunnah dalam ibadah yang sifatnya tidak wajib, tetapi sangat di anjurkan untuk di lakukan karena menambah kesempurnaan untuk ibadah, jika di lakukan mendapat pahala, dan jika di tinggalkan tidak berdosa.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-142", "m": "FIQIH", "n": 142, "q": "Sebutkan apa saja yang termasuk dalam sunnah hai'at dalam sholat! \nJawab: \nMengangkat tangan saat takbirotul ihram, ruku', dan bangun dari ruku', membaca do'a iftitah sebelum membaca suroh al-fatihah, mengucapkan amin setelah al-fatihah", "t": "Mudah", "k": "B"}, {"id": "FIQIH-143", "m": "FIQIH", "n": 143, "q": "Bagaimana hukum seseorang yang memamerkan harta di media sosial? \nJawab: \nDalam perspektif agama islam, hukum seseorang yang pamer harta di media sosial tergantung pada niat dan dampak dari tindakannya. Jika bertujuan untuk riya atau pamer maka hukumnya harom, jika seseorang memamerkan hartanya untuk memotivasi atau menginspirasi maka hukumnya mubah tanpa adanya niat sombong, namun hal ini tetap harus berhati-hati, agar tidak menyinggung perasaan orang lain, yang berdampak iri hati.", "t": "Susah", "k": "B"}, {"id": "FIQIH-144", "m": "FIQIH", "n": 144, "q": "Jelaskan perbedaan pendapat di antara ahli fikih terkait kedudukan hakim wanita! \nJawab: \nMadzhab maliki, syafi'i dan Hanbali tidak membolehkan hakim wanita. Dasar mereka terkait hal ini adalah hadist Abu Hurairah yang di riwayat kan imam Bukhari, \"  tidak akan mendapatkan satu kaum yang memasrahkan urusannya kepada seorang wanita. Imam Abu Hanifah membolehkan pengangkatan hakim wanita menyelesaikan urusan kecuali urusan had dan qishash.", "t": "Susah", "k": "B"}, {"id": "FIQIH-145", "m": "FIQIH", "n": 145, "q": "Jelaskan pengertian dari madzhab! \nJawab: \nSejumlah fatwa-fatwa dan pendapat seorang alim besar didalam urusan agama, baik ibadah maupun lainnya.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-146", "m": "FIQIH", "n": 146, "q": "Qodzaf secara bahasa berarti? \nJawab: \nDalam bahasa arab berarti melempar atau menuduh, dalam konteks syari'ah, istilah ini sering digunakan untuk merujuk pada tindakan menuduh seorang berzina tanpa bukti yang sah, seperti tanpa menghadirkan empat saksi yang adil.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-147", "m": "FIQIH", "n": 147, "q": "Hukuman had bagi hamba sahaya yang menuduh orang baik- baik berzina adalah? \nJawab: \nHukuman takzir, karena status mereka sebagai hamba sahaya, Hukuman had(hukuman tetap yang di tetapkan oleh syari'at), seperti yang berlaku untuk orang merdeka, yaitu 80 kali cambukan, bisa diringankan sesuai penguasa dan hakim.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-148", "m": "FIQIH", "n": 148, "q": "Hal apakah yang menjadikan seseorang wajib menikah? \nJawab: \nMenikah menjadi wajib bagi seseorang untuk menghindari perbuatan dosa, seperti kemaksiatan, zina. Seseorang yang mampu secara finansial dan fisik, yakni bertanggung jawab untuk menafkahi dzohir dan batin. Tidak adanya alternatif lain yang halal.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-149", "m": "FIQIH", "n": 149, "q": "Pernikahan seperti apakah yang dianggap sesuai syari'at islam? \nJawab: \nYakni dengan adanya rukun nikah, seperti: calon mempelai pria dan wanita, adanya wali nikah bagi wanita(biasanya ayah atau wali yang sah), dua orang saksi yang adil dan memenuhi syarat, ijab dan qobul(akad nikah) yaitu pernyataan serah terima kepada mempelai pria yang diterima secara jelas. Dalam syarat: kedua mempelai beragama islam, kedua mempelai tidak memiliki hubungan mahrom, adanya persetujuan dari wali mempelai wanita, tidak ada paksaan dari salah satu belah pihak, mas kawin yang di berikan mempelai pria kepada mempelai wanita.", "t": "Susah", "k": "B"}, {"id": "FIQIH-150", "m": "FIQIH", "n": 150, "q": "Jelaskan apa yang di maksud dengan luqotoh! \nJawab: \nLuqotoh adalah istilah dalam fiqih yang merujuk pada barang temuan, yaitu sesuatu barang yang ditemukan di tempat umum, tetapi tidak diketahui pemiliknya.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-151", "m": "FIQIH", "n": 151, "q": "Apa saja syarat- syarat luqotoh? \nJawab: \nBarang tidak diketahui pemiliknya jika si pemilik mengetahui nya, maka barang tersebut wajib  di kembalikan. Barang bukan milik pribadi yang hilang secara sengaja. Tidak boleh di ambil dengan niat menguasai, melakukan  pengumuman (i'lan) dengan jangka waktu maksimal setahun.", "t": "Susah", "k": "B"}, {"id": "FIQIH-152", "m": "FIQIH", "n": 152, "q": "Apakah boleh seseorang memakai barang temuan jika si pemilik sudah tidak lagi mencarinya? \nJawab: \nDalam pandangan etika dan hukum, menggunkan barang temuan tanpa memastikan pemiliknya tidak mencarinya lagi adalah tindakan yang harus dipertimbangkan dengan berhati-hati. Jika barang tersebut sudah di umumkan dalam jangka waktu 1 tahun, dan ternyata si pemilik sudah benar-benar tidak mencarinya lagi, maka barang tersebut boleh di manfa'atkan, namun dengan syarat dan ketentuan, jika suatu saat si pemilik datang atau meminta barang tersebut, maka harus dikembalikan atau di ganti.", "t": "Susah", "k": "B"}, {"id": "FIQIH-153", "m": "FIQIH", "n": 153, "q": "Apa yang di maksud dengan ghosob? \nJawab: \nGhosob adalah istilah dalam fiqih islam yang merujuk kepada tindakan mengambil atau menggunakan harta milik orang lain secara paksa atau tanpa izin yang sah.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-154", "m": "FIQIH", "n": 154, "q": "Bagaimana hukum ghosob? \nJawab: \nGhosob termasuk perbuatan yang haram karena melanggar hak orang lain, bertentangan dengan keadilan dan dapat menimbulkan kerugian. Sebagaimana Allah berfirman:\"Dan janganlah sebagian kamu memakan harta sebagian yang lain di antara kamu dengan jalan yang batil. (QS.Al Baqarah:188).", "t": "Mudah", "k": "B"}, {"id": "FIQIH-155", "m": "FIQIH", "n": 155, "q": "Bagaimana cara seorang makmum jika mengingatkan imam yang lupa dalam sholat? \nJawab: \nBagi makmum laki-laki cara mengingatkan dengan bacaan tasbih, sedangkan bagi perempuan cara mengingatkan dengan menepukkan tangan.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-156", "m": "FIQIH", "n": 156, "q": "Bagaimana hukum makmum yang mendahului gerakan imam? \nJawab: \nMendahulukan gerakan imam secara sengaja dianggap harom karena bertentangan dengan perintah mengikuti imam, jika tidak sengaja atau kurangnya konsentrasi hukumnya makruh.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-157", "m": "FIQIH", "n": 157, "q": "Apa hukumnya iqomah? \nJawab: \nHukum dari iqomah adalah sunnah mu'akkad(sunnah yang di anjurkan) menurut mayoritas ulama', seoerti madzhab syafi'i, hanafi, dan Hanbali.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-158", "m": "FIQIH", "n": 158, "q": "Bagaimana hukum keramas ditengah hari bulan puasa? \nJawab: \nHukumnya di perbolehkan dan tidak membatalkan puasa, asalkan tidak ada air yang masuk kedalam rongga tubuh, seperti mulut dan lainnya.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-159", "m": "FIQIH", "n": 159, "q": "Bagaimana cara  seseorang mengatasi ketika sholat ragu akan roka'at nya(jumlah banyak atau sedikitnya)? \nJawab: \nYakni dengan berusaha untuk mengingat, pilihlah jumlah roka'at yang diyakini, dan dengan memilih jumlah roka'at yang lebih sedikit.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-160", "m": "FIQIH", "n": 160, "q": "Bagaimana cara sholatnya wanita yang sedang istihadzoh? \nJawab: \nWanita yang sedang mengalami istihadzoh tetap di wajibkan sholat, adapun caranya dengan bersuci sebelum melakukan sholat, yakni membersihkan darah yang keluar, kemudian menutupnya dengan kain atau pembalut agar darah tidak keluar kemana-mana.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-161", "m": "FIQIH", "n": 161, "q": "Bagaimana hukum seseorang yang sedang berpuasa namun ia selalu mengghibah orang lain? \nJawab: \nHukum puasa tetap sah, namun dengan mengghibah dapat mengurangi atau bahkan menghilangkan pahala puasa.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-162", "m": "FIQIH", "n": 162, "q": "Bagaimana hukum seorang wanita yang sholat sambil menggendong anaknya yang masih balita? \nJawab: \nDalam islam, sholat sambil menggendong anak di perbolehkan, asalkan tidak mengganggu kekhusyu'an dalam sholat, dan tidak ada najis yang melekat pada anak ataupun pakaian yang di kenakan.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-163", "m": "FIQIH", "n": 163, "q": "Apa hukumnya seseorang yang menelan dahak di tengah sholat? \nJawab: \nMenelan dahak ditengah sholat dengan sengaja atau tidak adanya kebutuhan mendesak maka hukumnya makruh, dan para ulama' sepakat bahwa menelan dahak di tengah sholat tidak membatalkan sholat, karena dahak berasal dari dalam tubuh, dan tidak termasuk najis.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-164", "m": "FIQIH", "n": 164, "q": "Apa saja syarat- syarat menjadi imam? \nJawab: \nSyarat- syaratnya adalah: muslim, baligh dan berakal, menurut madzhab imam harus laki-laki, kecuali jika jama'ah wanita yang dipimpin oleh wanita, dan mengerti ilmu fiqih tentang sholat.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-165", "m": "FIQIH", "n": 165, "q": "Bagaimana hukum wanita sholat di masjid? \nJawab: \nDalam pandangan mayoritas ulama', seperti madzhab hanafi, maliki, dan syafi'i, seorang wanita diperbolehkan sholat di masjid, namun tidak di anjurkan(makruh) jika menyebabkan kesulitan atau gangguan dalam fokusnya sholat. Dan beberapa hadist menyebutkan seorang wanita lebih baik sholat di dalam rumahnya", "t": "Mudah", "k": "B"}, {"id": "FIQIH-166", "m": "FIQIH", "n": 166, "q": "Apa hukumnya  membaca dzikir setelah sholat? \nJawab:\nMembaca dzikir setelah sholat  merupakan amalan yang di anjurkan dalam agama islam, dan memiliki dasar hukum yang kuat, secara umum hukumnya adalah sunnah.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-167", "m": "FIQIH", "n": 167, "q": "Apa hukumnya membaca do'a qunut dalam sholat subuh? \nJawab: \nHukumnya adalah sunnah mu'akkadah (sunnah yang di anjurkan).", "t": "Mudah", "k": "B"}, {"id": "FIQIH-168", "m": "FIQIH", "n": 168, "q": "Apa hukum dari suap menyuap? \nJawab: \nSuap menyuap dalam pandangan fiqih islam adalah tindakan yang dilarang(harom),berdosa besar bagi penyuap ataupun yang menerima suap.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-169", "m": "FIQIH", "n": 169, "q": "Apakah boleh seorang wanita yang sedang haid memotong kuku? \nJawab: \nSecara umum tidak ada larangan memotong kuku bagi seorang wanita yang sedang haid, karena hal ini tidak termasuk dengan kesuciannya seseorang ataupun  tidak.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-170", "m": "FIQIH", "n": 170, "q": "Bagaimana hukum seseorang yang membawa HP ketika sholat? \nJawab: \nHukum membawa HP ataupun memegangnya ketika sholat, tergantung pada beberapa  faktor, jika HP ini mengganggu kekhusyu'an sholat maka tidak diperbolehkan  membawanya dan bisa mengurangi kesempurnaan sholat.", "t": "Mudah", "k": "B"}], "p": [{"k": "A", "s": ["NAHWU-24", "NAHWU-2", "SEJARAH-7", "SEJARAH-61", "NU-4", "NU-57", "HADIS-7", "HADIS-53", "FIQIH-18", "FIQIH-6"]}, {"k": "A", "s": ["NAHWU-25", "NAHWU-4", "SEJARAH-9", "SEJARAH-62", "NU-5", "NU-58", "HADIS-31", "HADIS-54", "FIQIH-19", "FIQIH-7"]}, {"k": "A", "s": ["NAHWU-26", "NAHWU-5", "SEJARAH-11", "SEJARAH-63", "NU-6", "NU-59", "HADIS-32", "HADIS-55", "FIQIH-20", "FIQIH-8"]}, {"k": "A", "s": ["NAHWU-27", "NAHWU-6", "SEJARAH-13", "SEJARAH-64", "NU-7", "NU-60", "HADIS-33", "HADIS-56", "FIQIH-21", "FIQIH-9"]}, {"k": "A", "s": ["NAHWU-29", "NAHWU-7", "SEJARAH-14", "SEJARAH-65", "NU-8", "NU-61", "HADIS-34", "HADIS-57", "FIQIH-22", "FIQIH-11"]}, {"k": "A", "s": ["NAHWU-31", "NAHWU-9", "SEJARAH-18", "SEJARAH-66", "NU-9", "NU-19", "HADIS-49", "HADIS-58", "FIQIH-23", "FIQIH-12"]}, {"k": "A", "s": ["NAHWU-34", "NAHWU-11", "SEJARAH-25", "SEJARAH-67", "NU-10", "NU-20", "HADIS-50", "HADIS-59", "FIQIH-24", "FIQIH-13"]}, {"k": "A", "s": ["NAHWU-35", "NAHWU-13", "SEJARAH-29", "SEJARAH-69", "NU-11", "NU-21", "HADIS-66", "HADIS-60", "FIQIH-26", "FIQIH-14"]}, {"k": "A", "s": ["NAHWU-36", "NAHWU-14", "SEJARAH-32", "SEJARAH-70", "NU-12", "NU-22", "HADIS-67", "HADIS-61", "FIQIH-27", "FIQIH-15"]}, {"k": "A", "s": ["NAHWU-37", "NAHWU-17", "SEJARAH-34", "SEJARAH-71", "NU-13", "NU-23", "HADIS-81", "HADIS-62", "FIQIH-28", "FIQIH-16"]}, {"k": "A", "s": ["NAHWU-39", "NAHWU-18", "SEJARAH-35", "SEJARAH-72", "NU-14", "NU-24", "HADIS-84", "HADIS-63", "FIQIH-30", "FIQIH-17"]}, {"k": "A", "s": ["NAHWU-
