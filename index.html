 mubtadak menjadi isimnya serta merofakkan khobar menjadi khobarnya, ini adalah pngertian dari apa?\nJawab : itu adalah pengertian dari amil nawasikh Inna dan saudara-saudaranya. Contoh ; إِنَّ الإِسْلَامَ دِيْنُ", "t": "Mudah", "k": "B"}, {"id": "NAHWU-150", "m": "NAHWU", "n": 150, "q": "Silahkan kamu tashrif lafadz yg bergaris bawah dari ayat berikut :وَّاَرۡسَلَ عَلَيۡهِمۡ طَيۡرًا اَبَابِيۡلَۙ  ! dengan tashrif istilahi !\nJawab :\nأَرْسَلَ  يُرْسِلُ  إِرْسَالاً فهو  مُرْسِلٌ  وذاك مُرْسَلٌ  أَرْسِلْ  لاَتُرْسِلْمُرْسَلٌ  مُرْسَلٌ", "t": "Susah", "k": "B"}, {"id": "SEJARAH-1", "m": "SEJARAH", "n": 1, "q": "Apakah Singkatan dari PPKI, dan Berapa kali PPKI menyelenggarakan sidang?\nJawab: \nPPKI adalah singkatan dari Panitia Persiapa Kemerdekaan Indonesia Sidang \nPPKI diselenggarakan pada tanggal 18-22 Agustus 1945.\nSidang pertama pada tanggal 18 Agustus 1945\n,Sidang kedua pada tanggal 19 Agustus 1945,\nSidang ketiga pada tanggal 20 Agustus 1945,\nSidang keempat pada tanggal 22 Agustus 1945", "t": "Susah", "k": "A"}, {"id": "SEJARAH-2", "m": "SEJARAH", "n": 2, "q": "Pada tanggal berapa PPKI dibubarkan dan lembaga-lembaga apa saja yang telah dibentuk dalam sidang keempat PPKI?\nJawab: \nDalam sidang keempat membahas perbentukkan lembaga-lembaga negara yaitu Komite Nasional, Partai Nasional, dan Badan Keamanan Rakyat. Setelah lembaga-lembaga tersebut terbentuk PPKI resmi dibubarkan pada tanggal 23 Agustus 1945.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-3", "m": "SEJARAH", "n": 3, "q": "Apa yang kamu ketahui tentang RIS?\nJawab: \nRIS adalah singkatan dari Republik Indonesia Serikat. RIS dibentuk ketika Belanda menerapkan politik pecah belah (devide et impera). Pembentukan RIS membuat provinsi-provinsi yang telah terbentuk menjadi negara-negara mandiri yang lepas dari konsep negara kesatuan.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-4", "m": "SEJARAH", "n": 4, "q": "Sesuai dengan KBBI, apa yang dimaksud dengan integritas secara politis?\nJawab: \ndalam KBBI (Kamus Besar Bahasa Indonesia), intergritas secara politik artiya proses penyatuan berbagai kelompok budaya dan sosial dalam satu kesatuan wilayah nasional dan membentuk suatu identitas sosial", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-5", "m": "SEJARAH", "n": 5, "q": "Apa yang kamu ketahui tentang sistem pemerintahan menggunakan sistem parlementer?\nJawab: \npada masa Demokrasi Liberal tahun 1950-1959. Sistwm pemerintahan menggunakan sistem parlementer yang artinya yang menjalankan pemerintahan adalah perdana menteri, sedangkan presiden hanya sebagai simbol negara.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-6", "m": "SEJARAH", "n": 6, "q": "Sebutkan tokoh-tokoh yang mempertahankan integritas bangsa Indonesia?\nJawab: \nIr. Soekarno,\nMohammad Hatta,\nAbdul Haris Nasution,\nAhmad Yani,\nSri Sultan Hamengkubuwono IX", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-7", "m": "SEJARAH", "n": 7, "q": "Apa yang kamu ketahui tentang sejarah demokrasi di Indonesia?\nJawab: \ndemokrasi merupakan suatu sistem pemerintahan di mana rakyat memegang kedaulatan tertinggi dengan sistem langsung maupun perwakilan. Sistem demokrasi di Indoensia petama kali diterapkan di Yunani Kuno tepatnya oleh Negara Kota (polis) Athena", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-8", "m": "SEJARAH", "n": 8, "q": "Sebutkan 3 maklumat yang dikeluarkan pemerintah untuk menghindari absolutisme dari kekuasaan presiden yang mungkin terjadi!\nJawab:\nMaklumat Wakil Presiden Nomer X 16 Oktober 1945 bahwa KNIP berubah menjadi lembaga legislatif.\nMaklumat Pemerintah 3 November 1945 tentang pembentukan partai-partai politik.\nMaklumat Pemerintah 14 November 1945 tentang perubahan sistem pemerintahan presidensial menjadi sistem pemerintahan parlementer", "t": "Susah", "k": "A"}, {"id": "SEJARAH-9", "m": "SEJARAH", "n": 9, "q": "Berikan salah satu alasan mengapa Presiden Soekarno harus mengeluarkan dekrit presiden ?\nJawab: \nsalah satu alasa Presiden Soekarno mengeluarkan dikret adalah adanya konflik antar partai yang terus-menerus terjadi sangat mengganggu stabilitas nasional.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-10", "m": "SEJARAH", "n": 10, "q": "Apa yang dimaksud dengan demokrasi terpimpin menurut Ketetapan MPRS?\nJawab: \nDemokrasi terpimpin menurut Ketetapan MPRS adalah  dekmokrasi kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan perwakilan yang berintikan musyawarah untuk mufakat secara gotong royong di antara semua kekuatan nasional yang progresif revolusioner dengan berporoskan nasionalisme, agama, dan komunisme (Nasakom).", "t": "Susah", "k": "A"}, {"id": "SEJARAH-11", "m": "SEJARAH", "n": 11, "q": "Sebutkan salah satu isi konsepsi Presiden 21 Februari 1957!\nJawab: \nsalah satu isi konsepsi Presiden adalah sistem demokrasi liberal akan diganti dengan demokrasi terpimpin.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-12", "m": "SEJARAH", "n": 12, "q": "Apa yang kamu ketahui tentang kondisi negara sebelum presiden mengumumkan dekrit presiden pada tanggal 5 Juli 1959?\nJawab: \nkondisi negara yang semakin memburuk ditambah dengan kegagalan konstutuante menyusun UUD yang baru, akibatnya pemerintah negara tidak memiliki landasan konstitusi yang kuat. Akhirnya Presiden mengumumkan Dekrit Presiden pada 5 Juli 1959, yang menandai berkahirnya penerpan Demokrasi Liberal dan kemudian digantikan dengan Demokrasi Terpimpin", "t": "Susah", "k": "A"}, {"id": "SEJARAH-13", "m": "SEJARAH", "n": 13, "q": "Apa yang kamu ketahui tentang perkembangan kehidupan ekonomi pada Masa Orde Baru?\nJawab: \nOrde Baru mewarisi kemerosotan ekonomi yang ditinggalkan oleh pemerintahan sebelumnya. Hal ini ditandai dengan rendahnya pendapatan per kapita penduduk yang hanya mencapai US$ 70 dan tingginya tinggkat inflasi hingga mencapai 65%.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-14", "m": "SEJARAH", "n": 14, "q": "Pada tahun berapa pelenggaraan pemilu secara langsung pada masa Reformasi 1998?\nJawab: \nyaitu, pada tahun 1999, 2004, 2009, dan 2014", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-15", "m": "SEJARAH", "n": 15, "q": "Demokrasi pada masa Orde Baru disebut?\nJawab: \nDemokrasi pada mas Orde Baru disebut dengan Demokrasi Pancasila.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-16", "m": "SEJARAH", "n": 16, "q": "Mengapa Abdurahman Wahid dikenal dengan sebutan Bapak Pluralisme Indonesia?\nJawab: \nkarena pada masa pemerintahan ia telah mencabut larangan pemerintah kepada masyarakat Tionghoa untuk berekspresi secara bebas.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-17", "m": "SEJARAH", "n": 17, "q": "Apa yang dilakukan Megawati dalam mendukung dalam pelaksanaan Demokrasi di Indonesia?\nJawab: \nada dua hal yang dilakukan oleh Megawati dalam mendukung pelaksanaan Demokrasi di Indonesia yaitu membagi kewenangan antara TNI dan Polri serta melaksanakan pemilihan umum secara langung untuk memilih presiden dan wakil presiden (tidak melalui perwakilan/MPR)", "t": "Susah", "k": "A"}, {"id": "SEJARAH-18", "m": "SEJARAH", "n": 18, "q": "Apa yang kamu ketahui tentang Gerakan Pemuda Masa Kolonial Belanda?\nJawab: \nsejarah telah mencatat bahwa gerakan pemuda memegang peranan penting bagi perubahan-perubahan di bidang politik dan pemerintaan dalam perjalanan sejarah bangsa ini.  Dari pemikiran kaum muda ini lahirlah sebuah peristiwa penting, yaitu Sumpah Pemuda yang di ikrarkan pada tanggal 28 Oktober 1928.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-19", "m": "SEJARAH", "n": 19, "q": "Apa yang dimaksud dengan sejarah dunia?\nJawab: \nsejarah dunia adalah sejarah umat manusia di seluruh dunia, semua daerah di bumi, dilihat dari era Paleolitikum", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-20", "m": "SEJARAH", "n": 20, "q": "Kapan ASEAN dibentuk?\nJawab: \nASEAN terbentuk pada tanggal 8 Agustus 1967", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-21", "m": "SEJARAH", "n": 21, "q": "Sebutkan negara-negara pendiri ASEAN?\nJawab: \nIndonesia, Malaysia, Thailand, Singapura, dan Filipina", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-22", "m": "SEJARAH", "n": 22, "q": "Siapakah wakil dari Indonesia yang menandatangani Deklarasi Bangkok?\nJawab: \nAdam Malik adalah meteri luar negeri yang mewakili indonesia untuk menandatangani Deklarasi Bangkok.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-23", "m": "SEJARAH", "n": 23, "q": "Sebutkan salah satu ini dari Deklarasi Bangkok?\nJawab: \nsalah satu isi Deklarasi Bangkok adalah sebagai berikut: mempercepat pertumbuhan ekonomi, kemajuan sosial dan perkembangan kebudayaan di kawasan Asia Tenggara.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-24", "m": "SEJARAH", "n": 24, "q": "Sebutkan 10 Negara anggota ASEAN?\nJawab: \nIndonesia, Brunei Darusalam, Kamboja, Laos, Malaysia, Singapura, Myanmar, Filipina, Thailand, dan Vietnam.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-25", "m": "SEJARAH", "n": 25, "q": "Apa yang kamu ketahui tentang peradaban-peradaban kuno?\nJawab: \npada masa 3000 tahun sebelum Masehi, telah muncul peradaban di lembah Mesopotamia (dataran di antara sungai Tigris dan Efrat) di Timur Tengah, di tepi sungai Nil, Mesir, dan di lembah sungai Indus. Selain itu, peradaban juga muncul di lembah sungai Kuning.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-26", "m": "SEJARAH", "n": 26, "q": "Apa yang dimaksud dengan zaman perunggu?\nJawab: \nzaman perunggu adalah bagian dari sistem tiga zaman yaitu zaman batu, zaman perunggu, dan zaman besi", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-27", "m": "SEJARAH", "n": 27, "q": "Deskripsikan Mesopotomia dengan bahasa anda?\nJawab: \nMesopotomia merupakan region di kawasan Hilal Subur. Tempat berdirinya beberapa negara kota pada zaman kuno.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-28", "m": "SEJARAH", "n": 28, "q": "Apa yang kamu ketahui tentang Sungai Nil?\nJawab: \nDaerah aliran sungai Nil di Afrika utara merupakan tempat perkembangan peradaban Mesir Kuno.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-29", "m": "SEJARAH", "n": 29, "q": "Sebutkan 6 Museum tertua di dunia?\nJawab: \nMuseum Capitolini,Italia,\nRoyal Armouries Museum, Inggris,\nMuseum Sejarah Basel, Swiss,\nMuseum Seni dan Arkeologi Besancon, Prancis,\nMuseum Kunstkamera, Rusia,Museum Louvre, Prancis", "t": "Susah", "k": "A"}, {"id": "SEJARAH-30", "m": "SEJARAH", "n": 30, "q": "Apa yang dimaksud dengan sejarah kontenporer?\nJawab: \nsejarah yang meliputi peristiwa-peristiwa yang terjadi sejak sekitar tahun 1900 hingga sekarang.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-31", "m": "SEJARAH", "n": 31, "q": "Apakah yang dimaksud dengan zaman pra-aksara atau nirleka?\nJawab. \nZaman nirleka atau zaman Pra- aksara adalah zaman dimana manusia belum mengenal tulisan. Bersal dari kata pra yang berarti belum dan aksara yang berarti tulisan atau aksara.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-32", "m": "SEJARAH", "n": 32, "q": "Apa manfaat kita peroleh mempelajari zaman pra-aksara.\nJawab. \nSecara garis besar adalah : Pertama : Sebagai inspirasi untuk pengembangan nalar kehidupan dan kedua sebagai peringatan .sebagai inspirasi, Kehidupan manusia modrn sekarang, sebagian masih mewarisi tradisi zaman pra- aksara, misalnya memelihara hewan ternak dan hewan penjaga, pola hunian manusia, dan system pertanian. Pada zaman nirleka, manusa merambah hutan secara sederhana dan tidak mengganggu lingkungan,  namun dizaman modern sudah menggunakan alat cangih dan menyebabkan masalah polusi, yang dapat mengganggu penerbangan dan kesehatan. Ini salah satu yang menjadi peringatan bagi kita", "t": "Susah", "k": "A"}, {"id": "SEJARAH-33", "m": "SEJARAH", "n": 33, "q": "Kapan penduduk kepulauan Indonesia memasuki zaman aksara/sejarah.\nJawab. \nPenduduk kepulauan indoknesia memasuki zaman aksara pada abad 5 M, dengan fakta ditemukannya prsasti peninggalan kerajaan tua seperti kerajaan Kutai di muara Kaman Kaltim.", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-34", "m": "SEJARAH", "n": 34, "q": "Seperti halnya mahkluk hidup, bumi yang kita diami ini juga mengalami evolusi. Sebutkan 4 periode evolusi bumi dan jelaskan \nJawab.\na. Zaman Azoikum . Yaitu zaman belum ada kehidupan di muka bumi. Karena suhu bumi masih terlalu tingggi. Waktunya sekitar 1 milyar tahun yang lalu.\nb. Zaman Palaezoikum, Zaman purba tertua. Paza masa itu sudah ada peninggalan fosil flora dan fauna. Waktunya sekitar 350.000.000 tahun yang lalu.\nc. Zaman Mesozoikum. Zaman purba pertengahan . Pada masa itu sudah ada hewan mamalia, hewan amphibi dan tumbuhan sudah mulai ada. Waktunya sekitar 140.00.000 tahun yang lalu. \nd. Zaman Neozoikum, Zaman purba baru. Yang dimulai sekitar 60.000.000 tahun yang lalu. Zaman ini dibagi menjadi dua lagi yaitu tertier dan quarter. Zaman es mulai menyusut dan manusia mulai hidup di zamn itu.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-35", "m": "SEJARAH", "n": 35, "q": "Menurut pendapat ahli sejarah “ Sarasin  bersaudara “ dari manakah asal usul nenek moyang bangsa Indonesia?\nJawab. \nPenduduk asli kepulauan Indonesia adalah ras berkulit gelap dan bertubuh kecil mereka mulanya tinggal di asia tenggara yang disebut suku bangsa Vedda. Ras yang masuk dalam kelompok ini adalah suku bangsa Hieng di kamboja, Miaotse dan Yao-jen di Cina dan suku senoi di semenanjung Malaya.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-36", "m": "SEJARAH", "n": 36, "q": "Masih menurut pendapat Sarasin, seteleh sebagian kepulauan Indonesia dihuni oleh suku bangsa vedda, masih ada 4 kelompok /glombang lagi , suku-suku bangsa yang datang ke Indonesia. Sebutkan 4 kelompok suku tersebut.\nJawab. \n1. Proto Melayu,  \n2. Deutro Melayu \n3. Melanesoid \n4. Negrito dan Weddid", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-37", "m": "SEJARAH", "n": 37, "q": "Terdapat berbagai pendapat/teori tentang proses masuknya budaya Hindu-Budha ke Indonesia. Sebutkan teori atau pendapat-pendapat tersebut.\nJawab :\na. Teori Ksatria \nb. Teori Waisya \nc. Teori Brahmana \nd. Teori Arus Balik", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-38", "m": "SEJARAH", "n": 38, "q": "Sebutkan 1 contoh  peninggalan  Budaya Hindu-Budha di Pulau sumatera, dan uraikan secara singkat.\nJawab. \nSalah satu contoh/bukti Peninggalan Budaya hindu-budha  di pulau sumatera adalah kerajaan Sriwijaya. Saat kerajaan sriwijaya berada di bawah Dinasti Syailendra kerjaan tersebut dapat mengusasi kerajaan-kerajaan lain di sepanjang selat malaka. Karena kekuatan angkatan lautnya. Hingga kerajaan Sriwijaya Dijuluki“ Nusantara I", "t": "Susah", "k": "A"}, {"id": "SEJARAH-39", "m": "SEJARAH", "n": 39, "q": "Sebutkan kerajaan-Kerajaan  hindu budha yang pernah ada di bumi nusantara, beserta tahun, tempat dan raja yang paling Berjaya pada kerajaan tersebut.\nJawab.\n1. Kerajaan Kutai, di Kalimantan  Timur pada Abad 5 M, dengan rajanya Mulawarman.\n2. Kerajaan Taruma Negara, di dekat Sungai Citarum, Jawa Barat, Abad 5-6 M dengan Rajanya Purnawarman\n3. Kerajaan Kalingga, di Jepara Sebelah Utara Gunung Muria pada abad 7- 9 M dengan Raja perempuan Ratu Sima.\n4. Kerajaan Sriwijaya, di Palembang Sumatera Selatan , Pada abad 7-13 M, raja paling ternama Bala Putra Dewa.\n5. Kerajaan Mataram Kuno, Tempat disekitar Kaki Gungung Seribu , Pada abad 7-10 M, dengan raja ternama Sanjaya.\n6. Kerajaan  Kediri, Tempat di Kediri Jawa  Timur, Pada abad 10-13 M, dengan raja ternama Jayabaya\n7. Kerajaan Singhasari, Di sekitar Malang Jawa Timur, pada Abad 13-14 dengan Raja ternama Kertanegara\n8. Kerajaan Majapahit, Tempat di Jawa  Timur, pada abad 13-15 dengan Raja Ternama Hayam Wuruk", "t": "Susah", "k": "A"}, {"id": "SEJARAH-40", "m": "SEJARAH", "n": 40, "q": "Apakah yang dimaksud dengan akulturasi kebudayaan ?\nJawab .\nAkulturasi kebudayaan adalah proses pencampuran antara unsur-unsur budaya yang satu dengan kebudayaan yang lain, sehingga terbentuk kebudayaan baru. Kebudayaan baru yang merupakan hasil pencampuran kedua kebudaay itu masing-masing tidak kehilangan kepribadian/ciri khasnya.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-41", "m": "SEJARAH", "n": 41, "q": "Sebutkan 3 pendapat tentang pertama kali Islam Masuk ke Nusantara!\nJawab:\nPendapat pertama , dari sarjana barat terutama dari belanda Misalnya J. Pijnapel bahwa Islam di Inonesia bersal dari Gujarat India sekitar abad 13 M atau abad 7 H.\nPendapat kedua, Hoesin Djajadiningrat, Islam mask ke Indonesia pada abad ke 13 M dan berasal dari Persia ( iran )\nPendapat ketiga, Buya Hamka  , bahwa Islam masuk Indonesia berasal dari Arab atau mesir pada abad ke 7 H.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-42", "m": "SEJARAH", "n": 42, "q": "Sebutkan kerajaan-kerajaan Islam yang pernah ada di sumatera dan sebutkan juga raja pertamanya !\nJawab :\na. Kerajaan Samudra Pasai, di Lhoksumawe , Aceh. Pada pertengahan abad ke 13, raja pertamnaya Sultan Malik As Shaleh\nb. Kesultanan Aceh Darussalam, di aceh berkembang pada abad 16, dengan sultan pertamanya Sultan Ali Mughayat Syah\nc. Kerajaan-kerajaan Islam di Riau. Berkembang pada abad 16, dengan raja-rajanya antara lain Sultan Mansyur Syah, Raja Hasan dan Raja Muhammad \nd. Kerajaan Islam di Jambi, Berkembang antara abad 9-13 M, dengan raja ternamanya Sultan Taha Syaifudin. \ne. Kerajaan Islam Di Sumatera Selatan, Berkembang  apa abad 14-15 M, dengan raja terkenalnya Sultan Mahmud Badarudin\nf. Kerajaan Islam di Minangkabau. Berkembang dari abad 15-17 M dengan raja pertamanya Syaikh Burhanudin.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-43", "m": "SEJARAH", "n": 43, "q": "Sebutkan kerajaan-kerajaan Islam yang pernah ada di Pulau Jawa  dan sebutkan juga raja pertamanya !\nJawab.\na. Kerajaan Demak, berdiri sekitar tahun 1500 M, terletak di Demak Jawa Tengah, dengan raja Raja Pertamanya adalah Raden Fattah\nb. Kerajaan Mataram, Berdiri sekitar tahun 1582, terletak di Kota Gede sebelah tenggara Yogyakarta sekarang, Raja pertamanya adalah Sutawijaya.\nc. Kesultanan Banten, terletak di Banten  berdiri sekitar tahun 1526, dengan raja pertamanya Maulana Hasanudin / Fattahillah\nd. Kesultanan Cirebon, terletak di Cirebon Jawa Barat, berdiri pada tahun 1470, dengan raja pertamanya adalah Syarif Hidayatullah atau Sunan Gunung Jati", "t": "Susah", "k": "A"}, {"id": "SEJARAH-44", "m": "SEJARAH", "n": 44, "q": "Sebutkan kerajaan-kerajaan Islam yang pernah ada di Pulau Kalimantan dan sebutkan juga raja pertamanya !\nJawab. \na. Kerajaan Pontianak Kalimantan Barat,berdiri abad ke 18, dengan raja pertamnya Syarif Idrus\nb. Kerajaan Banjar ( Banjarmasin ), Kalimantan Selatan , berdiri tahun 1550, dengan raja pertamanya Sultan Suryanullah", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-45", "m": "SEJARAH", "n": 45, "q": "Sebutkan kerajaan-kerajaan Islam yang pernah ada di Pulau Sulawesi dan sebutkan juga raja pertamanya!\nJawab. \na. Kerajaan Gowa-Tallo, di Sulawesi Selatan, berdiri pada tahun 1605, dengan raja ternamanya Sultan Hasanudin\nb. Kerajaan Wajo , Sulawesi selatan  berdiri tahun 1612, dengan raja pertamanya Arong Matoa", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-46", "m": "SEJARAH", "n": 46, "q": "Sebutkan ciri-ciri bangunan masjid kuno di Indonesia !\nJawab :\na. Atapnya berupa atap tumpang, yaitu atap yang bersusun, makin keatas makin kecil.\nb. Tidak ada menara yang berfungsi untuk mengumandangkan adzan, untuk menandai waktu sholat, dipukul beduk atau kentongan\nc. Masjid umumnya didirikan di Ibu kota atau dekat istana kerajaan.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-47", "m": "SEJARAH", "n": 47, "q": "Sebutkan kesenian yang bercorak Islam yang berfungsi untuk membantu penyebaran agama Islam\nJawab :\na.  Permainan debus,yaitu tarian yang pada puncak acara para penari menusukkan benda tajam ketubuhnya tanpa meninggalkan luka. Tarian ini diawali dengan pembacaan ayat-ayat Al Qur’an dan Sholawat nabi. Terdapat di Banten dan Minangkabau\nb. Tari Seudati, tarian ini aslinya dimainkan oleh delapan penari. Para penari menyanyikan lagu yang isinya antara lain adalah sholawat\nc. Wayang, termasuk  wayang kulit, yang dijadikan media dakwah oleh wali, dalam menyebarkan agama Islam.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-48", "m": "SEJARAH", "n": 48, "q": "Sebutkan peranan Islam dalam proses integrasi nusantara\nJawab :\na. Agama Islam yang diajarkan oleh para ulama. Islam mengatasi perbedaan-perbedaan yang terdapat diberbagi suku bangsa dan menjadi identitas yang mengatasi batas-batas geografis, sentiment entnis, identitas kesukuan dan adat istiadat lainnya.\nb. Penggunanan bahasa melayu yang lebih luas, yang awalnya terbatas hanya digunkaan di sebagian pulau sumatera, sejak Islam masuk digunakan sampai pulau jawa, Sulawesi dan pulau-pulau  lainnya.\nc. Jaringan perdaganan antarpulau", "t": "Susah", "k": "A"}, {"id": "SEJARAH-49", "m": "SEJARAH", "n": 49, "q": "Apakah yang anda ketahui tentang Upacara Tradisional Tabot.\nJawab. \nTabot adalah upacara tradisional maysarakat Bengkulu untuk mengenang kisah kepahlawanan dan kematian cucu nabi Muhammad SAW, Husain Bin Ali Bin Abi Tholib dalam peperangan dengan pasukan Ubaidillah bin Zaid di padang Karbala Irak, pada tanggal 10 Muharram 61 H ( 681 M )", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-50", "m": "SEJARAH", "n": 50, "q": "Sebutkan dan jelaskan contoh seni sasta bercorak Islam yang  berkembang di suamtera dan jawa pada masa penyebaran agama Islam \nJawab.\na. Hikayat, adalah karya sasta yang berisi cerita ataupun dongeng. Contoh: Hikayat Iskandar Zulkarnaian, Hikayat Raja-raja Pasai\nb. Babad,  cerita yang dalam penulisannya tidak selalu berdasarkan fakta. Contoh : Babad Tanah Jawi, Babad Tanah Matarm\nc. Syaiir, karya sastra mirip puisi, yang terdiri dari 4 baris dalam tiap baitnya: contoh syair tertua adalah  syair yang tertulis pada batu nisan makam putri Pasai di Minyene Tujoh.\nd. Suluk merupakan karya sastra yang berupa kitab-kitab yang isinya menjelaskan tentang tasawuf. Contoh :Suluk Sukarsa, Suluk Wujil, dan Suluk Sumirang.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-51", "m": "SEJARAH", "n": 51, "q": "Faktor utama bangsa barat melakukan imperialism dan ekpansi wilayah ke dunia timur, adalah karena factor 3G ( Gold, Gospel and Glory ). Jelaskan pengertian 3G tersebut.\nJawab:\na. Gold, bangsa barat memandang bahwa ada prospek ekonomi di dunia timur yang bagus,seperti emas, bahan tambang lainnya dan rempah-rempah\nb. Gospel, adanya keinginan untuk menyebarkan agama nasrani keseluruh dunia. Portugis dan adalah Negara yang dilandasi agama katolik.\nc. Glory, ( Kejayaan ). Sebagai bangsa yang lama dikuasasi penjajah , portugis ingin bangkit dan membuktikan kepada dunia bahwa portugis mampu membangun bangsanya dengan kekuatan sendiri", "t": "Susah", "k": "A"}, {"id": "SEJARAH-52", "m": "SEJARAH", "n": 52, "q": "Setelah Indonesia merdeka , ternyata kita belum   sepenuhnya merdeka, masih banyak ancaman baik dari kekuatan Asing, maupun dari dalam negeri. Pada periode tahun 1948-1965 indonesia masih mengahadapi ancaman disintegrasi dari dalam negeri. Sebutkan konflik/pergolakan yang terkait dengan ideology beserta tokohnya\nJawab. \na. Pemberontakan PKI Madiun, terjadi di Madiun Jawa Timur, pada tanggal 18 September 1948, dibawah pimpinan Muso dan Amir Syarifudin, dengan cita-cita ingin menjadikan Indonesia menjadi Negara komunis\nb. Pemberontakan DI/TII, dengan cita-cita ingin mendirikan Negara Islam,\n- Pemberontakan DI/TII di jawa barat dipimpin oleh S.M. Kartosuwiryo\n- Pemberontakan Di jawa Tengah dipimpin oleh  Amir Fatah\n- Pemberontakan Di Sulawesi Selatan  dipimpin oleh Kahar Muzakar\n- Pemberontakan Di Aceh dipimpin oleh  oleh Daun Beureuh\nc. Pemberontakan G 30s  PKI, 30 september 1965, dipimpin oleh DN Aidit", "t": "Susah", "k": "A"}, {"id": "SEJARAH-53", "m": "SEJARAH", "n": 53, "q": "Setelah Indonesia merdeka , ternyata kita belum   sepenuhnya merdeka, masih banyak ancaman baik dari kekuatan Asing, maupun dari dalam negeri. Pada periode tahun 1948-1965 indonesia masih mengahadapi ancaman disintegrasi dari dalam negeri. Sebutkan konflik/pergolakan yang terkait dengan Kepentingan kelompok beserta tokohnya\nJawab .\na. Pemberontakan Angkatan Perang Ratu Adil  ( APRA ) di jawa Barat tahun 1949, di pimpin oleh Raymond Westerling,  anggota utamanya adalah milisi tentara belanda\nb. Pemberontakan Andi Azis di Sulawesi Selatan, di pimpin oleh Andi Azis, karena mereka tidak puas dengan angkatan perang bentukan pemerintah RIS, terjadi tahun 1950.\nc. Pemberontakan Republik Maluku Selatan ( RMS ) di Maluku selatan dipimmpin oleh DR. Soumokil dan didukung tentara bekas tentara belanda KNIL. Terjadi pada tahun 1950, tujuan : ingin membuat Negara sendiri", "t": "Susah", "k": "A"}, {"id": "SEJARAH-54", "m": "SEJARAH", "n": 54, "q": "Sebagai generasi penerus perjuangan bangsa, kita perlu meneladani jejak para pahlawan dalam rangka mempertakan keutuhan NKRI, Sebutkan nama-nama pahlawan dari Papua yang berperan dalam mempertahan papua menjadi bagian dari NKRI\nJawab. \na. Frans Kaisiepo ( 1921-1979), Beliau yang mempopulerkan Lagu Indonesia Raya di Papua menjelang Indonesia Merdeka\nb. Marthen Indey , tahun 1946 menjadi ketua Partai Indonesia Merdeka ( PIM ) di Papua\nc. Silas Papare, tahun 1945 mendirikan Komite Indoensia Merdeka ( KIM ) di Papua \nd. Sebagai generasi penerus perjuangan bangsa, kita perlu meneladani jejak para pahlawan dalam rangka mempertakan keutuhan NKRI, Sebutkan nama-nama pahlawan dari Papua yang berperan dalam mempertahan papua menjadi bagian dari NKRI", "t": "Susah", "k": "A"}, {"id": "SEJARAH-55", "m": "SEJARAH", "n": 55, "q": "Sebagai generasi penerus perjuangan bangsa, kita perlu meneladani jejak para pahlawan dalam rangka mempertakan keutuhan NKRI, Sebutkan nama-nama Raja daerah yang berperan penting dalam mempertahan keutuhan NKRI, pada masa revolusi. \nJawab. \na. Sri Sultan Hamengkubuwono IX, dari Yogyayakarta (1912-1988)\nPeranan beliau , sejak awal kemerdekaan RI, sultan sudah banyak memberikan fasilitas kepada pemerintah RI yang baru terbentuk untuk menjalankan roda pemerintahan . Markas TKR dan Ibukota RI misalnya pernah dipindahkan ke Yogyakarta atas saran sultan. Bantuan logistic dan perlindungan bagi kesatuan-kesatuan TNI tatkala perang kemerdekaan berlangsung, juga ia berikan \nb. Sultan Syarif Kasim II Raja Siak Indrapura ( riau ) ( 1893-1968).\nKetika berita proklamasi Kemerdekaan RI sampai ke siak, Sultan Syarif segera mengirim surat kepada Soekarno-Hatta, menyatakan kesetiaan dan dukungan kepada pemerintah RI serta menyerahkan harta senilai 13 gulden ( sekitar 1,5 T  sekarang) untuk membantu perjuangan pemerintah RI. Selanjutnya sultan Syarif membentuk KOmite Nasional Indonesia dan tentara keamanan rakyat , dan barisan pemuda republik", "t": "Susah", "k": "A"}, {"id": "SEJARAH-56", "m": "SEJARAH", "n": 56, "q": "Dalam kurun waktu 1950-1959 pemerintah Indonesia belum stabil, terjadi pergantian cabinet hingga 7 kali. Sebutkan 7 kabinet pemerintah dalam kurun waktu tersebut.\nJawab:\na. Kabinet Natsir ( Masyumi ) 1950-1951\nb. KAbinet Sukiman  ( Masyumi ) 1951 -1952\nc. Kabinet Wilopo ( PNI ) 1952-1953\nd. Kabinet Ali Sastroamijoyo I ( PNI ) 1953-1955\ne. Kabinet Burhanudin Harahap ( Masyumi) 1955 – 1956\nf. Kabinet Ali Sastroamijoyo II ( PNI ) 1956 -1957\ng. Kabinet Juanda ( Zaken Kabinet )  1957-1959", "t": "Susah", "k": "A"}, {"id": "SEJARAH-57", "m": "SEJARAH", "n": 57, "q": "Dalam rangka perjuangan pembebasan irian barat, presiden Soekarno pada tanggal 19 Desember 1961di depan rapat raksasa di Yogyakarta, mengeluarkan suatu komando untuk berkonfrontasi secara militer dengan belanda yang dikenal dengan istilah Tri Komando Rakyat , sebutkan isi Trikora tersebut\nJawab.\nIsi Trikora \na. Gagalkan pembentukan Negara boneka papua buatan belanda\nb. Kibarkan sang merah putih di irian Barat\nc. Bersiaplah untuk mobilisasi umum guna mempertahankan kemerdekaan dan kesatuan tanah air dan bangsa.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-58", "m": "SEJARAH", "n": 58, "q": "Keadaan politik dan ekonomi pasca peristiwa G.30S/PKI, makin tidak aman dan ekonomi makin semrawut. Maka pada tanggal 12 januari 1966, KAMI , KAPPI, serta kesatuan-kesatuan aksi yang tergabung dalam Front Pancasila di depan DPR-GR. Mengajukan Tiga Tuntutan Rakyat. Sebutkan Isi Tritura tersebut , dan siapa mahasiswa yang gugur dalam lanjutan aksi itu. \nJawab\nIsi Tritura\n1. Bubarkan PKI\n2. Bersihkan cabinet Dwikora dari unsur-unsur PKI\n3. Turunkan harga/perbaikan ekonomi\nMahasiswa yang gugur dalam aksi lanjutan tersebut adalah Arif Rahman Hakim, mahasiswa UI, yang kemudian ditetapkan sebagai pahlawan AMPERA ( Amanat Penderitaan Rakyat).", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-59", "m": "SEJARAH", "n": 59, "q": "Sebutkan isi penting Surat Perintah Sebelas Maret, dari Ir. Sukarno, Kepada Letjen Suharto.\nJawab.\nSupersemar berisi pemberian mandate kepada Letjen Suharto, Selaku panglima angkatan Darat dan Pangkopkamtib untuk memulihkan keadaan keamanan dan kewibawaan pemerintah. Dalam menjalankan tugas penerima mandate diharuskan melaporkan segala sesuatu kepada presiden.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-60", "m": "SEJARAH", "n": 60, "q": "Perjuangan menentang belanda ( VOC ataupun pemerintahan colonial belanda ) menggunakan kekerasan dimulai sejak awal abad ke 17 sampai awal abad ke-20, sebutkan contoh-contoh perlawanan rakyat awal abad ke 17.\nJawab :\na. Sultan Agung dari mataram ( 1613-1645)\nb. Sultan Iskandar Muda dari Aceh ( 1635)\nc. Sultan Hasanudin dari makasar ( 1667)\nd. Untung Suropati dan Trunojoyo dari jawa ( 1670)\ne. Ibnu Iskandar dari Minang ( 1680)\nf. Sultan Agung Tirtayasa dari Banten ( 1684 )", "t": "Susah", "k": "A"}, {"id": "SEJARAH-61", "m": "SEJARAH", "n": 61, "q": "Perjuangan menentang belanda pasca VOC dengan menggunakan kekerasan pada  abad ke 19 sampai awal abad ke-20 terus digencarkan demi mencapai Indonesia merdeka, sebutkan contoh-contoh perlawanan rakyat awal abad ke 19 tersebut.\nJawab :\na. Pattimura dari Maluku ( 1817)\nb. Sultan Madaruddin dari Palembang (1817)\nc. Tuanku Imam Bonjol dari Minang ( 1822-1837)\nd. Pangeran Diponegoro dari jawa Tengah ( 1825-1830)\ne. I Gusti Ketut Jelantik dari Bali ( 1850)\nf. Pangeran Antasari dari Kalimantan ( 1860)\ng. Teuku Umar, Teuku Cik Di Tiro, Cut Nyak Din dari Aceh ( 1873 – 1904 )\nh. Anak Agung Made dari Lombok ( 1895 )\ni. Raja Sisingamangaraja XII dari tapanuli ( sekitar tahun1900 )", "t": "Susah", "k": "A"}, {"id": "SEJARAH-62", "m": "SEJARAH", "n": 62, "q": "Ada beberapa factor yang memicu gerakan nasioanilsme di Indonesia, ada yang bersifat internal dan eksternal, sebutkan factor-faktor tersebut, baik yang internal maupun yang eksternal\nJawab.\n1. Yang termasuk factor internal, antara lain\na. Kondisi social, politik dan ekonomi yang makin parah akibat penjajahan ( kolonialisme\nb. Munculnya kaum terpeljar/intelektual\nc. Tumbuhnya akan kejayaan bangsa/nusantara pada masa lampau \n2. Sedangkan yang termasuk factor eksternal antara lain\na.  Kesuksesan pergerakan nasional dinegara-negara lain di asia dan afrika\nb. Kemenangan jepang atas rusia dalam perang pada tahun 1905\nc. Masuk dan berkembangnya paham-paham baru dari eropa dan Amerika seperti, liberalism, demokrasi dan nasionalisme", "t": "Susah", "k": "A"}, {"id": "SEJARAH-63", "m": "SEJARAH", "n": 63, "q": "Sebutkan perbedaan perjuangan sebelum dan sesudah tahun 1908\nJawab :\na. Sebelum tahun 1908, \n- Dimpimpin oleh raja atau bangsawan dan tokoh agama\n- Bersifat kedaerahan/local\n- Perjuangan bersifat fisik saja\n- Terfokus kepada pemimpin kharismatik\n- Bersifat reaktif dan spontan\nb. Sesudah tahun 1908\n- Dipimpin dan digerkkan oleh kaum intelek\n- Bersifat nasional dan kerjasama antar daerah\n- Bersifat diplomasi, menggunakan cara-cara seperti perundingan, lobi dan sebagainya\n- Memiliki organisasi yang memungkinkan adanya kaderisasi\n- Memiliki visi yang jelas , yaitu Indonesia merdeka", "t": "Susah", "k": "A"}, {"id": "SEJARAH-64", "m": "SEJARAH", "n": 64, "q": "Sebutkan organisasi-organisasi yang bersifat nasional, sejak tahun 1908 sampai 1920, beserta pendirinya.\nJawab :\na. Budi Utomo ( BU ) didirikan pada tanggal 20 mei 1908, oleh Dr. Wahidin Sudirohusodo dan Dr. sutomo\nb. Sarekat Islam (SI ) didirkan pada tahun1911, oleh H. Samanhudi\nc. Muhammadiyah didirikan pada tanggal  18 November 1912 oleh KH. Ahmad Dahlan", "t": "Susah", "k": "A"}, {"id": "SEJARAH-65", "m": "SEJARAH", "n": 65, "q": "Peristiwa penting yang membangkitkan semangat nasionalisme dan semangat untuk Indonesia Merdeka, terjadi pada bulan Oktober 1928, memalui konggres Pemuda I dan konggres Pemuda II, Sebutkan tokoh-tokoh penting dalam konggres Pemuda II, tanggal 28 Oktober 1928, beserta hasil yang dicetuskan .\nJawab. \nTokoh-tokoh Penting Pada konggres Pemuda II/Sumpah Pemuda\na. Sugondo  Joyopuspito\nb. Muhammad Yamin\nc. R.M. Joko Marsaid\nd. Amir Syarifudin\ne. R. Kacasungkana\nf. Johan Mohammad Cai\nHasil yang dicetuskan yaitu , “ Sumpah Pemuda”, dengan isi sebagai berikut “\n- Sumpah Pemuda -\n1. Kami putra dan putri Indonesia, mengaku bertumpah darah yang satu tanah air Indonesia\n2. Kami putra dan putri Indonesia,mengaku berbangsa yang satu bangsa Indonesia\n3. Kami putra dan putri Indonesia, menjunjung tinggi bahasa persatuan, bahasa Indonesia", "t": "Susah", "k": "A"}, {"id": "SEJARAH-66", "m": "SEJARAH", "n": 66, "q": "Tonggak sejarah lahirnya bangsa Indonesia, diawali dengan peristiwa pembacaan Proklamasi kemerdekaan , pada tanggal 17 Agustus 1945. Sebutkan tokoh-tokoh yang sangat berperan menjelang peristiwa tersebut, serta sebutkan Bunyi teks proklamasi \nJawab. \nTokoh-tokoh yang berperan adalah ….\nIr. Sukarno, Drs. Moh. Hatta, Ahmad Subarjo, Fatmawati, Sukarni, Sayuti Melik, Latif Hendraningrat dan laksamana Maeda.\nIsi Naskah Proklamasi\n \nProklamasi\nKami bangsa Indonesia, dengan ini menyatakan kemerdekaan Indonesia\n\nHal-hal yang mengenai pemindahan kekuasaan dan lain-lain diselenggarakan dengan cara yang seksama dan dalam tempo yang sesingkat-singkatnya.\n\nJakarta, 17 Agustus 1945\nAtas nama bangsa Indonesia\n\nSukarno-Hatta", "t": "Susah", "k": "A"}, {"id": "SEJARAH-67", "m": "SEJARAH", "n": 67, "q": "Sebutkan tokoh-tokoh Ulama Indonesia yang paling berperan dalam  mencetuskan Resolusi Jihad dan hari santri 22 Oktober 1945\nJawab. \n1. KH. Hasyim Asy’ari\n2. Kiai Abas Buntet, \n3. Kiai Satori Arjowinangun\n4. Kiai Amin Babagan Ciwaringin\n5. Kiai Suja’I indramayu", "t": "Susah", "k": "A"}, {"id": "SEJARAH-68", "m": "SEJARAH", "n": 68, "q": "Resolusi adalah suatu keputusan atau kebulatan pendapat berupa permintaan atau tuntutan yang ditetapkan dalam rapat/sidang . Sedangkan resolusi Jihad adalah suatu keputusan atau kebulatan tekad yang ditetapkan dalam rapat/sidang untuk berjuang melawan penjajah demi membela tanah air. \nJawab \nIsi pokok dari resolusi jihad tanggal 22 Oktober 1945 adalah: \n1. Hukum membela tanah air adalah fardu ‘ain bagi setiap muslim di Indonesia. \n2. Muslimin yang berada dalam radius 94 km dari pusat pertempuran wajib ikut berperang melawan belanda", "t": "Mudah", "k": "A"}, {"id": "SEJARAH-69", "m": "SEJARAH", "n": 69, "q": "Perjuangan mengusir penjajah dan membela tanah air, tidak hanya  ditempuh dengan angkat senjata saja  dan jalur diplomasi saja,  namun juga bisa ditempuh dengan seni, yang mampu membakar semangat juang di hati dan rakyat melalui lagu-lagu perjuangan. Sebutkan tokoh/pencipta lagu-lagu perjuangan beserta judul lagu hasil karyanya, serta nyayikan minimal 1 lagu saja.\nJawab :\n1. W.R Supratman  ( Indonesia Raya )\n2. R. Kusbini ( Bagimu Negeri )\n3. Ibu Sud ( Berkibarlah Benderaku, Tanah Airku )\n4. R. Surarjo ( Dari Sabang Sampai Merauke )\n5. Ismail Marzuki ( Halo-halo Bandung, Indonesia Pusaka, Gugur Bunga)\n6. Husein Mutahar ( Hari Merdeka )\n7. C. Simanjuntak ( Maju Tak Gentar )\n8. L. Manik ( Satu Nusa Satu Bangsa )", "t": "Susah", "k": "A"}, {"id": "SEJARAH-70", "m": "SEJARAH", "n": 70, "q": "Setelah Indonesia memproklamirkan kemerdekaannya pada tanggal 17 agustus 1945, ternyata dunia belum  mengakui sepenuhnya. Kedatangan tentara sekutu yang diboncengi NICA ( tentara Belenda)  ingin berkuasa kembali di Indonesia. Hal ini membuat rakyat dan pejuang marah sehingga menyebabkan perlawanan rakyat. Sebutkan pertempuran-pertempuran yang terjadi pasca proklamasi dalam rangka mempertahan kemerdekaan Indonesa. \nJawab :\n1. Pertempuran medan Area ( Sumatera Utara , Sejak 13 Oktober 1945 ) dipimpin oleh : Achmad Tahir\n2. Pertempuran Ambarawa ( Jawa Tengah, sejak 26 Oktober 1945) dipimpin oleh : Kolonel Sudirman.\n3. Pertempuran Surabaya , di Surabaya ( 10 November 1945 ) dipimpin oleh Bung Tomo . Peristiwa ini kita peringati sebagai hari pahlawan.\n4. Peristiwa merah-Putih di manado, Sulawesi Utara. ( 14 Ferbuari 1946 ) diprakarsai oleh Dewan Minahasa pimpinan Mr. S.S. pelengkahu\n5. Pertempuran di Bandung/ Bandung lautan Api.( 23 Maret 1946). Kolonel AH. Nasution Memerintahkan untuk mengosongkan kota bandung dan membakarnya sebelum pergi. \n6. Pertempuran margarana, Bali ( 18 November 1946), Pimpinan Letkol I Gusti Ngurah Rai.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-71", "m": "SEJARAH", "n": 71, "q": "Selain perlawanan bersenjata, perjuangan bangsa Indonesia dalam mempertahankan dan memperoleh pengakuan dunia, juga ditempuh dengan jalur diplomasi ( Perundingan ), sebukan beberapa perundingan dalam mempertahankan  kemerdekaan tersebut.\nJawab :\na. Perundingan Linggarjati di Linggarjati Cirebon Jawa Barat tanggal 10 November 1946. Delegasi Indonesia dipimpin oleh : Sutan Syahrir, sedangkan dai belanda di  pimpin Oleh Prof. Willem Schermernhorn, penengah Lord Killearn dari Inggris\nb. Komisi Tiga Negara ( KTN ) , komisi jasa-jasa baik untuk Indonesia. Terbentuk pada tanggal 25 agustus 1947. KTN terdiri),  dari Australia ( pilihan Indondesia ), Belgia ( Pilihan Belanda  ) dan Amerika Serikat sebagai penengah.\nc. Perjanjian Renville , Kapal Angkatan Laut Amerika,  Dimulai pada tanggal 8 Desember 1948. \nd. Perjanjian Room-Royen ( tanggal 17 April 1949 )\ne. Konferensi Inter Indonesia ( 19-22 Juli 1949 dan 31 juli -2 agustus 1949 )\nf. Konferensi Meja Bundar ( KMB ) di Den Hag Belanda . Tanggal 23 Agustus 1949 – 2 November 1949\ng. Penyerahan Kedaulatan dari belanda Kepada RIS tanggal 27 Desember 1949", "t": "Susah", "k": "A"}, {"id": "SEJARAH-72", "m": "SEJARAH", "n": 72, "q": "Dalam sejarah dunia , ada peristiwa besar yang terjadi yaitu perang dunia ( PD ), yaitu PD I dan PD II. Setidaknya ada dua faktor yang melatarbelakangi terjadinya perang dunia II ( 1939-1945, yaitu faktor umum dan faktor khusus. Sebutkan kedua factor tersebut \nJawab :\na. Faktor umum adalah:\n1.  Kegagalan Liga Bangsa-Bangsa (LBB) menciptakan perdamaian dunia.\n2.  Munculnya keinginan melebarkan wilayah (ekspansi) di bidang ekonomi, Irredenta (Italia), Lebensraum (Jerman), dan Hakko I Chiu (Jepang).\n3.  Munculnya paham ideologi yang saling bertentangan, yaitu fasisme, komunisme, dan liberalisme.\n4.  Terdapat perlombaan pembuatan senjata antarnegara dan bangsa untuk memperkuat dan memperkokoh diri.\nB. Faktor Khusus\nFaktor khusus adalah:\n1. Invasi Jerman ke Polandia (1 September 1939).\n2. Invasi Jepang ke Manchuria, Cina (1931).\n3. Invasi Italia di Ethiopia (1935-1939).\n4. Serangan Jepang ke Pearl Harbor (7 Desember 1941).", "t": "Susah", "k": "A"}, {"id": "SEJARAH-73", "m": "SEJARAH", "n": 73, "q": "Dalam sejarah perjalanan bangsa, Indonesia. Selain menghadapi penjajah bangsa asing, bangsa Indonesia juga pernah mengalami beberapa kali kejadian/musibah berupa wabah penyakit yang mematikan, yang terbagi kedalam 2 periode, yaitu periode sebelum abad ke 20, dan periode  abad 20 sampai sekarang. Sebutkan kejadian wabah penyakit sebelum abad 20?\nJawab :\n1. Penyakit Dada . Penduduk Banten dan Jawa Tengah pada tahun 1622-1623   menghadapi wabah besar berupa “penyakit dada” yang membunuh banyak orang. Saat itu sepertiga penduduk Banten dan dua pertiga penduduk Jawa Tengah meninggal dunia. \n2. Di Makassar pada tahun 1636 juga pernah terjadi serangan wabah epidemic yang kejadiannya berlangsung sekira 40 hari dan menewaskan 60.000 orang. Kemudian di Jawa pada tahun 1643-1644 kembali terjadi wabah penyakit yang menyebabkan ratusan orang meninggal setiap hari. \n3. Pada tahun 1665 juga dikisahkan pernah terjadi wabah penyakit di Makassar, Bali, Jawa, dan Sumatra. Jumlah korban terbanyak berasal dari Jawa dan Makassar. Sekitar tahun 1625-1630 sempat terjadi wabah penyakit luar biasa besar di Indonesia. De Graaf menjelaskan wabah itu membunuh dua pertiga penduduk Jawa Tengah pada tahun 1626. Penyakit yang dulu menyerang wilayah ini adalah penyakit yang saat ini kita kenal dengan TBC", "t": "Susah", "k": "A"}, {"id": "SEJARAH-74", "m": "SEJARAH", "n": 74, "q": "Dalam sejarah perjalanan bangsa  Indonesia. Selain menghadapi penjajah bangsa asing, bangsa Indonesia juga pernah mengalami beberapa kali kejadian/musibah berupa wabah penyakit yang mematikan, yang terbagi kedalam 2 periode, yaitu periode sebelum abad ke 20, dan periode  abad 20 sampai sekarang. Sebutkan kejadian wabah penyakit dari awal abad 20 sampai sekarang 2023?\nJawab.  \n1. Wabah Pes. \nMemasuki abad ke-20, sejarah Indonesia juga diwarnai oleh kejadian kematian akibat wabah. Sepanjang tahun 1910-1936 puluhan ribu orang meninggal akibat wabah pes di Pulau Jawa (Safitry, 2013). \n2. Wabah Influensa.\nPada tahun 1918-1919,wabah Influenza yang dikenal dengan Flu Spanyol menyebar di seluruh Jawa hingga ke wilayah Indonesia bagian timur. Tercatat 1,5 juta orang meninggal akibat wabah ini. De Sumatra Post edisi 11 Desember 1920 menjelaskan, Flu Spanyol menginfeksi 13,3 persen dari 35 juta penduduk Hindia Belanda pada saat itu. \n3. Pandemi Covid-19  \n Pada 2 Maret 2020, Presiden Joko Widodo mengumumkan dua kasus pertama Covid-19 di Indonesia. Sejak saat itu, kasus Covid-19 terus bertambah. Gelombang pertama kasus Covid-19 di Indonesia terjadi pada Januari-Februari 2020. Pada saat itu, kasus Covid-19 harian tertinggi terjadi pada 30 Januari 2020 sebanyak 14.528. Lalu, gelombang kedua kasus Covid-19 terjadi di Indonesia pada Juni-Juli 2021 akibat varian Delta. Kasus tertinggi terjadi pada 15 Juli 2021 dengan penambahan 56.757 kasus. Jumlah korban meninggal 22.138 ( Nov 23)", "t": "Susah", "k": "A"}, {"id": "SEJARAH-75", "m": "SEJARAH", "n": 75, "q": "Dalam waktu yang relative singkat pendudukan jepang di indonesia sudah menyebar ke seluruh nusantara , tidak terkecuali juga Penjajahan Jepang di Palembang, sumatera selatan.   Apa alasan/kepentingan  utama jepang menjajah Palembang ? \nJawab.  \nPalembang merupakan sebuah kota yang penting bagi Jepang selama masa penjajahannya karena adanya sumber minyak dan posisinya yang strategis. Palembang yang ada di Pulau Sumatra berada di bawah penguasaan Angkatan Darat ke-25 yang berpusat di Bukittinggi. Pada mulanya kedatangan Jepang disambut dengan gembira oleh masyarakat lokal yang menganggap mereka sebagai liberator yang membebaskan Indonesia dari dominasi kolonial Belanda. Meskipun demikian, ada pula perlawanan lokal yang langsung ditindas oleh tentara Jepang.\nKepentingan utama Jepang di Palembang adalah untuk mendapatkan minyak buminya. Saat itu, produksi minyak bumi di Palembang mencapai 82% dari total produksi di Indonesia. Kebijakan ekonomi Jepang di Palembang diarahkan ke eksploitasi minyak dan mencegah upaya bumi hangus ladang-ladang minyak di Palembang. Para kuli BPP (Badan Pembantu Pemerintah) dan romusha dari dalam dan luar Sumatra dikerahkan untuk eksplotasi minyak. Namun, kehidupan mereka sangat menyedihkan karena kekurangan makanan dan pakaian. Banyak di antara mereka yang menggunakan karung goniatau kulit kayu sebagai pakaian.", "t": "Susah", "k": "A"}, {"id": "SEJARAH-76", "m": "SEJARAH", "n": 76, "q": "Sejarah pendudukan jepang di Indonesia ( 1942-1945 ), menimbulkan pro dan kontra bagi rakyat indonesia. Mereka ada yang mau bekerja sama danada pula yang melawan/memberontak. Ceritakan  sejarah singkat Perlawanan rakyat Aceh  terhadap pendudukan Jepang di Indonesia.\nJawab.\nPerlawanan Rakyat  Aceh terhadap pendudukan jepang.\nPerlawanan terbuka yang dilatarbelakangi oleh alasan agama untuk pertama kalinya terjadi di Aceh. Hanya delapan bulan setelah beberapa tokoh setempat membantu kemudahan bagi Jepang masuk ke daerah mereka. Perlawanan itu terjadi di Cot Plieng, Bayu, dekat Lhokseumawe dipimpin oleh seorang ulama muda Tengku Abdul Djalil. Ulama yang memimpin madrasah ini menyamakan Jepang dengan setan-setan yang merusak ajaran Islam. Ia juga menentang kewajiban melaksanakan seikeirei yang dianggapnya mengubah kiblat ke matahari.\nPada 10 November 1942 pasukan Jepang dikerahkan dari Bireun, Lhok Sukon, Lhokseumawe, ke Cot Plieng. Pasukan yang dilengkapi dengan senapan, mesin berat, mortar, dan jenis senjata api lainnya itu dihadapi oleh murid-murid Abdul Djalil yang pada umumnya menggunakan senjata tradisional. Bersama dengan sebagian muridnya, Abdul Djalil menyingkir ke Blang Kampong Teungah. Tempat ini pun diserbu Jepang pada 13 November 1942. Teungku Abdul Djalil dan 19 orang pengikutnya tewas, sedangkan 5 orang lainnya tertangkap.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-77", "m": "SEJARAH", "n": 77, "q": "Sejarah pendudukan jepang di Indonesia ( 1942-1945 ), menimbulkan pro dan kontra bagi rakyat indonesia. Mereka ada yang mau bekerja sama dan ada pula yang melawan/memberontak. Ceritakan  sejarah singkat Perlawanan PETA di Blitar ( Jatim )  terhadap pendudukan Jepang di Indonesia.\nJawab.\nPerlawanan PETA di Blitar\nPada 14 Februari 1945, Kota Blitar dikejutkan dengan kejadian  yang menghebohkan. Sepasukan prajurit PETA (Pembela Tanah Air) pimpinan Shodanco Supriyadi, Shodanco Muradi dan Shodanco Sunanto melakukan perlawanan terhadap  militer Jepang. Selain perilaku diskriminasi dari prajurit-prajurit Jepang, pemberontakan tersebut dipicu juga oleh kemarahan para anggota PETA terhadap pihak militer Jepang yang kerap membuat penderitaan terhadap rakyat. Kendati gagal, namun tidak dapat dipungkiri jika pemberontakan tersebut sempat membuat penguasa militer Jepang ketar-ketir. Itu terbukti saat mereka melakukan penumpasan, seluruh kekuatan militer Jepang di Blitar dikerahkan, bahkan juga melibatkan unsur-unsur kavaleri dan infanteri dari wilayah lain.\nKetika pemberontakan itu gagal maka pihak Jepang menghukum sekeras-kerasnya para pelaku. Dari 421 anggota PETA Blitar yang terlibat 78 di antaranya langsung dihukum berat. Termasuk Muradi dan Sunato yang dijatuhi hukuman mati pada 16 April 1945. Supriyadi sendiri hingga kini masih tak jelas rimbanya. Beberapakalangan meyakini bahwa sesungguhnya begitu pemb Supriyadi sendiri hingga kini masih tak jelas rimbanya. Beberapa kalangan meyakini bahwa sesungguhnya begitu pemberontakan berhasil dipadamkan, Supriyadi langsung ditangkap dan dihukum mati di suatu tempat yang dirahasiakan", "t": "Susah", "k": "B"}, {"id": "SEJARAH-78", "m": "SEJARAH", "n": 78, "q": "Sejarah pendudukan jepang di Indonesia ( 1942-1945 ), menimbulkan pro dan kontra bagi rakyat indonesia. Mereka ada yang mau bekerja sama dan ada pula yang melawan/memberontak. Ceritakan  sejarah singkat Perlawanan Rakyat di Kalimantan Barat terhadap pendudukan Jepang di Indonesia.\nJawab.\nPerlawanan di Kalimantan Barat\nPerlakuan kasar serdadu Jepang terhadap penduduk, seperti menjatuhkan hukuman jemur sampai pingsan terhadap orang yang hanya melakukan kesalahan kecil, merupakan sebab terjadinya perlawanan di Kalimantan Barat. Kekejaman Jepang semakin  meningkat setelah Sekutu sejak permulaan tahun 1943 melancarkan serangan terhadapkedudukan mereka. Orang-orang yang dicurigai ditangkap, bahkan dihukum pancung di muka umum. Pada 16 Oktober 1943, kurang lebih 70 orang mengadakan pertemuan di gedung bioskop Merdeka Sepakat di Pontianak. \nMereka merencanakan mengadakan perlawanan pada tanggal 8 Desember 1943. Rencana ini diketahui oleh Jepang berkat laporan mata-mata mereka.  Seminggu setelah pertemuan di bioskop Merdeka Sepakat itu, Jepang melakukan  penangkapan besarbesaran. Mereka yang ditangkap kemudian dibunuh, termasuk Sultan Pontianak, Sjarif Muhammad Ibrahim Sjafiuddin. Di antara mereka ada yang  dipancung. Orang-orang yang dibunuh itu dikuburkan di Mandor, dekat Pontianak.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-79", "m": "SEJARAH", "n": 79, "q": "Menjelang dibacakannya Teks proklamasi kemerdekaan 17 Agustus 1945, Bung Karno memberikan pidato singkat, dihadapan tokoh dan  warga masyarakat  yang hadir pada waktu itu. Sebutkan isi Pidato Bung Karno tersebut \nJawab .\nIsi pidato tesebut adalah sebagai berikut: \nSaudara-saudara sekalian!\nSaya telah minta saudara-saudara hadir di sini untuk menyaksikan satu peristiwa yang maha penting dalam sejarah kita. Berpuluh-puluh tahun kita bangsa Indonesia telah berjuang untuk kemerdekaan tanah air kita. Bahkan beratus- ratus tahun!\n\nGelombangnya aksi kita untuk mencapai kemerdekaan kita untuk ada naiknya dan turunnya, tetapi jiwa kita tetap menuju cita-cita. Juga di zaman Jepang, usaha kita untuk mencapai kemerdekaan nasional tidak berhenti-henti. Di dalam zaman Jepang ini, tampaknya saja kita menyandarkan diri kita kepada mereka. Tetapi pada hakikatnya, tetap kita menyusun tenaga kita sendiri, tetap kita percaya kepada kekuatan sendiri.\n\nSekarang tibalah saatnya kita benar-benar mengambil nasib bangsa dan nasib tanah air di dalam tangan kita sendiri, akan dapat berdiri dengan kuatnya. Saudara-saudara! Dengan ini kami nyatakan kebulatan tekad itu. Dengarkanlah proklamasi kami:\n\nProklamasi\n\nKami bangsa Indonesia dengan ini menyatakan kemerdekaan Indonesia.\n\nHal-hal mengenai pemeindahan kekuasaan dan lain-lain diselenggaraan dengan cara saksama dan dalam tempo yang sesingkat-singkatnya.\n\nJakarta, 17 Agustus 1945.\n\nAtas nama bangsa Indonesia\n\nSoekarno-Hatta\n\nDemikianlah saudara-saudara! Kita sekarang telah merdeka! Tidak ada suatu ikatan lagi yang mengikat tanah air kita dan bangsa kita. Mulai saat ini kita menyusun negara kita! Negara merdeka, negara republik Indonesia merdeka, kekal dan abadi.\nInsyaa Allah Tuhan memberkati kemerdekaan kita itu.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-80", "m": "SEJARAH", "n": 80, "q": "Setelah bangsa Indonesia memproklamirkan kemerdekaannya , 17- 8-45, ternyata Belanda tidak serta merta meyerahkan seluruh bekas jajahanna ke Indonesia .  masih ada 1 pulau besar yang masih dipersengketakan yaitu Irian jaya ( irian Barat ) . Ceritakan secara singkat sejarah Kembalinya Irian Barat  ke pangkaun RI, melalui jalur diplomasi. \npada tanggal 15 Agustus 1962 ditanda-tangani perjanjian antara Pemerintah Indonesia dengan Pemerintah Belanda di New York, hal ini dikenal sebagai Perjanjian New York. Hal pokok dari isi perjanjian itu adalah penyerahan pemerintahan di Irian dari pihak Belanda ke PBB. Untuk   kepentingan ini kemudian dibentuklah United Nation Temporary Excecutive Authority (UNTEA) yang kemudian akan menyerahkan Irian Barat ke pemerintah Indonesia sebelum tanggal 1 Mei 1963. \nBerdasarkan Perjanjian New York, pemerintah Indonesia punya kewajiban untuk menyelenggarakan Penentuan Pendapat Rakyat (Pepera) di Irian Barat sebelum akhir 1969 dengan ketentuan kedua belah pihak harus menerima apapun hasil dari Pepera tersebut.\nTindak lanjut berikutnya adalah pemulihan hubungan Indonesia Belanda yang dilakukan pada tahun 1963 dengan membuka kembali kedutaan Belanda  di Jakarta dan kedutaan Indonesia di Den Haag. Sesuai dengan Perjanjian New York, pada tanggal 1 Mei 1963 secara resmi dilakukan penyerahan kekuasan Pemerintah Irian Barat dari UNTEA kepada Pemerintah Republik Indonesia di Kota Baru/Holandia/Jayapura. Kembalinya Irian ke pangkuan RI berakhirlah perjuangan memperebutkan Irian Barat.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-81", "m": "SEJARAH", "n": 81, "q": "Supersemar berisi pemberian mandat kepada Letjen. Soeharto selaku Panglima Angkatan Darat dan Pangkopkamtib untuk memulihkan keadaan dan kewibawaan pemerintah. Dalam menjalankan tugas, penerima mandat  diharuskan melaporkan segala sesuatu kepada presiden. Mandat itu kemudian dikenal sebagai Surat Perintah 11 Maret (Supersemar). Keluarnya Supersemar dianggap sebagai tonggak lahirnya Orde Baru. Sebutkan tindakan pertama yang dilakukan oleh Soeharto  setelah menerima Supersemar Tersebut. \nJawab . \nkeesokan harinya setelahkan Letjend Soeharto  menerima Surat Perintah tersebut adalah membubarkan dan melarang PKI beserta organisasi massanya yang bernaung dan berlindung ataupun seasas dengannya di seluruh Indonesia, terhitung sejak tanggal 12 Maret 1966. Pembubaran itu mendapat dukungan dari rakyat, karena dengan demikian salah satu di antara Tritura telah dilaksanakan. Selain itu Letjen. Soeharto juga menyerukan kepada pelajar dan mahasiswa untuk kembali ke sekolah/kampus.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-82", "m": "SEJARAH", "n": 82, "q": "Supersemar berisi pemberian mandat kepada Letjen. Soeharto selaku Panglima Angkatan Darat dan Pangkopkamtib untuk memulihkan keadaan dan kewibawaan pemerintah. Dalam menjalankan tugas, penerima mandat  diharuskan melaporkan segala sesuatu kepada presiden. Mandat itu kemudian dikenal sebagai Surat Perintah 11 Maret (Supersemar). Sebutkan tindakan /langkah  kedua yang dilakukan oleh Soeharto  setelah menerima Supersemar Tersebut. \nJawab. \nTindakan berikutnya berdasarkan Supersemar adalah dikeluarkannya Keputusan Presiden No. 5 tanggal 18 Maret 1966 tentang penahanan 15 orang menteri yang diduga terkait dengan pemberontakan G 30 S/PKI ataupun dianggap memperlihatkan iktikad tidak baik  dalam penyelesaian masalah itu.  Demi lancarnya tugas pemerintah, Letjen. Soeharto mengangkat lima orang menteri koordinator ad interim yang menjadi Presidium Kabinet. Kelima orang tersebut ialah Sultan Hamengku Buwono IX, Adam Malik. Dr. Roeslan Abdulgani, Dr. K.H. Idham Chalid dan Dr. J. Leimena.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-83", "m": "SEJARAH", "n": 83, "q": "Sebutkan isi pidato pertama dari Presiden BJ. Habibie, “ presiden hasil gerkan reformasi “  setelah dilantik pada tanggal 21 Mei 1998.\nJawab. \nDalam pidato pertamanya pada tanggal 21 Mei 1998, malam harinya setelah dilantik sebagai Presiden, pukul 19.30 WIB di Istana Merdeka yang disiarkan langsung melalui RRI dan TVRI, B.J. Habibie menyatakan tekadnya untuk melaksanakan reformasi. pidato tersebut bisa dikatakan merupakan visi kepemimpinan B.J. Habibie guna menjawab tuntutan Reformasi secara cepat dan tepat. Beberapa point penting dari pidatonya tersebut adalah kabinetnya  akan menyiapkan proses reformasi dalam ketiga bidang yaitu:\n1)  Di bidang politik antara lain dengan memperbarui berbagai perundang-undangan dalam rangka lebih meningkatkan kualitas kehidupan berpolitik yang bernuansa pada PEMILU sebagaimana yang diamanatkan oleh Garis-garis Besar Haluan Negara (GBHN).\n2)  Di bidang hukum antara lain meninjau kembali Undang-Undang Subversi.\n3)  Di bidang ekonomi dengan mempercepat penyelesaian undang-undang yang menghilangkan praktik-praktik monopoli dan persaingan tidak sehat.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-84", "m": "SEJARAH", "n": 84, "q": "Ditengah berlangsungnya Konfrontasi Indonesia Malaysia, Malaysia dicalonkan menjadi anggota tidak tetap Dewan Keamanan PBB. Kondisi ini mendorong pemerintah Indonesia mengambil sikap menolak pencalonan Malaysia sebagai anggota tidak tetap Dewan Keamanan PBB. Sehingga Indonesia menyatakan sikap untuk keluar dari PBB. Kapan peristiwa itu terjadi ? dan apa isi pidato bung karno\nJawab. \nSikap Indonesia ini langsung disampaikan Presiden Soekarno pada pidatonya tanggal 31 \nDesember 1964. Presiden Seokarno menegaskan bahwa:\n\n“Oleh karenanya, jikalau PBB sekarang, PBB yang belum diubah, yang tidak lagi mencerminkan keadaan sekarang, jikalau PBB menerima Malaysia menjadi anggota Dewan Keamanan, kita, Indonesia, akan keluar, kita akan meninggalkan PBB sekarang”. (Taufik Abdullah dan AB Lapian, 2012)\nDari pidato tersebut terlihat bahwa keluarnya Indonesia dari PBB adalah karena masuknya Malaysia menjadi anggota tidak tetap Dewan Keamanan PBB. Ketika tanggal 7 Januari 1965 Malaysia dinyatakan diterima sebagai anggota tidak tetap Dewan Keamanan PBB, dengan spontan Presiden Sokearno menyatakan “Indonesia keluar dari PBB”.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-85", "m": "SEJARAH", "n": 85, "q": "Supersemar berisi pemberian mandat kepada Letjen. Soeharto selaku Panglima Angkatan Darat dan Pangkopkamtib untuk memulihkan keadaan dan kewibawaan pemerintah. Dalam menjalankan tugas, penerima mandate diharuskan melaporkan segala sesuatu kepada presiden. Mandat itu kemudian dikenal sebagai Surat Perintah 11 Maret (Supersemar). Keluarnya Supersemar dianggap sebagai tonggak lahirnya Orde Baru. Sebutkan tindakan awal yang dilakukan oleh Pak Suharto setelah menerima mandate itu?\nJawab\nTindakan pertama yang dilakukan oleh Soeharto keesokan harinya setelah menerima Surat Perintah tersebut adalah membubarkan dan melarang PKI beserta organisasi massanya yang bernaung dan berlindung ataupun seasas dengannya di seluruh Indonesia, terhitung sejak tanggal\n12 Maret 1966. Pembubaran itu mendapat dukungan dari rakyat, karena dengan demikian salah satu di antara Tritura telah dilaksanakan. Selain itu Letjen. Soeharto juga menyerukan kepada pelajar dan mahasiswa untuk kembali ke sekolah dan kampus.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-86", "m": "SEJARAH", "n": 86, "q": "Stabilisasi Politik dan Keamanan sebagai Dasar Pembangunan Orde Baru mencanangkan berbagai konsep dan aktivitas pembangunan nasional yang berorientasi pada kesejahteraan masyarakat. Langkah pertama  melaksanakan pembangunan nasional tersebut adalah dengan membentuk  Kabinet Pembangunan I pada 6 Juni 1968. Program Kabinet Pembangunan I dikenal dengan sebutan Pancakrida Kabinet Pembangunan, Sebutkan isi pancakrida cabinet pembangunan I\nJawab. \nPancakrida Kabinet Pembangunan I berisi :  \n1) Menciptakan stabilitas politik dan ekonomi sebagai syarat mutlak berhasilnya pelaksanakan Rencana Pembangunan Lima Tahun (Repelita) dan Pemilihan Umum (Pemilu);\n2) Menyusun dan merencanakan Repelita;\n3) Melaksanakan Pemilu selambat-lambatnya pada Juli 1971;\n4) Mengembalikan ketertiban dan keamanan masyarakat dengan mengikis habis sisa-sisa G 30/S/PKI dan setiap bentuk r o n g r o n g a n penyelewengan, serta pengkhianatan terhadap Pancasila dan UUD 1945; dan\n5) Melanjutkan penyempurnaan dan pembersihan secara menyeluruh aparatur negara baik di pusat maupun di daerah dari unsur-unsur komunisme", "t": "Susah", "k": "B"}, {"id": "SEJARAH-87", "m": "SEJARAH", "n": 87, "q": "Apakah yang dimaksud dengan moderasi  secara umum ?\nJawab. \nModerasi adalah jalan tengah. Dalam sejumlah forum diskusi kerap terdapat moderator orang yang menengahi proses diskusi, tidak berpihak  kepada siapa pun atau pendapat mana pun, bersikap adil kepada semua pihak yang terlibat dalam diskusi.  Moderasi juga berarti ‘’sesuatu yang terbaik’’.  Sesuatu yang ada di tengah biasanya berada di antara dua hal yang buruk.  Contohnya adalah  keberanian. Sifat berani dianggap baik karena ia berada di antara sifat ceroboh dan sifat takut.  Sifat dermawan juga baik karena ia berada di antara sifat boros dan sifat kikir.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-88", "m": "SEJARAH", "n": 88, "q": "Apakah yang dimaksud dengan moderasi  dalam bahasa latin ?\nJawab . \nkata moderasi berasal dari Bahasa Latin moderâtio, yang berarti ke-sedang-an (tidak kelebihan dan tidak kekurangan). Kata itu juga berarti penguasaan diri (dari sikap sangat kelebihan dan kekurangan). Kamus Besar Bahasa Indonesia (KBBI) menyediakan dua pengertian kata moderasi, yakni: 1. pengurangan kekerasan, dan 2. penghindaran keekstreman. Jika dikatakan, “orang itu bersikap moderat”, kalimat itu berarti bahwa orang itu bersikap wajar, biasa-biasa saja, dan tidak ekstrem", "t": "Susah", "k": "B"}, {"id": "SEJARAH-89", "m": "SEJARAH", "n": 89, "q": "Apakah yang dimaksud dengan moderasi  dalam bahasa Inggris ?\nJawab. \nDalam bahasa Inggris, kata moderation sering digunakan dalam pengertian average (rata-rata), core (inti), standard (baku), atau non-aligned (tidak berpihak). Secara umum, moderat berarti mengedepankan keseimbangan dalam hal keyakinan, moral, dan watak, baik ketika memperlakukan orang lain sebagai individu, maupun ketika berhadapan dengan institusi negara.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-90", "m": "SEJARAH", "n": 90, "q": "Apakah yang dimaksud dengan moderasi  dalam bahasa Arab ?\nJawab.\nSedangkan dalam bahasa Arab, moderasi dikenal de¬ngan kata wasath atau wasathiyah, yang memiliki padanan makna dengan kata tawassuth (tengah-tengah), i’tidal (adil), dan tawazun (berimbang). Orang yang menerapkan prinsip wasathiyah bisa disebut wasith. Dalam bahasa Arab pula, kata wasathiyah diartikan sebagai “pilihan terbaik”. Apa pun kata yang dipakai, semuanya menyiratkan satu makna yang sama, yakni adil, yang dalam konteks ini berarti memilih posisi jalan tengah di antara berbagai pilihan ekstrem. Kata wasith bahkan sudah diserap ke dalam bahasa Indonesia menjadi kata 'wasit' yang memiliki tiga pengertian, yaitu: 1) penengah, perantara (misalnya dalam perdagangan, bis¬nis); 2) pelerai (pemisah, pendamai) antara yang berselisih; dan 3) pemimpin di pertandingan.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-91", "m": "SEJARAH", "n": 91, "q": "Apakah yang dimaksud dengan moderasi beragama ?\nJawab. \nModerasi beragama berarti  cara beragama jalan tengah Dengan moderasi beragama, seseorang tidak ekstrem dan tidak berlebih-lebihan saat menjalani ajaran agamanya.  Moderasi beragama harus dipahami sebagai sikap ber¬agama yang seimbang antara pengamalan agama sendiri (eksklusif) dan penghormatan kepada praktik beragama orang lain yang berbeda keyakinan (inklusif). Keseimbang¬an atau jalan tengah dalam praktik beragama ini niscaya akan menghindarkan kita dari sikap ekstrem berlebihan, fa¬natik dan sikap revolusioner dalam beragama. Orang yang  mempraktekkannya disebut moderat.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-92", "m": "SEJARAH", "n": 92, "q": "Sebutkan contoh kegiatan/ sikap beragama  yang berlebihan ?\nJawab. \nContoh paling gamblang adalah ketika seorang pemeluk agama mengafirkan saudaranya sesama \npemeluk agama yang sama hanya gara-gara mereka berbeda dalam paham keagamaan, padahal hanya Tuhan yang Maha Tahu apakah seseorang sudah masuk kategori kafir atau tidak. Seseorang yang bersembahyang terus-menerus dari pagi hingga malam tanpa mempedulikan problem sosial di sekitarnya bisa disebut berlebihan dalam beragama.\n\nSeseorang juga bisa disebut  berlebihan dalam beragama ketika ia sengaja merendahkan agama orang lain, atau gemar menghina  figur atau simbol suci agama tertentu. Dalam kasus seperti ini ia sudah terjebak dalam ekstremitas yang tidak sesuai dengan prinsip-prinsip moderasi beragama.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-93", "m": "SEJARAH", "n": 93, "q": "Dimana posisi orang moderat di antara dua kutub ekstrem itu?\nJawab.\nOrang moderat harus berada di tengah, berdiri di antara kedua kutub ekstrem itu. Ia tidak berlebihan dalam beragama, tapi juga tidak berlebihan menyepelekan agama. Dia tidak ekstrem mengagungkan teks-teks keagamaan tanpa menghiraukan akal/ nalar, juga tidak berlebihan mendewakan akal sehingga mengabaikan teks. Pendek kata, moderasi beragama bertujuan untuk menengahi serta mengajak kedua kutub ekstrem dalam beragama untuk bergerak ke tengah, kembali pada esensi ajaran agama, yaitu memanusiakan manusia", "t": "Susah", "k": "B"}, {"id": "SEJARAH-94", "m": "SEJARAH", "n": 94, "q": "Sebutkan dan jelaskan 2 prinsip beragama yang moderat \nJawab.\nPrinsipnya ada dua:  yaitu adil dan berimbang. Bersikap adil berarti menempatkan segala sesuatu pada tempatnya seraya melaksanakannya secara  baik dan secepat mungkin. Sedangkan sikap berimbang berarti selalu berada di tengah di antara dua kutub. Dalam hal ibadah, misalnya, seorang moderat yakin bahwa beragama adalah melakukan pengabdian kepada Tuhan dalam bentuk menjalankan ajaran-Nya yang berorientasi pada upaya untuk memuliakan manusia. \nOrang yang ekstrem sering terjebak dalam  praktek beragama atas nama Tuhan hanya untuk membela keagungan-Nya saja seraya  mengenyampingkan aspek kemanusiaan. Orang beragama dengan cara ini rela membunuh sesame manusia “atas nama Tuhan” padahal menjaga\nkemanusiaan itu sendiri adalah bagian dari inti ajaran agama.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-95", "m": "SEJARAH", "n": 95, "q": "Apa batasannya Bahwa suatu pemahaman dan pengamalan Keagamaan sudah bisa Dinilai berlebihan? \nJawab \nPemahaman dan pengamalan keagamaan bisa dinilai berlebihan jika ia melanggar tiga hal: Pertama, nilai kemanusiaan; Kedua, kesepakatan bersama; dan Ketiga, ketertiban umum. Prinsip ini juga untuk menegaskan bahwa moderasi beragama berarti menyeimbangkan  kebaikan yang berhubungan dengan Tuhan dengan kemaslahatan yang bersifat sosial kemasyarakatan", "t": "Susah", "k": "B"}, {"id": "SEJARAH-96", "m": "SEJARAH", "n": 96, "q": "Sebutkan contoh  perilaku yang  sudah melanggar batasan kemanusiaan dalam moderasi beragama  !\nJawab. \nJika seseorang atas nama ajaran agama, misalnya, melakukan perbuatan yang merendahkan harkat, derajat, dan martabat kemanusiaan, atau bahkan menghilangkan eksistensi kemanusiaan itu sendiri, itu sudah bisa disebut melanggar nilai kemanusiaan. Tindakannya jelas berlebihan atau ekstrem. Contoh konkretnya, dengan dalih jihad agama, seseorang meledakkan bom di tengah pasar lalu puluhan bahkan ratusan orang tak bersalah tewas seketika. Ini jelas tindakan ekstrem.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-97", "m": "SEJARAH", "n": 97, "q": "Sebutkan contoh  perilaku yang melanggar  batasan kesepakatan bersama dalam moderasi beragama !\nJawab. \nContohnya jika seseorang, atas nama ajaran agama, melanggar butir-butir Pancasila, Undang-undang Dasar 1945, dan Negara Kesatuan Republik Indonesia (NKRI), yang telah menjadi kesepakatan bersama bangsa Indonesia dalam erbangsa dan bernegara, itu sudah bisa dinilai ekstrem dan melanggar. Dalam hal kehidupan bermasyarakat, niscaya juga banyak peraturan yang telah disepakati bersama oleh  seluruh warga di lingkungan tempat tinggal. Jika seorang warga, atas nama agama yang dianutnya, melanggar kesepakatan bersama yang telah ia setujui tersebut, maka ia pun dapat dianggap berlebih-lebihan.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-98", "m": "SEJARAH", "n": 98, "q": "Bagaimana orang moderat memahami kemanusiaan? \nJawab .\nKemanusiaan adalah salah satu esensi agama. Kemanusiaan diyakini sebagai fitrah agama yang tidak mungkindiabaikan. Agama  mengajarkan bahwa  menjunjung tinggi kemanusiaan adalah inti pokok agama. Tuhan diyakini  menurunkan agama dari langit ke bumi ini justru untuk melindungi kemanusiaan. Pendek kata, inti pokok ajaran agama adalah untuk menjaga kemanusiaan, bukan untuk  menghancurkan kemanusiaan itu sendiri.\nJadi, kalau ada paham ekstrem atas nama agama yang berakibat menghancurkan kemanusiaan, misalnya mengakibatkan  terbunuhnya orang tak bersalah, paham itu jelas bertentangan dengan fitrah agama  dan tentu saja tidak bisa dibenarkan. Orang moderat akan memperlakukan mereka yang berbeda agama sebagai  saudara sesama manusia dan akan  menjadikan orang yang seagama sebagai saudara seiman.  Orang moderat akan sangat  mempertimbangkan kepentingan kemanusiaan di samping kepentingan  keagamaan yang sifatnya subjektif.  Bahkan, dalam situasi tertentu,  kepentingan kemanusiaan mendahului subjektifitas keagamaannya.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-99", "m": "SEJARAH", "n": 99, "q": "Menurut anda , apakah sama antara moderasi beragama dengan moderasi agama?\nJawab. \nTidak sama.Agama tidak perlu dimoderasi karena agama itu sendiri telah mengajarkan prinsip moderasi, keadilan dan keseimbangan. Jadi bukan agama yang harus dimoderasi, melainkan cara penganut agama dalam menjalankan agamanya itulah yang harus dimoderasi. Tidak ada agama yang mengajarkan ekstremitas, tapi tidak sedikit orang yang menjalankan ajaran agama berubah menjadi ekstrem.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-100", "m": "SEJARAH", "n": 100, "q": "Berikan contoh yang konkret untuk membedakan  agama dan beragama dalam konteks moderasi beragama  ? \nJawab . \nMisalnya, ajaran agama untuk memuliakan perempuan. Ajaran ini bersifat pasti dan tidak ada yang memperdebatkan, itulah ajaran agama. Tapi, bagaimana cara memuliakan perempuan menurut ajaran agama itu, masing-masing umat beragama melakukan praktik yang berbeda-beda. Itulah yang disebut beragama.  Contoh yang  sudah terlihat misalnya ada paham dan amalan agama yang ekstrem membatasi aktivitas social  perempuan, seperti larangan keluar  rumah bagi perempuan meski untuk menuntut ilmu. Namun, ada juga paham  dan amalan agama yang memberi ruang  kebebasan ekstrem bagi perempuan untuk beraktifitas sosial sehingga  menyepelekan tanggung jawab    mengurus keluarga.   Di antara keduanya itu, ada juga paham dan amalan agama yang cenderung moderat, dengan memberikan hak-hak kesetaraan gender kepada perempuan,  tetapi tetap membatasinya dengan etika dan adat istiadat lokal yang berlaku.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-101", "m": "SEJARAH", "n": 101, "q": "Menurut pendapat anda, Apakah sama antara moderasi beragama dengan toleran ? \nJawab. \nToleran itu adalah hasil yang diakibatkan oleh sikap moderat dalam beragama. Moderasi adalah proses, toleransi  adalah hasilnya. Seorang yang moderat bisa  jadi tidak setuju atas suatu tafsir ajaran  agama, tapi ia tidak akan menyalahnyalahkan orang lain yang berbeda  pendapat dengannya. Begitu juga seorang yang moderat niscaya punya keberpihakan atas suatu tafsir agama, tapi ia tidak akan memaksakannya berlaku untuk orang lain.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-102", "m": "SEJARAH", "n": 102, "q": "Apakah bisa dikatakan /disimpulkan bahwa  orang yang moderat  tidak teguh pendiriannya dalam beragama? \nJawab. \nTentu saja tidak demikian. Seorang yang moderat juga harus memiliki pendirian teguh dan semangat beragama yang tinggi. Namun, ia harus mampu memilah mana pokok ajaran agama, di mana ia harus berpendirian teguh, dan mana  tafsir ajaran agama, di mana ia perlu toleran, menghormati pendirian orang lain, dan tidak menyalah-nyalahkan. Terkait urusan pokok agama, tidak boleh ada kompromi dalam hal meyakini dan mempraktikkannya. Tapi untuk urusan agama yang sifat hukumnya  diperdebatkan, dan ada beragam pandangan, seorang moderat akan  mengambil sikap hukum tertentu untuk dirinya, tapi tidak memaksakan hokum itu berlaku untuk orang lain. Itulah makna toleran.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-103", "m": "SEJARAH", "n": 103, "q": "Bagaimana caranya anda  membedakan ajaran pokok agama & tafsir agama ? \nJawab .\nUntuk bisa memilah mana wilayah pokok agama yang harus dibela secara teguh, dan mana wilayah tafsir ajaran agama yang terbuka untuk berbeda, seorang umat beragama harus mempelajari ajaran agamanya dengan baik dan secara mendalam. Ia harus mencari ilmu melalui guru atau sumber yang tepercaya.    \nSikap moderat dalam beragama akan  lebih mudah diterapkan jika seseorang memiliki pengetahuan agama yang baik dan memadai. Pengetahuan luas akan  menghantarkannya menjadi orang yang bijaksana. Berpengetahuan itu penting  karena untuk dapat berdiri di tengah, seorang yang moderat perlu tahu tafsir agama yang ada di ujung ekstrem kiri dan ujung ekstrem kanan.   Sikap hanya melihat kebenaran satu tafsir agama dan buta terhadap kebenaran tafsir lainnya dapat menjerumuskan seseorang pada sikap ekstrem dan cenderung mengklaim kebenaran menurut versi dirinya saja. Pendek kata, untuk moderat, seseorang perlu berilmu.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-104", "m": "SEJARAH", "n": 104, "q": "Seseorang dikatakan moderat bila memiliki pengetahuan atau keilmuan yang mumpuni, Sebutkan syarat lain selain syarat berilmu, tersebut? \nJawab.\nSelain berilmu, seorang yang moderat juga harus mampu mengendalikan emosi, berakhlak baik, pemaaf,menjadi teladan, dan sanggup berempati. Dalam menyikapi masalah keagamaan, ia harus mampu mendahulukan rasa daripada emosi, dan harus mengedepankan akal ketimbang otot. Moderasi beragama harus dibarengi dengan sikap berbudi.   \nDengan begitu, maka seorang yang moderat  dalam beragama akan senantiasa berhati-hati dalam  bertindak, tidak gegabah, melirik ke kiri dan ke  kanan, dan selalu mempertimbangkan baik  buruknya setiap pilihan. Konsisten berada  di tengah bukan berarti diam saja, melainkan dinamis bergerak merespons situasi  dengan cermat. Alhasil, moderasi beragama  dapat diwujudkan jika seseorang telah memenuhi syarat berilmu, berbudi,  pemaaf, bijaksana dan berhati-hati.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-105", "m": "SEJARAH", "n": 105, "q": "Menurut pendapat anda, mengapa moderasi dalam beragama diperlukan dalam kehidupan  masyarakat yang ber Bhinneka Tunggal Ika ? \nJawab\nModerasi beragama diperlukan karena sikap ekstrem dalam beragama tidak sesuai dengan esensi ajaran agama itu sendiri.  Perilaku  ekstrem atas nama agama juga  sering mengakibatkan lahirnya konflik, rasa benci, intoleransi, dan bahkan peperangan  yang memusnahkan peradaban. Sikapsikap   seperti itulah yang perlu dimoderasi.     \nModerasi beragama adalah upaya mengembalikan  pemahaman dan praktik beragama agar sesuai dengan esensinya, yakni untuk  menjaga harkat, martabat, dan peradaban  manusia, bukan sebaliknya. Agama tidak  boleh digunakan untuk hal-hal yang justru  merusak peradaban, sebab sejak diturunkan,  agama pada hakikatnya ditujukan untuk  membangun peradaban itu sendiri.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-106", "m": "SEJARAH", "n": 106, "q": "Apakah moderasi dikenal dalam   sejarah umat manusia?  \nJawab. \nYa, moderasi sudah lama dikenal sebagai  prinsip hidup dalam sejarah umat manusia. Dalam mitologi Yunani kuno, prinsip moderasi sudah dikenal dan dipahatkan pada inskripsi patung Apollo di Delphi dengan tulisan Meden Agan, yang berarti  “tidak berlebihan”.\n Prinsip moderasi saat itu sudah dipahami  sebagai nilai untuk melakukan segala sesuatu secara proporsional, tidak berlebihan. Seorang yang moderat dalam  hal makanan, misalnya, akan menyantap  segala jenis makanan, tapi membatasi  porsinya agar tidak menimbulkan penyakit. Moderasi juga dikenal dalam tradisi     berbagai agama. Jika dalam Islam ada  konsep wasathiyah, dalam tradisi  Kristen ada konsep golden mean. Dalam tradisi agama Buddha ada Majjhima Patipada. Dalam tradisi agama Hindu ada  Madyhamika. Dalam Konghucu juga ada konsep Zhong Yong.  begitulah, dalam tradisi semua agama, selalu ada ajaran “jalan  tengah”.          \n\nSemua istilah dalam setiap agama itu  mengacu pada satu titik makna yang sama,  yakni bahwa memilih jalan tengah di antara  dua kutub ekstrem dan tidak berlebihlebihan  merupakan sikap beragama yang  paling ideal.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-107", "m": "SEJARAH", "n": 107, "q": "Bagaimana menempatkan moderasi  beragama dalam konteks Indonesia?  \nJawab. \nModerasi beragama  adalah bagian dari  strategi bangsa ini dalam merawat Indonesia. Sebagai bangsa yang sangat beragam, sejak awal para pendiri  bangsa sudah berhasil mewariskan satu   bentuk kesepakatan dalam berbangsa   dan bernegara, yakni Negara Kesatuan   Republik Indonesia, yang telah nyata   berhasil menyatukan semua kelompok  agama, etnis, bahasa, dan budaya.       \nIndonesia disepakati bukan Negara agama, tapi juga tidak memisahkan  agama dari kehidupan sehari-hari     warganya. Nilai-nilai agama dijaga,   dipadukan dengan nilai-nilai kearifan  dan adat-istiadat lokal. Beberapa  hukum agama juga dilembagakan oleh  negara, ritual agama dan budaya berjalin  berkelindan dengan rukun dan damai.        \nItulah sesungguhnya jati diri Indonesia,  negeri yang sangat agamis, dengan  karakternya yang santun, toleran, dan mampu berdialog dengan keragaman.  Moderasi beragama harus menjadi  bagian dari strategi kebudayaan untuk  merawat jati diri kita tersebut.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-108", "m": "SEJARAH", "n": 108, "q": "Siapa yang harus mengawal moderasi beragama?\nJawab.  \nTegaknya moderasi beragama perlu dikawal bersama, baik oleh orang perorang maupun lembaga, baik masyarakat maupun negara. Kelompok beragama yang moderat harus lantang bersuara dan tidak lagi memilih menjadi mayoritas yang diam.   \nBahkan, keterlibatan perempuan juga akan sangat penting dalam upaya memperkuatmoderasi beragama, mengingat kekerasan atas nama agama bisa saja dilakukan, baik  oleh laki-laki maupun perempuan.  Setiap komponen bangsa harus yakin    bahwa Indonesia memiliki modal social   untuk memperkuat moderasi beragama.  Modal sosial itu berupa nilai-nilai budaya  lokal, kekayaan keragaman adat istiadat,  tradisi bermusyawarah, serta budaya  gotong-royong yang diwarisi masyarakat   Indonesia secara turun temurun.      \nModal sosial itu harus kita rawat, demi menciptakan kehidupan yang harmoni  dalam keragaman budaya, etnis, dan agama. Jika dipikul bersama, Indonesia  dapat menjadi inspirasi dunia dalam  mempraktikkan moderasi beragama.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-109", "m": "SEJARAH", "n": 109, "q": "Sebutkan dan jelaskan Sembilan Nilai moderasi beragama \nJawab. \nAda 9 nilai nilai moderasi atau wasathiyah itu adalah :  tengah-tengah (tawassuth), tegak-lurus (i’tidal), toleransi (tasamuh), musyawarah (syura), reformasi (ishlah), kepeloporan (qudwah), kewargaan/cinta tanah air (muwathanah), anti kekerasan (la ’unf) dan ramah budaya (i’tibar al-‘urf). Dalam bab mendatang, setiap nilai dijelaskan dengan menyertakan alasan-alasan keagamaannya. \nKesembilan nilai moderasi itu dipilih berdasarkan kepentingan membangun kualitas mental terbaik bangsa Indonesia. Islam mengajarkan bahwa yang terbaik dari segala sesuatu adalah pertengahannya (awsath). Kepentingan berikutnya, berbekal mental moderat, bangsa Indonesia diharapkan mampu melestarikan kemerdekaan dan mewujudkan cita-cita bangsa yang tertera dalam Konstitusi. Bagi Muslim, mewujudkan cita-cita Konstitusi adalah bukti bahwa ia melaksanakan kepatuhan kepada kesepakatan bangsa (mitsaq).", "t": "Susah", "k": "B"}, {"id": "SEJARAH-110", "m": "SEJARAH", "n": 110, "q": "Mengapa moderasi beragama perlu diperkuat, Dalam konteks Indonesia dan kaitannya dengan umat beragama seluruh dunia, ( Minimal 2 alasan/jawaban ) (i)\nJawab. \nPertama, kita telah memasuki era yang disebut postsekularisme atau pascasekuler. Gejala ini sebenarnya tidak hanya  melanda Indonesia, akan tetapi juga di negara-negara maju. Telah lama masyarakat di berbagai belahan dunia menerapkan sekularisme yang berarti menjaga jarak atau memisahkan agama dari kehidupan duniawi. Padahal kehidupan yang demikian telah mengancam kehidupan masyarakat itu sendiri. Oleh karenanya, sekarang ini, masyarakat dunia mulai merasa membutuhkan kembali kehadiran agama. Agama diharapkan menjadi solusi hidup atau memberikan jawaban dari segala macam problematika hidup di dunia yang sudah mengalami perkembangan dan kemajuan sedemikian rupa. Inilah substansi dari post-sekularisme.\nKedua, moderasi beragama perlu ditekankan karena pada saat yang sama masyarakat dunia tak terkecuali Indonesia, masih dihadapkan dengan persoalan radikalisme yang menjurus kepada tindakan ekstremisme dan terorisme. Memang ekstremitas dan teror tidak selalu mengatasnamakan agama atau keyakinan tertentu dan bisa jadi dilatarbelakangi oleh banyak sekali faktor, bukan hanya agama. Namun, tindakan kejahatan ini akan semakin berbahaya jika dicarikan pembenarnya dari ajaran agama. Fakta menunjukkan, beberapa tindakan terorisme di beberapa belahan dunia, termasuk di Indonesia, hampir selalu terkait dengan agama atau symbol-simbol agama.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-111", "m": "SEJARAH", "n": 111, "q": "Mengapa moderasi beragama perlu diperkuat, Dalam konteks Indonesia dan kaitannya dengan umat beragama seluruh dunia, ( Minimal 2 alasan/jawaban ) (ii)\nJawab. \nPertama, perkembangan dunia internasional seringkali tidak menentu, termasuk terjadinya konflik di berbagai kawasan yang melibatkan agama. Pada saat yang sama, masyarakat seluruh dunia tersambung dengan telepon pintar di tangan masing-masing sehingga semua informasi dan propaganda dari luar dapat tersebar ke berbagai belahan dunia secara cepat. Moderasi beragama
