 dalam kontek ini berfungsi untuk membentengi umat beragama di Indonesia agar tidak terombang-ambing dengan berbagai isu yang beredar yang dikhawatirkan dapat mengacaukan praktik moderasi beragama yang sudah berlangsung di Indonesia.\nKedua, faktor utama mengapa moderasi beragama ini penting di Indonesia adalah karena Indonesia bisa menjadi contoh praktik moderasi beragama bagi seluruh dunia. Indonesia bisa menjadi mercusuar moderasi beragama. Indonesia sebagainegara mayoritas beragama Islam penduduknya di dunia, telah mempraktikan moderasi beragama dari waktu ke waktu. Selain membentengi praktik moderasi yang sudah berjalan di Indonesia darilalu-lalang isu dan perkembangan dunia, konsep moderasi beragama dari Indonesia bisa menjadi contoh bagi “negara beragama” lainnya di seluruh dunia. Terkait dengan alasan pertama di atas, konsep moderasi beragama dari Indonesia diharapkan menjadi panduan bagi dunia yang sedang menghadapi fase post-sekularisme.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-112", "m": "SEJARAH", "n": 112, "q": "Mengapa moderasi beragama perlu diperkuat, Dalam konteks Indonesia dan kaitannya dengan umat beragama seluruh dunia, ( Minimal 2 alasan/jawaban ) (iii)\nJawab\nPertama, perkembangan dunia internasional seringkali tidak menentu, termasuk terjadinya konflik di berbagai kawasan yang melibatkan agama. Pada saat yang sama, masyarakat seluruh dunia tersambung dengan telepon pintar di tangan masing-masing sehingga semua informasi dan propaganda dari luar dapat tersebar ke berbagai belahan dunia secara cepat. Moderasi beragama dalam kontek ini berfungsi untuk membentengi umat beragama di Indonesia agar tidak terombang-ambing dengan berbagai isu yang beredar yang dikhawatirkan dapat mengacaukan praktik moderasi beragama yang sudah berlangsung di Indonesia.\nKedua, faktor utama mengapa moderasi beragama ini penting di Indonesia adalah karena Indonesia bisa menjadi contoh praktik moderasi beragama bagi seluruh dunia. Indonesia bisa menjadi mercusuar moderasi beragama. Indonesia sebagai negara mayoritas beragama Islam penduduknya di dunia, telah mempraktikan moderasi beragama dari waktu ke waktu. Selain membentengi praktik moderasi yang sudah berjalan di Indonesia dari lalu-lalang isu dan perkembangan dunia, konsep moderasi beragama dari Indonesia bisa menjadi contoh bagi “negara beragama” lainnya di seluruh dunia. Terkait dengan alasan pertama di atas, konsep moderasi beragama dari Indonesia diharapkan menjadi panduan bagi dunia yang sedang menghadapi fase post-sekularisme.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-113", "m": "SEJARAH", "n": 113, "q": "Mengapa moderasi beragama perlu diperkuat, Dalam konteks Indonesia dan kaitannya dengan umat beragama seluruh dunia, ( Minimal 2 alasan/jawaban ) (iii)\nJawab\nPertrama , faktor utama mengapa moderasi beragama ini penting di Indonesia adalah karena Indonesia bisa menjadi contoh praktik moderasi beragama bagi seluruh dunia. Indonesia bisa menjadi mercusuar moderasi beragama. Indonesia sebagai negara mayoritas beragama Islam penduduknya di dunia, telah mempraktikan moderasi beragama dari waktu ke waktu. Selainmembentengi praktik moderasi yang sudah berjalan di Indonesia dari lalu-lalang isu dan perkembangan dunia, konsep moderasi beragama dari Indonesia bisa menjadi contoh bagi “negara beragama” lainnya di seluruh dunia. Terkait dengan alasan pertama di atas, konsep moderasi beragama dari Indonesia diharapkan menjadi panduan bagi dunia yang sedang menghadapi fase post-sekularisme. \nKedua, dalam skala lokal dan nasional, moderasi beragama bisa menjadi spirit dalam membangun Indonesia. Muatan moderasi beragama yang di dalam buku ini diterjemahkan ke dalam Sembilan nilai atau sembilan karakter utama bisa menjadi modal dasar dalam pembangunan Indonesia.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-114", "m": "SEJARAH", "n": 114, "q": "Jelaskan secara singkat Akar Sejarah Moderasi Beragama di Indonesia !\nJawab. \nKarakter moderasi beragama sudah mulai ditanamkan sejak persebaran Islam pertama kali oleh para penyebar Islam di Indonesia, terutama oleh Wali Songo. Karakter ini kemudian diwarisi oleh  masyarakat Muslim Indonesia pada periode-periode berikutnya sampai ketika terbentuk negara Indonesia. Moderasi beragama dengan demikian sudah lama  mengakar bahkan sebelum Indonesia berdiri dan merupakan pangkal dari integrasi masyarakat. Moderasi beragama melambangkan sekaligus merupakan bentuk dari kesadaran akan harmoni dalam perbedaan sekaligus pemahaman atas batas-batas yang tidak dapat dilanggar. \nSecara sosiologis masyarakat Indonesia juga terdiri dari beragam suku dengan adat dan budayanya. Disebabkan keberagaman tersebut, maka dalam menjalankan keyakinan atau  ajaran agama, masyarakat Indonesia juga harus mempertimbangkan aspek keragaman ini. Dengan kata lain, dalam menjalankan ajaran agama di Indonesia masyarakat telah siap menerima kemungkinan adanya kelompok lain yang berbeda (the other). Oleh sebab itu, menjalankan ajaran agama Islam di Indonesia diperlukan kesadaran penuh bahwa warga Indonesia memiliki pandangan-pandangan religius, etnis, dan agama yang berbeda. Hal inilah yang menjadi titik tolak karakter moderasi beragama itu bermula.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-115", "m": "SEJARAH", "n": 115, "q": "Jelaskan Tentang Legitimasi Moderasi Beragama di Indonesia\nJawab.\nModerasi beragama sebagai sebuah konsep memang  merupakan hal baru. Konsep moderasi beragama baru dirumuskan dan dicanangkan pada tahun-tahun terakhir ini. Akan tetapi seperti disinggung di atas, sebagai sebuah praktik keberagamaan, moderasi beragama ini sudah ada jauh-jauh hari bahkan sejak sebelum Indonesia merdeka. Umat Islam di  Nusantara atau Indonesia sudah mempunyai karakter moderasi di dalam menjalankan ajaran agamanya yang di dalam buku ini disebutkan mencakup Sembilan nilai utama. \nSelain aspek historis dan sosiologis di atas, moderasi beragama telah mendapatkan legitimasi dari para pendiri bangsa dalam proses pendirian Negara Kesatuan Republik Indonesia (NKRI) yang berdasarkan Pancasila. NKRI bukanlah negara agama, tetapi negara yang menjamin kebebasan menjalankan ajaran-ajaran agama. Secara yuridis hal ini tertuang dalam Pasal 29 UUD 1945 Tentang Kebebasan Beragama: “(1) Negara berdasar atas Ketuhanan Yang Maha Esa. (2) Negara menjamin kemerdekaan tiap-tiap penduduk untuk memeluk agamanya masing-masing dan untuk beribadat menurut agamanya dan kepercayaannya itu.” Jaminan ini berarti bahwa negara memastikan bahwa tidak ada yang boleh memaksakan pemahaman agamanya di ranah publik yang menggangu kebebasan peganut agama yang lain.\n\nSecara lebih spesifik, moderasi beragama juga menjadi satu isu strategis bangsa yang  tercantum di dalam Peraturan Presiden No. 18 Tahun 2020 tentang Rencana Pembangunan Jangka Menengah Nasional (RPJMN) tahun 2020-2024 yang menjadi landasan dalam pelaksanaan perencanaan pembangunan nasional.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-116", "m": "SEJARAH", "n": 116, "q": "Jelaskan pengertian “Tawassuth”  yang merupakan salah satu prinsip moderasi beragama  di Indonesia! \nJawab. \nIstilah “Tawassuth” yang merupakan rangkaian dari kata wassatha, secara bahasa berarti sesuatu yang ada di tengah, atau sesuatu yang memiliki dua belah ujung yang ukurannya sebanding. Sedangkan pengertian secara terminologi adalah nilai-nilai Islam yang dibangun atas dasar pola pikir dan praktik yang lurus dan pertengahan, tidak berlebihan dalam hal tertentu. At-tawassuth juga memiliki lawan kata dari “berlebihan dan berkurangan”. Berlebihan setidaknya ada dua, yaitu al-ifrat ( الإفراط ) dan al-ghuluw ( ,(الغلًّ ) sedangkan untuk arti berkurangan at-tafrit ( التفرطي ) dan al-jafa` (الجفاء) ). Ringkasnya, al-tawassuth adalah posisi antara berlebihan dengan berkurangan. Nilai tawassuth ini memiliki peran sentral karena posisinya menjiwai delapan nilai moderasi beragama yang lainnya.\nTawassuth yang memiliki peran sentral dalam Sembilan nilai ini akan berdampak positif dalam pemikiran maupun praktik. Dengan Tawassuth akan menciptakan sifat dan prilaku  pertengahan dalam segala hal, tidak ekstrem kiri dan kanan, serta menjaga keseimbangan antara hak dan kewajiban. Begitu pula Tawassuth  mampu menempatkan kehidupan dunia dan akhirat secara seimbang, bisa memerankan ibadah individual dengan sosial, serta  mampu menjaga keseimbangan antara doktrin dan pengetahuan bagi yang menjalankannya. Sebagai nilai yang memiliki peran sentral, maka gambaran tawassuth terkadang terdapat pada  pembahasan nilai-nilai berikutnya baik secara pemikiran, sifat ataupun perilaku.\nTawassuth sebagai ajaran dan praktik beragama yang dapat dilakukan oleh umat Islam juga tergambarkan dalam memahami dan menjalankan ajaran Islam sebagaimana terekam dalam hadis Rasulullah saw.\n \n“Sesungguhnya agama ini (Islam) mudah, dan tidak ada seorang pun yang mempersulitnya melainkan (agama itu) akan mengalahkan dia (mengembalikan dia kepada kemudahan).”\n(HR. Bukhari, hadis ke-39)", "t": "Susah", "k": "B"}, {"id": "SEJARAH-117", "m": "SEJARAH", "n": 117, "q": "Jelaskan pengertian “I’TIDAL ”  yang merupakan salah satu prinsip moderasi beragama  Indonesia!\nJawab.\nI’tidal sebagai bagian dari sembilan nilai moderasi beragama  dimaksudkan untuk berperilaku proporsional dan adil serta denganpenuh tanggung jawab. Prinsip ini bersumber dari Q.S. Al-Maidah [5]: 8 yang artinya \n“ Wahai orang-orang yang beriman! Jadilah kamu sebagai penegak keadilan karena Allah, (ketika) menjadi saksi dengan adil. Dan janganlah kebencianmu terhadap suatu kaum mendorong kamu untuk berlaku tidak adil. Berlaku adillah. Karena (adil) itu lebih dekat kepada takwa. Dan bertakwalah kepada Allah, sungguh, Allah Mahateliti terhadap apa yang\nkamu kerjakan”. (Q.S. Al-Maidah [5]: 8)\nAdil merupakan perintah bagi orang-orang beriman dan bentuk kata lain dari “i’tidal” itu sendiri. I’tidal (adil) yaitu menunaikan sesuatu dengan sesuai haknya, memperoleh hak dan melaksanakan kewajiban dan tanggung jawab berdasarkan profesionalitas dan berpegang teguh pada prinsip. I’tidal adalah sikap jujur dan apa adanya, memiliki prinsip yang kuat, tidak mudah goyah, serta menegakkan keadilan kepada siapapun, di mana pun, dan dalam\nkondisi apapun, dengan sangat mempertimbangan kemaslahatan (Manan, 2012: 38). \nSikap i’tidal ini memegang teguh kebenaran dan berpegang pada keadilan sebagai komunitas yang tidak akan lembek dan lemah. Nabi Muhammad saw. membuat peran terbaik untuk emoderasi sikap dalam beragama dalam bentuk i’tidal yaitu cara berperilaku umat untuk bersikap proporsional,", "t": "Susah", "k": "B"}, {"id": "SEJARAH-118", "m": "SEJARAH", "n": 118, "q": "Jelaskan pengertian Tasamuh (Toleransi)yang merupakan salah satu prinsip moderasi beragama  Indonesia\nJawab. \nTasamuh adalah sikap menyadari akan adanya perbedaan dan menghormati, baik itu dari keagamaan, suku, ras, golongan dan berbagai aspek kehidupan lainnya, atau sikap untuk memberi ruang bagi orang lain dalam menjalankan keyakinan agamanya, mengekspresikan keyakinannya, dan menyampaikan pendapatnya, meskipun hal tersebut berbeda dengan apa yang diyakini. \ntoleransi mengacu pada sikap terbuka, lapang dada, sukarela, dan lembut dalam menerima perbedaan. Toleransi selalu disertai dengan sikap hormat, menerima orang yang berbeda sebagai bagian dari diri kita, dan berpikir positif. Maka dari itu tasamuh memiliki sikap moderat, adil dan berdiri atas semua kepentingan kelompok ataupun golongan.\nIslam memiliki istilah sendiri tentang toleransi karena toleransi bukan berarti menyamakan semua agama di dunia ini. Toleransi dalam Islam lebih menghargai kepada pemeluk agama lain dengan tanpa memaksakan mereka yang beragama lain dan juga bukan berarti mengikuti keyakinan mereka. Hal ini sudah jelas ditegaskan dalam Q.S. Al-Kafirun ayat 1-6.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-119", "m": "SEJARAH", "n": 119, "q": "Jelaskan pengertian Asy-Syura –( شورى )(Musyarawah) yang merupakan salah satu prinsip moderasi beragama  Indonesia (iv)\nJawab. \nMusyawarah berasal dari bahasa Arab yaitu syura (شورى ) yang berarti secara bahasa memiliki arti mengambil, melatih, menyodorkan diri, dan meminta pendapat atau nasihat; atau secara umum, asy-syura artinya meminta sesuatu. Adapun menurut istilah sebagaimana dikemukakan oleh Ar-Raghib Al-Ashfahani, musyawarah adalah mengeluarkan pendapat dengan mengembalikan sebagiannya pada sebagian yang lain, yakni menimbangsatu pendapat dengan pendapat yang lain untuk mendapat satu pendapat yang disepakati, maka dengan demikian asy-syura adalah urusan yang dimusyawarahkan (Al Alusy, 1415: 46).\nSyura (musyawarah) merupakan aktivitas yang dilaksanakan untuk menyelesaikan segala macam persoalan dengan jalan duduk bersama, mengumpulkan pandangan yang beragam untuk mencapai kesepakatan demi kemaslahatan bersama. Kebenaran yang dilahirkan dari musyawarah berasal dari pikiran-pikiran jernih pesertanya yang disuarakan berdasarkan argumentasi dan landasan kuat dan logis. Musyawarah ini biasanya merujuk kepada sumber-sumber ajaran agama dan budaya. Misalnya, prinsip yang bersifat universal seperti keadilan, penghormatan terhadap martabat kemanusiaan, kemerdekaan, dan tanggung jawab, persaudaraan dan kesetiakawanan, kesetaraan, kebhinekaan dan sebagainya.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-120", "m": "SEJARAH", "n": 120, "q": "Jelaskan pengertian Al-Ishlah - الإصلاح (Perbaikan) yang merupakan salah satu prinsip moderasi beragama  Indonesia?.\nJawab :\nSecara etimologi istilah al-Ishlah} dapat dimaknai sebagai perbuatan yang baik dan terpuji dalam kaitannya dengan perilaku manusia. Atau juga al-Ishlah ini memiliki makna mengatur sesuatu yang tidak lurus menjadi lurus dengan mengembalikan fungsinya yang sebenarnya (al-Thabarsi, 1986: 137). Karenanya, secara terminologi, al-Ishlah dapat didefinisikan sebagai suatu perbuatan yang hendak membawa perubahan dari kegelapan menuju jalan yang terang benderang. \nPara ahli hukum Islam berpandangan bahwa terminologi (alishlah )dapat dimaknai sebagai suatu perjanjian kesepakatan oleh pihak individu atau kelompok yang bersengketa atau bertikai untuk memperoleh jalan perdamaian (Abu Muhammad al-Aynayni, tt: ix, 3). Senada dengan pengertian tersebut, Hasan Sadily mengatakan bahwa kata al-ishlah adalah proses penyelesaian pertikaian atau persoalan di antara pihak yang bersengketa untuk menyelesaikan persoalan tersebut secara damai baik itu dalam perkara keluarga, pengadilan, politik, atau peperangan, dan lain-lain (Hassan Sadily, 1982: 1496).", "t": "Susah", "k": "B"}, {"id": "SEJARAH-121", "m": "SEJARAH", "n": 121, "q": "Jelaskan pengertian Al-Qudwah - قدوة (Kepeloporan) yang merupakan salah satu prinsip moderasi beragama  Indonesia?\nJawab.\nAl-Qudwah adalah membawa maksud memberi contoh, teladan dan model kehidupan. Memberi teladan ini adalah sebuah sikap inisiatif merintis mulia dan memimpin manusia untuk\nkesejahteraan. Al-Qudwah adalah membawa maksud memberi contoh, teladan dan model  kehidupan. Memberi teladan ini adalah sebuah sikap inisiatif merintis mulia dan memimpin manusia untuk kesejahteraan. Prinsip ini secara implisit dikutip dalam Al-Qur’an dari istilah serupa uswatun hasanah yang terdapat dalam firman Allah Swt:yang artinya :  “ Sungguh, telah ada pada (diri) Rasulullah itu suri teladan yang baik bagimu (yaitu) bagi orang yang mengharap (rahmat) Allah dan (kedatangan) hari Kiamat dan yang banyak mengingat Allah”  (Q.S. Al-Ahzab [33]: 21).\nMenurut Al-Ba’labaki sebagaimana dikutip oleh Jasmi, mendefinisikan  “Qudwah” adalah membawa maksud untuk memberi contoh, teladan, merepresentasikan seorang model, dan peran yang baik dalam kehidupan (Jasmi, 2016: 132-134).\nQudwah yang menjadi karakter dalam nilai-nilai moderasi beragama ini, jika dikaitkan dengan konteks sosial kemasyarakatan, maka memberikan pemaknaan bahwa seseorang atau kelompok umat Islam dapat dikatakan moderat jika mampu menjadi pelopor atas umat yang lain dalam menjalankan nilai-nilai keadilan dan kemanusiaan.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-122", "m": "SEJARAH", "n": 122, "q": "Jelaskan pengertian Al-Muwathanah - مواطنة (Cinta Tanah Air) yang merupakan salah satu prinsip moderasi beragama  Indonesia (vii)\nJawab. \nAl-Muwathanah adalah pemahaman dan sikap penerimaan eksistensi negara-bangsa (nation-state) dan pada akhirnya menciptakan cinta tanah air (nasionalisme) di mana pun berada. Al- Muwathanah ini mengedepankan orientasi kewarganegaraan atau mengakui negara-bangsa dan menghormati kewarganegaraan. Ramadhan dan Muhammad Syauqillah (2018) dalam jurnal “An Order to build the Resilience in the Muslim World againsts Islamophobia: The Advantage of Bogor Message in Diplomacy World & Islamic Studies”, mengutip pendapat Yusuf Al-Qardhawi, mengartikan nasionalisme sama dengan al-wathn ) الوطن ) dan kebangsaan sama dengan almuwathanah yang harus dihormati, antar sesama umat Muslim.\n Keberadaan cinta tanah air adalah sebuah komitmen kebangsaan yang merupakan indikator sangat penting untuk melihat sejauh mana cara pandang, sikap, dan praktik beragama seseorang  berdampak pada penerimaan terhadap konsensus dasar kebangsaan, sebagaimana yang telah dipraktikkan Nabi Muhammad saw di Kota Madinah. Dalam konteks Indonesia, al-muwathanah adalah pengakuan yang mencakup kesepakatan akan Pancasila sebagai ideologi negara, Undang-Undang Dasar 1945 sebagai konstitusi negara, Negara Kesatuan Republik Indonesia (NKRI), dan Bhinneka Tunggal Ika sebagai perekat bangsa yang majemuk", "t": "Susah", "k": "B"}, {"id": "SEJARAH-123", "m": "SEJARAH", "n": 123, "q": "Jelaskan pengertian Al-La ‘Unf – الا عنف (Anti Kekerasan) yang merupakan salah satu prinsip moderasi beragama  Indonesia (viii)\nJawab. \nDalam Bahasa Arab term tersebut menggunakan beberapa istilah, antara lain al-‘unf, at-tatharruf, al-guluww, dan alirhab. Al-‘unf adalah antonim dari ar-rifq yang berarti lemah lembut dan kasih sayang. Abdullah an-Najjar mendefinisikan al-‘unf dengan penggunaan kekuatan secara ilegal (main hakim sendiri) untuk memaksakan kehendak dan pendapat (Lajnah Pentashihan Mushaf Al-Qur’an Kementerian Agama, 2014: 97)\nAnti kekerasan artinya menolak ekstremisme yang mengajak pada perusakan dan kekerasan, baik terhadap dirinya sendiri ataupun terhadap tatanan sosial. Ekstremisme dalam konteks moderasi beragama ini dipahami sebagai suatu ideologi tertutup yang bertujuan untuk perubahan pada sistem sosial dan politik. Ini merupakan upaya untuk memaksakan kehendak yang seringkali menabrak norma atau kesepakatan yang ada di suatu masyarakat.\nCiri-ciri dari anti kekerasan pada moderasi beragama ini adalah mengutamakan cara damai dalam mengatasi perselisihan, tidak main hakim sendiri, menyerahkan urusan kepada yang berwajib dan mengakui wilayah negaranya sebagai satu kesatuan. Sifat anti kekerasan bukan berarti lemah/lembek tetapi tetap tegas dan mempercayakan penanganan kemaksiatan/pelanggaran hokum kepada aparat resmi.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-124", "m": "SEJARAH", "n": 124, "q": "Jelaskan pengertian I’tiraf al-’Urf – اعتراف العرف (Ramah Budaya) yang merupakan salah satu prinsip moderasi beragama  Indonesia (ix)\nJawab. \nBudaya adalah keseluruhan sistem, gagasan, tindakan, dan hasil kerja manusia dalam rangka menjalankan kehidupan masyarakat. Islam sendiri memandang bahwa budaya adalah\nhasil olah akal, budi, cipta rasa, karsa dan karya manusia yang\nberlandaskan pada nilai-nilai Islam. \nBudaya merupakan hasil karya manusia. Sedangkan Islam sebagai agama adalah pemberian Allah untuk kemaslahatan manusia itu sendiri. Agama Islam diberikan Allah Swt kepada manusia untuk mengarahkan dan membimbing karya-karya manusia agar bermanfaat, berkemajuan, mempunyai nilai positif dan mengangkat harkat manusia. Manusia dituntut menggunakan pikiran untuk mengolah alam dunia ini menjadi sesuatu yang bermanfaat bagi kepentingan manusia.\n Keberagaman kehidupan sosial budaya pada masyarakat  adalah sebuah keniscayaan. Eksistensi sosial budaya yang membentuk kebudayaan pada masyarakat adalah sebagai hasil beragamnya manusia yang diciptakan oleh Allah Swt, baik bangsanya, agamanya, sukunya, budayanya dan yang lainnya dengan tujuan untuk saling mengenal dan menghormati perbedaan kehidupan sosial budaya di masyarakat. Keadaan yang demikian sebagaimana firman Allah Swt dalam Q.S. Al-Hujurat [49]: 13,", "t": "Susah", "k": "B"}, {"id": "SEJARAH-125", "m": "SEJARAH", "n": 125, "q": "Sebutkan  ciri-ciri atau indikator sikap atau perilaku yang mencerminkan Nilai tawassuth (tengah-tengah ) dan I’tidal ( Tegak lurus )\nJawab\nIndikator yang mencerminkan perilaku tawassuth : \n- Mengutamakan sifat pertengahan dalam segala hal\n- Tidak ekstrem kiri dan kanan\n- Menjaga keseimbangan antara hak dan kewajiban; dunia dan akhirat; ibadah ritual dan sosial; doktrin dan ilmu pengetahuan.\n\nIndikator yang mencerminkan perilaku I’tidal : \n- Menempatkan sesuatu pada tempatnya\n-  Tidak berat sebelah\n-  Proporsional dalam menilai sesuatu\n-  Berlaku konsisten\n-  Menjaga keseimbangan antara hak dan kewajiban\n-  Mempertahankan hak pribadi dan memberikan hak orang lain", "t": "Susah", "k": "B"}, {"id": "SEJARAH-126", "m": "SEJARAH", "n": 126, "q": "Sebutkan  ciri-ciri atau indikator sikap atau perilaku yang mencerminkan Nilai Tasamuh  ( Toleran ) dan Al-Syura (Musyawarah)\nJawab\nIndikator yang mencerminkan perilaku   Tasamuh  ( Toleran )\n-  Menghormati perbedaan Suku, Agama, Ras, dan Antar Golongan (SARA)\n-  Menerima perbedaan sebagai fitrah manusia\n-  Tidak fanatik buta terhadap kelompok sendiri\n-  Menerima kebenaran dari kelompok lain\n-  Menghargai ritual dan hari besar agama lain\nIndikator yang mencerminkan perilaku   Al-Syura (Musyawarah)\n-  Membahas dan menyelesaikan urusan secara bersama\n-  Mau mengakui pendapat orang lain\n-  Tidak memaksakan pendapat pribadi\n-  Menghormati dan mematuhi keputusan bersama", "t": "Susah", "k": "B"}, {"id": "SEJARAH-127", "m": "SEJARAH", "n": 127, "q": "Sebutkan  ciri-ciri atau indikator sikap atau perilaku yang mencerminkan Qudwah (Kepeloporan)  dan Ishlah (Perbaikan) \nIndikator yang mencerminkan perilaku   Qudwah (Kepeloporan)\n-  Bisa menjadi contoh/teladan\n-  Mau berintrospeksi diri \n-  Tidak suka menyalahkan orang lain\n-  Memulai langkah baik dari diri sendiri\n-  Menjadi pelopor dalam kebaikan  seperti menjaga kelestarian lingkungan\nIndikator yang mencerminkan perilaku   Ishlah (Perbaikan) \n-  Berusaha memperbaiki keadaan\n-  Mau melakukan perubahan yang lebih baik\n-  Mengutamakan kepentingan bersama\n-  Mau mendamaikan perselisihan untuk kebaikan bersama", "t": "Susah", "k": "B"}, {"id": "SEJARAH-128", "m": "SEJARAH", "n": 128, "q": "Sebutkan  ciri-ciri atau indikator sikap atau perilaku yang mencerminkan  Muwathanah (Cinta Tanah Air) dan ‘Urf (Menghormati Budaya) \nJawab. \nIndikator yang mencerminkan perilaku   Muwathanah (Cinta Tanah Air)\n-  Menghormati simbol-simbol negara\n-  Siap sedia membela negara dari serangan fisik maupun non-fisik sesuai ketentuan yang berlaku\n-  Mempunyai rasa persaudaraan dengan sesama warga negara\n-  Mengakui wilayah negaranya sebagai satu kesatuan\n-  Mengakui kedaulatan negara lain \nIndikator yang mencerminkan perilaku   ‘Urf (Menghormati Budaya)\n-  Menghayati nilai-nilai yang berkembang di masyarakat\n-  Melestarikan adat dan budaya\n-  Menghormati tradisi yang dijalankan oleh masyarakat setempat\n-  Tak mudah menuduh bid’ah dan sesat\n-  Bisa menempatkan diri di manapun berada", "t": "Susah", "k": "B"}, {"id": "SEJARAH-129", "m": "SEJARAH", "n": 129, "q": "Ceritakan secara singkat Praktik moderasi beragama yang paling bersejarah  pada masa nabi Muhammad SAW. ( i )\nJawab. \nSelaku tokoh yang sukses mengubah peradaban manusia,Rasulullah saw, adalah figur yang mampu mempraktikkan moderasi beragama dalam bentuk adil serta balance.  Ketika elakukan berbagai  perjanjian dengan kalangan Quraisy, Rasulullah saw, memprioritaskan nilai-nilai perdamaian dan mencari jalur tengah (moderat) dalam rangka untuk kebaikan bersama. Misalnya, dalam  Perjanjian Hudaibiyah Nabi Muhammad saw menampilkan jiwa besar serta kesabarannya. Beliau pula sempat mempersilahkan  komunitas Kristen Najran untuk melaksanakan ibadah di Masjid Nabawi.\nPraktik moderasi beragama yang sangat bersejarah pada masa Nabi Muhammad saw juga tertuang dalam sebuah perjanjian/kesepakatan pada Piagam Madinah (662M). Beliau menjadi pemimpin negeri Madinah dan bersama warganya membangun komunitas orang-orang beriman yang diikat dengan perjanjian yang dituangkan dalam Mitsaq al-Madinah (Piagam Madinah). Beliau bersama warganya mengatur kehidupan bersama di Madinah yang dihuni oleh beberapa golongan yaitu Muslimin, Musyrikin dan Yahudi. Muslimin adalah orang-orang Quraisy yang telah masuk Islam yang terdiri dari beberapa kelompok, di antaranya Bani Hasyim dan Bani Muthalib. Kabilah Aus dan Khazraj merupakan unsur utama golongan Anshor. Sementara golongan musyrikin adalah orang-orang Arab yang masih menyembah berhala. Golongan Yahudi terdiri dari keturunan Yahudi pendatang dan keturunan Arab yang masuk agama Yahudi atau menikah dengan Yahudi.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-130", "m": "SEJARAH", "n": 130, "q": "Ceritakan secara singkat Praktik moderasi beragama yang paling bersejarah  pada masa nabi Muhammad SAW. ( ii )\nJawab.\nDi tengah kemajemukan penghuni Kota Madinah, Nabi  Muhammad saw. berusaha membangun tatanan hidup bersama, mencakup semua golongan yang ada di Kota Madinah. Sebagai langkah  awal beliau mempersaudarakan antara kaum Anshor  (pendatang dari Makkah) dan Muhajirin (penduduk Madinah).  Kemudian diadakan perjanjian hidup bersama secara damai diantara beberapa golongan yang ada di Madinah, baik golongan Islam, Yahudi dan musyrikin. Kesepakatan-kesepakatan di antara penduduk Madinah tersebut kemudian ditulis dalam sebuah naskah yang disebut shahifah (piagam) atau dalam Bahasa Inggris disebut\ndengan document. Shahifah tersebut oleh para peneliti diberi nama The Constitution of Medina, agramen, treaty, piagam dan sebagainya.\nDiantara isi piagam tersebut, Rasulullah menulis perjanjian antara Muhajirin dan Anshor, dan beliau mengikat janji perdamaian dengan Yahudi untuk kebaikan bersama (al-Ishlah), yang di dalamnya dinyatakan bahwa mereka bebas dalam agama mereka dan harta mereka dilindungi. Beliau menetapkan syarat (kewajiban) yang harus mereka penuhi dan syarat (hak) bagi mereka. (Ibnu Hisyam, tt: 119)", "t": "Susah", "k": "B"}, {"id": "SEJARAH-131", "m": "SEJARAH", "n": 131, "q": "Ceritakan secara singkat Praktik moderasi beragama yang paling bersejarah  pada masa nabi Muhammad SAW. ( iii )\nJawab.\nKetika Rasulullah melakukan pertemuan dengan, kaum  Anshor, Muhajirin, Yahudi dan Musyrikin dalam rangka menyusun  Piagam Madinah, beliau sering melakukan diskusi-diskusi dan  bermusyawarah (Syura) mengenai urusan kehidupan bersama warga Madinah. Kaum Yahudi pada awal Nabi datang ke Madinah mereka bersikap baik. Beliau sering berbincang-bincang bersama  para pemimpin dan tokoh mereka. Serombongan Rahib dan tokoh Yahudi datang kepada Nabi Muhammad saw melakukan dialog dan sebagainya. Nabi Muhammad dan golongan Muslim juga sangat akrab dengan golongan Yahudi pada saat proses membuat Piagam Madinah.\nDari pemaparan di atas sangatlah jelas nilai-nilai moderasi  beragama seperti, musyawarah, tasamuh, ishlah, qudwah, berlaku  adil, anti kekerasan dengan mengedepankan perdamaian dan tidak memaksakan beragama kelompok lain kepada penduduk Madinah telah dilakukan oleh Nabi Muhammad saw. Dari sini pula tergambar sejarah mengenai praktik moderasi beragama menjadi penting  demi membangun cinta tanah air (al-muwathanah) bagi seluruh masyarakat di negeri Madinah.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-132", "m": "SEJARAH", "n": 132, "q": "Ceritakan secara singkat Praktik moderasi beragama yang paling bersejarah  pada masa nabi Muhammad SAW.\nJawab.\npraktik moderasi beragama bisa disimak  pada kejadian Fathu Makkah. Pada saat Nabi Muhammad saw,  menguasai Makkah, beliau mengedepankan perilaku ksatria dan sifat terpuji dengan tidak mengedepankan perilaku ego selaku pemenang. Sebagai pihak yang menang, tentu nasib serta ketentuan  bagi penduduk Makkah terletak di genggaman tangan beliau dan pasukannya. Namun apa yang terjadi, justru Nabi Muhammad saw memberikan amnesti (pengampunan) kepada Kaum Quraisy Makkah. Padahal Kaum Quraisy ingin membunuh, mengusir, menyakiti, memerangi, dan menganiaya Nabi serta para sahabatnya.  Sebagaimana sebuah kisah yang diceritakan oleh Al-Abbas bin Abdul Muthalib, ia berkata: “Wahai Rasulullah, Abu Sufyan bin Harb adalah orang yang senang dengan kebanggaan, oleh sebab itulah, berikanlah suatu kebanggaan kepadanya.”Rasulullah bersabda: “Ya, barangsiapa memasuki rumah Abu Sufyan bin Harb, ia aman. Barangsiapa menutup pintu rumahnya, ia aman. Dan barangsiapa memasuki Masjidil Haram, ia aman. Kemudian ketika Abu Sufyan kembali ke pasukannya di Makkah, ia menyampaikan apa yang disampaikan Rasulullah saw, tersebut kepada Kaum Quraisy penduduk Makkah (Ibnu Ishaq, 2018: 640-642).\nGambaran di atas juga bukti bahwa kebesaran jiwa Nabi Muhammad saw dan para sahabatnya adalah bersifat rahmah anti kekerasan (al-la ‘unf), tidak dikotori oleh dendam serta dengki kepada musuh-musuhnya. Beliau mewariskan teladan (al-qudwah) yang berupa kebaikan, kemanusiaan, keteguhan menepati janji dan berlaku adil kepada siapapun masyarakatnya tanpa memandang agama, suku dan golongannya.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-133", "m": "SEJARAH", "n": 133, "q": "Coba Anda berikan contoh keteladanan nabi Nabi Muhammad saw,   untuk memoderasi cara umat dalam melakukan ibadah.\nJawab \nDalam sebuah hadis yang diriwayatkan dalam kitab Shahih al-Bukhari dari Anas bin Malik terdapat cerita bahwa: “Ada tiga orang mendatangi rumah istri-istri Nabi saw untuk bertanya tentang ibadah Beliau. Lalu setelah mereka diberitahukan (tentang ibadah Beliau), mereka menganggap ibadah yang mereka lakukan selama ini sedikit sekali. Mereka berkata, “Kita ini tidak ada apa-apanya dibandingkan dengan Rasulullah saw. Beliau telah diberikan ampunan atas semua dosa-dosanya baik yang telah lewat maupun yang akan datang.” Salah seorang dari mereka mengatakan, “Adapun saya, maka saya akan shalat malam selama-lamanya.” Lalu orang yang lainnya menimpali, “Adapun saya, maka sungguh saya akan puasa terus menerus tanpa berbuka.” Kemudian yang lainnya lagi berkata, “Sedangkan saya akan menjauhi wanita, saya tidak akan menikah selamanya.” Kemudian, Rasulullah saw, mendatangi mereka, seraya berkata, “Benarkah kalian yang telah berkata begini dan begitu? Demi Allah! Sesungguhnya aku adalah orang yang paling takut kepada Allah dan paling taqwa kepada-Nya di antara kalian. Akan tetapi aku berpuasa dan aku juga berbuka (tidak puasa), aku shalat dan aku juga tidur, dan aku juga menikahi wanita. Maka, barangsiapa yang tidak menyukai sunnahku, maka ia tidak termasuk golonganku.” (HR Al-Bukhari)", "t": "Susah", "k": "B"}, {"id": "SEJARAH-134", "m": "SEJARAH", "n": 134, "q": "Ceritakan/jelaskan secara singkat Praktik moderasi beragama pada masa sahabat Khalifah  Umar bin Khattab.\nJawab. \nTak jauh berbeda dengan Abu Bakar, adalah Khalifah  Umar bin Khattab, khalifah yang dikenal sebagai Bapak Keadilan. Ia dikenal sebagai munshif—seorang yang objektif (i’tidal). Tidak segan bagi beliau untuk mengakui kesalahannya meski pada posisi menjadi khalifah. Misalnya, sebuah kisah yang diceritakan Ibn Asakir dalam tarikhnya. Suatu hari Umar mendatangi kota Syam yang saat itu baru ditaklukkan. Ketika Umar sampai kota tersebut, tiba-tiba  ia disambut oleh para muqallis. Muqallis adalah tentara yang biasa  menyambut panglima perang. Karena Umar adalah orang yang sangat sederhana dan paling tidak suka dengan protokol, ia hendak melarang para muqallis yang tidak beragama Islam itu. Namun Abu Ubaidah mencegah, “Biarlah wahai Amirul Mukminin. Ini adalah kebiasaan mereka. Jika kau melarang mereka, maka kau sungguhbtelah melanggar janji kebebasan berekspresi.” Kemudian Umar berkata, “Abu Ubaidah benar dan Umar keliru.” (Kholil: 2019)", "t": "Susah", "k": "B"}, {"id": "SEJARAH-135", "m": "SEJARAH", "n": 135, "q": "Ceritakan/jelaskan secara singkat Praktik moderasi beragama pada masa sahabat Khalifah  Umar bin Khattab, tentang tindakan sahabat Umar dalam menjaga Gereja Holy Sepulchre.\nJawab.\ncerita masyhur tentang tindakan Umar dalam menjaga Gereja Holy Sepulchre. Kisah nyata ini menggambarkan toleransi beragama selama kepemimpinan Umar. Apalagi pada waktu itu bertepatan dengan momen penolakan Umar untuk shalat di Gereja tersebut. Kemudian dibuatlah Perjanjian Aelia Ahdah ‘Umariyah; perjanjian kebebasan beragama bagi penduduk Kota Aelia. Al-Tabari telah menetapkan isi perjanjian Aelia. Secara garis besar isi perjanjian tersebut terkait dengan kebebasan beragama bagi penduduk Aelia; bagi yang ingin tetap tinggal di kota, bergabung bersama Romawi, atau ingin netral, semuanya diperbolehkan dan dibebaskan (Kholil: 2019).", "t": "Susah", "k": "B"}, {"id": "SEJARAH-136", "m": "SEJARAH", "n": 136, "q": "Ceritakan/jelaskan secara singkat Praktik moderasi beragama pada masa  Umar ibn Ábd Aziz (101H/720M)\nJawab. \npada masa Khalifah Umar ibn Ábd Aziz (101H/720M). Salah satu kisah menarik pada masa Khalifah Umar ibnu Abdul Aziz adalah kisah Walid bin Abdul Malik yang mengambil gereja Nasrani untuk perluasan masjid. Pada sewaktu Umar bin Abdul Aziz menjadi khalifah, orang-orang Nasrani mengadu kepada beliau terkait dengan tindakan yang dilakukan oleh Walid terhadap gereja mereka. Kemudian Umar bin Abdul Aziz menulis mandat kepada petugasnya untuk mengembalikan apa yang pernah diambil Walid (Al-Abid, tt: 22-31).\nPada masa Khalifah Umar bin Abdul Aziz juga pernah terjadi peristiwa dialog atau musyawarah (syura) untuk mencari jalan tengah terkait dengan persoalan Bangunan Masjid Umayyah di Damaskus yang mewah konstruksinya. Masjid tersebut dahulu sebuah Gedung\nyang impresif, sangat bagus dan mahal bangunannya. Pada masa ituUmar bin Abdul Aziz sempat ia menginginkan untuk menghancurkan bangunan Masjid tersebut.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-137", "m": "SEJARAH", "n": 137, "q": "Ceritakan/jelaskan secara singkat Praktik moderasi beragama pada masa  masa Dinasti Utsmaniyah\nJawab. \nPada masa Dinasti Utsmaniyah, praktik moderasi beragama pernah diwujudkan dalam sistem sosial dalam bentuk perlindungan  dan jaminan kebebasan serta kehidupan beragama yang disebut millet. Millet (berasal dari Bahasa Arab yang berarti Millah), yang mana kelompok agama dan suku minoritas dapat mengurus masalah mereka sendiri tanpa intervensi dan kontrol yang banyak dari pemerintah pusat. Millet adalah sistem yang mengatur hubungan antar komunitasagama yang berbeda di Disnati Utsmaniyah. Sistem ini bertanggungjawab atas ritual keagamaan, pendidikan, keadilan, amal, dan memiliki pelayanan sosial di setiap kelompok agama. Terdapat Millet Yahudi, Millet Armenia, Millet Komunitas Ortodoks Timur di bawah Ottoman dan tentu saja Millet Muslim. Setiap millet menjalankan fungsi koordinasi internal dan melaporkan kepada Sultan bila ada masalah yang perlu diselesaikan. Sultan melindungi seluruh millet tersebut dan tentu pemimpin tertinggi millet di Islam dikenal dengan sebutan Syeikh al-Islam (Lukman Hakim: 2019, 93- 112)", "t": "Susah", "k": "B"}, {"id": "SEJARAH-138", "m": "SEJARAH", "n": 138, "q": "Ceritakan/jelaskan secara singkat Praktik moderasi yang pernah  dilakukan oleh Imam Syafi’i  ketika mempertimbangkan keragaman pendapat hukum yang melahirkan  perbedaan dalam bermadzhab (ikhtilāf) .\nJawab\nPraktik moderasi juga pernah dilakukan oleh Imam Syafi’I ketika mempertimbangkan keragaman pendapat hukum yang melahirkan perbedaan dalam bermadzhab (ikhtilāf), misalnya Imam  Syafi’i menjelaskan semacam ketidaksepakatan dengan argumentasi yang kuat dan adanya kebutuhan pandangan untuk mengakui bahwa kita mungkin benar dan yang lain mungkin salah, tetapi cara lain mungkin saja benar. Beliau melantunkan syair:\n“Apabila engkau adalah orang mulia dan berilmu, (punya pendapat) berbeda dengan orang lain, maka berdiskusilah dalam keadaan tenang, sabar, tidak pongah dan tidak sombong”\n(Diwan Asy-Syafi’i /Kumpulan Syair Imam Asy-Syafi’i).\nPada konteks ini dapat dipahami bahwa Imam Syafi’i mengedepankan kesadaran bahwa perbedaan-perbedaan ini juga mendorong kepada bentuk kesederhanaan dan tidak berlebihan dalam memaksakan pendapat orang lain.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-139", "m": "SEJARAH", "n": 139, "q": "Peradaban umat manusia di dunia selalu mengalami perkembangan dari masa kemasa, tak terkecuali di bidang teknologi, yang melahirkan  Revolusi Industri.  Jelaskan Apakah yang dimaksud dengan revolusi industry? \nJawab. \nRevolusi adalah perubahan sosial dan kebudayaan yang berlangsung secara cepat dan menyangkut dasar atau pokok  kehidupan masyarakat. Revolusi Industri adalah perubahan teknologi, sosio-ekonomi, dan budaya pada akhir abad ke-18 dan awal abad ke-19 yang terjadi dengan penggantian ekonomi yang berdasaekan pada pekerja menjadi yang didominasi oleh industry dan diproduksi mesin. Revolusi ini dimulai di Inggris dengan perkenalan mesin uap (dengan menggunakan batu bara sebagai bahan bakar) dan ditenagai oleh mesin (terutama dalam produksi tekstil). Perkembangan peralatan mesin logam keseluruhan pada dua dekade pertama abad ke-19 membuat produk mesin produksi untuk digunakan di industri lainnya. Dalam revolusi, perubahan yang terjadi dapat direncanakan atau tanpa direncanakan terlebih dahulu dan dapat dijalankan tanpa kekerasan atau melalui kekerasan. Revolusi Industri telah mengubah cara kerja manusia dari penggunaan tangan menjadi menggunakan mesin. Istilah “Revolusi Industri” diperkenalkan oleh Friedrich Engels dan Louis Auguste Blanqui di pertengahan abad ke-19.\nRevolusi industri dapat dikatakan sebagai suatu peristiwa yang mengubah sistem ekonomi agraris menjadi sistem ekonomi industri yang menggunakan tenaga mesin sebagai alat produksinya, menggantikan tenaga hewan dan manusia. Sebelum dikenal ala-alat mekanis dan otomatis, masyarakat Eropa bekerja dengan menggunakan alat-alat manual (menggunakan tenaga manusia) dan masih mengandalkan kecepatan kedua tangan dan kaki. Artinya, alat-alat tersebut tidak akan berfungsi dan bekerja jika tidak ada tangan atau kaki. Peralatan yang dimaksud seperti cangkul, parang, sekop, gergaji, pisau, pengukur, palu, penenun, pemintal, jala, pendayung, dan lain-lain.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-140", "m": "SEJARAH", "n": 140, "q": "Jelaskan Latar Belakang Munculnya Revolusi Industri di Inggris, yang merupakan awal dari revolusi industry Dunia! ( i )\nJawab. \nRevolusi Industri di kawasan Eropa bermula di negara Inggris, kemudian pada awal abad ke-19, mulai menyebar ke negara-negara Eropa lainnya dan negara-negara di benua Amerika. Adapun sebab-sebab yang melatabelakangi terjadinya Revolusi Industri tersebut adalah sebagai berikut :\n1. Keamanan dalam negara Inggris yang mantap. Mantapnya kondisi keamanan negara Inggris pada sekitar abad ke-18 menyebabkan terjaminnya seluruh segi kehidupan masyarakat Inggis pada saat itu.\n2. Mulai berkembangnya kegiatan kewiraswastaan dan manufaktur. Perkembangan masyarakat Eropa sebelum Revolusi Industri hidup dalam sistem perdagangan yang masih menggunakan uang dan sistem barter. Kegiatan kegiatan produksi dilakukan di rumah-rumah atau kerajinan rumah (home industry). Di Prancis dikenal istilah “gilda”, yaitu bengkel kerja dan pusat usaha. Setiap orang yang akan memesan barang-barang dapat menghubungi gilda. Alat-alat yang dihasilkan oleh gilda adalah alatrumah tangga, alat kerja pertanian, dan sebagainya. Gildaberu bekerja kalau ada pesanan.\n3. Inggis memiliki kekayaan alam terutama batu bara dan bijih besi. Kekayaan sumber daya alam Inggris seperti banyak ditemukannya batu bara dan bijih besi telah membantu Inggris dalam mengembangkan industrinya karena batu bara dan bijih besi sangat diperlukan dalam proses produksi. Batu bara dijadikan sebagai bahan bakar mesin-mesin dan bijih besi diperlukan untuk industri berat. Kekayaan alam tersebut ditunjang oleh kemampuan dan keinginan manusianya. Orang Ingris terkenal sebagai orang yang rajin dan tekun dalam penelitian alam.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-141", "m": "SEJARAH", "n": 141, "q": "Jelaskan Latar Belakang Munculnya Revolusi Industri di Inggris, yang merupakan awal dari revolusi industry Dunia! ( ii )\nJawab. \n1. Inggris memiliki banyak daerah jajahan. Kerajaan Inggris pada abad ke-18 memiliki banyak daerah jajahan yang  tersebar di benua Afrika dan Asia. Daerah-daerah jajahan inilah yang mendukung kegiatan industri Inggris, karena daerah-daerah jajahan tersebut dapat menyediakan bahan baku yang diperlukan oleh industri Inggris. Selain itu, daerah-daerah jajahan tersebut dapat dijadikan sebagai tempat pemasaran hasil industri Inggris.\n2. Terjadinya revolusi agraria. Kondisi masyarakat Inggris yang dilanda gejolak turut melatarbelakangi revolusi  industri di negara tersebut. Gejolak yang dimaksud adalah revolusi agraria (pertanian). Revolusi agraria ini disebabkan oleh berkembangnya kerajinan pakaian wol, yang dengan sendirinya meningkatkan permintaan bulu domba. Dari hal itu usaha di bidang wol menjadi sangat menarik, maka tanah pertanian diubah menjadi peternakan domba.\n3. Munculnya paham ekonomi liberal. Kegiatan lain yang mendorong lahirnya Revolusi Industri adalah kegiatan  perekonomian. Sejak abad ke-17, dunia pelayaran dan perdagangan di Inggris berkembang pesat. Perkembangan  ini dibuktikan oleh banyaknya kongsi-kongsi dagang, seperti EIC (East India Company), Virginia Co., Plymouth Co., Massachusets Bay Co. dan lain-lain. Para kongsi dagang memperoleh keuntungan dari penanaman modalnya di Inggris dan daerah lain. Sebagian besar dari keuntungannya itu ditabung di bank, sehingga secara keseluruhan aktivitas mereka memberi kesejahteraan bagi kerajaan Inggris. Gejolak dalam masyarakat akibat perkembangan kegiatan perekonomian adalah munculnya paham ekonomi liberal. Tokoh-tokoh yang mengembangkan paham ini adalah Adam Smith, Thomas Robert Malthus, David Ricardo, dan John Stuart Mill.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-142", "m": "SEJARAH", "n": 142, "q": "Jalannya Revolusi Industri, tidak dapat dipisahkan dengan tahap-tahap perkembangan industry, sebutkan dan jelaskan Tahap-tahap perkembangan Industri tersebut. \nJawab. \na. Domestic System\nTahap ini dapat disebut sebagai tahap kerajinan rumah (home industry). Para pekerja bekerja di rumah masing-masing dengan alat yang mereka miliki sendiri. Bahkan, bahan baku kerajinan diperoleh dari pengusaha yang setelah selesai dikerjakan disetorkan kepadanya. Upah diperoleh berdasarkan jumlah barang yang dikerjakan. Dengan cara kerja yang demikian, majikan yang memiliki usaha hanya membayar tenaga kasar atas dasar prestasi atau hasil. Para majikan tidak direpotkan soal tempat kerja dan gaji.\nb. Manufacture Setelah kerajinan industri makin berkembang diperlukan tempat khusus untuk bekerja agar majikan dapat mengawasi dengan baik cara mengerjakan dan mutu produksinya. Sebuah manufaktur (pabrik) dengan puluhan tenaga kerja didirikan  dan biasanya berada di bagian belakang rumah majikan. Rumah bagian tengah untuk tempat tinggal dan bagian depan sebagai toko untuk menjual produknya. Hubungan majikan dengan pekerja (buruh) lebih akrab karena tempat kerjanya jadi satu dan jumlah buruhnya masih sedikit. Barang-barang yangdibuat kadang-kadang juga masih berdasarkan pesanan\nc.  Factory System\nTahap sistem factory (pabrik) sudah merupakan industry yag menggunakan mesin. Tempatnya di daerah industri yang  telah ditentukan, bisa di dalam atau di luar kota. Tempat tersebut untuk tempat kerja, sedangkan majikan tinggal di tempat lain. Demikian juga toko tempat pemasaran hasil  industri diadakan di tempat lain. Jumlah tenaga kerjanya (buruhnya) sudah puluhan, bahkan ratusan. Barang-barang produksinya untuk dipasarkan.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-143", "m": "SEJARAH", "n": 143, "q": "Sebutkan  dan jelaskan  Berbagai jenis Penemuan mesin pendukung perkembangan revolusi undustri  generasi I/ Generasi Perintis . ( i)\nJawab. \nBerkembangnya Revolusi Industri di Inggris ditandai dengan penemuan mesin-mesin yang erguna bagi dunia industri. James Watt pada 1763 menemukan mesin uap. Hasil temuannya ini lebih efektif dan efesien dibandingkan dengan hasil penemuan Thomas Newcomen. Temuan Newcomen\nhanya berupa mesin yang dapat memompa air yang menggenamg di tambang-tambang batu bara dan masih menggunakan tenaga manusia. \nPenemuan di  bidang tekstil ini didasarkan pada keinginan untuk memproses bahan tekstil secara cepat. Pada 1768, ilmuwan Richard  Arkwright (flying shuttle dan water frame). Temuan ini lebih\nmaju dibandingkan dengan temuan John Hargreaves, yaitu mesin pemintal yang dapat menghasilkan beberapa benang (spinning jenny). Mesin tersebut masih digerakan oleh tenaga\nkuda dan tenaga air. Pada 1785, penemuan mesin tenun yang lebih otomatis (power loom) dibuat oleh Edmund Cartwright. Dia menggabungkan penemuan Arkwright, Kay, Hargreaves, dan James Watt. Mesin tenun dan pintal temuan Edmund Cartwright menggunakan mesin uap.\nHenry Cort, menemukan  mesin pelebur bijih besi dengan bahan bakar batu bara. Penemuan ini melahirkan temuan lain dalam bidang transportasi seperti kapal uap oleh Robert Fulton dan kereta api uap oleh George Stephenson.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-144", "m": "SEJARAH", "n": 144, "q": "Sebutkan  dan jelaskan  Berbagai jenis Penemuan mesin pendukung perkembangan revolusi undustri  generasi II dan III. ( ii )\nJawab. \na. Kumparan terbang (flying shuttle) ciptaan John Kay (1733) dengan alat ini proses pemintalan dapat berjalan secara cepat.\nb.  Mesin pemintal benang (spinning jenny) ciptaan James Hargreves (1767) dan Richard Arkwright (1785). Dengan alat ini hasilnya berlipat ganda.\nc.  Mesin tenun (merupakan penyempurnaan dari kumparan terbang) ciptaan Edmund Cartwright (1785). Dengan alat ini hasilnya berlipat ganda.\nd.  Cottongin, alat pemisah biji kapas dari seraburnya ciptaan Whitney (1794). Dengan alat ini maka kebutuhan kapas bersih dalam jumlah yang besar dapat tercukupi.\ne.  Cap selinder ciptaan Thomas Bell (1785). Dengan alat ini kain putih dapat dilukisi pola kembang 200 kali lebih cepat jika dibandingkan dengan pola cap balok dengan tenaga manusia.\nf.  Mesin uap, ciptaan James Watt (1769). Dari mesin uap ini dapat diciptakan berbagai peralatan besar yang menakjubkan, seperti lokomotif ciptaan Richard Trevethik  (1804) yang  emudian disempurnakan oleh George Stepenson menjadi kereta api penumpang. Kapal perang yang digerakkan dengan mesin uap diciptakan oleh Robert Fulton (1814).", "t": "Susah", "k": "B"}, {"id": "SEJARAH-145", "m": "SEJARAH", "n": 145, "q": "Sebutkan  dan jelaskan  Berbagai jenis Penemuan mesin pendukung perkembangan revolusi undustri  generasi II dan III. ( iii)\nJawab. \na. Tahun 1750 : Symington menemukan kapal kincir.\nb. Tahun 1807 : Robert Fulton membuat kapal api yang telah menggunakan baling-baling yang dapat menggerakkan kapal. Kapal ini diberi nama Clermont yang mengarungi lautan Atlantik pertama kali. Kapal ini berangkat dari Paris dan berlabuh di New York. Selanjutnya Robert Fulton berhasil membuat kapal perang pertama (1814) yang telah digerakkan oleh mesin uap. i. Tahun 1804 : Richard Trevethick membuat kereta uap.\nc.  Tahun 1832 : Samuel Morse membuat telegraf\nd.  Tahun 1872 : Graham Bell membuat pesawat telepon.\ne  Tahun 1887 : Daimler membuat mobil", "t": "Susah", "k": "B"}, {"id": "SEJARAH-146", "m": "SEJARAH", "n": 146, "q": "Selain revolusi industry yang terjadi di inggris, di perancis juga terjadi revolusi yang dimulai    tahun 1789.  Sebutkan  pengaruh revolusi perancis bagi Indonesia  yang  terkait dengan  rasa /paham nasioalisme disaat kita  masih dijajah belanda .\nJawab\nPaham nasionalisme berasal dari Eropa Barat, kemudian menyebar ke seluruh Eropa pada abad ke-19 dan abad ke-20.Nasionalisme merupakan paham yang berperan penting dalam mendasari lahirnya pergerakan nasional di berbagai negara Asia dan Afrika.  Nasionalisme di Asia dan Afrika, termasuk di Indonesia disebabkan oleh penindasan yangdilakukan oleh negara-negara imperialis Barat. Pelaksanaanpolitik etis telah memberikan kesempatan pendidikan kepadapenduduk bumiputera, walaupun masih dalam lingkup yang terbatas. Adanya pendidikan telah mendorong munculnya golongan baru, yaitu golongan terpelajar yang menjadi pelopor pergerakan nasional. Pada awal perkembangan pergerakan nasional muncul beberapa organisasi dengan sifat yang berbeda. Boedi Oetomo lebih bersifat organisasi budaya, Sarikat Islam bersifat sosial ekonomi dan religius, sedangkan Indische Partij bersifat politis. Namun ketiga organisasi tersebut memiliki kesamaan, yaitu bersifat\nnasionalis yang bertujuan untuk mengangkat harkat dan martabat bangsanya menuju kemerdekaan kelak.\nDalam rangka merayakan kemerdekaan Belanda ke-100 dari penjajahan Prancis dibentuklah sebuah komite yang dikenal sebagai “Komite Bumiputera” di Bandung. Komite ini dibentuk dengan maksud hendak mengirimkan telegram kepada Ratu Belanda yang isinya permintaan agar dibentuk Majelis Perwakilan Sejati dan ketegasan adanya kebebasan berpendapat di daerah jajahan. Salah seorang pemimpin  komite ini, Soewardi Soerjaningrat menulis sebuah sindiran yang berjudul “Als ik een Nderelander was...” yang isinya mengajak penduduk bumiputera untuk merayakan hari kemerdekaannya. Dari artikel tersebut dapat disimpulkan bahwa bangsa Indonesia sudah memendam rasa nasionalisme yang sangat dalam", "t": "Susah", "k": "B"}, {"id": "SEJARAH-147", "m": "SEJARAH", "n": 147, "q": "Selain revolusi industry yang terjadi di inggris, di perancis juga terjadi revolusi yang dimulai    tahun 1789.  Sebutkan  pengaruh revolusi perancis bagi Indonesia  yang  terkait dengan   pembentukan  wajib militer  disaat kita  masih dijajah belanda .\nJawab\nPada Kongres Boedi Oetomo tanggal 5 dan 6 Agustus 1915, telah ditetapkan usulan perlunya dibentuk wajib militer bagi kalangan pribumi. Selanjutnya komite Indie weerbar  pada 23 Juli 1916 telah memutuskan bahwa pembentukaan kekuatan militer baik laut maupun darat dari kalangan bumiputera mendesak, agar dapat mempertahankan diri dari serangan luar. Dwidjosewoyo sebagai wakil Boedi Oetomo berhasil mengadakan pendekatan dengan pemimpin- pemimpin  terkemuka Belanda. Walaupun misi tidak berhasil meloloskan usulan tentang pembentukan wajib militer,  namun sebagai gantinya pemerintah Belanda akan membentuk Volksraad yang disahkan pada bulan Desember 1916", "t": "Susah", "k": "B"}, {"id": "SEJARAH-148", "m": "SEJARAH", "n": 148, "q": "Selain revolusi industry yang terjadi di inggris, di perancis juga terjadi revolusi yang dimulai    tahun 1789.  Sebutkan  pengaruh revolusi perancis bagi Indonesia  yang  terkait dengan   tuntutan pembentukan  Parlemen terhadap pemerintah  belanda .\nJawab\nTuntutan Indonesia berparlemen  Parlemen merupakan suatu badan yang harus ada pada  negara yang berdasarkan asas-asas demokrasi seperti yang diperjuangkan oleh rakyat Prancis, khususnya Montesquieu. Pada tanggal 21 Mei 1939 berhasil dibentuk badan kerja sama antar partai-partai politik di dalam Volksraad yang disebut gabungan politik Indonesia (GAPI) yang dipimpin oleh Mohammad Hoesni Thamrin. Di dalam konferensi pertamanya, GAPI mencetuskan semboyannya, yaitu“Indonesia Berparlemen”. Momentum untuk menyampaikan gagasan itu muncul ketika meletusnya Perang Dunia II, yaitu atas penyerbuan Jerman terhadap Polandia, pada 20 September 1939 GAPI mengeluarkan suatu pernyataan yang kemudian dikenal dengan nama Manifest GAPI. Isinya adalah mengajak rakyat Indonesia dan negeri Belanda untuk bekejasama menghadapi bahaya fasisme. Kerjasama itu akan lebih berhasil apabila kepada rakyat Indonesia diberikan hak-hak baru dalam urusan pemerintahan, yaitu suatu pemerintahan dengan parlemen yang dipilih dari dan oleh rakyat, dimana pemerintahan tersebut bertanggung jawab  kepada parlemen tersebut.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-149", "m": "SEJARAH", "n": 149, "q": "Selama Perang Dunia I berkecamuk, perekonomian tidak mendapat perhatian yang layak. Akibatnya krisis ekonomi yang dahsyat melanda dunia. Hal ini dikenal dengan sebutan\n“malaise” .Sebutkan sebab-sebab  dari krisis ekonomi tersebut. !\nJawab\n1.  Kemiskinan akibat tenaga manusia tercurah untuk keperluan perang, dan faktor-faktor produksi rusak.\n2.  Produksi yang berlebihan, akibat perdagangan internasional terhenti oleh proteksi yang dilakukan oleh negara-negara totaliter seperti Jerman, Italia, dan Rusia.\n3.  Terhambatnya pemberian kredit. Banyak nasabah yang menarik depositnya karena terjadi inflasi yang sangat tinggi serta banyak perbankan yang menarik kembali pinjamannya.\n4.  Terjadinya kekacauan pembayaran. Terjadi perbedaan besar dalam nilai mata uang Jerman, Austria, dan Prancis terhadap dollar Amerika.", "t": "Susah", "k": "B"}, {"id": "SEJARAH-150", "m": "SEJARAH", "n": 150, "q": "Sebutkan dan jelaskan  Latar Belakang  secara umum Terjadinya Perang Dunia II !\nJawab\nPada hakikatnya latar belakang Perang Dunia II sama dengan Perang Dunia I, yakni terbagi atas sebab umum dan sebab khusus.  Sebab umum yang melatarbelakangi Perang Dunia II , adalah \n1. Kegagalan Liga Bangsa-bangsa (LBB)  \nLBB yang diharapkan dapat menjadi suatu lembaga yang dapat menciptakan perdamaian  dunia, ternayata tidak dapat menjalankan peranannya dengan baik. Seperti pada 1935,  ketika Italia melakukan agresi terhadap Ethiopia, LBB tidak dapat mencegah agresi itu. Oleh karena itu dalam waktu satu tahun, Italia dapat menguasai Ethiopia.\n2. Perlombaan senjata\nIndustri angkatan perang berkembang dengan pesat karena mendapat dukungan dari keuangan negara. Sebagian besar anggaran belanja negara ditujukan untuk bidang industri agar dapat membangun kembali industrinya yang telah hancur pada  masa Perang Dunia I. Tiap-tiap negara berusaha untuk saling mengungguli lawan-lawan mereka dengan melengkapi persenjatannya.\n3. Persekutuan dan pertentangan paham\nBerkembangnya berbagai paham setelah Perang Dunia I  telah menjadikan negara-negara Eropa membentuk persekutuanpersekutuan  berdasarkan kepentingan ideologi yang  berkembang di negara masing-masing   menjelang perang dunia II terdapat tiga paham yang saling bertentangan, yaitu paham  komunis yang dipimpin oleh Rusia (blok komunis), paham fasis yang otoriter-totaliter dipimpin Jerman dan Italia (blok Fasis), serta paham demokrasi dan liberalisme yang dipimpin Amerika Serikat, Inggris dan Prancis (blok demokrasi).", "t": "Susah", "k": "B"}, {"id": "NU-1", "m": "NU", "n": 1, "q": "Dikalangan warga nahdiyin (Nu) ketika ada sanak saudara, orang tua maupun tetangga meninggal dunia maka akan dibacakan yasii, surat iklash, tahlil, dll yang pahalanya di hadiahkan kepada orang yang telah meninggal tersebut. Beberapa kalangan menyebutkan bahwa pahala bacaan quran yang dihadiahkan kepada mayyit tidak akan sampai. Bagaimana pendapat anda tentang membaca Al-quran atau sebagian ayat Al-quran yang pahalanya dihadiahkan kepada Mayyit?.\nJawab : \nMenghadiahkan Pahala Bacaan Al-Quran kepada mayyit adalah perbuatan yang bagus dan pahalanya sampai kepada mayyit. Hal tersebut dikuatkan oleh Hadist Nabi sebagai berikut.\n\nDari Abdullah bin Umar, ia berkata, “Saya mendengar Rasulullah Saw bersabda, ‘Apabila salah seorang kamu meninggal dunia, maka janganlah kamu menahannya, segerakanlah ia ke kuburnya, bacakanlah di sisi al-Fatihah dan di sisi kedua kakinya akhir surat al-Baqarah di kuburnya”. Pendapat para Ulama’.\nA.\tImam Syafi’i\nImam Syafi’i berkata bahwa, disunnahkan membacakan ayat-ayat al-Qur’an kepada mayit, dan jika sampai khatam al-Qur’an maka akan lebih baik.\nB.\tImam al-Hafidz Jalaluddin Suyuthi\nImam as-Suyuthi menjelaskan bahwa,jumhur ulama’ salaf telah berpendapat denganpendapat yang mengatakan “sampainya pahala bacaan terhadap mayit”.\nC.\tImam Nawawi Imam \nNawawi berkata, “Disunnahkan bagi orang yang ziarah kubur untuk membaca ayat-ayat Al-Qur’an lalu setelahnya diiringi berdo’a untuk mayit.\nD.\tIbnu Taymiah\nBeliau berkata: Barang siapa yang berpendapat bahwa, seseorang tidak mendapat pahala kecuali dengan amalanya sendiri, maka orang tersebut telah menghancurkan dan menyalahi ijma (Is’aful muslimin wal muslimat”,hal.50-53)", "t": "Susah", "k": "A"}, {"id": "NU-2", "m": "NU", "n": 2, "q": "Wahabi adalah kelompok yang sangat gencar melarang tawasul. Demikian pula dengan tabaruk dan  istighatsah. Argumen keharamannya juga berkenaan dengan tuduhan bahwa praktik tawasul merusak kemurnian tauhid. Jadi, setelah diharamkan, menyusul kemudian dengan tuduhan bid‘ah dhalalah dan syirik. Bagi kaum Wahabi, tawasul berarti meminta pertolongan kepada selain Khaliq. Jika pandangannya demikian, tabaruk (mengambil berkah dari orang saleh atau para wali) tidak ada dalam konsep keberagamaan Wahabi. Begitu pula dengan istighatsah, karena dalam kamus mazhab Salafi-Wahabi, majlis zikir adalah bid‘ah dhalalah. Bagaimana pendapat anda tentang hal tersebut?.\nJawab :\nSecara garis besar tawasul/wasitah bermakna perantara. Dalam praktiknya, ia banyak dilakukan ketika berdoa kepada Allah SWT. Doa itu dilakukan dengan menyertakan nama Nabi Muhamad Rasulallah SAW. atau nama pribadi seseorang yang masyhur dikenal sebagai ahli takwa. Atau dengan menyebut-nyebut amal kebajikan si pendoa. Dengan tawasul ini, diyakini bahwa peluang dikabulkannya harapan dan doa lebih besar. Salah satu hadist Nabi tentang tawashul adalah : \nAbdullah bin Umar berkata: Saya mendengar Rasulullah Saw bersabda: “Ada tiga orang sebelum kamu melakukan perjalanan, lalu mereka bernaung di sebuah gua, mereka masuk ke dalamnya, lalu ada satu buah batu besar jatuh dari atas bukit dan menutup pintu gua itu. Mereka berkata: “Tidak ada yang dapat menyelamatkan kamu dari batu besar ini kecuali kamu berdoa kepada Allah dengan amal shaleh kamu. \n\nSalah satu dari mereka bertiga berkata: “Ya Allah, saya mempunyai dua orang tua yang sudah tua renta, tidak seorang pun yang lebih saya dahulukan daripada mereka berdua, baik dalam urusan keluarga maupun harta. Suatu hari mereka meminta sesuatu kepada saya. Saya belum menyenangkan mereka hingga mereka tertidur. Maka saya siapkan susu untuk mereka berdua, saya dapati mereka berdua sudah tertidur, saya tidak ingin lebih mendahulukan yang lain; keluarga dan harta daripada mereka berdua. Maka saya terdiam, cangkir berada di tangan saya, saya menunggu mereka berdua terjaga, hingga terbit fajar. Mereka berdua pun terjaga, lalu mereka minum. Ya Allah, jika yang aku lakukan itu untuk mengharapkan kemuliaan-Mu, maka lepaskanlah kami dari dalam gua ini dan dari batu besar ini”. Maka gua itu terbuka sedikit, mereka belum bisa keluar.\n\nOrang kedua berkata: “Ya Allah, saya mempunyai sepupu perempuan, dia orang yang\npaling saya cintai, saya menginginkan dirinya. Ia menahan dirinya hingga berlalu beberapa tahun lamanya. Ia datang kepada saya, lalu saya beritakan seratus dua puluh Dinar kepadanya agar ia mau berdua-duaan dengan saya. Ia pun melakukannya, sampai saya mampu untuk melakukan sesuatu terhadapnya. Ia berkata: “Aku tidak halalkan bagimu untuk melepas cincin kecuali dengan kebenaran”. Saya merasa berat untuk melakukan sesuatu terhadapnya. Maka saya pun pergi meninggalkannya, padahal ia orang yang paling saya cintai, saya pun meninggalkan uang emas yang telah saya berikan. Ya Allah, jika yang saya lakukan itu untuk mengharapkan kemuliaan-Mu, maka lepaskanlah kami dari dalam gua ini”. Maka pintu gua itu pun terbuka sedikit, hanya saja mereka masih belum mampu keluar.\n\nOrang yang ketiga berkata: “Ya Allah, saya mempekerjakan para pekerja, saya memberikan gaji kepada mereka. Hanya saja ada seorang laki-laki yang tidak mengambil gajinya, ia pergi. Maka saya mengembangkan gajinya hingga menjadi harta yang banyak. Lalu setelah berapa lama ia datang lagi dan berkata: “Wahai hamba Allah, bayarkanlah gaji saya”. Saya katakana kepadanya: “Semua yang engkau lihat ini adalah dari gajimu; ada unta, lembu, kambing dan hamba sahaya”. Pekerja itu berkata: “Wahai hamba Allah, janganlah engkau mengejek”. Saya jawab: “Saya tidak mengejekmu”. Maka pekerja itu pun mengambil semuanya, ia membawanya, tidak meninggalkan walau sedikit pun. Ya Allah, jika yang aku lakukan itu untuk mengharapkan kemuliaan-Mu, maka lepaskanlah kami dari gua ini”. Maka batu besar itu pun bergeser (gua terbuka), lalu mereka pun pergi keluar melanjutkan perjalanan”. (HR. alBukhari dan Muslim).", "t": "Susah", "k": "A"}, {"id": "NU-3", "m": "NU", "n": 3, "q": "Wahabi adalah kelompok yang sangat gencar melarang tawasul. Demikian pula dengan tabaruk dan  istighatsah. Argumen keharamannya juga berkenaan dengan tuduhan bahwa praktik tawasul merusak kemurnian tauhid. Jadi, setelah diharamkan, menyusul kemudian dengan tuduhan bid‘ah dhalalah dan syirik. Bagi kaum Wahabi, tawasul berarti meminta pertolongan kepada selain Khaliq. Jika pandangannya demikian, tabaruk (mengambil berkah dari orang saleh atau para wali) tidak ada dalam konsep keberagamaan Wahabi. Begitu pula dengan istighatsah, karena dalam kamus mazhab Salafi-Wahabi, majlis zikir adalah bid‘ah dhalalah. Bagaimana pendapat anda tentang hal tersebut?.\nJawab :\nSecara garis besar tawasul/wasitah bermakna perantara. Dalam praktiknya, ia banyak dilakukan ketika berdoa kepada Allah SWT. Doa itu dilakukan dengan menyertakan nama Nabi Muhamad Rasulallah SAW. atau nama pribadi seseorang yang masyhur dikenal sebagai ahli takwa. Atau dengan menyebut-nyebut amal kebajikan si pendoa. Dengan tawasul ini, diyakini bahwa peluang dikabulkannya harapan dan doa lebih besar. Salah satu hadist Nabi tentang tawashul adalah : \nAbdullah bin Umar berkata: Saya mendengar Rasulullah Saw bersabda: “Ada tiga orang sebelum kamu melakukan perjalanan, lalu mereka bernaung di sebuah gua, mereka masuk ke dalamnya, lalu ada satu buah batu besar jatuh dari atas bukit dan menutup pintu gua itu. Mereka berkata: “Tidak ada yang dapat menyelamatkan kamu dari batu besar ini kecuali kamu berdoa kepada Allah dengan amal shaleh kamu. \n\nSalah satu dari mereka bertiga berkata: “Ya Allah, saya mempunyai dua orang tua yang sudah tua renta, tidak seorang pun yang lebih saya dahulukan daripada mereka berdua, baik dalam urusan keluarga maupun harta. Suatu hari mereka meminta sesuatu kepada saya. Saya belum menyenangkan mereka hingga mereka tertidur. Maka saya siapkan susu untuk mereka berdua, saya dapati mereka berdua sudah tertidur, saya tidak ingin lebih mendahulukan yang lain; keluarga dan harta daripada mereka berdua. Maka saya terdiam, cangkir berada di tangan saya, saya menunggu mereka berdua terjaga, hingga terbit fajar. Mereka berdua pun terjaga, lalu mereka minum. Ya Allah, jika yang aku lakukan itu untuk mengharapkan kemuliaan-Mu, maka lepaskanlah kami dari dalam gua ini dan dari batu besar ini”. Maka gua itu terbuka sedikit, mereka belum bisa keluar.\n\nOrang kedua berkata: “Ya Allah, saya mempunyai sepupu perempuan, dia orang yang\npaling saya cintai, saya menginginkan dirinya. Ia menahan dirinya hingga berlalu beberapa tahun lamanya. Ia datang kepada saya, lalu saya beritakan seratus dua puluh Dinar kepadanya agar ia mau berdua-duaan dengan saya. Ia pun melakukannya, sampai saya mampu untuk melakukan sesuatu terhadapnya. Ia berkata: “Aku tidak halalkan bagimu untuk melepas cincin kecuali dengan kebenaran”. Saya merasa berat untuk melakukan sesuatu terhadapnya. Maka saya pun pergi meninggalkannya, padahal ia orang yang paling saya cintai, saya pun meninggalkan uang emas yang telah saya berikan. Ya Allah, jika yang saya lakukan itu untuk mengharapkan kemuliaan-Mu, maka lepaskanlah kami dari dalam gua ini”. Maka pintu gua itu pun terbuka sedikit, hanya saja mereka masih belum mampu keluar.\n\nOrang yang ketiga berkata: “Ya Allah, saya mempekerjakan para pekerja, saya memberikan gaji kepada mereka. Hanya saja ada seorang laki-laki yang tidak mengambil gajinya, ia pergi. Maka saya mengembangkan gajinya hingga menjadi harta yang banyak. Lalu setelah berapa lama ia datang lagi dan berkata: “Wahai hamba Allah, bayarkanlah gaji saya”. Saya katakana kepadanya: “Semua yang engkau lihat ini adalah dari gajimu; ada unta, lembu, kambing dan hamba sahaya”. Pekerja itu berkata: “Wahai hamba Allah, janganlah engkau mengejek”. Saya jawab: “Saya tidak mengejekmu”. Maka pekerja itu pun mengambil semuanya, ia membawanya, tidak meninggalkan walau sedikit pun. Ya Allah, jika yang aku lakukan itu untuk mengharapkan kemuliaan-Mu, maka lepaskanlah kami dari gua ini”. Maka batu besar itu pun bergeser (gua terbuka), lalu mereka pun pergi keluar melanjutkan perjalanan”. (HR. alBukhari dan Muslim).", "t": "Susah", "k": "A"}, {"id": "NU-4", "m": "NU", "n": 4, "q": "Persaksian terhadap jenazah yang biasa kita lihat ketika jenazah akan diantarkan ke kubur, dengan pertanyaan: “Apakah jenazah ini baik?”. Lalu dijawab: “Baik”. Apakah ada dalilnya?\nJawab :\nDisebutkan dalam Shahih al-Bukhari dan Shahih Muslim:\nDari Anas bin Malik, ia berkata: “Mereka melewati jenazah, lalu mereka memuji kebaikan jenazah itu. Rasulullah Saw bersabda: “Wajib”. Kemudian mereka melewati jenazah lain, mereka mencela, Rasulullah Saw bersabda: “Wajib”. \nUmar bin al-Khaththab berkata: “Apa yang wajib?”. \nRasulullah Saw menjawab: “Jenazah yang kamu puji baik, ia wajib masuk surga. Jenazah yang kamu cela, ia wajib masuk neraka. Kamu adalah para saksi Allah di atas bumi”. (HR. Al-Bukhari dan Muslim).\n\nAkan tetapi pujian dalam hadits ini murni dari orang yang ingin memberikan persaksian, bukan direkayasa dengan ditanya: “Apakah jenazah ini baik?”. Pertanyaan seperti ini akan membuat orang berbohong, karena tidak ada yang akan menjawab : “Tidak baik”. Bahkan jika kesaksian itu palsu, tergolong dalam dosa besar, yaitu dosa memberikan kesaksian palsu. Dalam hadits disebutkan:\n \nDari Anas ra, ia berkata, “Rasulullah Saw ditanya tentang dosa-dosa besar”. Rasulullah Saw menjawab, “Mempersekutukan Allah Swt, membunuh jiwa dan kesaksian palsu”. (HR. Al Bukhari dan Muslim).", "t": "Susah", "k": "A"}, {"id": "NU-5", "m": "NU", "n": 5, "q": "Bagaimana hukumnya memelihara jenggot dan mencukur jenggot bagi kaum laki-laki?\nJawab :\nBanyak hadits menyebutkan bahwa Rasulullah Saw memerintahkan agar membiarkan (tidak mencukur) jenggot. Diantaranya hadits tersebut adalah :\n \nMuhammad bin Minhal menceritakan kepada kami; Yazid bin Zurai’ menceritakan kepada kami; Umar bin Muhammad bin Zaid menceritakan kepada kami, dari Nafi’, dari Ibnu Umar, dari Rasulullah Saw, beliau bersabda: \n\n“Bedakanlah diri kamu dari orang-orang musyrik, biarkanlah jenggot dan rapikanlah kumis”.\n\nUlama Mazhab Syafi’i berpendapat bahwa makna tersebut hanya bersifat anjuran, bukan\nwajib, oleh sebab itu mencukur jenggot hanya dikatakan makruh. Berikut ini beberapa teks dari\nkitab-kitab ulama kalangan mazhab Syafi’i:\n \n“Makruh hukumnya mencabut jenggot pada awal tumbuhnya untuk orang yang baru tumbuh jenggot dan untuk penampilan yang bagus”.", "t": "Susah", "k": "A"}, {"id": "NU-6", "m": "NU", "n": 6, "q": "Didalam sholat subuh masyarakat nahdyin membaca do’a qunut. Pembacaan do’a qunut sendiri menjadi sebuah ihtilaf sebagian ulama’. Ada yang berpendapat pembacaan qunut sunnah dan sebaliknya bacaan qunut tidak ada tuntunan dari Nabi. Bagaimana pendapat anda terkait hal tersebut?.\nJawab :\nRasulullah Saw Membaca Doa Qunut Shubuh Hingga Meninggal Dunia.\nHadits Anas ra, “Sesungguhnya Rasulullah Saw membaca Qunut selama satu bulan, beliau melaknat mereka, kemudian meninggalkannya. Adapun doa Qunut pada shalat Shubuh, Rasulullah Saw terus membaca doa Qunut pada shalat Shubuh hingga beliau meninggal dunia”.\n\nAbu Bakar, Umar dan Utsman Membaca Doa Qunut Shubuh.\nDari al-‘Awwam bin Hamzah, ia berkata, “Saya bertanya kepada Abu ‘Utsman tentang doa Qunut pada shalat Shubuh. Ia menjawab, “Setelah ruku’.” Saya katakan, “Dari siapa?”. Ia menjawab, “Dari Abu Bakar, Umar dan Utsman”. (HR. al-Baihaqi).", "t": "Susah", "k": "A"}, {"id": "NU-7", "m": "NU", "n": 7, "q": "Dalam amaliyah NU setiap orang yang telah meninggal dunia dan telah dikuburkan akan dibacakan Talqin sebagai pengingat kepada mayyit, hal tersebut dihukumi bidah dholalah oleh sebagian kecil golongan Islam yang ada di Indonesia. Bagaimana pendapat anda mengenai hal tersebut?. \nJawab :\nMenurut Imam Syafi’i dan Imam Ahmad Ibnu Hanbal, hukum membaca Talqin bagi mayit yang sudah mukallaf setelah selesai dikubur itu hukumnya disunahkan. Orang yang membaca talqin itu duduk di arah kepala kuburan mayit, kemudian berkata kepada mayit:\n“Ya Abdullah bin Amatillah; ingatlah apa yang kamu keluar atasnya dari dunia ini: Kesaksian bahwa tidak ada Tuhan kecuali Allah, dan sesungguhnya Nabi Muhammad adalah utusan Allah, sesungguhnya surga itu benar, neraka itu benar, kebangkitan itu benar dan hari qiyamat pasti datang tidak diragukan lagi, dan sesungguhnya Allah akan membangkitkan manusia dari kubur dan sesungguhnya engkau telah ridla bahwa Allah sebagai Tuhanmu dan Islam agamamu dan Muhammad Nabimu dan Al-Qur’an panutanmu dan Ka’bah kiblatmu dan orang-orang mu’min saudaramu.” (Hadis diriwayatkan Thabrani).\n\nMenurut Imam Nawawi, walaupun hadis ini dha’if, tetapi dikuatkan oleh beberapa hadis lain yang shahih dan firman Allah;\n\nوَذَكِّرْ فَإنَّ الذِكْرى تَنْفَعُ اْلمُؤْمِنِينَ\n\n“Dan berilah peringatan sesungguhnya peringatan itu bermanfa’at bagi orang-orang yang beriman.” (QS. Az-Zariyat: 55) Selanjutnya, dapat dilihat juga dalam kitab Nailul Awthar juz. IV, sebagaiberikut;\n\nرويَ عَنْ رَاشِدِبْنِ سَعْدٍ وَضَمْرَةَ بْنِ حَبِيْبٍ وَحَكِيْمِ بْنِ عَمِيرٍ قَالُوْااِذَا سَوَى عَلَى اْلمَيِّتِ وَانْصَرَفَ النَّاسَ عَنْهُ كَانُوْا يَسْتَحِبُّوْنَ اَنْ يُقَالَ لِلْمَيِّتِ عِنْدَ قَبْرِهِ يَافُلاَنُ قُلْ لاَاِلَهَ اِلاَّ اللهُ وَاَشْهَدُ اَنْ لاَاِلَهَ اِلاَّ اللهُ ثَلاَثَ مَرَّاتٍ يَافُلاَنُ رَبِّىَ اللهُ وَدِيْنِ اْلإِسْلاَمُ وَنَبِيّىِ ُمحَمَّدٌ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ\n\n“Diriwayatkan dari Rasyid bin Sa’ad dan Dlamrah bin Habib dan Hakim bin Umair mereka berkata: Apabila telah diratakan kuburan atas mayit dan orang-orang telah pergi mereka mesunahkan untuk dikatakan kepada mayit di atas kuburnya; Yaa Fulan, katakan! Tidak ada Tuhan kecuali Allah tiga kali; Yaa Fulan, katakan! Tuhanku Allah agamaku Islam, Nabiku Muhammad SAW kemudian pergilah.”", "t": "Susah", "k": "A"}, {"id": "NU-8", "m": "NU", "n": 8, "q": "Di akhir bulan Sya’ban yang berarti akan memasuki bulan Ramadhan, ada sejumlah kebiasaan di masyarakat khususnya warga Nahdlatul Ulama (Nahdliyin). Tradisi tersebut adalah berupa melakukan ziarah ke makam orang tua, saudara, ulama dan leluhur. Istilah yang digunakan juga beragam. Ada yang menyebutnya dengan arwahan, nyekar, munggahan dll. Bagi sebagian orang, hal ini menjadi semacam kewajiban yang bila ditinggalkan serasa ada yang kurang dalam melangkahkan kaki menyongsong puasa Ramadhan. Tetapi, dilain sisi ada juga sekelompok aliran yang menganggap bidah hal tersebut. Bagaimana tanggapan anda tentang hal tersebut?.\nJawab : \nPada masa awal-awal Islam, Rasulullah SAW memang pernah melarang umat Islam berziarah ke kuburan, mengingat kondisi keimanan mereka pada saat itu yang masih lemah. Serta kondisi sosiologis masyarakat Arab masa itu yang pola pikirnya masih didominasi dengan kemusyrikan dan kepercayaan kepada para dewa dan sesembahan. Rasulullah mengkhawatirkan terjadinya kesalahpahaman ketika mereka mengunjungi kubur baik dalam berperilaku maupun dalam berdoa.\nAkan tetapi bersama berjalannya waktu, Rasulullah pun memperbolehkan berziarah kubur. Demikian keterangan Rasulullah yang bisa kita temukan dalam Sunan Turmudzi no 973 sebagai berikut:\nHadits dari Buraidah ia berkata bahwa Rasulullah bersabda: Saya pernah melarang berziarah kubur. Tapi sekarang Muhammad telah diberi izin untuk berziarah ke makam ibunya. Maka sekarang berziarahlah karena hal itu dapat mengingatkan kamu kepada akhirat.\nDemikianlah sebenarnya hukum dasar dibolehkannya ziarah kubur dengan illat (alasan) ‘tazdkiratul akhirah’ yaitu mengingatkan kita kepada akhirat. Oleh karena itu dibenarkan berziarah ke makam orang tua dan juga ke makam orang shalih dan para wali. Selama ziarah itu dapat mengingatkan kita kepada akhirat.", "t": "Susah", "k": "A"}, {"id": "NU-9", "m": "NU", "n": 9, "q": "Salah satu tradisi umat Islam di Indonesia (kaum nahdyin) adalah mendoakan orang yang telah meninggal dunia dengan membaca yaasin dan tahlil yang biasanya dilakukan umat Islam pada hari ke-7 (bahkan ada yang bersedia melakukannya selama tujuh hari berturut-turut), ke-40, ke-100, setahun, dua tahun dan hari ke-1000 dari kematian seseorang. Tradisi yang sudah turun temurun tersebut oleh sebagian kelompok Islam dihukumi bidah karena dianggap meniru ajaran hindu. Sebagai argumentasi mereaka adalah “ man tasabbaha biqoumin fahua minhum” dengan pengertian barang siapa meniru kebiayaan-kebiyasaan suatu kaum, maka orang tersebut menjadi salah satu dari golongan mereka. Tuduhan tersebut sangat profokatif dan banyak menimbulkan perpecahan diantara kaum Muslim. Bagaimana tanggapan anda menegai hal tersebut?\nJawab :\nTentu saja tuduhan yang demikian itu tidak benar. Sebab, membaca surat Yasin, berdzikir dan mendoakan orang yang telah meninggal dunia serta bersedekah yang pahalanya diniatkan untuk si mayit kapan pun boleh dilakukan. Kalau ada mau melakukannya pada hari ke-5, ke-7, ke-20, ke-50, ke-1000, tiap tahun atau bahkan setiap hari sekalipun diperbolehkan. Untuk melaksanakan amal shalih semacam itu kita diberi kebebasan melakukan amal shalih tertentu.  Untuk memperkuat argumentasi tersebut :\n\n  عَنِ ‏ابْنِ عُمَرَ ‏رَضِيَ اللهُ عَنْهُمَا ‏قَالَ: ‏كَانَ النَّبِيُّ ‏صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ ‏ ‏يَأْتِي ‏ ‏مَسْجِدَ قُبَاءٍ ‏‏كُلَّ سَبْتٍ، مَاشِيًا وَرَاكِبًا، وَكَانَ ‏عَبْدُ اللهِ بْنُ عُمَرَ ‏رَضِيَ اللهُ عَنْهُمَا ‏ ‏يَفْعَلُهُهُ\n\nArtinya: “Dari Ibnu Umar ra berkata, “Nabi shallallahu ‘alaihi wa sallam selalu mendatangi Masjid Quba setiap hari Sabtu, baik dengan berjalan kaki maupun berkendaraan, sedangkan Abdullah bin Umar ra pun selalu melakukannya.” (HR Imam Bukhari dan Imam Muslim).\n\nDalam menjelaskan hadits ini, al-Hafidzh Ibnu Hajar al-Asqalani berkata:\n\nالْحَدِيْثُ عَلَى الْخْتِلاَفِ طُرُقِهِ دَلاَلَةٌُ عَلَى جَوَازِ تَخْصِيْصِ بَعْضِ اْلأَيَّامِ بِبَعْضِ اْلأَعْمَالِ الصَّالِحَةِ وَالْمُدَاوَمَةِ عَلَى  ذَلِكَ\n\nArtinya: “Hadits ini dengan sekian jalur yang berbeda menunjukkan diperbolehkannya menentukan sebagian hari-hari tertentu untuk melakukan sebuah amal shalih dan dilakukan secara terus menerus.”  (Fath al-Bari, 3/69).\n\nPernyataan al-Hafizh Ibnu Hajar al-Asqalani ini menjelaskan kepada kita bahwa kita diizinkan untuk memilih waktu-waktu tertentu untuk mengamalkan amal shalih tertentu dan dilakukan secara terus menerus. Dengan kata lain, kita boleh menentukan, misalnya membaca surat Yasin setiap malam Jumat, membaca surat ar-Rahman setiap malam Senin, bersedekah setiap pagi di hari Jumat, dan seterusnya. Kita pun boleh mengucapkan doa-doa tertentu pada hari-hari tertentu. Termasuk di dalamnya Anda boleh membaca surat Yasin dan dzikir tahlil serta doa pada hari ke-7, ke-40 dan seterusnya dari kematian seseorang. Penentuan waktu-waktu yang demikian itu sesungguhnya telah tercakup dalam keumuman makna.\n\nDemikian pula dengan waktu pelaksanaan tradisi kenduri arwah/tahlilan. Umat Islam, khususnya di tanah Jawa, biasanya melakukannya pada hari ke-7, ke-40, ke-100, setahun, dua tahun dan ke-1000 dari kematian seseorang.\n\nBerdasarkan hadits di atas dan penjelasan yang disampaikan oleh alHazh Ibnu Hajar, maka hal itu diperbolehkan. Yang disebut boleh (mubah) adalah sesuatu yang jika dikerjakan tidak mendapat pahala dan tidak pula berdosa. Demikian pula jika ditinggalkan, tidak berpahala dan tidak berdosa.", "t": "Susah", "k": "A"}, {"id": "NU-10", "m": "NU", "n": 10, "q": "Pada setiap bulan Maulid dirayakan kelahiran Nabi Muhammad SAW yang oleh sebagian kaum muslimin menghukumi perayaan tersebut sebagai suatu yang baru dan tidak ada tuntunan dari Nabi, tidak dilaksanakan oleh sahabat, tabiin, sehingga dihukumi bidah. Bagaimana tanggapan anda?.\nJawab : \nMenurut catatan Sayyid al-Bakri, pelopor pertama kegiatan maulid adalah al-Mudzhaffar Abu Sa`id, seorang raja di daerah Irbil, Baghdad. Peringatan maulid pada saat itu dilakukan oleh masyarakat dari berbagai kalangan dengan berkumpul di suatu tempat. Mereka bersama membaca sejumlah ayat Al-Qur’an, membaca sejarah ringkas kehidupan dan perjuangan Rasulullah, melantunkan shalawat dan syair-syair kepada Rasulullah, serta diisi pula ceramah agama. [al-Bakri bin Muhammad Syatho, I`anah at-Thalibin, Juz II, hal 364] Pendapat para ulama’ tentang Maulid Nabi.\nA.\tSyeikh Taqiyudin Ibnu Taymiah\nBeliau berkata: “mengagungkan maulidnabi adalah menganndung pahala yang sangatagung, karena hal itu adalah wujud ta’dzim kepadaRasulullah.”\nB.\tImam Jalaluddin as-Suyuthi\nBeliau berkata: “perayaan maulid nabiadalah bid’ah hasanah. Orang yang merayakannya\ndiberi pahala olehnya.”Imam Suyuthi juga berkata: “disunnahkan bagi kita untuk menampakkan rasasyukur atas lahirnya Rasulullah. Dan juga beliau berkata: tidak ada rumah atau masjidatau apa saja yang dibacakan maulid di dalamnya kecuali mendapatkan rahmat dari allah.", "t": "Susah", "k": "A"}, {"id": "NU-11", "m": "NU", "n": 11, "q": "Sebelum mengerjakan shalat maktubah, seringkali kita mendengar pujian sholawatan yang biasanya dikumandangkan setelah adzan dan sebelum iqamah. Tradisi pujian ini mengakar kuat di tengah masyarakat Nusantara selama puluhan tahun. Namun warisan tradisi leluhur tersebut, keberadaanya mulai terpinggirkan, bahkan kerap kali dituding sebagai amaliah tanpa berdalil. Amaliah yang tidak pernah diajarkan oleh Rasulullah SAW dan para sahabat.Lalu bagaiamanakah hukum sebenarnya tentang pujian sebelum sholat maktubah tersebut?. Benarkah sebagai amaliah yang menyalahi sunnah, dan dituding bid’ah?.\nJawab :\nMembaca sholawat kepadaNabi setelah adzan adalah sunnah hukumnya, dan tidak ada perbedaan pendapat di dalamnya. Hal ini berdasarkan hadist yang diriwayatkan Imam Muslim (hadist no.384), dan Abu Dawud (hadis no.523). yaitu. Ketika kalian mendengarkan adzan maka jawablah, kemudian setelah itu bacalah sholawat kepadaku. (idza sami’tum nida’a faquluu matsalu ma yaqulu tsumma shollu ‘alaiya).\nPendapat di atas ini juga didukung oleh pendapat Ibnu Hajar al-Haitsami, , dalam kitab Fatawa Al- Fiqhiyyah Al-Kubra mengatakan: “Para muadzin sungguh telah melakukan pembaharuan, yakni melantunkan bacaan shalawat dan salam kepada nabi setelah adzan shalat fardlu, kecuali di waktu subuh dan di waktu hari jum’at, mereka melantunkan shalawat tersebut sebelum adzan, dan kecuali pada waktu maghrib, mereka tidak melakukannya (pujian shalawat) karena waktu yang terbatas”.", "t": "Susah", "k": "A"}, {"id": "NU-12", "m": "NU", "n": 12, "q": "Apa hukumnya melaksanakan dzikir setelah sholat maktubah secara berjamaah dan dengan sura keras yang sering dilakukan oleh warga nahdyin?\nJawab:\nBerdzikir dengan suara lantang merupakan praktik yang sudah dilakukan di periode kenabian, bukan sesuatu yang baru dan dianggap bid’ah, sebagaimana tuduhan beberapa kelompok Islam lain terhadap amalan NU. Polemik berdzikir dengan suara lantang dan berjamaah sudah lama diperbincangkan, sehingga perlu adanya pembahasan untuk menguatkan kembali praktik keagamaan yang ditradisikan oleh masyarakat Nahdlatul Ulama. Argumen kuat pengamalan dzikir dengan suara lantang dan berjamaah adalah sebuah riwayat yang disampaikan imam al-Bukhari dalam kitab Shahih al-Bukhari sebagai berikut: \n \nحَدَّثَنَا إِسْحَاقُ بْنُ نَصْرٍ قَالَ: حَدَّثَنَا عَبْدُ الرَّزَّاقِ قَالَ: أَخْبَرَنَا ابْنُ جُرَيْجٍ قَالَ: أَخْبَرَنِي عَمْرٌو: أَنَّ أَبَا مَعْبَدٍ، مَوْلَى ابْنِ عَبَّاسٍ أَخْبَرَهُ: أَنَ ابْنَ عَبَّاسٍ رَضِيَ اللهُ عَنْهُمَا أَخْبَرَهُ: أَنَّ رَفْعَ الصَّوْتِ بِالذِّكْرِ حِينَ يَنْصَرِفُ النَّاسُ مِنَ الْمَكْتُوبَةِ، كَانَ عَلَى عَهْدِ النَّبِيِّ صَلَّى اللهُ عَلَيْهِ وَسَلَّم
