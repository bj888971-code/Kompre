tu walaupun salah; kelima, menarik simpati orang untuk mengerjakan perbuatan-perbuatan baik, termasuk mengajarkan anak-anak tentang agama", "t": "Susah", "k": "A"}, {"id": "HADIS-32", "m": "HADIS", "n": 32, "q": "Bagaimana cara membedakan hadits yang asli dengan yang palsu?\nJawaban:\nPertama, matan (teks) hadis tak sesuai dengan kefasihan bahasa, kebaikan, kelayakan, dan kesopanan bahasa Nabi SAW. Kedua, bertentangan dengan Alquran, akal, dan kenyataan. Ketiga, rawinya dikenal sebagai pendusta, Keempat, pengakuan sendiri dari pembuat hadis palsu tersebut.", "t": "Susah", "k": "A"}, {"id": "HADIS-33", "m": "HADIS", "n": 33, "q": "Seperti apa contoh hadits maudhu?\nJawaban:\nHadits Maudhu Tentang Mencari Rezeki:Inalloha yuhibbu an yaro 'abdahu ta'iban fi tholabil halal.\" Artinya: “Sesungguhnya Allah suka melihat hamba-Nya yang lelah dalam mencari rezeki yang halal.” Riwayat hadist tersebut diketahui sebagai hadist maudhu", "t": "Susah", "k": "A"}, {"id": "HADIS-34", "m": "HADIS", "n": 34, "q": "Mengapa hadits tidak dibukukan sejak masa Rasulullah SAW?\nJawaban:\nPertama, pada mulanya mereka memang dilarang untuk melakukan penulisan hadits. Karena adanya kekhawatiran tercampurnya sebagian hadis dengan Alquran, sebagaimana diinformasikan secara valid oleh Imam Muslim dalam Sahih-nya.\"\nKedua, karena kekuatan hafalan dan kecerdasan akal mereka.", "t": "Susah", "k": "A"}, {"id": "HADIS-35", "m": "HADIS", "n": 35, "q": "Siapa yang menurunkan hadits?\nJawaban:Tidak hanya Al-Quran, Allah juga menurunkan firman-firman nya kepada Nabi Muhammad yang disebut dengan hadits.", "t": "Mudah", "k": "A"}, {"id": "HADIS-36", "m": "HADIS", "n": 36, "q": "Siapa pemalsu hadits?\nJawaban:\nAbdul Karim Bin Abu Al-Auja merupakan di antara orang-orang zindik san pemalsu hadits yang paling terkenal.", "t": "Mudah", "k": "A"}, {"id": "HADIS-37", "m": "HADIS", "n": 37, "q": "Apa yang terjadi jika tidak ada hadis?\nJawaban:\nAkan terjadi kesalah pahaman,Tidak bisa mengamalkan Sunnah Nabi Muhammad Saw", "t": "Mudah", "k": "A"}, {"id": "HADIS-38", "m": "HADIS", "n": 38, "q": "Kapan hadis dibukukan pertama kali?\nJawaban: \nsekitar abad ke-2 Hijriah, atas perintah Khalifah Umar bin Abdul Aziz, untuk mencegah penyebaran hadis palsu dan sebagai langkah konservasi ilmu.", "t": "Mudah", "k": "A"}, {"id": "HADIS-39", "m": "HADIS", "n": 39, "q": "Apa hukum mempelajari ilmu hadits?\nJawaban:\nHukum mempelajari Ilmu Hadits adalah fardlu ain jika hanya ada satu orang yang berusaha mempelajarinya. Namun, jika sudah banyak orang yang mempelajari disiplin ilmu ini, maka hukumnya adalah fardu kifayah.", "t": "Mudah", "k": "A"}, {"id": "HADIS-40", "m": "HADIS", "n": 40, "q": "Apa fungsi dari hadits Nabi?\nJawaban:\nSalah satu fungsi hadis yang paling utama adalah memperjelas isi di dalam Al-Qur'an. Hadis berfungsi untuk memperjelas isi Al-Qur'an, agar umat Islam lebih mudah memahami dan menjalankan segala perintah Allah SWT", "t": "Mudah", "k": "A"}, {"id": "HADIS-41", "m": "HADIS", "n": 41, "q": "Apa contoh hadis qudsi?\nJawaban:\n“Dari Abu Hurairah radhiallahu'anhu ia berkata bahwa Rasulullah shallallahu'alaihi wa sallam bersabda, Allah Ta'ala berfirman, “Aku mengikuti sangkaan hamba-Ku terhadap-Ku. Dan Aku ada bersamanya jika ia senantiasa ingat Aku. Jika ia ingat Aku sendirian, maka Aku pun akan ingat ia sendirian", "t": "Mudah", "k": "A"}, {"id": "HADIS-42", "m": "HADIS", "n": 42, "q": "Apakah hadis Qudsi termasuk wahyu?\nJawaban:\n“Hadis Qudsi adalah wahyu yang di turunkan kepada Nabi Muhammad dengan tanpa perantara malaikat melainkan dengan ilham atau mimpi", "t": "Mudah", "k": "A"}, {"id": "HADIS-43", "m": "HADIS", "n": 43, "q": "Apakah hadis termasuk dalil?\nJawaban:\nDalam Islam, dalil dapat dibagi menjadi dua, yaitu dalil naqli yang adalah Al-Quran dan hadis Nabi dan dalil aqli yang adalah pemikiran ulama.", "t": "Mudah", "k": "A"}, {"id": "HADIS-44", "m": "HADIS", "n": 44, "q": "Apa persamaan antara Al-Quran dan hadis?\nJawaban:\nDari pengertian Al-Quran dan Hadis Qudsi di atas kita bisa menyebutkan bahwa PERSAMAAN keduanya adalah sama-sama wahyu atau firman dari Allah SWT", "t": "Mudah", "k": "A"}, {"id": "HADIS-45", "m": "HADIS", "n": 45, "q": "Apakah hukum menggunakan hadits sebagai landasan hukum?\nJawaban:\nJadi, Hukum menggunakan hadits sebagai landasan hukum adalah Wajib.", "t": "Mudah", "k": "A"}, {"id": "HADIS-46", "m": "HADIS", "n": 46, "q": "Apa perbedaan antara Alquran dan hadits?\nJawaban:\nAl-Qur'an adalah kalam Allah SWT yang telah diturunkan kepada Rasulullah SAW dengan berangsur-angsur melalui perantara Malaikat Jibril. Sementara itu, hadits adalah semua bentuk perbuatan, perkataan, ataupun persetujuan dari Rasulullah SAW", "t": "Mudah", "k": "A"}, {"id": "HADIS-47", "m": "HADIS", "n": 47, "q": "Apa yang terjadi jika hadits tidak ada sistem sanadnya?\nJawaban:\nSekiranya sanad hadis tidak ada, niscaya siapa saja akan bebas menyatakan apa yang dikehendakinya. Ini berarti bahwa sanad hadis merupakan bagian penting dari riwayat hadis. Keberadaan suatu hadis ditentukan oleh keberadaan dan kualitas sanadnya", "t": "Mudah", "k": "A"}, {"id": "HADIS-48", "m": "HADIS", "n": 48, "q": "Apa syarat seorang perawi hadits?\nJawaban:\nSeorang rawi yang adil harus memiliki karakteristik moral baik, muslim, telah baligh, berakal sehat, terbebas dari kefasikan dan hal – hal yang menyebabkan harga dirinya jatuh dai ia meriwayatkan hadits dalam keadaan sadar", "t": "Mudah", "k": "A"}, {"id": "HADIS-49", "m": "HADIS", "n": 49, "q": "Bagaimana cara menentukan hadis itu dapat diterima?\nJawaban:\nMenurut Ta'rif Muhadditsin, suatu hadis bisa dikatakan shahih apabila telah memenuhi lima syarat penting berikut:\n1. Sanadnya Bersambung\n2. Periwayat Bersifat Adil\n3. Perawi Bersifat Dhabit\n4. Tidak Tanggal atau Syadz\n5. Terhindar dari 'Illat", "t": "Susah", "k": "A"}, {"id": "HADIS-50", "m": "HADIS", "n": 50, "q": "Bagaimana cara takhrij hadis pada masa sekarang?\nJawaban:\nSedangkan takhrij hadits yang sedang dikembangkan di masa sekarang identik dengan penelitian kepustakaan, yaitu mencari hadits dari berbagai kitab hadits. Setelah itu, dilanjutkan dengan meneliti kualitas keasliannya berdasarkan isi hadits di dalam kitab tersebut.", "t": "Susah", "k": "A"}, {"id": "HADIS-51", "m": "HADIS", "n": 51, "q": "Kitab hadis primer apa saja?\nJawaban:\nAda Beberapa hadis yang dapat dikategorikan dalam hadis primer yaitu Pemikiran Imam al-Bukhari dalam kitab sahih al-Bukhari, Pemikiran Imam Muslim bdalam kitab sahih Muslim, Pemikiran Abu Dawud dalam kitab sunan Abu Dawud, Pemikiran al-Tirmidzi dalam kitab sunan al-Turmudzi, Pemikiran Al-Nasa'i dalam sunan al-Nasa'i", "t": "Mudah", "k": "A"}, {"id": "HADIS-52", "m": "HADIS", "n": 52, "q": "Apa itu hadist lemah?\nJawaban:\nHadits lemah atau Hadits Dha'if (bahasa Arab: حديث ضعيف) adalah hadits yang tidak memenuhi persyaratan hadits shahih dan hasan. Hadits dhaif tidak sama dengan hadits maudhu', atau palsu.", "t": "Mudah", "k": "A"}, {"id": "HADIS-53", "m": "HADIS", "n": 53, "q": "Apa itu hadits mutawatir?\nJawaban:\nHadis Mutawatir adalah hadis yang diriwayatkan oleh sejumlah orang pada setiap tingkat sanadnya, yang menurut tradisi mustahil mereka berse- pakat untuk berdusta dan karena itu diyakini kebenarannya.", "t": "Mudah", "k": "A"}, {"id": "HADIS-54", "m": "HADIS", "n": 54, "q": "Hadits yang terputus sanadnya apa saja?\nJawaban:\nSanad yang terputus terbagi menjadi empat: mursal, mu'alaq, mu'dhol dan munqothi'", "t": "Mudah", "k": "A"}, {"id": "HADIS-55", "m": "HADIS", "n": 55, "q": "Siapa yang berhak menilai status sebuah hadist?\nJawaban:\nPenilaian hadis hanya dilakukan ulama yang berkompeten.", "t": "Mudah", "k": "A"}, {"id": "HADIS-56", "m": "HADIS", "n": 56, "q": "Apa ancaman bagi pembuat hadis maudhu?\nJawaban:\nKarena ancamannya berat, Rasulullah Shallallahu 'Alaihi wa Sallam mengatakan: “Siapa yang berdusta atas namaku dengan sengaja, maka hendaklah ia mempersiapkan tempat duduknya di neraka.", "t": "Mudah", "k": "A"}, {"id": "HADIS-57", "m": "HADIS", "n": 57, "q": "Sebutkan macam-macam hadis da’if dari segi putusnya sanad!\nJawaban: \nMursal, Mu’ḍal, Mu’allaq, Mudallas, Munqaṭi'.", "t": "Mudah", "k": "A"}, {"id": "HADIS-58", "m": "HADIS", "n": 58, "q": "Jelaskan kelebihan sahih muslim dibandingkan dengan sahih Bukhari! \nJawaban: \nSistimatikanya yang tidak memotong hadis dan tidak mengulang sanad", "t": "Mudah", "k": "A"}, {"id": "HADIS-59", "m": "HADIS", "n": 59, "q": "Sebutkan sanad hadis yang paling ḍa’if atau yang disebut dengan awha alasanid!\nJawaban: \nMuhammad bin Marwan dari al-Kallabi dari Abi Shalih dari Ibnu Abbas", "t": "Mudah", "k": "A"}, {"id": "HADIS-60", "m": "HADIS", "n": 60, "q": "Imam Tirmizi mengungkapkan hadis “hasan sahih ”. Jelaskan maksudnya!..... \nJawaban: \njika sanadnya 1 ada yang mengatakan sahih, ada yang mengatakan hasan. Jika sanadnya lebih dari satu asa sanad yang sahih ada sanad yang hasan", "t": "Mudah", "k": "A"}, {"id": "HADIS-61", "m": "HADIS", "n": 61, "q": "Jelaskan periwayatan hadits dengan lafal asli dan dengan maknanya saja!\nJawaban: \nDengan lafaz asli, yakni menurut lafaz yang mereka terima dari Nabi SAW yang mereka hapal benar lafaz dari Nabi. Dengan maknanya saja; yakni para sahabat meriwayatan maknanya karena tidak hapal lafazh asli dari Nabi", "t": "Mudah", "k": "A"}, {"id": "HADIS-62", "m": "HADIS", "n": 62, "q": "Apa fungsi hadits pada masa awal perkembangan Islam?\nJawaban: \nBayan al-taqrir, bayan al-tafshil, bayan al-ba’ts, bayan al-tasyri", "t": "Mudah", "k": "A"}, {"id": "HADIS-63", "m": "HADIS", "n": 63, "q": "Mengapa pada masa Rasulullah Saw. hadits belum ditulis?\nJawaban: \nBelum banyak para sahabat yang cakap dalam baca tulis dan agar hadits tidak bercampur dengan wahyu Al-Quran", "t": "Mudah", "k": "A"}, {"id": "HADIS-64", "m": "HADIS", "n": 64, "q": "Apa penyebab munculnya hadits-hadits palsu?\nJawaban: \nTerpecahnya umat Islam tersebut, memacu orang-orang yang tidak bertanggung jawab untuk mendatangkan keterangan-keterangan yang berasal dari Rasulullah SAW. untuk mendukung golongan mereka", "t": "Mudah", "k": "A"}, {"id": "HADIS-65", "m": "HADIS", "n": 65, "q": "Sebutkan ulama-ulama yang menyusun kitab induk hadits sahih al-kutub as-sittah!\nJawaban: \nShahih Al- Bukhari, Shahih Muslirn, Sunan Abu Dawud, Sunan AtTirmidzi,dan Sunan An- Nasa'i", "t": "Mudah", "k": "A"}, {"id": "HADIS-66", "m": "HADIS", "n": 66, "q": "Jelaskan dengan tepat apa saja nama-nama Al Qur’an…\nJawaban: \nQur’an adalah yang dibaca atau bacaan,\nAl-Kitab adalah tulisan atau yang ditulis,\nAl-Furqan  adalah yang membedakan yang hak dan yang batil,\nAz-Zikru adalah yang memberi peringatan kepada manusia,\nAt-Tanzil adalah yang diturunkan oleh Allah SWT kepada Nabi Muhammad", "t": "Susah", "k": "A"}, {"id": "HADIS-67", "m": "HADIS", "n": 67, "q": "Nabi saw pernah mengajarkan do’a yang sangat indah dan dapat memotivasi kita untuk memiliki etos kerja yang tinggi, yaitu..........\nJawab: اللهُمَّ اِنِّى اَعُوْذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ وَالْجُبْنِ وَالْهَرمِ وَالْبُخْلِ وَاَعُوْذُ بِكَ مِنْ عَذَابِ الْقَبْرِ وَمِنْ فِتْنَةِ الْمَحْيَا وَالْمَمَاتِ", "t": "Susah", "k": "A"}, {"id": "HADIS-68", "m": "HADIS", "n": 68, "q": "Sebutkan delapan metode penerimaan dan periwayatan hadits !\nJawab:\n-Metode sama’ \n-Metode qiraah \n-Metode ijazah  \n-Metode munawalah  \n-Metode mukatabah  \n-Metode I’lam \n-Metode washiyah-Metode wijadah", "t": "Mudah", "k": "A"}, {"id": "HADIS-69", "m": "HADIS", "n": 69, "q": "Apa yang dimaksud dengan bayan tasyri’ dan berikan contohnya !\nJawab: \n3 (tiga) Bayan tasyri’ adalah penjelasan hadits yang berupa penetapan hukum atau aturan syari’ah yang tidak didapati nashnya didalam al-Qur’an. Contohnya : hukum zakat fitrah", "t": "Mudah", "k": "A"}, {"id": "HADIS-70", "m": "HADIS", "n": 70, "q": "Sebutkan contoh dari kitab Jami’ !\nJawab: Jami Shahih Bukhari dan Jami’ Shahih Muslim", "t": "Mudah", "k": "A"}, {"id": "HADIS-71", "m": "HADIS", "n": 71, "q": "Siapakah penemu ilmu hadis?\nJawab:\nKhalifah Umayyah, Umar bin Abdul Aziz (alias Umar II, yang memerintah dari tahun 717-   720 M) juga memulai upaya untuk mengumpulkan semua hadis. Mengajarkan dan mengumpulkan hadis merupakan bagian dari rencananya untuk memperbarui moral masyarakat Muslim.", "t": "Mudah", "k": "A"}, {"id": "HADIS-72", "m": "HADIS", "n": 72, "q": "Apa perbedaan ilmu hadits, riwayah, dan dirayah?\nJawab:\nIlmu hadis riwayah ibarat al-Qur'an, sementara ilmu hadis dirayah ibarat penafsiran terhadapnya, tidak bisa memahami al-Qur'an tanpa mengetahui makna atau penafsirannya", "t": "Mudah", "k": "A"}, {"id": "HADIS-73", "m": "HADIS", "n": 73, "q": "Hadis berasal dari siapa?\nJawab:\nbersumber kepada Nabi saw yang bersifat normatif sehingga hal-hal yang berasal dari Nabi saw yang sifatnya faktual ansich dan historis belaka bukan hadis. Oleh karena itu definisi hadis menurut ahli-ahli usul fikih adalah perkataan, perbuatan atau persetujuan diam-diam Nabi saw", "t": "Mudah", "k": "A"}, {"id": "HADIS-74", "m": "HADIS", "n": 74, "q": "sebutkan isi pokok ajaran dalam kitab suci al-qur’an\nJawab: \nIsi kandungan Al Quran antara lain tentang pokok-pokok atau dasar-dasar ajaran Islam yang berkenaan dengan masalah ketauhidan dan akidah, ibadah, akhlak, hukum, dan sains atau ilmu pengetahuan yang dibutuhkan manusia dalam kehidupannya", "t": "Mudah", "k": "A"}, {"id": "HADIS-75", "m": "HADIS", "n": 75, "q": "jelaskan perbedaan antara al-qur’an dan hadis\nJawab: \nAl-Quran sendiri harus dipegang ketika kita dalam keadaan suci dari hadas kecil atau hadas besar, sedangkan hadits boleh dibaca walaupun kita tidak sedang dalam keadaan suci. Ayat-Ayat Al-Quran adalah ayat yang harus dibaca ketika umat islam melaksanakan sholat, sedangkan hadits tidak boleh dibaca ketika sholat.", "t": "Mudah", "k": "A"}, {"id": "HADIS-76", "m": "HADIS", "n": 76, "q": "Apa yang dimaksud sunnah qauliyah menurut istilah....\nJawab: \nSunnah qauliyah adalah ucapan lisan dari Nabi Muhammad SAW. Yang didengar dan dinukilkan oleh sahabatnya, namun yang diucapkan Nabi itu bukan wahyu Alquran. Alquran juga lahir dari lisan Nabi yang juga didengar oleh sahabat dan disiarkannya kepada orang lain sehingga kemudian diketahui orang banyak.", "t": "Mudah", "k": "A"}, {"id": "HADIS-77", "m": "HADIS", "n": 77, "q": "apa pengertian sunnah fi’liyah secara istilah\nJawab: \nSunnah fi'liyah adalah perbuatan Nabi Muhammad SAW yang dilihat, diketahui, dan disampaikan oleh sahabat kepada orang lain. Perbuatan ini bisa berupa ibadah atau muamalah, dan bisa dilakukan sekali atau sering.", "t": "Mudah", "k": "A"}, {"id": "HADIS-78", "m": "HADIS", "n": 78, "q": "jelaskan pengertian ibadah\nJawab: \nIbadah adalah perilaku yang dilakukan untuk mendekatkan diri kepada Tuhan atau Allah, dengan niat tulus dan sesuai ajaran-Nya. Ibadah dapat dilakukan dengan hati, lisan, dan anggota badan.", "t": "Mudah", "k": "A"}, {"id": "HADIS-79", "m": "HADIS", "n": 79, "q": "apa yang  dimaksud hadist qorib\nJawab: \nHadits gharib adalah hadis yang diriwayatkan oleh satu perawi atau jalur perawi, baik di semua tingkatan sanad atau sebagian tingkatan sanad. Hadits gharib termasuk dalam pembagian hadits ahad, yaitu hadits yang diriwayatkan oleh sekelompok orang tetapi tidak mencapai tingkatan mutawatir", "t": "Mudah", "k": "A"}, {"id": "HADIS-80", "m": "HADIS", "n": 80, "q": "sebutkan syarat yang harus dipenuhi supaya hadist suatu hadist dapat dikategorikan sahih\nJawab: \nSyarat-syarat yang harus dipenuhi agar hadits dapat dikategorikan sahih adalah: Sanadnya bersambung, Diriwayatkan oleh perawi yang adil dan dhabit, Tidak terdapat kejanggalan (syadz), Tidak terdapat cacat ('illat), Ada mutaba'ah dan syawahid ketika dibutuhkan", "t": "Mudah", "k": "A"}, {"id": "HADIS-81", "m": "HADIS", "n": 81, "q": "sebutkan unsur-unsur dalam definisi al-qur’an\nJawab: \nUnsur-unsur dalam definisi Al-Qur'an adalah:,Al-Qur'an adalah kalam Allah yang mengandung kemukjizatan. ,Al-Qur'an diturunkan kepada Nabi Muhammad SAW. ,Al-Qur'an ditulis dalam mushaf-mushaf. ,Al-Qur'an disampaikan dengan jalan mutawatir. ,Membaca Al-Qur'an bernilai ibadah. ,Al-Qur'an merupakan petunjuk bagi umat Islam dalam hidup dan kehidupannya. ,Al-Qur'an senantiasa dipelihara dari kesalahan dan pemalsuan. ,Tidak ada seorang pun yang mampu membuat hal yang serupa dengan Al-Qur'an walau hanya satu surah.\n Secara etimologi, Al-Qur'an berasal dari bahasa Arab yang berarti \"bacaan\" atau \"sesuatu yang dibaca berulang-ulang\". Kata Al-Qur'an adalah bentuk kata benda (masdar) dari kata kerja qara'a yang artinya membaca", "t": "Susah", "k": "A"}, {"id": "HADIS-82", "m": "HADIS", "n": 82, "q": "jelaskan,bagaimana cara  kita  menghormati orang tua guru dan seseorang yang lebih sepuh dari kita?\nJawab: \nMenghormati orang tua,Melaksanakan perintah dan nasihat orang tua ,Berkata sopan dan halus ,Membantu pekerjaan orang tua ,Membahagiakan orang tua ,Menjaga nama baik orang tua", "t": "Mudah", "k": "A"}, {"id": "HADIS-83", "m": "HADIS", "n": 83, "q": "bagaimana analisis terhadap Q.S al-isra’ :23-24?jelaskan!\nJawab: \nSurat Al-Isra ayat 23-24 menjelaskan tentang kewajiban berbakti kepada orang tua, khususnya dalam hal bertutur kata dan bersikap", "t": "Mudah", "k": "A"}, {"id": "HADIS-84", "m": "HADIS", "n": 84, "q": "sebutkan hal-hal yang menjadi pintu untuk masuk kepada zina!\nJawab: \nBeberapa hal yang dapat menjadi pintu untuk masuk kepada zina adalah:\nPergaulan bebas yang tidak terikat norma dan agama ,\nMendekati tempat yang dapat menimbulkan nafsu syahwat ,\nMelihat aurat dan menghayalkan aurat tersebut \n,Melihat film atau tayangan media yang mengundang syahwat ,Membaca bacaan yang mengandung unsur-unsur yang dapat menimbulkan nafsu birahi \n,Berduaan dengan lawan jenis di tempat sepi. \nZina adalah hubungan kelamin antara laki-laki dan perempuan yang tidak terikat dalam hubungan perkawinan", "t": "Susah", "k": "A"}, {"id": "HADIS-85", "m": "HADIS", "n": 85, "q": "sebutkan hukum mencari ilmu sebagaimana dijelaskan dalam Riwayat ibnu majah dari anas bin malik\nJawab: \nHukum mencari ilmu sebagaimana dijelaskan dalam riwayat Ibnu Majah dari Anas bin Malik adalah wajib bagi setiap muslim:\n1. Menuntut ilmu itu wajib bagi setiap muslim\" (HR. Ibnu Majah no. 224, dari sahabat Anas bin Malik radhiyallahu 'anhu)\n2. Menuntut ilmu adalah kewajiban bagi setiap individu muslim\"", "t": "Mudah", "k": "A"}, {"id": "HADIS-86", "m": "HADIS", "n": 86, "q": "Jelaskan pengertian hadis kudsi!\nJawab: \nHadits Qudsi adalah hadis yang maknanya berasal dari Allah SWT, tetapi redaksinya disampaikan oleh Rasulullah SAW. Hadits Qudsi disebut demikian karena dinisbahkan pada kata Quddus/Qudsi, yang artinya suci.", "t": "Mudah", "k": "A"}, {"id": "HADIS-87", "m": "HADIS", "n": 87, "q": "Rasulallah pernah melihat Khalid memakan daging Dhab (biawak padang pasir), namun beliau tidak melarang juga tidak ikut memakannya. Hadits diatas merupakan contoh dari ….\nJawab: \nSunnah taqririyah", "t": "Mudah", "k": "B"}, {"id": "HADIS-88", "m": "HADIS", "n": 88, "q": "Jelaskan periwayatan hadits dengan lafal asli dan dengan maknanya saja!\nJawaban : \nDengan lafaz asli, yakni menurut lafaz yang mereka terima dari Nabi SAW yang mereka hapal benar lafaz dari Nabi. Dengan maknanya saja; yakni para sahabat meriwayatan maknanya karena tidak hapal lafazh asli dari Nabi", "t": "Mudah", "k": "B"}, {"id": "HADIS-89", "m": "HADIS", "n": 89, "q": "Apa fungsi hadits pada masa awal perkembangan Islam?\nJawaban :  \nBayan al-taqrir, bayan al-tafshil, bayan al-ba’ts, bayan al-tasyri", "t": "Mudah", "k": "B"}, {"id": "HADIS-90", "m": "HADIS", "n": 90, "q": "Mengapa pada masa Rasulullah Saw. hadits belum ditulis?\nJawaban : \nBelum banyak para sahabat yang cakap dalam baca tulis dan agar hadits tidak bercampur dengan wahyu Al-Quran", "t": "Mudah", "k": "B"}, {"id": "HADIS-91", "m": "HADIS", "n": 91, "q": "Apa penyebab munculnya hadits-hadits palsu?\nJawaban : \nTerpecahnya umat Islam tersebut, memacu orang-orang yang tidak bertanggung jawab untuk mendatangkan keterangan-keterangan yang berasal dari Rasulullah SAW. untuk mendukung golongan mereka.", "t": "Mudah", "k": "B"}, {"id": "HADIS-92", "m": "HADIS", "n": 92, "q": "Sebutkan ulama-ulama yang menyusun kitab induk hadits sahih al-kutub as-sittah!\nJawaban : \nShahih Al- Bukhari, Shahih Muslirn, Sunan Abu Dawud, Sunan AtTirmidzi,dan Sunan An- Nasa'i", "t": "Mudah", "k": "B"}, {"id": "HADIS-93", "m": "HADIS", "n": 93, "q": "Jelaskan fungsi terhadap al-qur’an dan berikan contoh-contohnya\nJawab: \nAl-Qur'an memiliki beberapa fungsi, di antaranya:\n• Sebagai sumber ajaran dan hukum Islam yang utama \n• Petunjuk hidup manusia ke jalan yang lurus \n• Sumber rujukan hukum yang mengatur hubungan manusia dengan Allah SWT, sesama, dan alam sekitar \n• Pengontrol dan pengoreksi terhadap ajaran-ajaran masa lalu, yaitu Injil, Zabur, dan Taurat \n• Peringatan dan pelajaran bagi umat manusia \nContoh fungsi Al-Qur'an:\n• Sebagai petunjuk dalam berbagai persoalan, mulai dari akidah, syariah, hingga akhlak\n• Al-Qur'an memuat berbagai kisah para nabi atau rasul beserta umat terdahulu yang dapat dijadikan pelajaran", "t": "Susah", "k": "B"}, {"id": "HADIS-94", "m": "HADIS", "n": 94, "q": "Mengapa setiap muslim dianjurkan menuntut ilmu?\nJawaban:\nIlmu menjadi kunci keberhasilan manusia menjalankan kehidupan dengan baik dan beramal sholeh. Tanpa ilmu, seorang Muslim tidak bisa menjalankan perintah Allah SWT dengan benar. Tanpa ilmu, manusia juga akan sulit memahami maksud dari perintah-perintah Allah SWT dengan tepat.", "t": "Susah", "k": "B"}, {"id": "HADIS-95", "m": "HADIS", "n": 95, "q": "Apa hukum makan dan minum sambil berdiri?\nJawab:\nMuslim disebutkan Nabi Muhammad Saw bersabda: “Jangan kalian minum sambil berdiri, Apabila kalian lupa, maka hendaknya dimuntahkan”. Sehubungan dengan dengan larangan minum tersebut, seorang sahabat, Qotadah bertanya,”Bagaimana dengan makan”. Beliau (Nabi Muhammad Saw), “Itu lebih buruk lagi”. (HR Muslim dan Turmidzi).", "t": "Susah", "k": "B"}, {"id": "HADIS-96", "m": "HADIS", "n": 96, "q": "Sunnah dalam ilmu hadits dibagi menjadi tiga macam, salah satunya adalah segala perkataan Rasulallah yaitu.....\nJawab: \n1. Sunnah QauliyyahSunnah yang berasal dari perkataan Rasulullah SAW, baik dalam bentuk pernyataan, anjuran, perintah, cegahan, maupun larangan. Sunnah ini banyak ditemui dalam kitab-kitab hadis.\n2. Sunnah Fi'liyyahSunnah yang berasal dari perbuatan Rasulullah SAW, baik dalam hal ibadah atau juga muamalah.\n3. Sunnah TaqririyyahSunnah yang berasal dari respons Rasulullah terhadap segala perbuatan sahabat yang diketahuinya", "t": "Susah", "k": "B"}, {"id": "HADIS-97", "m": "HADIS", "n": 97, "q": "Apakah sanad dan rawi itu sama?\nJawab: \nSanad dan rawi adalah dua istilah yang berbeda, namun tidak dapat dipisahkan dalam mempelajari ilmu hadits:", "t": "Mudah", "k": "B"}, {"id": "HADIS-98", "m": "HADIS", "n": 98, "q": "Apa perbedaan rawi dan perawi?\nJawab:\nRawi, yaitu orang yang menyampaikan atau menuliskan hadits dalam suatu kitab apa-apa yang pernah didengar dan diterimanya dari seseorang atau gurunya. Perbuatannya menyampaikan hadits tersebut dinamakan merawi atau meriwayatkan hadits dan orangnya disebut perawi hadits.", "t": "Mudah", "k": "B"}, {"id": "HADIS-99", "m": "HADIS", "n": 99, "q": "Sanad terbagi menjadi berapa?\nJawab:\nSecara garis besar, hadis dilihat dari kuantitas sanad ada dua macam, 1) Hadis Mutawatir, 2) Hadis Ahad.", "t": "Mudah", "k": "B"}, {"id": "HADIS-100", "m": "HADIS", "n": 100, "q": "Hadis apakah yang paling tinggi derajatnya?\nJawab:\nHadis Sahih merupakan hadis dengan tingkatan tertinggi penerimaannya.30 May 2020.", "t": "Mudah", "k": "B"}, {"id": "HADIS-101", "m": "HADIS", "n": 101, "q": "Siapa yang membuat hadis palsu?\nJawab:\nBerdasarkan data sejarah yang ada, pemalsuan hadistidak hanya dilakukan oleh orang-orang islam tetapi juga dilakukan oleh orang-orangnon islam dengan berbagai macam motif dan kepentingan anatara lain Pertentanganpolitik, usaha kaum zindik, fanatic terhadap bangsa dan suku, mempengaruhi kaumawam dan lain sebagainya.", "t": "Mudah", "k": "B"}, {"id": "HADIS-102", "m": "HADIS", "n": 102, "q": "Apa arti dari maudu?\nJawab:\nHadis Maudhu' adalah sesuatu yang disandarkan kepada Nabi Muhammad s.a.w samaada perbuatannya, perkataannya, taqrirnya, sifat akhlaqnya atau sifat semulajadinya, secara rekaan atau dusta semata-mata. Di dalam penggunaan masyarakat Islam di negara kita, hadis maudhu' disebut juga dengan nama hadis palsu.28 Jun 2019", "t": "Mudah", "k": "B"}, {"id": "HADIS-103", "m": "HADIS", "n": 103, "q": "Siapakah perintis ilmu hadits riwayah?\nJawab:\nPendiri Ilmu Hadis Riwayah adalah Muhammad bin Syihab al-Zuhri (w. 124 H) yakni orang pertama melakukan penghimpunan Ilmu Hadis Riwayah secara formal berdasarkan instruksi Khalifah Umar bin Abdul Aziz.", "t": "Mudah", "k": "B"}, {"id": "HADIS-104", "m": "HADIS", "n": 104, "q": "Apa pengertian matan?\nJawab:\nMatan secara bahasa artinya kuat, kokoh, keras, maksudnya adalah isi, ucapan atau lafazh-lafazh hadits yang terletak sesudah rawi dari sanad yang akhir.", "t": "Mudah", "k": "B"}, {"id": "HADIS-105", "m": "HADIS", "n": 105, "q": "Mengapa hadis tidak dibukukan menjadi satu seperti Al-Quran?\nJawab:\nSetelah Nabi wafat, hadis masih belum dibukukan sebagaimana Al-Quran karena tidak ingin hadis menjadi tandingan bagi Al-Quran yang menyebabkan adanya pencampuran dan kelalaian untuk membaca dan mempelajari Al-Quran.", "t": "Mudah", "k": "B"}, {"id": "HADIS-106", "m": "HADIS", "n": 106, "q": "Mengapa hadits tidak dibukukan sejak Nabi masih hidup sehingga dapat meminta pertimbangan langsung dari Nabi?\nJawab:\nSebenarnya sudah dimulai penulisan hadits pada zaman Rasulullah masih hidup, tetapi bukan menjadi perhatian utama. Hal ini dikarenakan kekhawatiran bahwa penulisan wahyu Allah SWT akan tercampur dengan sabda/hadits Rasulullah.", "t": "Mudah", "k": "B"}, {"id": "HADIS-107", "m": "HADIS", "n": 107, "q": "Bagaimana cara menentukan hadis itu dapat diterima?\nJawab:\nMenurutnya, kriteria kesahihan hadis yakni: 1) tidak terdapat syadz (kejanggalan), 2) diriwayatkan oleh rawi yang tsiqah, 3) tidak juga terdapat di dalamnya 'illat (kecacatan), 4) adanya mutaba'ah dan syawahid ketika dibutuhkan.", "t": "Mudah", "k": "B"}, {"id": "HADIS-108", "m": "HADIS", "n": 108, "q": "Bagaimana penyelesaian masalah jika terdapat kontradiksi antara hadist dengan hadist lain?\nJawab:\nArtinya: dua hadis yang secara zahir saling bertentangan, lalu diselesaikan dengan cara kompromi atau tarjih.", "t": "Mudah", "k": "B"}, {"id": "HADIS-109", "m": "HADIS", "n": 109, "q": "Bagaimana periwayatan hadis pada masa tabi'in?\nJawab:\nPada masa ini, Cara periwayatan hadits pada masa tabi'i al-tabi'in adalah bi lafdzi, yaitu dengan lafaz. Karena kodifikasi hadits mulai dilakukan pada akhir masa tabi'in, kodifikasi menggunakan metode sistematis, yaitu mengelompokkan hadits- hadits yang ada sesuai dengan bidang bahasan", "t": "Mudah", "k": "B"}, {"id": "HADIS-110", "m": "HADIS", "n": 110, "q": "Bagaimana ulama Islam menentukan keaslian hadis?\nJawab:\nUlama Islam meyakini bahwa jika rantai perawi sebuah hadis memenuhi lima kriteria, maka hadis tersebut dapat diterima sebagai hadis otentik: kontinuitas dalam rantai perawi, integritas karakter, ingatan yang sempurna, bebas dari cacat tersembunyi, dan keselamatan dari penyimpangan apa pun .", "t": "Mudah", "k": "B"}, {"id": "HADIS-111", "m": "HADIS", "n": 111, "q": "Apa yang akan terjadi apabila hadis tidak ada sanadnya?\nJawab:\nTanpa adanya sanad, maka suatu matan tidak dapat dinyatakan sebagai berasal dari Rasulullah Saw. Ulama hadits menganggap penting penelitian matan untuk dilaku- kan, setelah sanad bagi matan itu telah diketahui kualitasnya, da- lam hal ini kualitas shahih, atau minimal tidak termasuk berat ke- dhaifannya", "t": "Mudah", "k": "B"}, {"id": "HADIS-112", "m": "HADIS", "n": 112, "q": "Bagaimana solusi ketika menemukan dua hadis yang saling bertentangan?\nJawab:\nApabila ada hadis yang nampak saling bertentangan ada beberapa metode untuk menyelesaikannya, dalam ilmu hadis mukhtalif metode yang digunakan yakni menggunakan metode, pertama metode al-jam'u wa al-taufiq, kedua metode naskh wal mansukh, ketiga metode tajrih, keempat metode tawaqquf.", "t": "Susah", "k": "B"}, {"id": "HADIS-113", "m": "HADIS", "n": 113, "q": "Bagaimana prinsip pemahaman hadis?\nJawab:\nPemahaman hadis dibangun di atas dua prinsip, yaitu penguasaan terhadap perangkat keilmuan, dan mendasarkan pada prinsip konfrehensif.", "t": "Mudah", "k": "B"}, {"id": "HADIS-114", "m": "HADIS", "n": 114, "q": "Apakah hadits dhaif bisa diamalkan?\nJawab:\nHadits dhaif boleh diamalkan, tetapi dengan beberapa syarat: \n• Tidak boleh mengatasnamakan Nabi Muhammad SAW dalam hadits dhaif. \n• Tidak berkaitan dengan hukum halal dan haram, akidah. \n• Hanya sebatas fadha'il amal", "t": "Mudah", "k": "B"}, {"id": "HADIS-115", "m": "HADIS", "n": 115, "q": "Apakah hadits dhaif bisa dijadikan landasan hukum?\nJawab:\nMayoritas ulama hadis berpendapat bahwa hadits dhaif tidak bisa dijadikan landasan hukum, terutama yang berkaitan dengan hukum halal dan haram.", "t": "Mudah", "k": "B"}, {"id": "HADIS-116", "m": "HADIS", "n": 116, "q": "Apakah hadits dhaif bisa naik derajatnya menjadi hadits hasan?\nJawab:\nHadits dhaif bisa naik derajatnya menjadi hadits hasan li ghairihi jika ada sanad lain yang memperkuat kebenarannya", "t": "Mudah", "k": "B"}, {"id": "HADIS-117", "m": "HADIS", "n": 117, "q": "Apakah hadits dhaif berbeda dengan hadits maudhu'?\nJawab:\nHadits maudhu' itu palsu, sedangkan hadits dhaif itu lemah. Palsu itu karena berbohong, sedangkan lemah belum tentu karena bohong.", "t": "Mudah", "k": "B"}, {"id": "HADIS-118", "m": "HADIS", "n": 118, "q": "Hadits dhaif adalah ..\nJawab:\nhadits yang tidak memenuhi kriteria hadits shahih dan hasan. Secara bahasa, hadits dhaif berarti hadits yang lemah atau tidak kuat.", "t": "Mudah", "k": "B"}, {"id": "HADIS-119", "m": "HADIS", "n": 119, "q": "Kapan hadis dhaif boleh diamalkan?\nJawab:\nHadis dhaif boleh diamalkan jika ia tersebar secara luas dan masyarakat menerimanya secara umum tanpa adanya tolakan yang berarti (talaqqathul ummah bil qabul).", "t": "Mudah", "k": "B"}, {"id": "HADIS-120", "m": "HADIS", "n": 120, "q": "Apa yang dimaksud dengan hadits shahih? \nJawab: \nHadits shahih adalah hadits yang disandarkan kepada Nabi Muhammad SAW dan memenuhi lima kriteria kesahihan.", "t": "Mudah", "k": "B"}, {"id": "HADIS-121", "m": "HADIS", "n": 121, "q": "Apa syarat-syarat yang harus dipenuhi agar sebuah hadits bisa dikatakan shahih? \nJawab: \nKriteria-kriteria tersebut adalah:\no Sanadnya bersambung \no Diriwayatkan oleh perawi yang adil dan dhabit \no Tidak ada kejanggalan dan tidak berikat \no Tidak ada syaz dan tidak terdapat 'Illat", "t": "Mudah", "k": "B"}, {"id": "HADIS-122", "m": "HADIS", "n": 122, "q": "Bagaimana seseorang dikatakan adil sesuai syarat hadits shahih?\nJawab:\nkriteria seorang periwayat disebut 'adil, yaitu beragama Islam, baligh, berakal, memelihara maru'ah dan tidak berbuat fasik. Berdasarkan peryataan para ulama di atas diketahui berbagai kriteria periwayat hadits dinyatakan 'adil.", "t": "Mudah", "k": "B"}, {"id": "HADIS-123", "m": "HADIS", "n": 123, "q": "Apakah semua hadis mutawatir bisa dikatakan sebagai hadits yang shahih?\nJawab:\nLalu apakah setiap hadits mutawatir sudah pasti shahih? Jawabannya tentu saja iya. Bahkan lebih shahih daripada hadits yang kita kenal dengan sebutan hadits shahih. Karena hadits mutawatir sudah tidak dimungkinkan rawinya untuk berbohong.", "t": "Mudah", "k": "B"}, {"id": "HADIS-124", "m": "HADIS", "n": 124, "q": "Bagaimana cara menentukan hadis itu shahih dan dapat diterima sebagai sumber hukum?\nJawab:\nMenurutnya, kriteria kesahihan hadis yakni: 1) tidak terdapat syadz (kejanggalan), 2) diriwayatkan oleh rawi yang tsiqah, 3) tidak juga terdapat di dalamnya 'illat (kecacatan), 4) adanya mutaba'ah dan syawahid ketika dibutuhkan", "t": "Mudah", "k": "B"}, {"id": "HADIS-125", "m": "HADIS", "n": 125, "q": "Apa hukum mengamalkan hadits shahih bagi ulama ushul fiqh?\nJawab:\nWajib mengamalkannya menurut kesepakatan ( ijma') ulama hadis dan para ulama Ushul Fiqih serta fuqaha yang memiliki kapabilitas untuk itu. Dengan demikian, ia dapat dijadikan hujjah syari'at yang tidak boleh diberikan kesempatan bagi seorang Muslim untuk tidak mengamalkannya.", "t": "Susah", "k": "B"}, {"id": "HADIS-126", "m": "HADIS", "n": 126, "q": "Apa syarat hadis yang menjadi sumber hukum Islam?\nJawab: \nSyarat sebuah hadis yang pertama ialah ittishalus sanad atau sanadnya bersambung. Baik itu marfu' (tersambung sampai Rasulullah SAW) atau mauquf (sampai sahabat saja)", "t": "Mudah", "k": "B"}, {"id": "HADIS-127", "m": "HADIS", "n": 127, "q": "Kenapa harus ada hadits jika semua hal sudah terdapat dalam Al-Quran?\nJawab:\nSelain sebagai sumber ajaran Islam kedua, Hadis berfungsi sebagai penjelas ayat-ayat Alquran yang masih bersifat umum (mujmal). Tanpa Hadis, ayat-ayat Alquran yang bersifat umum, akan sulit diimplementasikan dalam kehidupan manusia, baik berkaitan dengan ibadah maupun muamalah.", "t": "Mudah", "k": "B"}, {"id": "HADIS-128", "m": "HADIS", "n": 128, "q": "Apa kontribusi hadis dalam yurisprudensi Islam?\nJawab: \nMeskipun jumlah ayat yang membahas hukum dalam Al-Quran relatif sedikit, banyak yang menganggap hadis memberikan arahan tentang segala hal, mulai dari rincian kewajiban agama (seperti Mandi Wajib atau Wudhu, tata cara salat), hingga bentuk-bentuk salam yang benar dan pentingnya kebajikan terhadap budak.", "t": "Susah", "k": "B"}, {"id": "HADIS-129", "m": "HADIS", "n": 129, "q": "Mengapa dalam menjalankan agama masih diperlukan hadis padahal sudah ada Al-Quran sebagai sumber hukum utama?\nJawab:\nFungsi hadits sebagai sumber hukum Islam yang pertama yakni adalah Bayan At-Taqrir atau memperjelas isi Al-Qur'an. Hadits berfungsi untuk memperjalas isi Al-Qur'an, agar lebih mudah dipahami dan menjadi petunjuk umat manusia dalam menjalankan perintah dari Allah SWT.", "t": "Susah", "k": "B"}, {"id": "HADIS-130", "m": "HADIS", "n": 130, "q": "Apakah diterima sebuah hadis dari seorang perawi yang mengalami gangguan pikiran?\n Jawab: Dari sini jelas, bahwa tidak ada tempat menerima hadits dari perawi yang mengalami gangguan akal yang berpengaruh terhadap ketepatan periwayatannya.", "t": "Mudah", "k": "B"}, {"id": "HADIS-131", "m": "HADIS", "n": 131, "q": "Bagaimana perbedaan antara hadis mutawatir dan hadits ahad selain dilihat dari jumlah perawinya?\nJawab:Adapun kesimpulan dari tulisan ini adalah bahwa hadis mutawatir adalah hadis yang diriwayatkan oleh banyak perawi yang kredibel (dapat dipercaya) dan mustahil melakukan kebohongan berjama'ah/publik, sedangkan hadis Ahad adalah hadis yang jumlah perawinya tidak mencapai jumlah yang kuat untuk di adu argumentasinya,", "t": "Susah", "k": "B"}, {"id": "HADIS-132", "m": "HADIS", "n": 132, "q": "Apa yang dimaksud dengan gharib mutlak?\nJawab:Mutlaq adalah hadis yang tidak diriwayatkan kecuali dari seorang sahabat, maksudnya adalah seorang sahabat yang meriwayatkan (hadis) dari Nabi saw. dan yang rajih adalah dia disebut dengan al-fard al-mutlaq, atau disebut juga garib matan dan sanad.", "t": "Mudah", "k": "B"}, {"id": "HADIS-133", "m": "HADIS", "n": 133, "q": "Hadits yang hanya diriwayatkan oleh dua orang perawi disebut hadits apa?\nJawab:\nHadis yang diriwayatkan secara perorangan, meskipun hanya pada salah satu tingkatan (tabaqah) sanadnya disebut dengan hadis ahad, yaitu hadis yang dalam satu atau lebih tingkatan (tabaqah) sanadnya hanya diriwayatkan oleh satu atau dua orang saja sehingga tidak memenuhi salah satu syarat- syarat hadis mutawatir.", "t": "Mudah", "k": "B"}, {"id": "HADIS-134", "m": "HADIS", "n": 134, "q": "Bagaimana kedudukan hadits hasan dalam Islam?\njawab:\nMenurut para ulama' ahli hadits, bahwa hadits hasan, baik hasan li dzatih maupun hasan li ghairih, juga dapat dijadikan hujjah untuk menetapkan suatu kepastian hukum, yang harus diamalkan.", "t": "Mudah", "k": "B"}, {"id": "HADIS-135", "m": "HADIS", "n": 135, "q": "Apakah hadis hasan dapat dijadikan landasan hukum?\nJawab: \nHadis hasan menurut Imam Bukhari dan Ibnu Araby, tidak dapat dijadikan sebagai dalil dalam menetapkan hukum, tetapi Al-Hakim, Ibnu Hibban dan Ibnu Khuzaimah dapat menerimanya sebagai hujjah, dengan syarat apabilah hadis hasan tersebut tidak bertentangan dengann hadis shahih.", "t": "Mudah", "k": "B"}, {"id": "HADIS-136", "m": "HADIS", "n": 136, "q": "Apakah hadis hasan bisa berubah menjadi hadis shahih?\nJawab: \nHadis hasan bisa menjadi hadis sahih, yaitu sahih lighairihi karena didukung oleh hadis lain yang semakna. Sedangkan hadis yang memang sendiri sudah sahih disebut sebagai hadis sahih lidzatihi. Hadis dengan kualitas paling rendah ialah hadis dhaif.", "t": "Mudah", "k": "B"}, {"id": "HADIS-137", "m": "HADIS", "n": 137, "q": "Apa yang menyebabkan hadis berstatus dhaif?\nJawab: \nDalam hadits dhaif, ada dua pembagian besar yang dilakukan oleh para ulama. Pembagian ini didasarkan pada sebab-sebab suatu hadits dihukumi dhaif (lemah), yaitu: pertama, karena terputusnya sanad (al-mardûd bi sabab saqtun fi al-isnad) dan kedua, karena cacatnya rawi (al-mardûd bi sabab ṭaʽn fi ar-rawi).", "t": "Mudah", "k": "B"}, {"id": "HADIS-138", "m": "HADIS", "n": 138, "q": "Bagaimana hukum menggunakan hadits dhaif dalam kehidupan sehari-hari?\nJawab: \nUlama sepakat bahwa mengamalkan hadits dhaif dibolehkan, selama tidak berkaitan dengan hukum halal dan haram, akidah, dan hanya sebatas fadha'il amal. Dengan demikian, menyampaikan hadits dhaif, seperti mengutip hadits dhaif dalam buku atau menyampaikannya dalam pengajian dan majelis taklim dibolehkan", "t": "Mudah", "k": "B"}, {"id": "HADIS-139", "m": "HADIS", "n": 139, "q": "Bagaimana pendapat ulama tentang kehujjahan hadis dhaif?\nJawab: \nMayoritas ulama hadis berpendapat bahwa hadis daif tidak bisa dijadikan sebagai landasan hukum, terutama yang berkaitan dengan hukum halal dan haram. Akan tetapi Imam Abu Hanifah berpendapat, hadis daif boleh dijadikan sebagai landasan hukum.", "t": "Mudah", "k": "B"}, {"id": "HADIS-140", "m": "HADIS", "n": 140, "q": "Apa perbedaan hadits shahih, hasan, dan dhaif?\nJawab: \nHadits shahih adalah hadits yang lemah. Menurut buku Pengantar Studi Sejarah Peradaban Islam karya Muhammad Husain Mahasnah, hadits dhaif kehilangan satu syarat atau lebih dari syarat-syarat hadits hasan, yakni hadits yang diketahui diriwayatkan oleh orang yang tertuduh berdusta dan jelek hafalannya.", "t": "Mudah", "k": "B"}, {"id": "HADIS-141", "m": "HADIS", "n": 141, "q": "Apa contoh hadits dhaif?\nJawab: \nContoh hadits dhaif lainnya yang senada dari hadits di atas adalah: Diriwayatkan dari Musa bin Ubaidah, dari Abu Hurairah ra mengatakan Rasulullah bersabda, “Segala sesuatu itu ada zakatnya. Zakat badan adalah puasa. Puasa itu separuh kesabaran", "t": "Mudah", "k": "B"}, {"id": "HADIS-142", "m": "HADIS", "n": 142, "q": "Apakah hadis riwayat Bukhari itu shahih?\nJawab: \nHadits riwayat Bukhari termasuk hadits sahih yang banyak menjadi rujukan para ulama maupun umat Muslim di seluruh dunia. Hal ini karena Imam Bukhari merupakan seorang ahli hadis asal Uzbekistan yang sudah berkiprah di bidangnya sejak usia remaja", "t": "Mudah", "k": "B"}, {"id": "HADIS-143", "m": "HADIS", "n": 143, "q": "Berapa waktu yang dibutuhkan Imam Bukhari untuk mengumpulkan hadis?\nJawab: \nUntuk mengumpulkan dan menyeleksi hadis shahih, Bukhari menghabiskan waktu selama 16 tahun untuk mengunjungi berbagai kota guna menemui para perawi hadis, mengumpulkan dan menyeleksi hadisnya.", "t": "Mudah", "k": "B"}, {"id": "HADIS-144", "m": "HADIS", "n": 144, "q": "Berapa jumlah hadits dalam Musnad Ahmad?\nJawab: \nMenurut penomoran al-Alamiyah, terdapat 26363 hadis dalam Musnad Ahmad. Sedangkan menurut penomoran Ihya, ada 27100 hadis.", "t": "Mudah", "k": "B"}, {"id": "HADIS-145", "m": "HADIS", "n": 145, "q": "Apa yang melatarbelakangi Imam Bukhari menyusun Shahih Bukhari?\nJawab: \nUntuk menjelaskan keputusan fiqih atau madzhab (pendapat) yang beliau pegang. Walaupun untuk itu beliau menyalahi dan berbeda pendapat dengan keputusan para Imam atau sebagian dari mereka. Tidak mengapa, karena beliau rahimahullah memang seorang mujtahid mutlak.", "t": "Mudah", "k": "B"}, {"id": "HADIS-146", "m": "HADIS", "n": 146, "q": "Apa mazhab Imam Bukhari?\nJawab :\nSebagian ulama menyebutkan Imam Bukhari sebagai pengikut mazhab Syafi'i, bahkan Imam as-Subki menggolongkannya ke dalam “Thabaqat asy-Syafi'iyyah”. Namun menurut Abu Syuhbah, al-Bukhari adalah seorang ahli fikih dan mujtahid mustaqil (independen, tidak terikat pada madzhab tertentu), bukan muqallid.", "t": "Mudah", "k": "B"}, {"id": "HADIS-147", "m": "HADIS", "n": 147, "q": "Berapa jumlah semua hadits?\nJawab: \nSecara keseluruhannya terdapat 32,000 lebih hadis untuk rujukan para pembaca di dalam Buku Ensiklopedia Hadits. Ayat terjemahan yang mudah difahami serta mempunyai tanda baris yang lengkap dan mudah.", "t": "Mudah", "k": "B"}, {"id": "HADIS-148", "m": "HADIS", "n": 148, "q": "Imam Bukhari menyelesaikan penyusunan kitab Shahih Bukhari dimana?\nJawab: \nSosok Imam Bukhari yang Tekun\"Saya menyusun kitab al-Jami' as-Shahih ini di Masjid al-Haram, Makkah. Dan saya tidak mencantumkan sebuah hadits pun kecuali sesudah shalat Istikharah dua rakaat, memohon pertolongan kepada Allah, dan setelah meyakini bahwa hadits itu benar-benar sahih.", "t": "Mudah", "k": "B"}, {"id": "HADIS-149", "m": "HADIS", "n": 149, "q": "Berapa banyak guru Imam Al Bukhari?\nJawab: \nMenimba ilmu bersama lebih dari seribu guru Pertama, Imam al-Bukhâri menimba ilmu dari Ulama setempat. Beliau berguru kepada Muhammad bin Salam al-Biikandi, Abdullah bin Muhammad bin Abdullah bin Ja'far bin Yamaan al-Ju'fi al-Musnidi, dan ulama lainnya.", "t": "Mudah", "k": "B"}, {"id": "HADIS-150", "m": "HADIS", "n": 150, "q": "Siapakah Guru dari Imam Bukhari?\nJawab: \nMuhammad bin Ismail al-Bukhari disebut-sebut sebagai anak murid Imam Ahmad bin Hanbal. Uniknya, sejak mulai belajar, ia tidak pernah menulis apa yang disampaikan semua gurunya. Ia memiliki kekuatan hafalan yang mengagumkan", "t": "Mudah", "k": "B"}, {"id": "HADIS-151", "m": "HADIS", "n": 151, "q": "Siapakah yang menyusun hadits?\nImam Malik (w. 179 H/795 M) adalah orang pertama yang melakukan kompilasi hadis secara komprehensif dan sistematis. Karyanya dikenal sebagai Al-Muwatta' (Jalan yang Ditempuh). Kemudian, kompilasi lainnya pun muncul.", "t": "Mudah", "k": "B"}, {"id": "HADIS-152", "m": "HADIS", "n": 152, "q": "Jawab :", "t": "Mudah", "k": "B"}, {"id": "HADIS-153", "m": "HADIS", "n": 153, "q": "Siapakah yang mengumpulkan hadis?\nJawab:\nUmar bin Abdul Aziz adalah seorang khalifah dari bani umayah yang berkuasa pada tahun 99-101 H. Dialah yang memerintahkan para ulama untuk mendirikan majelis-majelis hadis dan membukukan hadis-hadis Nabi.", "t": "Mudah", "k": "B"}, {"id": "HADIS-154", "m": "HADIS", "n": 154, "q": "Kitab Shahih Bukhari membahas tentang apa?\nJawab: \nShahih Bukhari memuat hadits-hadits shahih tentang hukum, keutamaan amal, etika pergaulan, sejarah, dan berita tentang kejadian-kejadian di masa mendatang. Kitab ini memuat 7.275 hadits dari sekitar 100.000 buah hadits yang diakuinya shahih.", "t": "Mudah", "k": "B"}, {"id": "HADIS-155", "m": "HADIS", "n": 155, "q": "Berapa hadis yang termuat dalam kitab hadis Musnad al-Kabir karya Ahmad ibn Hanbal?\nJawab :\nKitab Al-Musnad Al-Kabir (ensiklopedia hadis) yang sangat monumental, ini memuat tak kurang dari 27 ribu hadis", "t": "Mudah", "k": "B"}, {"id": "HADIS-156", "m": "HADIS", "n": 156, "q": "Jenis hadist apa saja yang masuk dalam kitab musnad?\nJawab:\nHadits- hadits yang terdapat dalam kitab musnad imam ahmad, setelah dinilai dengan kriteria hadits shahih yang di sepakatioleh ulama' hadits, memiliki derajat yang berbeda-beda, ada yang shahih, dhaif dan maudhu'.", "t": "Mudah", "k": "B"}, {"id": "HADIS-157", "m": "HADIS", "n": 157, "q": "Apakah dalam Shahih Bukhari ada hadits dhaif?\nJawab: \nLebih jauh dari itu, menurut hasil penelitian beliau, di kitab Shahih-nya pun, Imam Bukhari juga menggunakan hadits dhaif.", "t": "Mudah", "k": "B"}, {"id": "HADIS-158", "m": "HADIS", "n": 158, "q": "Berapa waktu yang dibutuhkan Imam Bukhari untuk mengumpulkan hadis?\nJawab:\nUntuk mengumpulkan dan menyeleksi hadis shahih, Bukhari menghabiskan waktu selama 16 tahun untuk mengunjungi berbagai kota guna menemui para perawi hadis, mengumpulkan dan menyeleksi hadisnya", "t": "Mudah", "k": "B"}, {"id": "HADIS-159", "m": "HADIS", "n": 159, "q": "Berapa umur Imam Bukhari saat ia menghafal Al-Quran?\nJawab:\nIbu Imam Bukhari-lah yang menyuruhnya menghafal Al-Quran. Setelah menyelesaikan hafalannya pada usia enam tahun , ibunya kemudian menyuruhnya duduk di majelis-majelis Hadits.", "t": "Mudah", "k": "B"}, {"id": "HADIS-160", "m": "HADIS", "n": 160, "q": "Siapakah imam mazhab yang masyhur?\nJawab:\nPara imam pendiri empat mazhab fikih yaitu Abu Hanifah yang merupakan pendiri Mazhab Hanafi, Malik bin Anas pendiri Mazhab Maliki, Muhammad bin Idris Asy-Syafi'i pendiri Mazhab Syafi'i, dan Ahmad bin Hanbal yang merupakan pendiri Mazhab Hambali.", "t": "Mudah", "k": "B"}, {"id": "HADIS-161", "m": "HADIS", "n": 161, "q": "Siapa saja yang termasuk imam mazhab?\nJawab:\nKeempat imam mazhab, Hanafi, Maliki, Syafii, dan Hambali menetapkan hukum berdasarkan Quran dan Sunnah. Kalaupun ada perbedaan, itu lebih dipengaruhi oleh lingkungan tempat lahir dan berkembangnya mazhab.", "t": "Mudah", "k": "B"}, {"id": "HADIS-162", "m": "HADIS", "n": 162, "q": "1Siapa yang meriwayatkan hadis terbanyak?\nJawab:\nPara ahli hadits sepakat bahwa Abu Hurairah RA merupakan sosok sahabat nabi yang paling banyak meriwayatkan hadits. Tercatat bahwa Imam Ahmad bin Hanbal di dalam Musnad-nya meriwayatkan 3.848 hadits dari Abu Hurairah RA. Sedangkan Imam Baqy bin Makhlad meriwayatkan 5.374 hadits di dalam Musnad-nya", "t": "Mudah", "k": "B"}, {"id": "HADIS-163", "m": "HADIS", "n": 163, "q": "Di manakah makam Imam Hambali?\nJawab: \nMakam imam mazhab yang wajib diketahui terakhir adalah makam Imam Hambali. Ia dimakamkan di Baghdad, tepatnya berada di Kompleks Pemakaman Bab Harb di kawasan el-Hibna, berlokasi di sebelah barat pemakaman Quraisy.", "t": "Mudah", "k": "B"}, {"id": "HADIS-164", "m": "HADIS", "n": 164, "q": "Faktor apa yang mendorong Imam Bukhari menyusun kitab Shahih Bukhari?\nJawab: \nDorongan sang guru Isḥāq bin Rahawaih salah seorang guru Imam al-Bukhari pernah berwasiat kepadanya “Hendaklah engkau menyusun sebuah kitab yang khusus berisi sunah Rasul yang shahih.” Wasiat keinginan gurunya inilah yang mendorong dan mengilhami Imam Bukhari untuk menyusun sebuah kitab yang berbeda dari kitab-kitab", "t": "Susah", "k": "B"}, {"id": "HADIS-165", "m": "HADIS", "n": 165, "q": "Siapakah ulama yang Allah beri kesembuhan dari butanya semasa kecil?\nJawab: \nAllah benar-benar memberikan kesembuhan kepada Muhammad bin Ismail. Imam Al-Bukhari mulai belajar hadis saat masih muda, bahkan masih kurang dari 10 tahun.", "t": "Mudah", "k": "B"}, {"id": "HADIS-166", "m": "HADIS", "n": 166, "q": "Siapakah yang mulai menulis hadis?\nJawab: \nHadits-hadits ditulis oleh para sahabat Nabi , sebagian dari mereka menentang Ahlulbayt (keluarganya). Pada masa hidup Nabi, tidak ada Syiah/Sunni, sehingga perbedaan pendapat mulai muncul setelah Nabi meninggal.", "t": "Mudah", "k": "B"}, {"id": "HADIS-167", "m": "HADIS", "n": 167, "q": "Berapa ribu hadits yang dihafal Imam Bukhari?\nJawab: \nHadis-hadis yang dihafal tersebut terdiri dari 200 ribu hadis tidak sahih dan 100 ribu hadis sahih. Dari jumlah hadis sahih tersebut, ia hanya mencantumkan 7.275 hadis dalam kitabnya, Jami'as-Shahih atau yang dikenal dengan Shahih Al-Bukhari", "t": "Mudah", "k": "B"}, {"id": "HADIS-168", "m": "HADIS", "n": 168, "q": "Siapa saja tokoh yang menonjol dalam pembukuan dan penulisan kitab hadis?\nJawab: \nBeberapa sahabat yang tercatat memiliki catatan-catatan hadis adalah Jabir ibn Abdillah, Ali ibn Abi Thalib, Abu Hurairah, dan Abdullah ibn Umar", "t": "Mudah", "k": "B"}, {"id": "HADIS-169", "m": "HADIS", "n": 169, "q": "Apa hukumnya meriwayatkan hadits dari orang yang fasik?\nJawab : \nSeluruh ulama pun sepakat haram hukumnya meriwayatkan atau menyampaikan hadits maudhu' kecuali dengan menjelaskan hakekatnya, bahwa ia hadits palsu", "t": "Mudah", "k": "B"}, {"id": "HADIS-170", "m": "HADIS", "n": 170, "q": "Siapakah tokoh ulama yang membangun dan mengembangkan ilmu hadis?\nJawab: \ndi bidang ilmu hadis di antaranya adalah Imam Bukhari, Imam Muslim, Ibnu Majah, Abu Daud, hingga At-Tirmidzi.", "t": "Mudah", "k": "B"}, {"id": "HADIS-171", "m": "HADIS", "n": 171, "q": "Hadits yang hanya diriwayatkan oleh dua orang perawi disebut hadits apa?\nJawab:\nHadis yang diriwayatkan secara perorangan, meskipun hanya pada salah satu tingkatan (tabaqah) sanadnya disebut dengan hadis ahad, yaitu hadis yang dalam satu atau lebih tingkatan (tabaqah) sanadnya hanya diriwayatkan oleh satu atau dua orang saja sehingga tidak memenuhi salah satu syarat- syarat hadis mutawatir.", "t": "Nonaktif", "k": "B"}, {"id": "FIQIH-1", "m": "FIQIH", "n": 1, "q": "Jelaskan kajian ilmu fiqih terdapat banyak definisi yang di kemukakan oleh para ulama' fiqih, uraikan lah salah satunya!\nJawab: \nIlmu tentang hukum syari'ah yang berkaitan dengan perbuatan manusia, baik dalam bentuk perintah (wajib), larangan(harom), pilihan(mubah), anjuran untuk melakukan(sunnah), maupun anjuran agar menghindarinya(makruh) yang di dasarkan pada sumber-sumber syari'ah, bukan akal atau perasaan.", "t": "Susah", "k": "A"}, {"id": "FIQIH-2", "m": "FIQIH", "n": 2, "q": "Fiqih merupakan bagian dari syari'ah islamiyah, jabarkan maksud dari syari'ah islamiyah!\nJawab: \nPengetahuan tentang hukum syari'ah islamiyah yang berkaitan dengan perbuatan manusia yang telah dewasa dan berakal sehat(mukallaf) dan di ambil dari dalil terperinci.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-3", "m": "FIQIH", "n": 3, "q": "Jelaskanlah definisi dari thoharoh secara terminologi! \nJawab: \nThoharoh adalah istilah dalam fiqih islam yang berarti bersuci atau membersihkan diri, pakaian, tempat, atau sesuatu dari hadas dan najis sesuai dengan syari'at islam. Definisi ini meliputi dua aspek utama, seperti: bersuci dari hadas dan najis.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-4", "m": "FIQIH", "n": 4, "q": "Dalam bab thoharoh ada penjelasan tentang air, ada berapakah macam-macam air tersebut? Sebutkan!\nJawab: \nMacam-macam air tersebut ada 4 berdasarkan hukumnya, yaitu: air suci dan mensucikan(air mutlak) air yang dapat digunakan untuk bersuci karena sifatnya yang murni, seperti air hujan, air laut, air sungai, air sumur, air salju, dan air embun. Yang kedua air suci tidak mensucikan, air yang sudah tercampur dengan benda suci hingga berubah warna, rasa atau baunya, seperti kopi. Yang ketiga air musta'mal, yakni air yang sudah digunakan untuk bersuci dari hadas kecil dan besar, yang keempat air najis, yakni air yang bercampur dengan najis sehingga berubah warna, rasa atau baunya.", "t": "Susah", "k": "A"}, {"id": "FIQIH-5", "m": "FIQIH", "n": 5, "q": "Menurut imam Siapakah menggunakan air panas untuk berwudlu' hukumnya makruh? \nJawab: \nDalam penjelasan tentang hukum  menggunakan air panas untuk berwudlu'  ada beberapa ulama' tertentu, seperti: madzhab hanafi dan maliki tidak ada keterangan menggunakan air panas hukumnya makruh. Madzhab syafi'i dalam kitab fiqih syafi'i yah juga tidak ditemukan makruh. Madzhab Hanbali dalam beberapa literatur disebutkan bahwa menggunakan air panas yang di panaskan api di anggap makruh.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-6", "m": "FIQIH", "n": 6, "q": "Bangkai apa saja yang tidak bisa di makan dagingnya? \nJawab: \nBangkai hewan darat yang tidak disembelih secara syari'at, yakni hewan yang disembelih secara tidak halal, bangkai hewan yang harom, yakni babi dan anjing, dan pengecualian dalam syari'at, Bangkai yang boleh dimakan seperti ikan dan belakang.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-7", "m": "FIQIH", "n": 7, "q": "Bagaimana hukum memakai wadah dari emas dan perak? \nJawab: \nHukumnya dalam islam harom, baik untuk makan, minum, maupun keperluan lainnya, dengan alasan menghindari kesombongan dan pemborosan, mengutamakan orang miskin dan membedakan kaum muslimin, yakni islam mengajarkan kesederhanaan", "t": "Mudah", "k": "A"}, {"id": "FIQIH-8", "m": "FIQIH", "n": 8, "q": "Hukum menggunakan siwak adalah? \nJawab: \nHukumnya adalah sunnah mu'akkadah, hukum tersebut didasari dari hadist Nabi yang bersabda: \" Seandainya tidak memberatkan umatku, maka akan aku perintahkan mereka untuk bersiwak setiap kali wudhu\" (HR.Bukhari dan Muslim)", "t": "Mudah", "k": "A"}, {"id": "FIQIH-9", "m": "FIQIH", "n": 9, "q": "Kapan saja waktu yang di sunnah kan untuk bersiwak? \nJawab: \nWaktu yang di sunnahkan untuk bersiwak yaitu ketika hendak melaksanakan sholat, bangun dari tidur, dan ketika berubahnya bau mulut", "t": "Mudah", "k": "A"}, {"id": "FIQIH-10", "m": "FIQIH", "n": 10, "q": "Berapakah fardhu nya wudhu'? Sebutkan secara terperinci! \nJawab: \n¹Niat, yakni melafalkan  niat di dalam hati untuk berwudhu' semata- mata karena Allah, ²membasuh wajah, meliputi seluruh wajah, dari tumbuhnya rambut kepala hingga dagu, dan dari kedua telinga, ³membasuh kedua tangan hingga siku-siku, ⁴ mengusap sebagian kepala, yang kelima membasuh kedua kaki hingga mata kaki, yang ke-enam tertib, yakni melaksanakan semua fardhu wudhu' secara berurutan sesuai yang diajarkan.", "t": "Susah", "k": "A"}, {"id": "FIQIH-11", "m": "FIQIH", "n": 11, "q": "Ada berapa perkara yang membatalkan wudhu'? Sebutkan! \nJawab: \nPerkara yang membatalkan wudhu' ada 4,yaitu: keluarnya sesuatu dari subuh atau dubur, hilangnya akal sebab mabuk dan tidur yang tidak menetapkan pantatnya kebumi, bersentuhan  kulit antara laki-laki yang bukan mahrom, dan menyentuh kemaluannya anak adam dengan dalamnya telapak tangan", "t": "Mudah", "k": "A"}, {"id": "FIQIH-12", "m": "FIQIH", "n": 12, "q": "Jelaskan apa yang maksud dengan istinja'? \nJawab: \nIstinja' adalah membersihkan najis yang keluar dari salah satu dua jalan, dan iatinja' dilakukan dengan dua cara, yakni menggunakan air atupun menggunakan benda kesitu seperti batu.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-13", "m": "FIQIH", "n": 13, "q": "Apa definisi mandi secara syara'?\n Jawab:\n Mengalirkan air keseluruh tubuh dengan niat tertentu untuk menghilangkan hadas besar.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-14", "m": "FIQIH", "n": 14, "q": "Apa saja perkara yang mewajibkan  mandi? \nJawab: \nKeluarnya air mani karena syahwat, haid dan nifas, melahirkan, jima', dan meninggal dunia", "t": "Mudah", "k": "A"}, {"id": "FIQIH-15", "m": "FIQIH", "n": 15, "q": "Ada berapa fardhu nya mandi? Sebutkan! \nJawab:\nFardhu nya mandi ada 3, yaitu: niat dilakukan didalam hati, menghilangkan najis yang ada dibadan, meratakan air keseluruh tubuh dari ujung rambut sampai ujung kaki", "t": "Mudah", "k": "A"}, {"id": "FIQIH-16", "m": "FIQIH", "n": 16, "q": "Sebutkan salah satu mandi yang disunnahkan! \nJawab: \nMandi yang disunnahkan salah satunya mandi pada hari jum'at sebelum pergi untuk sholat jum'at, berdasarkan hadist Nabi yang menyarankan umat islam untuk membersihkan diri pada hari itu.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-17", "m": "FIQIH", "n": 17, "q": "Ada berapa syarat- syarat mengusap muzah? Sebutkan!\n Jawab: \nMuzah harus dipakai setelah berwudhu', harus tertutup rapat, bukan dari bahan yang tipis atau tembus pandang, muzah dipakai dalam keadaan suci, dan waktu untuk mengusap terbatas.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-18", "m": "FIQIH", "n": 18, "q": "Sebutkan apa saja perkara yang membatalkan muzah!\nJawab: \nmenghilangkan kondisi tayamum, mengeluarkan sesuatu dari tubuh, seperti buang air kecil dan besar, melepas muzah, waktu mengusap muzah sudah habis, keadaan junub atau haid", "t": "Mudah", "k": "A"}, {"id": "FIQIH-19", "m": "FIQIH", "n": 19, "q": "Jelaskan definisi tayamum secara syara'! \nJawab: \nTayamum adalah pengganti dari wudhu' dan mandi yang dilakukan menggunakan debu yang suci pada anggota tubuh tertentu, sebagai pengganti air", "t": "Mudah", "k": "A"}, {"id": "FIQIH-20", "m": "FIQIH", "n": 20, "q": "Ada berapakah syaratnya  tayamum? Sebutkan 2 saja! \nJawab: \nSyaratnya tayamum ada 4,yaitu: Tidak adanya air atau tidak bisa menggunakan air, adanya penyebab menggunakan air, seperti orang sakit atau terluka, yang mana jika ia menggunakan air sakitnya akan semakin parah.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-21", "m": "FIQIH", "n": 21, "q": "Ada berapakah fardhu nya tayamum? Sebutkan secara perincian!\nJawab: \nNiat, berniat untuk melakukan tayamum sebagai pengganti dari wudhu' atau mandi, mengusap wajah menggunakan debu yang suci, mengusap kedua tangan hingga siku-siku, tertib.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-22", "m": "FIQIH", "n": 22, "q": "Sebutkan 2 saja sunnah-sunnah tayamum!\nJawab: \nYaitu di sunnahkan membaca bismillah sebelum memulai tayamum, sebagaimana di anjurkan dalam ibadah yang lain, dan menghadapi kiblat, cara ini di sunnahkan saat tayamum sebagaimana adab dalam beribadah", "t": "Mudah", "k": "A"}, {"id": "FIQIH-23", "m": "FIQIH", "n": 23, "q": "Apa saja perkara yang membatalkan tayamum? Jelaskan! \nJawab: \nAdanya air untuk berwudhu', semua hal yang membatalkan wudhu', seperti hilang akal.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-24", "m": "FIQIH", "n": 24, "q": "Bagaimana cara wudhunya seseorang yang anggota badannya diperban? \nJawab: \nAnggota badan yang tidak diperban tetap wajib di basuh seperti biasa sesuai urutan wudhu', untuk anggota yang diperban, jika khawatir luka memburuk karena terkena air, maka cukup diusap dengan tangan basah, jika luka meluas atau semakin parah, maka bisa ditambah dengan tayamum.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-25", "m": "FIQIH", "n": 25, "q": "Apakah boleh memakai parfum yang beralkohol untuk sholat?\nJawab: \nPandangan mayoritas ulama', termasuk dari madzhab hanafi, maliki, dan sebagian syafi'i berpendapat bahwa alkohol yang digunakan dalam parfum(bukan untuk diminum) tidak dianggap najis. Alkohol dalam parfum biasanya alkohol sintesis atau alkohol yang dicampur dengan bahan non makanan, sehingga tidak di maksudkan untuk diminum, oleh karena itu diperbolehkan untuk sholat.", "t": "Susah", "k": "A"}, {"id": "FIQIH-26", "m": "FIQIH", "n": 26, "q": "Jelaskan definisi najis secara lughot! \nJawab: \nNajis berasal dari bahasa arab (نجاسة)    yang berarti kotoran atau sesuatu yang dianggap kotor secara fisik/maknawi, dalam pengertian bahasa najis merujuk pada segala sesuatu yang menjijikkan, kotor dan tidak layak untuk di sentuh, terutama dalam kesucian dan kebersihan", "t": "Mudah", "k": "A"}, {"id": "FIQIH-27", "m": "FIQIH", "n": 27, "q": "Ada berapa macamnya najis? Sebutkan! \nJawab: \nMacam-macamnya najis ada 3,yaitu:Najis mukhoffafah, najis mutawassithoh, dan najis mugholladzoh", "t": "Mudah", "k": "A"}, {"id": "FIQIH-28", "m": "FIQIH", "n": 28, "q": "Jelaskan apa yang dimaksud dengan najis mugholladzoh! \nJawab: \nNajis mugholladzoh adalah najis berat yang harus dibersihkan dengan cara khusus, adapun najis ini merujuk pada anjing dan babi, serta semua yang berasal dari keduanya.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-29", "m": "FIQIH", "n": 29, "q": "Bagaimana cara mensucikan najis mukhoffafah? Dan berikan contohnya! \nJawab: \nCara untuk membersihkan najis mukhoffafah, yakni dengan cara dihilangkan najis nya terlebih dahulu, setelah itu, di percikan air pada bagian yang terkena najis, tidak perlu membasuh hingga mengalir, hal ini berdasarkan pendapat ulama' yang bersumber dari hadist Nabi tentang: \" Air kencing bayi laki-laki yang belum makan apa-apa selain ASI, cukup di percikan air, sedangkan untuk bayi perempuan harus di cuci. (HR. Abu Daud dan Ahmad). Adapun contohnya yaitu air kencingnya laki-laki yang berusia dibawah 2 tahun dan hanya mengkonsumsi ASI", "t": "Susah", "k": "A"}, {"id": "FIQIH-30", "m": "FIQIH", "n": 30, "q": "Bagaimana cara mensucikan  najis mugholladzoh? \nJawab: \nCara mensucikannya, yaitu dengan mengalirkan air ke tempat yang terkena najis, air yang digunakan cukup banyak dan mengalir, untuk membersihkan sisa-sisa najis, dengan membasuh sebanyak 7× dan salah satunya dicampur dengan debu yang suci", "t": "Mudah", "k": "A"}, {"id": "FIQIH-31", "m": "FIQIH", "n": 31, "q": "Ada berapakah jenis-jenis darah yang keluar dari farji perempuan? Sebutkan! \nJawab:\nBerdasarkan kondisi dan latar belakangnya, darah yang keluar dari farji perempuan ada 3,yaitu: darah haid, nifas, dan istihadhah.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-32", "m": "FIQIH", "n": 32, "q": "Jelaskan pengertian dari istihadhah!\n Jawab: \nDarah yang keluar diluar waktu haid dan nifas, biasanya disebabkan karena gangguan medis atau hormonal.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-33", "m": "FIQIH", "n": 33, "q": "Apa saja yang di haromkan bagi orang yang sedang berhadas besar? \nJawab: \nperkara yang di haromkan bagi orang yang sedang berhadas besar seperti, junub, haid, dan nifas, yaitu: melakukan sholat, menyentuh mushaf, membaca alquran, masuk masjid, thowaf di ka'bah.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-34", "m": "FIQIH", "n": 34, "q": "Jelaskan lah pengertian sholat secara lughot! \nJawab: \nSholat berasal dari bahasa arab yakni assholah(do'a) yang merujuk pada makna rahmat dan permohonan kepada Allah.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-35", "m": "FIQIH", "n": 35, "q": "Sholat secara syara' adalah? \nJawab: \nPerbuatan dan perkataan yang di awali dengan takbir dan di akhiri dengan salam", "t": "Mudah", "k": "A"}, {"id": "FIQIH-36", "m": "FIQIH", "n": 36, "q": "Kapan waktu sholat dhuhur?\nJawab:\nWaktu sholat dhuhur yaitu ketika tergelincirnya matahari  kearah barat setelah mencapai puncaknya(zawal) dan berlangsung hingga bayangan suatu benda menyamai bendanya", "t": "Mudah", "k": "A"}, {"id": "FIQIH-37", "m": "FIQIH", "n": 37, "q": "Kapan waktu sholat shubuh? \nJawab:\nYaitu mulai dari terbit fajar(fajar Shodiq) hingga sebelum terbit matahari", "t": "Mudah", "k": "A"}, {"id": "FIQIH-38", "m": "FIQIH", "n": 38, "q": "Apakah keutamaan nya sholat berjama'ah? \nJawab: \nSholat berjama'ah memiliki banyak keutamaan yang sangat besar, pahala yang lebih besar, Seperti sabda Rosulullah SAW. Sholat nya orang yang berjama'ah itu lebih utama dari pada sholat sendirian, dengan 27 derajat(HR. Bukhari dan Muslim).", "t": "Mudah", "k": "A"}, {"id": "FIQIH-39", "m": "FIQIH", "n": 39, "q": "Kapan saja waktu sholat yang di makruh kan? \nJawab: \nWaktu sholat yang di makruh kan adalah waktu-waktu tertentu dimana umat islam di sarankan untuk tidak melakukan sholat fardhu. Adapun waktunya yaitu ketika setelah sholat shubuh sampai terbit matahari, saat matahari tepat terbit, saat matahari tepat ditengah langit(zawal)", "t": "Mudah", "k": "A"}, {"id": "FIQIH-40", "m": "FIQIH", "n": 40, "q": "Apa perbedaan dari fajar Shodiq dan fajar kadzib? \nJawab: \nPenjelasan tentang fajar shodiq yaitu cahaya fajar yang benar, cahaya putih yang menyebar, melintang di ufuk timur, menandakan bahwa sholat shubuh telah di mulai, sedangkan fajar kadzib adalah fajar palsu, yaitu cahaya fajar yang semu, cahaya yang muncul seperti sabit atau membelah langit dengan warna kemerahan.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-41", "m": "FIQIH", "n": 41, "q": "Jelaskan  apa definisi adzan secara syara' dan lughot! \nJawab: \nSecara bahasa atau lughot, adzan adalah memberitahukan atau mengumumkan, makna ini sesuai bahwa adzan adalah pemberitahukan bagi umat islam tentang masuknya waktu sholat, sedangkan adzan secara syara' adalah rangkaian lafadz tertentu yang di syari'atkan untuk mengumandangkan sebagai tanda masuknya waktu sholat fardhu.", "t": "Susah", "k": "A"}, {"id": "FIQIH-42", "m": "FIQIH", "n": 42, "q": "Bagaimana hukumnya seseorang yang mendengar adzan tapi tidak mau menjawab adzan? \nJawab:\nDalam islam mendengar adzan adalah  panggilan untuk melaksanakan sholat, dan menjawab adzan hukumnya sunnah mu'akkadah, tidak menjawab adzan tidak dihukumi dosa, tetapi seseorang kehilangan pahala besar karena menghilangkan sunnah ini", "t": "Mudah", "k": "A"}, {"id": "FIQIH-43", "m": "FIQIH", "n": 43, "q": "Ada berapa syarat- syarat wajibnya sholat jum'at? Sebutkan! \nJawab: \nSyarat wajibnya sholat jum'at ada 7,yaitu: islam, baligh, berakal, Laki-laki, sehat, Mukim dan aman.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-44", "m": "FIQIH", "n": 44, "q": "Bagaimana hukumnya seseorang yang melewati didepan orang yang sedang sholat? \nJawab: \nDalam islam melewati didepan orang yang sedang sholat hukumnya terlarang, berdasarkan hadist Nabi, beliau bersabda:\" Seandainya orang yang lewat didepan orang yang sedang sholat mengetahui dosa yang dia pikul, maka dia akan memilih untuk berhenti selama 40(hari, bulan, ataupun tahun) daripada melewati didepannya. (HR. Bukhari dan Muslim).", "t": "Mudah", "k": "A"}, {"id": "FIQIH-45", "m": "FIQIH", "n": 45, "q": "Sebutkan syarat sahnya sholat jum'at! \nJawab: \nDilaksanakan di waktu dzuhur, di lakukan secara berjamaah(minimal diikuti oleh 40 orang menurut sebagian besar ulama'), dilaksanakan dei tempat yang tetap, didahului dua khutbah, tidak ada sholat jum'at di tempat yang sama.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-46", "m": "FIQIH", "n": 46, "q": "Sebutkan rukun-rukunnya khutbah! \nJawab: \nDukunnya khutbah yaitu, memuji kepada Allah, membaca sholawat Nabi, berwasiat untuk bertakwa kepada Allah, membaca alquran pada salah satu khutbah, mendo'akan kaum muslimin pada khutbah kedua", "t": "Mudah", "k": "A"}, {"id": "FIQIH-47", "m": "FIQIH", "n": 47, "q": "Apa hukum melaksanakan sholat 2 hari raya('idul fitri dan 'idul adha)? \nJawab: \nHukum tersebut ada perbedaan dari para ulama', menurut madzhab hanafi sholat 'id hukumnya fardu 'ain, wajib bagi setiap undividu, menurut madzhab maliki dan syafi'i hukumnya sunnah mu'akkadah(sangat di anjurkan), meskipun bukan kewajiban, tapi pelaksanaan nya sangat di tekankan, karena nabi selalu melaksanakannya, dan menurut madzhab Hanbali hukumnya fardhu kifayah", "t": "Susah", "k": "A"}, {"id": "FIQIH-48", "m": "FIQIH", "n": 48, "q": "Berapakah takbir yang terdapat  dalam roka'at pertama sholat 'id?\nJawab:  \nYaitu ada 7 takbir, dan setiap takbirnya di ikuti dengan bacaan tasbih", "t": "Mudah", "k": "A"}, {"id": "FIQIH-49", "m": "FIQIH", "n": 49, "q": "Sebutkan apa saja sholat sunnah yang sangat di anjurkan(sunnah mu'akkadah)! \nJawab: \nSholat sunnah mu'akkad terdiri dari, sholat rowatib, sholat witir, sholat tahajjud, sholat 2 'id(idhul fitri dan 'idul adha), sholat 2 gerhana(bulan dan matahari), sholat tarawih, istisqo', dan sholat dhuha", "t": "Mudah", "k": "A"}, {"id": "FIQIH-50", "m": "FIQIH", "n": 50, "q": "Jelaskan apa yang di maksud dengan sholat istisqo'! \nJawab: \nSholat istisqo' adalah sholat sunnah yang di lakukan untuk memohon hujan kepada Allah, sholat ini biasanya di lakukan ketika kekeringan air yang berkepanjangan", "t": "Mudah", "k": "A"}, {"id": "FIQIH-51", "m": "FIQIH", "n": 51, "q": "Jelaskan bagaimana tata caranya sholat istisqo'! \nJawab: \nCaranya dengan niat melakukan sholat istisqo', dengan dua rokaat, khutbah, do'a khusus, bertaubat dan memperbanyak amal.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-52", "m": "FIQIH", "n": 52, "q": "Sholat khouf adalah? \nJawab: \nSholat yang di lakukan dalam keadaan darurat atau genting ketika menghadapi musuh dalam perang atau dalam keadaan mengancam jiwa.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-53", "m": "FIQIH", "n": 53, "q": "Apa  saja syarat- syaratnya sholat istisqo'? \nJawab: \nAdapun syaratnya yaitu, mengubah penampilan yang lebih sederhana, meninggalkan kemaksiatan, puasa dan beramal.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-54", "m": "FIQIH", "n": 54, "q": "Apa hukumnya seorang laki-laki memakai pakaian dari sutra? \nJawab: \nDalam islam laki-laki yang memakai pakaian dari sutra hukumnya harom, berdasarkan dalil dari alquran dan hadist: Rosulullah SAW.bersabda bahwa, \"janganlah kalian memakai sutra, karena barangsiapa memakainya di dunia, ia tidak akan memakainya di akhirat.\" ( HR. Al Bukhari dan Muslim)", "t": "Mudah", "k": "A"}, {"id": "FIQIH-55", "m": "FIQIH", "n": 55, "q": "Apa saja yang di wajibkan bagi mayit? \nJawab: \nPerkara yang wajib bagi mayit adalah: memandikan mayit, mengafani mayit, mensholati mayit, mengkubur mayit.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-56", "m": "FIQIH", "n": 56, "q": "Apa yang di namakan zakat secara lughot? \nJawab: \nZakat secara lughot adalah berasal dari bahasa arab زكاة yang berarti tumbuh, bersih, suci dan berkah. Kata ini mencerminkan makna pencucian harta dan jiwa.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-57", "m": "FIQIH", "n": 57, "q": "Zakat terbagi menjadi berapa? Sebutkan! \nJawab: \nZakat terbagi menjadi 2 bagian, yaitu: zakat fitrah dan zakat mal.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-58", "m": "FIQIH", "n": 58, "q": "Zakat fitrah adalah?\n Jawab: \nzakat fitrah adalah zakat yang wajib di keluarkan oleh orang muslim pada bulan romadhon sebelum sholat idulfitri", "t": "Mudah", "k": "A"}, {"id": "FIQIH-59", "m": "FIQIH", "n": 59, "q": "Jelaskan apa yang di maksud zakat mal! \nJawab: \nZakat mal adalah zakat harta benda yang di keluarkan dari kekayaan seseorang apabila telah memenuhi syarat-syarat tertentu(nishob dan haul).", "t": "Mudah", "k": "A"}, {"id": "FIQIH-60", "m": "FIQIH", "n": 60, "q": "Sebutkan siapa saja yang wajib menerima zakat! \nJawab: \nYaitu, fakir, miskin, ghorimin, amil zakat, muallaf, Ibnu sabil, dan fi sabilillah", "t": "Mudah", "k": "A"}, {"id": "FIQIH-61", "m": "FIQIH", "n": 61, "q": "Sebutkan syarat harta yang wajib di keluarkan zakatnya! \nJawab: \nHarta harus di dapat dengan cara baik dan halal, harta tersebut berkembang dan berpotensi untuk di kembangkan, misalnya melalui kegiatan usaha perdagangan dan lain-lain, milik penuh, harta tersebut di bawah kontrol kekuasaan pemiliknya, dan tidak tersangkut dengan hal orang lain, mencapai nishob, mencapai jumlah minimal yang menyebabkan harta terkena kewajiban zakat, sudah mencapai satu tahun", "t": "Susah", "k": "A"}, {"id": "FIQIH-62", "m": "FIQIH", "n": 62, "q": "Sebutkan hikmah yang terkandung dalam zakat! \nJawab: \nMensucikan jiwa manusia dari sifat keji, kikir, pelit, rakus dan tamak, membersihkan dan mensucikan orang yang menunaikan nya, melatih kerendahan hati, menghapus dosa", "t": "Mudah", "k": "A"}, {"id": "FIQIH-63", "m": "FIQIH", "n": 63, "q": "Apa yang di maksud dengan aqiqah? \nJawab: \nAqiqah dari segi bahasa yang berarti rambut yang tumbuh di kepala bayi, sedangkan dari segi istilah adalah binatang yang di sembelih pada saat hari ketujuh dari kelahiran bayi disertai dengan mencukur rambut dan memberi nama pada anak yang baru di lahirkan.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-64", "m": "FIQIH", "n": 64, "q": "Jelaskan ketentuannya dari pembagian qurban! \nJawab: \nDaging qurban sebaiknya di bagikan kepada fakir miskin masih daging mentah, dengan ketentuan, \n1. 1/3 untuk yang berqurban dan keluarganya, \n2. 1/3 untuk fakir miskin, \n3. 1/3 untuk hadiah kepada masyarakat sekitar atau disimpan agar se waktu-waktu bisa di manfaatkan", "t": "Susah", "k": "A"}, {"id": "FIQIH-65", "m": "FIQIH", "n": 65, "q": "Apa yang anda ketahui tentang macam-macam penganiayaan? \nJawab: \npenganiayaan berat yaitu perbuatan melukai atau merusak bagian badan yang menyebabkan hilangnya fungsi atau manfaat anggota badan tersebut, seperti memukul tangan hingga patah, sedangkan penganiayaan ringan yaitu perbuatan melukai anggota badan yang tidak sampai merusak atau menghilangkan fungsinya melainkan hanya menimbulkan cacat ringan", "t": "Mudah", "k": "A"}, {"id": "FIQIH-66", "m": "FIQIH", "n": 66, "q": "Ada berapakah macamnya zina? Sebutkan!\n Jawab: \nZina mukhson dan ghoiru mukhson", "t": "Mudah", "k": "A"}, {"id": "FIQIH-67", "m": "FIQIH", "n": 67, "q": "Apa yang di maksud dari zina mukhson? \nJawab: \nZina mukhson adalah perbuatan zina yang di lakukan seseorang yang sudah menikah, baik suami, istri, janda ataupun duda. Had yang di dapatkan untuk pezina mukhson adalah rajam hingga mati", "t": "Mudah", "k": "A"}, {"id": "FIQIH-68", "m": "FIQIH", "n": 68, "q": "Jelaskan pengertian dari pembunuhan! \nJawab: \nmelenyapkan nyawa seseorang dengan sengaja atau tidak sengaja, dengan menggunakan alat yang mematikan atau tidak", "t": "Mudah", "k": "A"}, {"id": "FIQIH-69", "m": "FIQIH", "n": 69, "q": "Sebutkan macam-macam pembunuhan! \nJawab: \nqotl al-amdin(pembunuh sengaja), qotl al-shibhi al-amdin(pembunuhan seperti sengaja), qotl al-khata'(pembunuhan tersalah)", "t": "Mudah", "k": "A"}, {"id": "FIQIH-70", "m": "FIQIH", "n": 70, "q": "Jelaskan hikmah utama di berlakukan nya diyat \nJawab: \nHikmah utama di berlakukan nya diyat bagi pelaku tindak pembunuhan atau penganiayaan adalah mencegah pertumpahan darah serta sebagai obat hati dari rasa dendam keluarga korban terhadap pelaku tindak pidana pembunuhan", "t": "Mudah", "k": "A"}, {"id": "FIQIH-71", "m": "FIQIH", "n": 71, "q": "Sebutkan 3 golongan yang tidak boleh menerima zakat! \nJawab: \nOrang kaya, keturunan Nabi, dan orang yang masih menanggung kewajiban nafkah", "t": "Mudah", "k": "A"}, {"id": "FIQIH-72", "m": "FIQIH", "n": 72, "q": "Apa yang di maksud dengan puasa secara syara' adalah? \nJawab: \nYaitu menahan diri hal-hal yang membatalkan seperti, makan, minum, berhubungan suami istri, mulai terbit fajar sampai terbenamnya matahari dengan niat tertentu", "t": "Mudah", "k": "A"}, {"id": "FIQIH-73", "m": "FIQIH", "n": 73, "q": "Apa saja syarat-syaratnya puasa? Sebutkan! \nJawab: \nsyarat wajibnya puasa yaitu:islam, baligh, berakal, tidak dalam perjalan jauh, mampu secara fisik, suci dari haid dan nifas.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-74", "m": "FIQIH", "n": 74, "q": "Apa saja perkara yang membatalkan puasa?\nJawab:\nmakan dan minum dengan sengaja, berhubungan badan di siang hari bulan romadhon, muntah dengan sengaja, haid, nifas, memasukkan sesuatu kedalam lubang yang ada di tubuh.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-75", "m": "FIQIH", "n": 75, "q": "Apa hukumnya seorang makmum yang ketika sholat gerakannya mendahului imam? \nJawab: \nGerakan makmum yang mendahului imam dianggap tidak sesuai dengan tuntunan syari'at, dan hukumnya tergantung sejauh mana pelanggaran itu di lakukan, jika mendahului secara sengaja maka hukumnya makruh bahkan sampai harom jika di lakukan  dengan tanpa udzur, jika tidak sengaja karena kurang konsentrasi, maka hukumnya makmum tidak berdosa, tetapi makmum wajib segera menyesuaikan diri dengan imam.", "t": "Susah", "k": "A"}, {"id": "FIQIH-76", "m": "FIQIH", "n": 76, "q": "Kapan saja waktu yang di haromkan untuk berpuasa?\n Jawab: \nDalam islam ada beberapa waktu dimana dilarang puasa berdasarkan hadist Nabi, yaitu: di hari raya idul fitri dan idul adha, di hari tasyriq(11, 12,13)dzulhijjah, dan pada hari syak(hari yang di ragukan).", "t": "Mudah", "k": "A"}, {"id": "FIQIH-77", "m": "FIQIH", "n": 77, "q": "Apa saja kafarah nya bagi seseorang yang berzina disiang hari bulan romadhon? \nJawab: \nkafarah nya yaitu membebaskan seorang budak, jika memungkinkan, jika tidak mampu berpuasa dia bulan berturut-turut, jika tidak mampu memberi makan 60 orang miskin, Masing-masing nya 1 mud.", "t": "Mudah", "k": "A"}, {"id": "FIQIH-78", "m": "FIQIH", "n": 78, "q": "I'tikaf secara syara' adalah? \nJawab: \nBerdiam diri didalam masjid dengan niat mendekatkan diri kepada Allah SWT, disertai dengan ibadah seperti sholat, membaca al-quran, berdzikir, dan berdo'a. Adapun dalil tentang i'tikaf terdapat dalam alquran suroh Al-Baqarah:187 \"Dan janganlah kamu campuri mereka itu sedang kamu  ber'i'tikaf di dalam masjid\".", "t": "Mudah", "k": "A"}, {"id": "FIQIH-79", "m": "FIQIH", "n": 79, "q": "Apa saja rukun-rukunnya i'tikaf? \nJawab: \nRukun-rukunnya i'tikaf yaitu: niat, berdiam di masjid, dan orang yang ber'i'tikaf yakni muslim, berakal, dan suci dari hadas besar", "t": "Mudah", "k": "A"}, {"id": "FIQIH-80", "m": "FIQIH", "n": 80, "q": "Bagaimana cara seseorang yang tidak mampu berdiri ketika sholat? \nJawab: \nDalam islam sholat fardhu tetap wajib di lakukan sesuai kemampuan fisik seseorang, sebagaimana yang di ajarkan oleh Rosulullah SAW:\"Sholatlah sambil berdiri, jika tidak mampu sambil duduk, dan jika tidak mampu sambil berbaring\" (HR. Bukhari no. 1117). Yakni ketika seseorang muslim tidak mampu berdiri ketika sholat maka boleh dengan duduk, jika tidak mampu maka dengan berbaring(terlentang menghadap kiblat), dan jika tidak mampu maka menggunakan isyaroh mata atau hati.", "t": "Susah", "k": "A"}, {"id": "FIQIH-81", "m": "FIQIH", "n": 81, "q": "Jelaskan pengertian hajji secara syara'! \nJawab: \nIbadah yang di lakukan dengan sengaja berkunjung ke Baitullah(ka'bah) di Makkah untuk melaksanakan rangkaian amalan tertentu, seperti wukuf di Arafah, thowaf, sa'i dan ritual lainnya, sesuai dengan syarat-syarat, rukun, dan tata cara yang telah di tetapkan dalam syari'at islam", "t": "Mudah", "k": "A"}, {"id": "FIQIH-82", "m": "FIQIH", "n": 82, "q": "Sebutkan apa saja rukun-rukunnya haji!\nJawab:\nrukun-rukunnya yaitu, ihrom, wukuf di Arafah, thowaf, sa'i, tahallul dan tertib", "t": "Mudah", "k": "A"}, {"id": "FIQIH-83", "m": "FIQIH", "n": 83, "q": "Apa saja dan yang wajib di dalam ihrom? \nJawab:\nDalam keadaan ihrom, baik haji maupun umroh, ada sejumlah larangan  yang jika di langgar akan mewajibkan pelaku membayar denda, seperti, memakai pakaian yang di jahit untuk laki-laki, menutup kepala bagi laki-laki,menutup wajah bagi perempuan, memakai wangi-wangian, memotong rambut dan kuku, melakukan hubungan suami istri, membunuh binatang atau mengganggu hewan buruan", "t": "Susah", "k": "A"}, {"id": "FIQIH-84", "m": "FIQIH", "n": 84, "q": "Jelaskan pengertian dari fidyah! Dan siapa saja seseorang yang di wajibkan untuk membayar fidyah? \nJawab: \nFidyah adalah kompensasi yang di bayarkan oleh orang muslim ketika tidak dapat melaksanakan kewajiban berpuasa di bulan romadhon, dengan  alasan-alasan tertentu, orang yang wajib membayar fidyah, yaitu orang tua yang sudah lanjut usia karena kelemahan fisiknya, orang yang sakit kronis atau tidak dapat disembuhkan, wanita hamil atau menyusui karena khawatir akan diri dan kesehatan anaknya jika ia berpuasa", "t": "Susah", "k": "A"}, {"id": "FIQIH-85", "m": "FIQIH", "n": 85, "q": "Apa hukumnya seorang muslim memelihara anjing? \nJawab: \nDalam islam hukum memelihara anjing memiliki perincian tertentu, berdasarkan tujuan dan niatnya, 1.di perbolehkan dengan tujuan tertentu, Seperti untuk berburu sesuai dengan suroh Al-Ma'idah:4, anjing yang terlatih untuk berburu di perbolehkan, asalkan hewan yang di tangkap nya disembelih secara syari'at, untuk menjaga keamanan rumah. Tidak diperbolehkan tanpa kebutuhan  syari'at seperti memelihara anjing di rumahnya tanpa kebutuhan tertentu, hanya sekedar hoby, maka tidak diperbolehkan, karena dalam madzhab Hanbali, syafi'i dan maliki mengatakan bahwa air liurnya anjing di anggap najis mugholladzoh, sehingga menyulitkan untuk membersihkannya", "t": "Susah", "k": "A"}, {"id": "FIQIH-86", "m": "FIQIH", "n": 86, "q": "Apa definisi dari buyu'(jual beli) secara syara'? \nJawab: \nSecara syara'(hukum islam) jual beli adalah pertukaran harta dengan harta atas dasar kerelaan kedua belah pihak yang di lakukan dengan akad dan ijab qobul sesuai dengan aturan syari'at islam.", "t": "Mudah", "k": "B"}, {"id": "FIQIH-87", "m": "FIQIH", "n": 87, "q": "Sebutkan syarat-syaratnya jual beli! \nJawab: \nSyaratnya yaitu adanya penjual dan pembeli berakal sehat, baligh(harus mempunyai kemampuan untuk memahami transaksi tersebut), barang atau jasa yang di jual harus suci dan halal, harga harus jelas dan di sepakati kedua belah pihak, ijab dan qobul(akad).", "t": "Mudah", "k": "B"}, {"id": "FIQIH-88", "m": "FIQIH", "n": 88, "q": "Jelaskan bagaimana suatu perbuatan bisa di katakan riba! \nJawab: \nSuatu transaksi yang mana melibatkan pinjaman uang atau barang
