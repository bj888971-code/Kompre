َ. وَقَالَ ابْنُ عَبَّاسٍ: كُنْتُ أَعْلَمُ إِذَا انْصَرَفُوا بِذَلِكَ إِذَا سَمِعْتُهُ.\n\nSesungguhnya Ibnu Abbas RA memberitahu pelayannya yang bernama Abu Ma’bad, ia berkata: Bahwa mengerasakan suara dalam berdzikir ketika orang-orang selesai shalat maktubah itu sudah ada pada masa Nabi SAW. Ibnu Abbas berkata: Saya mengetahui bahwa mereka telah selesai melaksan akan shalat ketika saya mendengarnya. (Imam al-Bukhari dalam Shahih al-Bukhari, 1, 168, No. 841).  Dasar dari pendapat para ulama’.\na.\tImam Ibnu Al-Jauzi\nImam Ibnu Jauzi dalam kitabnya “Khusn al-Khosin”menjelaskan bahwa: “setiap dzikir yang disyariatkan, baik dalam kategori wajib maupun sunnah,tidak akan diberi pahala kecuali telah diucapkanminimal dapat didengar oleh dirinya sendiri.\nb.\tImam Abdul Wahab As-Sya’roni\nPara ulama’ berijma’ atas wajibnya dzikir dengansuara keras.\nSyeh Ibnu ‘Athoillah As-Sakandari\nSyeh Ibnu ‘Athoillah berpendapat dengan dibolehkannya dzikir dengan suara keras ketika dalamkondisi dzikir bersama-sama.", "t": "Susah", "k": "A"}, {"id": "NU-13", "m": "NU", "n": 13, "q": "Bagaimana hukumnya bersalaman setelah sholat dan apa dasar hukum yang melandasi argumentasi anda?.\njawab :\nBersalaman setelah shalat adalah sesuatuyang dianjurkan dalam islam karena bisa menambah eratnya persaudaraan sesama umat Islam.Aktifitas ini sama sekali tidak merusak shalat seseorang karena dilakukan setelah prosesi shalat selesai dengan sempurna.Berikut ini adalah beberapa dalilnya.\n\nDiriwayatkan dari al-Barro’ dari Azib RA. Rasulullah SAW bersabda, “Tidaklah ada dua orang muslim yang saling bertemu kemudian saling bersalaman kecuali dosa-dosa keduanya diampunioleh Allah sebelum berpisah.” (HR. Abu Daawud)\n\nhal tersebut juga di perkuat dengan hadis yang diriwayatkan oleh HR. Bukhori.\n \nDari Qatadah, ia berkata, “Saya bertanya kepada Anas bin Malik, ‘Apakah para shahabat nabiMuhammad Saw bersalaman?”. Anas bin Malik menjawab, “Ya”. (HR. al-Bukhari).\nDiriwayatkan dari sahabat Yazid bin Aswadbahwa ia shalat subuh bersama Rasulullah, lalusetelah shalat para jamaah berebut untuk menyalami nabi (HR Bukhori. hadist ke.3360)\nPendapat para ulama’\na.\tPendapat Imam Thohawi.\nImam al-Thohawi dalam kitabnya “hasiyahmaroqil falah” berkata: bahwa bersalaman setelahshalat adalah sunnah dan begitu juga setiap berjumpa dengan sesama muslim.\nb.\tPendapat Syekh Abdul Aziz bin Baz\nAda seseorang yang bertanya kepada Syekh Abdul Aziz bin Baz: ada sebagian orang yang shalat, setelah menunaikan shalat Tahyatal-masjid, iamenoleh ke kanan lalu bersalaman kepada orang yang ada di sebelah kanannya, ia menoleh kekiri dan bersalaman dengan orang yang berada di sebelah kirinya, apa hukumnya? Semoga Allahmemberikan balasan kebaikan kepada Anda. Syekh Abdul Aziz bin Baz  menjawab : Bismillah, walhamdulillah. Sunnah hukumnya bersalaman dengan orang yang beradadi sebelah kanan dan kiri setelah selesai shalat. Rasulullah Saw ketika bertemu dengan parashahabatnya, ia bersalaman dengan mereka. Ketika para shahabat bertemu, mereka jugabersalaman. Apabila orang yang shalat datang ke masjid, ia sampai di dalam shaf, makahendaklah ia mengucapkan salam sebelum shalat. Setelah shalat, ia bersalaman dengan orangyang berada di sebelah kanan dan kirinya jika ia belum bersalaman dengan mereka sebelumshalat karena itu mengikuti perbuatan Rasulullah Saw.\nc.\tPendapat Imam an-Nawawi\nJika ia sudah bersalaman sebelum shalat, (kemudian ia ulang lagi setelah shalat), maka itu mubah(boleh), sebagaimana yang telah kami sebutkan.Jika ia bersalaman dengan seseorang setelah shalat, orang tersebut belum bersalaman dengannyasaat bertemu sebelum shalat, maka bersalaman itu sunnah menurut ijma’ berdasarkan haditshadits shahih tentang itu. Asal bersalaman itu sunnah. Bahwa ada orang-orang yang bersalaman pada waktu-waktu tertentu(misalnya setelah selesai shalat), maka itu tidak mengeluarkannya dari asal Sunnah.", "t": "Susah", "k": "A"}, {"id": "NU-14", "m": "NU", "n": 14, "q": "Tasbih banyak digunakan oleh umat islam khusus nya kaum nahdyin untuk membantu menghitung jumlah hitungan dzikir baik itu sholawat, istighfar, dll. Disisi lain, ada beberapa golongan yang bependapat bahwa hal tersebut tidak berdasar pada sumber agama Islam dan Meniru budaya atau kebiyasaan hindu budha. Apakah pandangan tersebut bisa dibenarkan?. \nJawab :\nMenggunakan tasbih (butiran tasbih) sebagai alat hitung untuk berdzikir di perbolehkan. Sebagian sahabat juga ada yang menggunakannya dimasa rosulullah salah satunya adalah Abu Hurairoh. Hal tersebut dibuktikan dengan hadist yang diriwayatkan oleh Abu Daud.\n \nDari Nu’aim bin al-Muharrar bin Abi Hurairah, dari Abu Hurairah Kakeknya, sesungguhnya\nAbu Hurairah memiliki benang, pada benang itu ada seribu simpul, Abu Hurairah tidak tidur\nhingga ia bertasbih menggunakan (seribu simpul itu).\nPendapat Ulama’\nA.\tPendapat Syekh Ibn ‘Utsaimin\nSesungguhnya bertasbih menggunakan Tasbih tidak dianggap berbuat bid’ah dalam agama, karena maksud bid’ah yang dilarang adalah bid’ah dalam agama. Sedangkan bertasbih menggunakan Tasbih adalah cara untuk menghitung jumlah bilangan (zikir). Tasbih adalah sarana yang marjuhah (lawan rajih/kuat) dan mafdhulah (lawan afdhal). Afdhalnya menghitung tasbih itu dengan jari jemari.\nB.\tPendapat Imam Ibnu Taimiah\nMenghitung tasbih dengan jari jemari adalah sunnah, sebagaimana sabda Rasulullah Saw kepadawanita, “Bertasbihlah, hitunglah dengan jari jemari, sesungguhnya jari jemari itu adalah ditanyadan akan dibuat berbicara”. Adapun menghitung zikir dengan biji-bijian atau batu-batu kecil danseperti itu, maka baik. Sebagian shahabat melakukan itu. Rasulullah Saw melihat UmmulMu’minin bertasbih menggunakan batu-batu kecil dan Rasulullah Saw mengakuinya.Diriwayatkan bahwa Abu Hurairah bertasbih menggunakannya\nC.\tPendapat Imam asy-Syaukani berkata.\nImam as-Suyuthi telah menyebutkan beberapa atsar dalam satu juz yang beliau beri judul alMin-hah fi as-Sab-hah, kitab yang tergaung dalam al-Fatawa (kumpulan fatwa), di akhirnya\nbeliau katakana, “Tidak ada riwayat dari seorang pun, baik dari kalangan Salaf maupun Khalaftentang larangan berzikir menggunakan tasbih, bahkan sebagian besar mereka menganggapnyadipakai saat berzikir, mereka tidak memakruhkannya.", "t": "Susah", "k": "A"}, {"id": "NU-15", "m": "NU", "n": 15, "q": "Apa perbedaan karomah dan istidjroj?.\nJawab :\nKaromah adalah kelebihan yang diberikan oleh Allah kepada orang-orang shalih ataupara waliyullah. Kelebihan ini dapat berupa pengetahuan sebelum terjadinya peristiwa atauhal-hal lainnya yang tidak sesuai kebiasaanyang berlaku umum. Misalnya dapat mengetahui akan kedatangan seorang tamu, padahal belum ada seorang pun yang memberitahunya.\nSedangkan istidraj adalah kelebihan yangdimiliki oleh orang-orang kafir.\n\nDalil tentang karamah Hadits dari Abu Hurairoh RA dari RasulullahSAW. Ada seorang lelaki menaiki punggung sapi yang sudah membawa beban. Kemudian sapi itu menoleh kepadanya dan berkata, “Sesungguhnyaaku bukan diciptakan untuk hal semacam ini. Sesungguhnya aku diciptakan untuk membajak.”Orang-orang yang mendengar cerita ini berkata, “Maha Suci Allah yang menciptakan sapi bisabicara.”Lalu Rasulullah SAW bersabda, “ Aku mempercayai hal ini, Aku, Abu Bakar dan Umar.” (HRBukhori Muslim) Pendapat para ulama’ tentang karamah.\n\nImam Ibnu Taimiyah Ibnu Taimiyah berkata dalam kitabnya “aqidah wasithiyah” bahwa : salah satu landasan aqidah ahlusunnah adalah mempercayai adanya karamah para wali Allah.", "t": "Susah", "k": "A"}, {"id": "NU-16", "m": "NU", "n": 16, "q": "Sebutkan beberapa keutamaan membaca Surah Yaasiin?.\nJawab :\nMembaca Surat Yasin memiliki keutamaannya tersendiri bagi seorang Muslim. \nMembaca Surat tersebut maka akan diganjar pahala yang besar karena begitu besarnya keutamaan Surah Yasin sebagaimana sabda Rasulullah SAW.\nBeberapa perawi hadits, yaitu ad-Darimi, at-Tarmidzi, dan al-Baihaqi memasukkan surah tersebut ke dalam Syu'abul Iman, yang artinya surah Yasin menjadi salah satu cabang iman. Para perawi tersebut meriwayatkan dari Anas bin Malik, yang di dalamnya Rasulullah SAW bersabda, \"Sesungguhnya segala sesuatu memiliki hati, dan hati Alquran adalah (Surah) Yasin. Siapa yang membacanya (Surah Yasin), Allah memberikan pahala sama seperti membaca Al quran sepuluh kali.\"\n\nAdapun beberapa fadhilah atau keutamaan membaca surah yasiin adalah sebagai beriku :\nA.\tDiampuni Dosa\nKeutamaan surat Yasin yang pertama dijelaskan dalam hadis riwayat At Thabrani. Dalam hadis tersebut disebutkan bahwa saat seseorang membaca surat Yasin di malam hari, maka keesokan paginya dosa-dosa orang tersebut akan diampuni.\n\nDalam sebuah hadis dari Abu Hurairah RA, Rasulullah SAW bersabda:\n“Siapa yang membaca (surat) Yasin pada malam hari dengan mengharap keridaan Allah maka diampuni dosa-dosanya,” (HR At Thabrani dan Al-Bayhaqi).\nB.\tDianggap Mati Syahid \nDalam riwayat At-Thabrani juga dijelaskan bahwa seseorang yang rutin membaca surat Yasin setiap malam hari, maka dia akan dipermudah ajalnya. Bahkan, saat meninggal orang tersebut dalam keadaan syahid. Dalam sebuah hadis dari Anas bin \nMalik, bahwa Rasulullah SAW bersabda: “Barang siapa yang membiasakan membaca Yasin setiap malam maka tanpa terduga dia menemui ajalnya, maka matinya dalam keadaan syahid,” (HR At-Thobroni).\nC.\tMendapatkan Ketenangan Hati\nMembaca Alquran sama halnya dengan berzikir. Seseorang yang memperbanyak zikir maka hatinya akan tenang. Itulah keutamaan surat Yasin dan surat lain dalam Alquran bagi orang-orang yang sering membacanya. Dalam Alquran Allah SWT berfirman: “(yaitu) Orang-orang yang beriman dan hati mereka manjadi tenteram dengan mengingat Allah. Ingatlah, hanya dengan mengingati Allah-lah hati menjadi tenteram,” (QS Ar-Ra’ad :28).\nD.\tMeningkatkan Keimanan dan Pahala\nApabila seseorang membaca surat Yasin dengan memahami artinya, maka orang tersebut akan memahami betapa besar keagungan Allah SWT. Bahwa betapa mengerikannya kematian dan bagaimana perjuangan para pendakwah di masa lalu demi membela islam. Tentunya hal ini bisa membuat keimanan seseorang semakin bertambah. Selain itu, Rasulullah SAW bersabda: “Surat Yasin adalah jantung Alquran. Dan siapa yang membaca Yasin akan diberikan pahala sama seperti 10 kali membaca Alquran,” (HR At-Tirmidzi dan Ad-Darimi).\nE.\tMendapatkan Kemuliaan\nPada dasarnya, setiap surat di dalam Alquran itu memberikan kebaikan. Dengan membaca Alquran secara rutin termasuk juga surat Yasin, maka seseorang akan dimuliakan oleh Allah SWT. Sebagaimana dijelaskan dalam hadis:\n\n“Siapa yang membaca Alquran dan beramal dengan isi kandungannya, dianugerahkan kedua ibu bapaknya mahkota di hari kiamat. Cahayanya (mahkota) lebih baik dari cahaya matahari di rumah-rumah dunia. Kalaulah demikian itu matahari berada di rumahmu (dipenuhi dengan sinarnya), maka apa sangkaan kamu terhadap yang beramal dengan ini (Alquran),” (HR Abu Daud).", "t": "Susah", "k": "A"}, {"id": "NU-17", "m": "NU", "n": 17, "q": "Jelaskan pengertian bidah menurut pendapat ulama’ yg mashur?\nJawab :\nPengertian Bid’ah menurut beberapa Ulama adalah sebagai berikut :\n•\tPendapat Imam asy-Syathibi \nSuatu cara/kebiasaan dalam agama Islam, cara yang dibuat-buat, menandingi syariat Islam,tujuan melakukannya adalah sikap berlebihan dalam beribadah kepada Allah Swt.\n•\tPendapat Imam an-Nawawi\nPara ahli bahasa berkata, bid’ah adalah semua perbuatan yang dilakukan, tidak pernah ada contoh sebelumnya.  Hal tesebut disampaikan oleh Imam an-Nawawi  dalam kitabnya al-Minhaj Syarh Shahih Muslim bin al-Hajjaj, juz.VI\n•\tPendapat al-Hafizh Ibnu Hajar al-‘Asqalani\nSegala sesuatu yang dibuat-buat tanpa ada contoh sebelumnya disebut bid’ah, apakah itu terpuji ataupun tercela.", "t": "Susah", "k": "A"}, {"id": "NU-18", "m": "NU", "n": 18, "q": "Sebutkan pembagian bida’h beserta pendapat ulama’ yg mashur dalam pembagian bidah?\nJawab :\nPembagian Bidah.\nMenurut para ulama’ bid’ah dalam ibadah dibagidua: yaitu bid’ah hasanah dan bid’ah dhalalah. Diantara para ulama’ yang membagi bid’ah ke dalamdua kategori ini adalah:\na.\tImam Syafi’i\nMenurut Imam Syafi’i, bid’ah dibagi dua; bid’ahmahmudah dan bid’ah madzmumah. Jadi bid’ahyang mencocoki sunnah adalah mahmudah, danyang tidak mencocoki sunnah adalah madzmumah.\nb.\tImam al-Baihaqi\nBid’ah menurut Imam Baihaqi dibagi dua; bid’ahmadzmumah dan ghoiru madzmumah. SetiapBid’ah yang tidak menyalahi al-Qur’an, Sunnah, danIjma’ adalah bid’ah ghoiru madzmumah.\nc.\tImam Nawawi\nBid’ah menurut Imam Nawawi dibagi menjadi dua;bid’ah hasanah dan bid’ah qobihah.\nd. Imam al-Hafidz Ibnu Katsir\nBid’ah dibagi menjadi dua; bid’ah yang terdapatpetunjuk nash (teks al-Qur’an/hadits) di dalamnya,dan bid’ah yang tidak ada petunjuk nash di dalamnya. Jadi setiap bentuk bid’ah yang menyalahi kitabdan sunnah adalah tercela dan harus diingkari.Akan tetapi bid’ah yang mencocoki keumumandalil-dalil nash, maka masuk dalam kategoti terpuji.", "t": "Susah", "k": "A"}, {"id": "NU-19", "m": "NU", "n": 19, "q": "Jelaskan tentang garis-garis besar pemikiran NU!\nJawab:\na.\tNU mengambil sumber ajaran Islam dari Al-Qur’an, Hadits, Ijma’ dan Qiyas\nb.\tNU mengikuti faham Ahlus Sunnah Wal jamaah\nc.\tNU dalam aqidah mengikuti faham Imam Abu Hasan Asy’ari dan imam Abu Mansur Al Maturidi\nd.\tNU dalam fiqih mengikuti 4 imam madzhab.\ne.\tNU dalam Tasyawuf mengikuti imam Junaedi Albagdai dan Imam Alghozali.", "t": "Mudah", "k": "A"}, {"id": "NU-20", "m": "NU", "n": 20, "q": "Jelaskan ciri-ciri sikap kemasyarakatan Nahdotul Ulama!\nJawab:\nAda 3 pendekatan kemsyarakatan NU.\na.\tTasawut dan I’tidal yaitu sikap moderat yang berpijak pada prinsip keadilan serta berusaha menghindari sikap extrim.\nb.\tTasamuh yaitu sikap toleran yang menghargai perbedaan pandangan dan kemajemukan identitas budaya masyarakat.\nc.\tTawazun yaitu sikap seimbang dalam berkhidmat dalam terciptanya keserasian antar sesama manusia.", "t": "Mudah", "k": "A"}, {"id": "NU-21", "m": "NU", "n": 21, "q": "Jelaskan ciri-ciri sikap kemasyarakatan Nahdotul Ulama!\nJawab: \nAda 3 pendekatan kemsyarakatan NU.\na.\tTasawut dan I’tidal yaitu sikap moderat yang berpijak pada prinsip keadilan serta berusaha menghindari sikap extrim.\nb.\tTasamuh yaitu sikap toleran yang menghargai perbedaan pandangan dan kemajemukan identitas budaya masyarakat.\nc.\tTawazun yaitu sikap seimbang dalam berkhidmat dalam terciptanya keserasian antar sesama manusia.", "t": "Mudah", "k": "A"}, {"id": "NU-22", "m": "NU", "n": 22, "q": "Ada 9 tokoh NU yang bergelar pahlawan Nasional, siapakah mereka…..\nJawab :\na. K.H Hasyim Asy’ari\nb. K.H Abdul Wahid Hasyim\nc. K.H Zainul Arifin\nd. K.H Zainul Mustafa\ne. K.H Idham Chalid\nf. K.H Abdul Wahab Hasbullah\ng. K.H As’ad Syamsul Arifin\nh. K.H Syam’un\ni. K.H Masykur", "t": "Mudah", "k": "A"}, {"id": "NU-23", "m": "NU", "n": 23, "q": "Siapakah tokoh NU yang berperan dalam pendidikan Nasional……\nJawab :\nBeliau adalah K.H Abdul Wahid Hasyim, putera kelima dari K.H Hasyim Asy’ari. Pada usia 20 tahun beliau mulai membantu menyusun kurikulum pesantren, dan beliau mengusulkan untuk mengubah system klasikal dengan system tutorial. Serta memasukkan materi ilmu pengetahuan umum ke pesantren.", "t": "Mudah", "k": "A"}, {"id": "NU-24", "m": "NU", "n": 24, "q": "Sebutkan tradisi amalaiyah NU yang umum di Masyarakat….\nJawab : \nAda 9 amaliyah orang NU yang umum di masyarakat yaitu…\n1) Tahlilan\n2) Ziarah kubur\n3) Maulid nabi\n4) Istighosah\n5) Qunut dalam solat subuh\n6) Talqin mayit\n7) Azan 2 kali dalam solaat jumat\n8) Tingkepan\n9) Merujuk kitab kuning", "t": "Mudah", "k": "A"}, {"id": "NU-25", "m": "NU", "n": 25, "q": "Ada berapakah Simbol Dalam Lambang NU? Sebutkan!.\nJawaban : \nada 8.\n• Bola dunia\n• Peta Indonesia\n• Bintang sembilan\n• Bintang satu besar diatas\n• Bintang empat diatas\n• Bintang empat dibawah\n• Ikatan tali\n• Tulisan Arab Nahdlotul Ulama", "t": "Mudah", "k": "A"}, {"id": "NU-26", "m": "NU", "n": 26, "q": "Siapakah tokoh dibalik berdirinya IPNU/IPPNU\nJawab : \nK.H Prof Mohammad Tolhah Mansur. Beliau lahir di Malang 10 september 1930 dan wafat pada 20 Oktober 1986.", "t": "Mudah", "k": "A"}, {"id": "NU-27", "m": "NU", "n": 27, "q": "Jelaskan apa yang dimaksud dengan Mu’tamar NU…..\nJawab : \nforum permusyawaratan tertinggi NU yang dilaksanakan untuk berbagai agenda yakni mengevaluasi kinerja kepengurusan, menyusun program baru, memilih pengurus untuk periode selanjutnya. Pertama kali dilaksanakan di Surabaya 21 Oktober 1926.", "t": "Mudah", "k": "A"}, {"id": "NU-28", "m": "NU", "n": 28, "q": "Kapan dan dimanakah Mu’tamar NU pertama kalinya dilaksanakan diluar pulau Jawa…\nJawab : \ndi Banjarmasin , 9 Juni 1936 M dengan hasil diantaranya\na. Perbedaan antara Al-Quran dan Hadis Qudsi \nb. Kentongan daan bedug yang dipukul untuk memberitahukan waktu solat.", "t": "Mudah", "k": "A"}, {"id": "NU-29", "m": "NU", "n": 29, "q": "Siapakah ketua tanfidziyah terpilih pada mu’tamar NU yang ke 27 di Situbondo……..\nJawab : \nbeliau adalah K.H Abdurrahman Wahid ( gurdur) beliau menjabat sampai mu’tamar NU yang ke 29 di tasik Malaya pada tahun 1994 M.", "t": "Mudah", "k": "A"}, {"id": "NU-30", "m": "NU", "n": 30, "q": "Bagaimana pandangan NU terhadap kebudayaan….\nJawab : \nNU tidak menolak budaya dan tradisi secara mutlak karena NU mengikuti teladan Nabi dan wali songo yang selalu mendorong kebudayaan secara positif dalam praktek dan dakwah agama, dakwah harus selalu dilaksanakan dengan cara bijaksana termasuk memandang kebudayaan dan tradisi.", "t": "Mudah", "k": "A"}, {"id": "NU-31", "m": "NU", "n": 31, "q": "Jelaskan hubungan antara NU dan Aswaja….\nJawab : \nhubungan keduanya sangat erat, dan tidak dapat dipisahkan sebab latar belakang didirikan NU merupakan usaha untuk mempertahankan ajaran ahlusssunnah wal jamaah dari pengaruh dan fikiran lain yang ingin menghilangkan ajaran ahlussunnah wal jamaah\"", "t": "Mudah", "k": "A"}, {"id": "NU-32", "m": "NU", "n": 32, "q": "Siapakah ketu Syuriah PBNU yang pertama?\nJawab: \nK.H. M. Hasyim Asy,ari di kabupaten Jombang yang merupakan pendiri Pon-pes Tebu Ireng.", "t": "Mudah", "k": "A"}, {"id": "NU-33", "m": "NU", "n": 33, "q": "NU Atau Nahdlotul Ulama, Merupakan Salah satu Organisasi yang ada di Indonesia, Terdiri Dari Dua Kata, Yakni Annahdloh dan Ulama, Arti kedua kata tersebut adalah...........\nJawab :\nAnanahdloh Artinya Kebangkitan, Ulama' Artinya Para pemilik ilmu yang mau mengamalkannya.", "t": "Mudah", "k": "A"}, {"id": "NU-34", "m": "NU", "n": 34, "q": "Jelaskan Maksud Dan Tujuan Di Dirikannya Organisasi NU!\nJawaban : \nUntuk Memelihara dan Mengembangkan Ajaran Islam yang berlandaskan Ahlus sunah wal Jamaah.\"", "t": "Mudah", "k": "A"}, {"id": "NU-35", "m": "NU", "n": 35, "q": "Dalam Organisasi NU terdapat Tanda Pengenal atau simbol Yang Mempunyai Arti Masingmasing, jelaskan Maksud Dari simbol bintang sembilan yang ada di lambang NU!\nJawaban : \nArti Dari bintang sembilan adalah, simbol para wali 9 Yang Menjadi panutan dalam berdakwah menyebarkan agama Islam di Nusantara.\"", "t": "Mudah", "k": "A"}, {"id": "NU-36", "m": "NU", "n": 36, "q": "Jelaskan arti simbol bintang satu besar , di atas yang ada dalam lambang NU!\nJawaban : \nBintang Satu besar di atas, artinya adalah Simbol Rosulullah SAW yang menjadi panutan utama bagi warga NU.\"", "t": "Mudah", "k": "A"}, {"id": "NU-37", "m": "NU", "n": 37, "q": "Kepengurusan Dalam Organisasi NU Terdiri dari 3 Bagian Pokok, Sebutkan dan jelaskan!.\nJawaban : \na. MUSTASYAR \t: Dewan Penasehat. \nb. SYURIYAH \t: Dewan Pimpinan tertinggi.\nc. TANFIDZIYAH\t: Dewan Pelaksana Harian.\"", "t": "Mudah", "k": "A"}, {"id": "NU-38", "m": "NU", "n": 38, "q": "Warga NU Memiliki Empat Ciri-ciri Kepribadian Sebagai Warga NU, Sebutkan Salah satunya\nDan Jelaskan!\nJawaban : Dalam Hal fikroh atau Sudut pandang pemikiran, NU memakai konsep :\n• Tasamuh ( Toleransi)\n• Tawassuth ( Tengah-tengah)\n• Tawazzun ( Seimbang)\n• ‘Adalah ( Adil).", "t": "Mudah", "k": "A"}, {"id": "NU-39", "m": "NU", "n": 39, "q": "Dalam Organisasi NU terdapat Struktur Kepengurusan Mulai Dari tingkat teratas sampai terbawah, Sebutkan!\nJawaban :\n• Pengurus Besar ( PBNU)\n• Pengurus Wilayah ( PWNU)\n• Pengurus cabang ( PCNU)\n• Majlis Wakil Cabang ( MWC NU)\n• Pengurus Ranting ( PR NU ).", "t": "Mudah", "k": "A"}, {"id": "NU-40", "m": "NU", "n": 40, "q": "Salah ciri khas orang NU adalah mempercayai madzhab, sebutkan 4 imam madzhab yang mu’tabaroh?\nJawab : \n1) Imam Syafii\n2) Imam Hanafi \n3) Imam Hambali\n4) Imam Maliki\nSedangkan mayoritas muslim di Indonesia adalah bermadzhab imam syafii. Sebab madzhaab syafii termasuk madzhab yang tengah-tengah tidak terlalu berat dan juga tidak terlalu ringan, sesuai porsi oraang Indonesia.", "t": "Mudah", "k": "A"}, {"id": "NU-41", "m": "NU", "n": 41, "q": "Organisasi NU mempunyai 2 lajnah, Sebutkan dan Jelaskan!\nJawab: \na. Lajnah Falakiyah: bertugas mengurus masalah hisabdan rukyah serta ilmu falak\nb. Lajnah Talif Wan Nasr: bertugas mengembangkan tulisan, penerjemah dan penerbitan kitab serta media informasi.", "t": "Mudah", "k": "A"}, {"id": "NU-42", "m": "NU", "n": 42, "q": "Ada berapa lembaga dalam organisasi NU? Sebutkan 5 lembaga saja!\njawab:\na. LDNU  \t: Lembaga Dakwah NU\nb. LPMNU  \t: Lembaga Pendidikan Ma’arif NU\nc. RMI  \t\t: Robitoh Ma’ahid Islamiyah\nd. LPNU  \t\t: Lembaga Perekonomian NU\ne. LAZIZNU \t: Lemaga AMil Zakat Infaq dan Sodaqoh NU", "t": "Mudah", "k": "A"}, {"id": "NU-43", "m": "NU", "n": 43, "q": "NU mempunyai 10 Banom , sebutkan….?\nJawab :\na. Jam’iyah Ahli Thariqoh Al-mu’tabaroh An-nahdliyah\nb. Jam’iyah Qurro Wal-huffadz ( JQH )\nc. Muslimat\nd. Fatayat\ne. Gerakan pemuda Ansor /GP Ansor\nf. IPNU : ikatan Pelajar Nahdlatul ulama\ng. IPPNU : Ikatan Pelajar Putri Nahdlatul ulama\nh. ISNU : ikatan sarjana Nahdlatul ulama\ni. SARBUMUSI : Sarikat Buruh Muslimin Indonesia\nj. Pagar Nusa.\"", "t": "Mudah", "k": "A"}, {"id": "NU-44", "m": "NU", "n": 44, "q": "Toleransi antar pemeluk agama adalah salah satu hal yang sangan dijunjung tinggi oleh masyarakat Nahdhatul ulama'. Hal tersebut menjadi salah satu indikator terciptanya kerukunan antar pemeluk agama di Indonesia.  \nMenurut anda, apakah pengertian toleransi dalam Islam dan berikan landasan hukum tentang toleransi dan berikan contohnya?\nJawab :\nToleransi dalam Islam atau bahasa Arab disebut al-tasamuh. Hanya saja, kalimat itu tidak ditemukan secara eksplisit dalam Al Quran. Kalimat itu bisa ditemui dalam hadist inni ursiltu bi al-hanifiyyat al-samhat. Rasulullah SAW bersabda, beliau diutus tuhan untuk menebarkan toleransi.\n\nWalaupun kalimat al-tasamud tidak ditemukan dalam Al-Quran, menurut buku karya Zuhairi Misrawi ini kitab suci Al Quran menulis semua toleransi dalam sikap saling menghargai, menerima, serta menghormati keragaman budaya dan perbedaan berekspresi. \"\"Maka Al-Quran merupakan kitab suci yang secara nyata memberikan perhatian terhadap toleransi. Hal tersebut dapat ditemukan dalam ratusan ayat yang secara gamblang mendorong toleransi serta menolak intoleransi,\"\".\n\nContoh toleransi dalam Islam juga tertulis dalam Quran surat Al Mumtahanan ayat 8-9. Dalam surat tersebut, Alla SWT berfirman agar setiap Muslim berperilaku baik kepada umat beragama lain selama tidak ada sangkut pautnya dalam agama. Hal ini juga menjelaskan bagaimana batasan toleransi dalam Islam.\n\nلَا يَنْهٰىكُمُ اللّٰهُ عَنِ الَّذِيْنَ لَمْ يُقَاتِلُوْكُمْ فِى الدِّيْنِ وَلَمْ يُخْرِجُوْكُمْ مِّنْ دِيَارِكُمْ اَنْ تَبَرُّوْهُمْ وَتُقْسِطُوْٓا اِلَيْهِمْۗ اِنَّ اللّٰهَ يُحِبُّ الْمُقْسِطِيْنَ\nاِنَّمَا يَنْهٰىكُمُ اللّٰهُ عَنِ الَّذِيْنَ قَاتَلُوْكُمْ فِى الدِّيْنِ وَاَخْرَجُوْكُمْ مِّنْ دِيَارِكُمْ وَظَاهَرُوْا عَلٰٓى اِخْرَاجِكُمْ اَنْ تَوَلَّوْهُمْۚ وَمَنْ يَّتَوَلَّهُمْ فَاُولٰۤىِٕكَ هُمُ الظّٰلِمُوْنَ\n\nArtinya: \nAllah tidak melarang kamu berbuat baik dan berlaku adil terhadap orang-orang yang tidak memerangimu dalam urusan agama dan tidak mengusir kamu dari kampung halamanmu. Sesungguhnya Allah mencintai orang-orang yang berlaku adil. Sesungguhnya Allah hanya melarang kamu menjadikan mereka sebagai kawanmu orang-orang yang memerangi kamu dalam urusan agama dan mengusir kamu dari kampung halamanmu dan membantu (orang lain) untuk mengusirmu. Barangsiapa menjadikan mereka sebagai kawan, mereka itulah orang-orang yang zalim.\n\nSelain itu, dalam Quran surat Luqman ayat 15, Allah SWT berfirman mengenai tetap berperilaku baik kepada keluarga atau saudara non Islam, walaupun mereka sempat mengajak untuk mempersekutukan Allah SWT.\n\nوَاِنْ جَاهَدٰكَ عَلٰٓى اَنْ تُشْرِكَ بِيْ مَا لَيْسَ لَكَ بِهٖ عِلْمٌ فَلَا تُطِعْهُمَا وَصَاحِبْهُمَا فِى الدُّنْيَا مَعْرُوْفًا ۖوَّاتَّبِعْ سَبِيْلَ مَنْ اَنَابَ اِلَيَّۚ ثُمَّ اِلَيَّ مَرْجِعُكُمْ فَاُنَبِّئُكُمْ بِمَا كُنْتُمْ تَعْمَلُوْنَ\n\n\n\nArtinya: \nDan jika keduanya memaksamu untuk mempersekutukan Aku dengan sesuatu yang engkau tidak mempunyai ilmu tentang itu, maka janganlah engkau menaati keduanya, dan pergaulilah keduanya di dunia dengan baik, dan ikutilah jalan orang yang kembali kepada-Ku. Kemudian hanya kepada-Ku tempat kembalimu, maka akan Aku beritahukan kepadamu apa yang telah kamu kerjakan.\"", "t": "Susah", "k": "A"}, {"id": "NU-45", "m": "NU", "n": 45, "q": "Bagaimana pandangan anda ketika seorang muslim mengucapkan Selamat Hari Raya Kepada pemeluk agama lain dengan alasan hal tersebut adalah  sebagai salah satu perwujudan toleransi antar umat beragama?\nJawab :\nPara ulama sendiri juga terbagi menjadi dua kelompok dalam melihat fenomena ini; ada kelompok ulama yang membolehkan dan ada pula yang mengharamkan. Masing-masing memiliki argumentasi dan dalil untuk mengukuhkan pendapatnya.\na.\tUlama' yang membolehkan\nSebagian kelompok ulama yang membolehkan ucapan selamat atas hari besar umat beragama lain berpedoman pada Al-Qur’an Surat al-Mumtahanah ayat 8: “Allah tidak melarang kamu untuk berbuat baik dan berlaku adil terhadap orang-orang yang tiada memerangimu karena agama dan tidak (pula) mengusir kamu dari negerimu. Sesungguhnya Allah menyukai orang-orang yang berlaku adil.” Dalam ayat tersebut, Allah tidak melarang seorang Muslim untuk berbuat baik kepada siapa saja yang tidak memeranginya dan mengusirnya. Nah, mengucapkan selamat hari raya non-Muslim dinilai sebagai salah satu bentuk perbuatan baik kepada non-Muslim. \n\nDengan demikian, adalah boleh hukumnya melakukan hal demikian. Ulama yang memperbolehkan juga menjadikan hadits Nabi Muhammad yang diriwayatkan Anas bin Malik sebagai dalil atas pendapat mereka. Bunyi hadits tersebut adalah: “Dahulu ada seorang anak Yahudi yang senantiasa melayani (membantu) Nabi Muhammad, kemudian ia sakit. Maka, Nabi mendatanginya untuk menjenguknya, lalu beliau duduk di dekat kepalanya, kemudian berkata: ‘Masuk Islam-lah!’ Maka anak Yahudi itu melihat ke arah ayahnya yang ada di dekatnya, maka ayahnya berkata: ‘Taatilah Abul Qasim (Nabi Muhammad).’ Maka anak itu pun masuk Islam. Lalu Nabi keluar seraya bersabda: ‘Segala puji bagi Allah yang telah menyelamatkannya dari neraka.” Dalam hadits tersebut, Nabi Muhammad memberikan teladan kepada umatnya agar berbuat baik kepada non-Muslim yang tidak memerangi mereka. Begitupun dengan mengucapkan selamat hari raya atas agama lain kepada mereka yang memperingatinya. \n\nUlama yang membolehkankan menilai hal itu sebagai bentuk berbuat baik kepada non-Muslim. Maka memberi selamat hari raya kepada mereka hukumnya boleh. Kelompok ulama ini juga berpendapat bahwa mengucapkan selamat hari raya kepada non-Muslim bukan berarti mengakui apa yang dipercayai mereka, namun lebih pada penghormatan dalam bermasyarakat dan menjaga kerukunan bersama. Di antara ulama yang membolehkan adalah Syekh Ali Jum’ah, Syekh Muhammad Rasyid Ridla, Syekh Yusuf Qaradhawi, Syekh al-Syurbashi, Syekh Abdullah bin Bayyah, Syekh Nasr Farid Washil, Syekh Musthafa Zarqa, Syekh Ishom Talimah, Syekh Musthafa al-Zarqa', Prof. Dr Abdussattar Fathullah Sa'id, Prof. Dr. Muhammad al-Sayyid Dusuqi, Majelis Fatwa Eropa, Majelis Fatwa Mesir, dan lainnya.\n\nb.\tUlama' yang tidak membolehkan\nSementara itu, di sini yang lain, terdapat ulama yang mengharamkan. Para ulama berpedoman pada beberapa sejumlah dalil, salah satunya adalah Al-Qur’an Surat al-Furqon ayat 72: “Dan orang-orang yang tidak memberikan persaksian palsu, dan apabila mereka bertemu dengan (orang-orang) yang mengerjakan perbuatan-perbuatan yang tidak berfaedah, mereka lalui (saja) dengan menjaga kehormatan dirinya.\n\nKelompok ulama ini menafsirkan ayat di atas bahwa ciri orang yang akan mendapatkan martabat tinggi di surga adalah orang yang tidak memberikan kesaksian palsu. Sementara seorang Muslim yang memberikan ucapan selamat atas hari raya agama lainnya dianggap sama dengan memberikan persaksian palsu dan membenarkan keyakinan umat non-Muslim tentang hari rayanya. Sebagai konsekuensinya, dia tidak akan mendapatkan martabat yang tinggi di surga. \n\nAtas dasar itulah, mereka mengharamkan ucapan selamat atas hari raya non-Muslim. Dalil lain yang mereka gunakan untuk menguatkan argumentasinya adalah hadits riwayat Ibnu Umar, yaitu “Barangsiapa menyerupai suatu kaum maka dia termasuk bagian kaum tersebut.” Hadits ini sangat terkenal dan sering dipakai oleh sekelompok umat Islam untuk mengafirkan umat Islam lainnya, hanya karena mereka dianggap ‘menyerupai’ non-Muslim.", "t": "Susah", "k": "A"}, {"id": "NU-46", "m": "NU", "n": 46, "q": "Kita sering mendengar slogan \"\"Hubbul wathon minal iman\"\" slogan-slogan tersebut sering disampaiak oleh Ulama' dalam ceramah-ceramah saat hari kemerdekaan dan Nasionalisme. Apakah yang anda pahami dari slogan tersebut?\nJawab :\nSecara bahasa, hubbul wathon minal amin artinya cinta Tanah Air adalah sebagian dari iman. Istilah ini diyakini sebagai bagian dari hadits Rasulullah. Namun, Edi Rohani dalam buku Pendidikan dan Kewarganeragaaran menjelaskan, kalimat tersebut adalah hadits maudhu atau palsu dan tidak bisa dijadikan sebagai dalil.\nMeski begitu, kalimat ini tidak salah menurut syariat Islam. Karena selaras dengan Rasulullah yang mencintai Mekah dan Madinah. Sehingga, banyak para ulama menggunakan istilah tersebut sebagai konsep dari ukhuwah wathaniyah dalam ajaran Islam.\nZaedun Na’im dalam buku Memahami Ahlus Sunnah Wal Jamaah, mendefisikan ukhuwah wathaniyah sebagai persaudaraan yang diikat oleh jiwa nasioanalisme tanpa membedakan agama, suku, warna kulit, adat-istiadat, budaya, atau aspek lainnya. Ukhuwah ini merupakan perwujudan dari surat Al Hujarat ayat 13 yang berbunyi:\nيٰٓاَيُّهَا النَّاسُ اِنَّا خَلَقْنٰكُمْ مِّنْ ذَكَرٍ وَّاُنْثٰى وَجَعَلْنٰكُمْ شُعُوْبًا وَّقَبَاۤىِٕلَ لِتَعَارَفُوْا ۚ اِنَّ اَكْرَمَكُمْ عِنْدَ اللّٰهِ اَتْقٰىكُمْ ۗاِنَّ اللّٰهَ عَلِيْمٌ خَبِيْرٌ\nArtinya: \nWahai manusia! Sungguh, Kami telah menciptakan kamu dari seorang laki-laki dan seorang perempuan, kemudian Kami jadikan kamu berbangsa-bangsa dan bersuku-suku agar kamu saling mengenal. Sesungguhnya yang paling mulia di antara kamu di sisi Allah ialah orang yang paling bertakwa. Sungguh, Allah Maha Mengetahui, Mahateliti. melalui konsep hubbul wathon minal amin dan ayat di atas, ajaran Islam memperbolehkan umatnya untuk berhubungan dengan umat agama lain. Toleransi antar umat beragama ini dibatasi dengan batasan muamalah, yaitu hubungan kemanusiaan dan tolong menolong dalam sosial kemasyarakatan.", "t": "Susah", "k": "A"}, {"id": "NU-47", "m": "NU", "n": 47, "q": "Ukhuwah menjadi hal yang sangat penting demi terciptanya masyarakat yang rukun dan damai. Selain itu, ukhuwah memiliki beragam manfaat bagi umat Muslim. Apa sajakah manfaat Ukhuwah yang anda ketahui?\nJawab :\na.\tUkhuwah adalah pilar kekuatan Islam\nKekuatan Islam akan terwujud jika umat Muslim mampu menegakkan ukhuwah dan silaturahmi terhadap sesama, memperbanyak persamaan, dan memperkecil perbedaan. Namun, jika sesama umat muslim bermusuhan, tentunya agama Islam akan lemah dan tidak mempunyai kekuatan.\nb.\tUkhuwah merupakan bagian penting dari iman\nIman seseorang tidak akan sempurna tanpa disertai dengan ukhuwah.  Begitu juga sebaliknya, ukhuwah tidak akan bermakna tanpa dilandasi keimanan.\nc.\tUkhuwah dapat membangun mansyarakat mandani\nMasyarakat madani adalah masyarakat ideal yang memiliki karakteristik yang menjunjung tinggi kedamaian, kerukunan, dan saling tolong menolong. Nilai-nilai tersebut akan dengan mudah terwujud, apabila setiap manusia memiliki ketulusan dan kemauan yang tinggi untuk membangun ukhuwah antar sesama. \"", "t": "Susah", "k": "A"}, {"id": "NU-48", "m": "NU", "n": 48, "q": "Sebutkan beberapa dalil dalam peringatan Maulid Nabi Muhammad SAW?\nJawab :\nmemperingati Maulid bukan hanya dilakukan oleh umat Nabi Muhammad SAW saja. Nabi Muhammad sendiri juga memperingati kelahirannya dengan berpuasa di hari Senin. Ketika ditanya oleh sahabat, \"\"Kenapa engkau berpuasa ya Rasul? aku berpuasa karena di hari itu aku dilahirkan dan di hari itu pula lah aku mendapatkan wahyu pertama kali,\"\" jawab Nabi. Disebutkan beberapa dalil syar’I peringatan Maulid dari Al-Qur’an dan Hadits. Di antaranya adalah firman Allah dalam QS Yunus ayat 58 yang artinya, \"\"Katakanlah, dengan anugerah Allah dan rahmatNya (Nabi Muhammad Saw) hendaklah mereka menyambut dengan senang gembira.\"\" (QS.Yunus: 58).\n\nMenurut Sayyid Muhammad bin Alawi Al-Maliki Al-Hasani Bergembira dengan adanya Nabi Muhammad SAW ialah dianjurkan berdasarkan firman Allah SWT pada surat Yunus ayat 58 ini. [Sayyid Muhammad Al-Maliki Al-Hasani, Ikhraj wa Ta’liq Fi Mukhtashar Sirah An-Nabawiyah, hal 6-7]. Dalam kitab Fathul Bari karangan al- Hafidz Ibnu Hajar al-Asqolani diceritakan pula bahwa Abu Lahab mendapatkan keringanan siksa tiap hari senin karena dia gembira atas kelahiran Rasulullah. Ini membuktikan bahwa bergembira dengan kelahiran Rasulullah memberikan manfaat yang sangat besar, bahkan orang kafirpun dapat merasakannya. [Ibnu Hajar, Fathul Bari, Juz 11, hal 431].\"", "t": "Susah", "k": "A"}, {"id": "NU-49", "m": "NU", "n": 49, "q": "Ziarah kubur menjadi kegiatan yang kerap dilakukan umat Islam menjelang puasa Ramadhan. Saat berziarah, bukan hanya doa yang disampaikan, tabur bunga juga menjadi salah satu tradisi yang tak bisa dilewatkan. Lantas bagaimana hukum tabur bunga saat ziarah kubur dalam Islam?\nJawab :\ntabur bunga dalam Islam didasarkan pada riwayat sahih yang menyebutkan bahwa Rasulullah SAW pernah meletakkan dahan yang masih basah di atas kuburan. Tindakan Rasulullah ini dimaknai sebagai cara untuk meringankan siksa kubur penghuni makam.\nBerikut riwayat sahihnya:\n\nوَالدّليل مَا وردَ فِي الحدِيث الصّحِيح مِنْ وَضْعِه عليْه الصّلاة والسّلام الجَريدَة الخضْراء، بعْدَ شقِّها نِصفَين علَى القبْرين اللذَين يُعذَّبان، وتعليْله بالتّخْفيف عنهُما ما لمْ ييبسا أي يخفف عنهما ببركَة تسبيحِهما؛ إذ هُو أكمَل مِن تسبيح اليَابس، لِما في الأخضرِ مِن نوع حيَاة\n\nArtinya:\n\"Dalilnya adalah riwayat dalam hadis sahih yang menyebutkan bahwa Rasulullah meletakkan dahan hijau yang segar setelah membelahnya menjadi dua bagian di atas dua makam yang ahli kuburnya sedang disiksa. Tujuan peletakan dahan basah ini adalah meringankan siksa keduanya, selagi kedua dahan itu belum kering, yaitu diringankan keduanya dengan berkah tasbih kedua dahan tersebut. Pasalnya, tasbih dahan basah lebih sempurna daripada tasbih dahan kering karena hijau segar mengandung daya hidup.\"\" (Syekh Wahbah Az-Zuhayli, Al-Fiqhul Islami wa Adillatuhu, [Beirut, Darul Fikr: tt], cetakan keempat, juz II, halaman 672).\n\nAtas dasar riwayat sahih ini, maka para ulama fikih menyebutkan bahwa:\n\nيُسنّ وضْع الْجريد الاخضَر علَى القبْر وكَذا الرّيْحان ونحْوه مِن الشّيء الرّطب\n\n\"Disunahkan meletakkan dahan pohon yang masih hijau segar di atas kuburan. Demikian pula hal-hal yang mengandung aroma yang sedap atau serupa dari zat yang basah segar.\"\" (As-Syarbini, Al-Iqna' pada Hamisy Tuhfatul Habib, (Beirut, Darul Kutub al Islamiyah: 1996 M/1417 H).", "t": "Susah", "k": "A"}, {"id": "NU-50", "m": "NU", "n": 50, "q": "Banyak dari kaum muslimin melakukan suatu amaliyah dengan mendasarkan pada hadis yang tingkatannya Dhoif, sebagian kelompok radikal menganggap hal tersebut tidak bisa dibenarkan dengan asusmsi bahwa beramal harus menggunakan Hadis shohih sebagai landasannya. bagamana pandangan anda terkait hal tersebut?\nJawab :\nHukum Beramal Dengan Hadits Dha’if.\nImam as-Suyuthi menyebutkan dalam Tadrib ar-Rawy fi Syarh Taqrib an-Nawawi, Boleh meriwayatkan dan mengamalkan hadits Dha’if, dengan syarat:\na.\tBukan pada masalah Aqidah; tentang sifat Allah, perkara yang boleh dan mustahil bagi Allah, penjelasan firman Allah Swt.\nb.\tBukan pada hukum halal dan haram. Boleh pada kisah-kisah, fadha’il (keutamaan) amal dan nasihat.\nc.\tTidak terlalu dha’if; perawinya bukan kadzdzab (pendusta), tertuduh sebagai pendusta atau terlalu banyak kekeliruan dalam periwayatan.\nd.\tBernaung di bawah hadits shahih.\ne.\tTidak diyakini sebagai suatu ketetapan, hanya sebagai bentuk kehati-hatian.\"", "t": "Susah", "k": "A"}, {"id": "NU-51", "m": "NU", "n": 51, "q": "Apa yang anda pahami tentang Isbal, dan bagaimana hukum isbal menurut pandangan para ulama’?.\nJawab :\nSecara bahasa, isbal merupakan masdar dari \"asbala\"\", \"\"yusbilu-isbaalan\"\", bermakna \"\"irkhaa-an\"\" yang artinya menurunkan, melabuhkan atau memanjangkan. Sementara menurut istilah Islam dari ungkapan Imam Ibnul 'Aroby rahimahullah, isbal berarti memanjangkan, melabuhkan dan menjulurkan pakaian hingga menutupi mata kaki dan menyentuh tanah.\n\nHadis tentang Isbal :\n\nمَا أَسْفَلَ مِنَ الْكَعْبَيْنِ مِنَ الإِزَارِ فَفِى النَّارِ\n\nArtinya: \"Kain yang berada di bawah mata kaki itu berada di neraka.\" (HR. Bukhari no. 5787)\n\nPendapat Ulama Memahami Hadits-Hadits Ini:\nPendapat Imam Syafi’i:\nImam an-Nawawi berkata, “Makna Isbal adalah memanjangkan kain di bawah kedua mata kaki, hanya bagi orang yang sombong. Jika pada orang yang tidak sombong, maka makruh. Demikian disebutkan Imam Syafi’i secara nash tentang perbedaan antara orang yang memanjangkan kain karena sombong dan orang yang memanjangkan kain tetapi tidak sombong.\"", "t": "Susah", "k": "A"}, {"id": "NU-52", "m": "NU", "n": 52, "q": "Salah satu kebiyasaan warga nahdiyion adalah ketika berdo'a slalu mengangkat tangan dan setelah berdoan mengusapkan kedua telapak tangan ke wajah.hal tersebut disangsikan oleh beberapa golongan dan mengganggap hal tersebut tidak ada tuntunan dari Rosulullah SAW. Bagaimana pandangan anda terkait hal tersebut?\nJawab :\nPada dasarnya mengangkat tangan ketika berdoa dan dan mengusap wajah sesudahnya bukanlah sekadar tradisi yang tanpa dasar. Keduanya merupakan sunnah Rasulullah shallallahu 'alaihi wasallam sebagaimana termaktub dalam salah satu haditsnya yang diceritakan oleh Ibn Abbas:\n \nإذا دعوت الله فادع بباطن كفيك ولا تدع بظهورهما فاذا فرغت فامسح بهما  وجهك (رواه ابن ماجه) \n\nArtinya: \"\"Apabila engkau memohon kepada Allah, maka bermohonlah dengan bagian dalam kedua telapak tanganmu, dan jangan dengan bagian luarnya. Dan ketika kamu telah usai, maka usaplah mukamu dengan keduanya.\"\" Demikian pula keterangan para ulama dari beberapa kitab. Bahkan mereka menganjurkan ketika semakin penting permintaan agar semakin tinggi pula mengangkat tangan. Adapun ukuran mengangkat tangan adalah setinggi kedua belah bahu. Dalam I’anatut Thaibin juz II diterangkan:\n ورفع يديه الطاهرتين حذو منكبيه ومسح الوجه بهما بعده\nArtinya: \"\"Dan diwaktu berdoa disunnahkan mengangkat kedua tangannya yang suci setinggi kedua bahu, dan disunnahkan pula menyapu muka dengan keduanya setelah berdoa. Keterangan ini ditambahi oleh keterangan Syaikh Muhammad bin Sulaiman al-Kurdy dalam Al-Hawasyil Madaniyyah  dengan sangat singkat. \nوغاية الرفع خذو المنكبين الا اذا شتد الأمر \nArtinya: Batas maksimal mengangkat tangan adalah setinggi kedua bahu, kecuali apabila keadaan sudah amat kritis, maka ketika itu bolehlah melewati tinggi kedua bahu.\"", "t": "Susah", "k": "A"}, {"id": "NU-53", "m": "NU", "n": 53, "q": "Menyimpan lukisan atau gambar-gambar sebagai penghias rumah sudah merupakan hal yang lumrah dilakukan masyarakat. Gambar dan lukisan yang disimpan cenderung variatif, mulai dari gambar tokoh, hewan, pemandangan alam, dan aneka gambar serta lukisan lain sesuai selera pemilik atau desain interior rumah.  Lantas sebenarnya bagaimana syariat menyikapi realitas demikian? Bolehkah bagi seorang Muslim untuk menyimpan berbagai gambar dan lukisan dalam rumahnya?\nJawab :\nDalam berbagai hadits memang dijelaskan tentang larangan menyimpan gambar atau lukisan di dalam rumah. Misalnya seperti dalam hadits berikut:  \n إِنَّ الْمَلاَئِكَةَ لاَ تَدْخُلُ بَيْتًا فِيهِ صُورَةٌ    \n“Sesungguhnya Malaikat tidak masuk pada rumah yang terdapat gambar di dalamnya” (HR. Baihaqi).   Berdasarkan hadits di atas, dapat dipahami seolah-olah menyimpan gambar di dalam rumah merupakan sebuah larangan syariat yang tidak dapat ditoleransi. Namun, rupanya terdapat hadits lain yang mengindikasikan ditoleransinya menyimpan gambar di dalam rumah, seperti hadits berikut ini:   \nعَنْ عُبَيْدِ اللهِ بْنِ عَبْدِ اللهِ ، أَنَّهُ دَخَلَ عَلَى أَبِي طَلْحَةَ الأَنْصَارِيِّ يَعُودُهُ فَوَجَدَ عِنْدَهُ سَهْلَ بْنَ حُنَيْفٍ فَأَمَرَ أَبُو طَلْحَةَ إِنْسَانًا يَنْزِعُ نَمَطًا تَحْتَهُ ، فَقَالَ لَهُ سَهْلٌ : لِمَ تَنْزِعُهُ ؟ قَالَ : لأَنَّ فِيهِ تَصَاوِيرَ ، وَقَدْ قَالَ فِيهَا رَسُولُ اللهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ مَا قَدْ عَلِمْتَ ، قَالَ : أَلَمْ يَقُلْ إِلاَّ مَا كَانَ رَقْمًا فِي ثَوْبٍ ، قَالَ : بَلَى ، وَلَكِنَّهُ أَطْيَبُ لِنَفْسِي   \nDiriwayatkan dari ‘Ubaidillah bin ‘Abdullah bahwa ia berkunjung pada Abu Thalhah al-Anshari untuk menjenguknya. Di sana terdapat Sahl bin Hunaif, lalu Abu Thalhah memerintahkan seseorang untuk melepaskan tikar yang ada di bawahnya, melihat hal tersebut, Sahl bertanya: “Kenapa engkau melepasnya?”    “Sebab pada tikar itu terdapat gambar, dan Rasulullah telah mengatakan tentang larangan menyimpan gambar, seperti halnya yang engkau tahu” jawab Abu Thalhah.   “Bukankah Rasulullah mengatakan: ‘Kecuali gambar yang ada di pakaian?’” sanggah Sahl   “Iya memang, tapi melepaskan (tikar) lebih menenteramkan hatiku” ungkap Abu Thalhah” (HR. An-Nasa’i).   Dari dua hadits di atas, para ulama berbeda pendapat dalam menentukan kategori lukisan atau gambar yang dilarang oleh syara’ untuk membuat ataupun menyimpannya. Namun para ulama sepakat atas keharaman suatu gambar ketika memenuhi lima kategori berikut:  \n فعلم أن المجمع على تحريمه من تصوير الأكوان ما اجتمع فيه خمسة قيود عند أولي العرفان أولها ؛ كون الصورة للإنسان أو للحيوان ثانيها ؛ كونها كاملة لم يعمل فيها ما يمنع الحياة من النقصان كقطع رأس أو نصف أو بطن أو صدر أو خرق بطن أو تفريق أجزاء لجسمان ثالثها ؛ كونها في محل يعظم لا في محل يسام بالوطء والامتهان رابعها ؛ وجود ظل لها في العيان خامسها ؛ أن لا تكون لصغار البنان من النسوان   فإن انتفى قيد من هذه الخمسة . . كانت مما فيه اختلاف العلماء الأعيان . فتركها حينئذ أورع وأحوط للأديان   \n “Maka dapat dipahami bahwa gambar yang disepakati keharamannya adalah gambar yang terkumpul di dalamnya lima hal. \nPertama, gambar berupa manusia atau hewan. \nKedua, gambar dalam bentuk yang sempurna, tidak terdapat sesuatu yang mencegah hidupnya gambar tersebut, seperti kepala yang terbelah, separuh badan, perut, dada, terbelahnya perut, terpisahnya bagian tubuh. \nKetiga, gambar berada di tempat yang dimuliakan, bukan berada di tempat yang biasa diinjak dan direndahkan. \nKeempat, terdapat bayangan dari gambar tersebut dalam pandangan mata. \nKelima, gambar bukan untuk anak-anak kecil dari golongan wanita. \nJika salah satu dari lima hal di atas tidak terpenuhi, maka gambar demikian merupakan gambar yang masih diperdebatkan di antara ulama. Meninggalkan (menyimpan gambar demikian) merupakan perbuatan yang lebih wira’i dan merupakan langkah hati-hati dalam beragama” (Sayyid Alawi al-Maliki al-Hasani, Majmu’ fatawa wa ar-Rasa’il, hal. 213)\"", "t": "Susah", "k": "A"}, {"id": "NU-54", "m": "NU", "n": 54, "q": "Menjadi kebiyasaan Masyarakat di Indonesia memajang Foto, baik itu foto Orang tua, keluarga, foto Guru, dll. Ada satu golongan yang mengharamkan memajang foto didalam rumah. Bagaiman pandangan anda terhadap hal tesebut ?.\nJawab :\nFoto berbeda dengan lukisan, hal tersebut didasarkan oleh pendapat beberapa ulama', diantaranya adalah sebagai berikut :\nPendapat Syekh Ibnu ‘Utsaimin:\nAdapun gambar moderen zaman sekarang; seseorang menggunakan alat untuk mengambil gambar objek tertentu, lalu kemudian gambar tersebut terbentuk di kertas, maka itu sebenarnya bukanlah makna tashwir, karena kata tashwir adalah bentuk mashdar dari kata shawwara, artinya: menjadikan sesuatu dalam bentuk tertentu. Sedangkan gambar yang diambil dengan alat tidak menjadikannya dalam bentuk sesuatu. Gambar berbentuk adalah gambar yang dibentuk, bentuk kedua mata, hidung, dua bibir dan sejenisnya.\n\nPendapat Lembaga Fatwa Kuwait:\nAdapun gambar semua yang bernyawa; manusia atau hewan, dengan cara menahan cahaya, seperti pada poto dan video, maka itu boleh, menurut pendapat yang paling kuat diantara pendapat para ahli Fiqh kontemporer, karena semua itu sama seperti gambar yang dipantulkan kaca cermin dan sejenisnya\"", "t": "Susah", "k": "A"}, {"id": "NU-55", "m": "NU", "n": 55, "q": "Salah satu bentuk kesesatan wahabi adalah menyerupakan Allah SWT dengan Mahluk, dalam kitab karangan salah satu Ulama' Panutan Wahabi yaitu Ibnu Taimiyah \"\" Majmu' Al Fatawa\"\" meyakini Allah sebagai sosok jism (fisikal) yang mempunyai dimensi panjang, lebar, dan tinggi. Sebagai sorang santri, Bagaimana anda meng counter pendapat tersebut?.\nJawab :\nSemua ulama Ahlussunnah wal Jama’ah (Asy’ariyah-Maturidiyah) sepakat mengatakan bahwa Allah bukanlah jism sebab seluruh jism itu sama, serupa, atau paling tidak setara meskipun berbeda-beda bentuknya. hal tersebut dikuatkan dengan dalil Al quran :\nلَيْسَ كَمِثْلِهِ شَيْءٌ\n“Tak ada satu pun yang serupa dengan Allah sedikit pun”. (QS. asy-Syura: 11)\n\nDan, di tempat lainnya Allah menegaskan dalam bentuk pertanyaan bahwa manusia takkan mengetahui ada yang sama dengan Allah, yaitu dalam ayat:  \n هَلْ تَعْلَمُ لَهُ سَمِيًّا  \nApakah kamu tahu ada yang sama dengan-Nya?\"\". (QS. Maryam: 65)\nSelain tak ada yang serupa dan yang sama dengan diri-Nya, Allah juga menegaskan tak ada yang setara dengan Dia. Allah berfirman: \n  وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدٌۢ   \ndan tidak ada satu pun yang setara dengan Dia\"\". (QS. al-Ikhlas:\n\nDari kalangan ulama Salaf, Imam Ahmad secara tegas menyatakan bahwa Allah bukan jism . Demikian juga dengan para imam lainnya, di antaranya:   Imam Abu Hanifah, ia berkata:  \n وصفاته كلها بخلاف صفات المخلوقين ... وهو شيء لا كالأشياء ومعنى الشيء إثباته تعالى بلا جسم ولا جوهر ولا عرض ولا حد له ولا ند له ولا مثل له.\nSifat-sifat Allah seluruhnya berbeda dengan sifat-sifat makhluk. ... Allah adalah sesuatu yang berbeda dengan segala sesuatu yang lain. Makna sesuatu yang berbeda ini adalah menetapkan Allah Ta’ala tidak berupa jism, unsur pembentuk jism (jauhar), sifat-sifat jism (‘aradl), tak punya batasan fisikal, tak punya saingan, tak punya sesuatu yang menyerupainya.” (Abu Hanifah, al-Fiqh al-Akbar, hlm. 2)\"", "t": "Susah", "k": "A"}, {"id": "NU-56", "m": "NU", "n": 56, "q": "Kelompok wahabi berpendapat bahwa orang tua Nabi Mihammad SAW di dalam neraka. Tentuanya hal tersebut sangat melukai hati kebanyakan kaum muslimin yang beraliran Ahlusunnah waljamaah. Bagaimana pandangan anda terkait hal tersebut?.\nJawab :\nAllah Swt berfirman,\n“Dan Kami tidak akan meng'azab sebelum Kami mengutus seorang rasul”. (Qs. Al-Isra’ [17]:15). Sebagaimana kita ketahui bahwa Abdullah dan Aminah hidup sebelum Nabi Muhammad SAW diutus, maka mereka berdua termasuk ahlul fatrah yang tidak diazab sebelum rasul diutus. Demikian keyakinan Ahlussunnah waljama’ah. \n\nDemikian juga pendapat Imam Ibnu Taimiah :\nSesungguhnya al-Qur’an dan Sunnah menunjukkan bahwa Allah tidak mengazab seorang pun kecuali setelah sampainya risalah kepada mereka. Siapa yang tidak sampai risalah kepadanya secara keseluruhan, maka ia tidak diazab sama sekali. Siapa yang risalah sampai kepadanya secara keseluruhan tapi tidak terperinci, maka ia diazab hanya pada perkara yang ia ingkari saja.\nAdapun Hadis yang berbunyi :\n\nعَنْ أَنَسٍ أَنَّ رَجُلًا قَالَ: يَا رَسُولَ اللَّهِ أَيْنَ أَبِيْ؟ قَالَ: فِي النَّارِ. فَلَمَّا قَفَّى دَعَاهُ فَقَالَ: إِنَّ أَبِي وَأَبَاكَ فِي النَّارِ\nDari Anas, bahwasanya ada seorang laki-laki bertanya kepada Rasulullah, “Wahai Rasulullah, di manakah tempat ayahku (yang telah meninggal) sekarang berada?” Beliau menjawab, “Di neraka.” Ketika orang tersebut menyingkir, maka beliau memanggilnya lalu berkata, “Sesungguhnya ayahku dan ayahmu di neraka” (HR. Imam Muslim dalam Shahîh-nya (203).\n\nYang dimaksud dengan bapak dalam hadits ini adalah paman Rasulullah Saw, yaitu Abu Thalib. Bukan Abdullah. Karena orang Arab biasa menyebut paman dengan sebutan ( أَبِي). Abu Thalib masuk neraka karena tidak beriman setelah rasul diutus. Sedangkan Abdullah meninggal sebelum rasul diutus, maka ia termasuk ahlulfatrah; orang yang hidup sebelum rasul diutus.", "t": "Susah", "k": "A"}, {"id": "NU-57", "m": "NU", "n": 57, "q": "Dalam kehidupan sehari-hari, Kembiasaan mengucapkan kata sayyidina selalu digunakan oleh muslim di Nusantara khususnya. Kebiasaan tersebut dilakukan baik pada saat melaksanakan shalat ataupun di luar shalat, termasuk saat nama Nabi Muhammad SAW disebutkan. Sebab, hal tersebut termasuk amalan yang utama sebagai salah satu bentuk pengagungan dan penghormatan kepada Nabi.\nTetapi, disisi lain Ada beberapa orang maupun kelompok yang sangat anti menggunakan \"Sayyidina\" yang disematkan dalam penyebutan Nama Baginda Nabi Muhammad SAW, baik dalam sholat ketika membaca tasyahud Akhir maupun diluar sholat. Bagaimana pandangan anda mengenai hal tersebut?\nJawab :\nDalam kitab Hasyiyah Al-Bajuri, Syekh Ibrahim bin Muhammad al-Bajuri menjelaskan :\n\nالأوْلَى ذِكْرُالسَّيِّادَةِ لِأنَّ اْلأَفْضَلَ سُلُوْكُ اْلأَدَ بِ\n\n“Yang lebih utama adalah mengucapkan sayyidina (sebelum nama Nabi SAW), karena hal yang lebih utama bersopan santun (kepada Beliau).” (Hasyisyah al-Bajuri, juz I, hal 156).\nPendapat ini didasarkan pada salah satu hadits Nabi Muhammad SAW:\n\nعن أبي هريرةقا ل , قا ل ر سو ل الله صلي الله عليه وسلم أنَا سَيِّدُ وَلَدِ آدَمَ يَوْمَ القِيَامَةِ وَأوَّلُ مَنْ يُنْسَقُّ عَنْهُ الْقَبْرُ وَأوَّلُ شَافعٍ وأول مُشَافِعٍ\n“Diriwayatkan dari Abu Hurairah RA ia berkata, Rasulullah SAW bersabda, “Saya adalah sayyid (penghulu) anak adam pada hari kiamat. Orang pertama yang bangkit dari kubur, orang yang pertama memberikan syafaa’at dan orang yang pertama kali diberi hak untuk membrikan syafa’at.” (Shahih Muslim, 4223).\nKemudian, bagaimana dengan hadits yang menjelaskan larangan mengucapkan sayyidina di dalam shalat?\n\nلَا تُسَيِّدُونِي فِي الصَّلَاةِ\n“Janganlah kalian mengucapakan sayyidina kepadaku di dalam shalat”\nUngkapan tersebut memang diklaim oleh sebagian golongan sebagai hadits Nabi SAW. Sehingga mereka mengatakan bahwa menambah kata sayyidina di depan nama Nabi Muhammad SAW adalah bid’ah dhalalah, bid’ah yang tidak baik.\nAkan tetapi ungkapan ini masih diragukan kebenarannya. Sebab secara gramatika bahasa Arab, susunan kata-katanya ada yang tidak singkron. Dalam bahasa Arab tidak dikatakan   سَادَ- يَسِيْدُ , akan tetapi سَادَ -يَسُوْدُ  , Sehingga tidak bisa dikatakan  لَاتُسَيِّدُوْنِي . Oleh karena itu, jika ungkapan itu disebut hadits, maka tergolong hadits maudhu’. Yakni hadits palsu, bukan sabda Nabi, karena tidak mungkin Nabi SAW keliru dalam menyusun kata-kata Arab. Konsekuensinya, hadits itu tidak bisa dijadikan dalil untuk melarang mengucapkan sayyidina dalam shalat?\nDengan demikian dapat disimpulkan bahwa membaca sayyidina ketika membaca shalawat kepada Nabi Muhammad SAW boleh-boleh saja, bahkan dianjurkan. Demikian pula ketika membaca tasyahud di dalam shalat.", "t": "Susah", "k": "A"}, {"id": "NU-58", "m": "NU", "n": 58, "q": "Jelaskan sejarah singkat tentang Komite Hijaz?\nJawab :\nKOMITE HIJAZ adalah nama sebuah kepanitiaan kecil yang diketuai oleh KH Abdul Wahab Chasbullah. Panitia ini bertugas menemui raja Ibnu Saud di Hijaz (Saudi Arabia) untuk menyampaikan beberapa permohonan.\n\nSejak Ibnu Saud, Raja Najed yang beraliran Wahabi, menaklukkan Hijaz (Mekkah dan Madinah) tahun 1924-1925, aliran Wahabi sangat dominan di tanah Haram. Kelompok Islam lain dilarang mengajarkan mazhabnya, bahkan tidak sedikit para ulama yang dibunuh. \nDengan alasan untuk menjaga kemurnian agama dari musyrik dan bid’ah, berbagai tempat bersejarah, baik rumah Nabi Muhammad dan sahabat termasuk makam Nabi hendak dibongkar. Dalam kondisi seperti itu umat Islam Indonesia yang berhaluan Ahlussunnah wal Jamaah merasa sangat perihatin kemudian mengirimkan utusan menemui Raja Ibnu Saud. Utusan inilah yang kemudian disebut dengan Komite Hijaz. Komite bertugas menyampaikan lima permohonan:\n \nPertama, Memohon diberlakukan  kemerdekaan bermazhab di negeri Hijaz pada salah satu  dari mazhab empat, yakni Hanafi, Maliki, Syafi’i dan Hanbali. Atas dasar kemerdekaan bermazhab tersebut hendaknya dilakukan giliran  antara imam-imam shalat Jum’at di Masjidil Haram dan hendaknya tidak dilarang pula masuknya kitab-kitab yang berdasarkan  mazhab tersebut  di bidang tasawuf, aqoid maupun fikih ke dalam negeri Hijaz, seperti karangan Imam Ghazali, imam Sanusi dan lain-lainnya yang sudaha terkenal kebenarannya. Hal tersebut tidak lain adalah semata-mata untuk  memperkuat hubungan  dan persaudaraan umat Islam yang bermazhab sehingga umat Islam menjadi sebagi tubuh yang satu, sebab umat Muhammad tidak akan bersatu dalam kesesatan. \n\nKedua, Memohon untuk tetap diramaikan tempat-tempat  bersejarah  yang terkenal sebab tempat-tempat tersebut  diwaqafkan untuk masjid seperti tempat kelahiran Siti Fatimah dan bangunan Khaezuran dan lain-lainnya berdasarkan firman Allah “Hanyalah orang yang meramaikan Masjid Allah orang-orang yang beriman kepada Allah” dan firman Nya “Dan siapa yang lebih aniaya dari pada orang yang menghalang-halangi orang lain untuk menyebut nama Allah dalam masjidnya  dan berusaha untuk merobohkannya.” Di samping untuk mengambil ibarat dari tempat-tempat yang  bersejarah tersebut. \n\nKetiga, Memohon agar disebarluaskan ke seluruh dunia, setiap tahun sebelum datangnya musim haji menganai tarif/ketentuan beaya yang harus diserahkan oleh jamaah haji kepada syaikh dan muthowwif dari mulai Jedah  sampai pulang lagi ke Jedah. Dengan demikian orang  yang akan menunaikan ibadah haji dapat menyediakan perbekalan  yang cukup buat pulang-perginya dan agar supaya mereka tiak  dimintai lagi  lebih dari ketentuan pemerintah. \n\nKeempat, Memohon agar semua hukum yang berlaku di negeri Hijaz, ditulis dalam bentuk undang-undang  agar tidak terjadi pelanggaran terhadap undang-undang tersebut. \n\nKelima, Jam’iyah Nahdlatul Ulama  memohon  balasan surat  dari Yang Mulia yang menjelaskan bahwa kedua orang delegasinya benar-benar menyampaikan  surat mandatnya dan permohonan-permohonan NU kepada Yang Mulia dan hendaknya surat  balasan tersebut  diserahkan kepada  kedua delegasi tersebut.", "t": "Susah", "k": "A"}, {"id": "NU-59", "m": "NU", "n": 59, "q": "Siapa Nama Pendiri Nahdhlotul Ulama' dan Sebutkan silsilah nya?\nJawab :\nPendiri Organisasi Nahdlatul Ulama adalah Hadratussyekh KH Hasyim Asy’ari. Silsilah Hadratussyekh KH Hasyim Asy’ari tersambung sampai Rosulullah SAW. Adapun silsilah dari Hadratussyekh KH Hasyim Asy’ari adalah sebagai berikut :\n1. Hadratussyekh KH Hasyim Asy’ari Syaikh \n2. Mahfudz at-Termasi. \n3. Syaikh Nawawi al-Bantani \n4. Sayyid Ahmad Zaini Dahlan. \n5. Imam Ahmad ad-Dasuqi. \n6. Imam Ibrahim al-Baijuri. \n7. Imam Abdullah as-Sanusi. \n8.  Imam ‘Abduddin al-‘Iji. \n9. Imam Muhammad bin Umar Fakhrurrazi. \n10. Imam Abdul Karim asy-Syahrastani. \n11. Hujjatul Islam Abu Hamid Muhammad al-Ghozali. \n12. Imam Abdul Malik al-Haramain al-Juwaini. \n13. Imam Abubakar al-Baqillani. \n14. Imam Abdullah al-Bahili. \n15. Imam Abu al-Hasan Ali al-Asy’ari. \n16. Abu Ali al-Juba’i. \n17. Abu Hasyim al-Juba’i. \n18. Abu al-Hudzail al-‘Allaf. \n19. Ibrahim An-Nadzdzam. \n20. Amr bin Ubaid. \n21. Washil bin Atha’. \n22. Sayyidina Muhammad bin Ali bin Abi Thalib. \n23. Sayyidina Ali bin Abi Thalib. \n24. Sayyidina Rasulullah Muhammad SAW.", "t": "Susah", "k": "A"}, {"id": "NU-60", "m": "NU", "n": 60, "q": "Masyarakat Nahdyin ketika akan melaksanakan sholat senantiasa melafadzkan Niat. Hal tersebut menjadi salah satu perdebatan akan hukum dalam pelafadzan niat ketiaka akan melaksanakan sholat. Ada yang menghukumi bidan dan sebagian besar  Ulama' madzhab Syafi'i menghukumi sunnah. Bagaiamana pandangan anda terhadap hal tersebut?\nJawab :\nNiat dalam shalat merupakan rukun yang pertama, bahkan yang paling utama. Sebelum masuk ke rukun-rukun yang lain, seorang mushalli (orang yang melaksanakan shalat) terlebih dahulu haruslah berniat melakukan shalat. Dalam kitab-kitab fikih terdapat tiga komponen penting dalam niat. Yaitu, al-qashdu, ‘bermaksud mengerjakan shalat’, at-ta’arrudh, ‘menyatakan status kefarduan atau kesunnahan shalat tersebut’, dan at-ta’yin, ‘menentukan shalat yang dikerjakannya, seperti zuhur, asar, atau yang lain’.\n\nNiat adalah poros dan barometer utama segala aktivitas, termasuk shalat. Mulai dari ihwal keabsahan, hingga urusan kualitas shalat yang dilakukan. Hal ini merujuk pada penggalan hadist Rasulullah shallallahu ‘alaihi wasallam yang sangat masyhur, innamal a‘mâlu binniyyât (amal perbuatan itu hanya tergantung pada niatnya).\n\nUntuk urusan kewajiban berniat melakukan shalat, semua ulama sepakat. Kendati berbeda dalam hal teknis dan kapan seorang mushalli harus memasang niatnya. Namun, masalah melafalkan niat, mereka berselisih pandang. Menurut sekalian penganut mazhab Syafi’i (Syafi’i sentris), melafalkan niat shalat hukumnya sunnah. Karena sangat membantu terhadap kekhusyukan seseorang. Dalilnya menggunakan qiyas atau analogi hukum terhadap kesunnahan melafalkan niat haji dan umrah. Dengan titik temu bahwa keduanya (haji dan shalat) sama-sama rukun Islam.   Hukum ini berdasarkan âtsâr as-shahâbah Sayidina Umar dalam kitab Syarh Ma'ânî al-Âtsâr (juz 2, hal. 146) karya Abu Ja’far Ahmad bin Muhammad at-Thahawi (321 H) berikut:\n  \nعن رسول الله صلى الله عليه وسلم أنه أتآه آت من ربه فقال له: قل عمرة في حجة\n\nArtinya, “Dari Rasulullah SAW, bahwa nabi pernah didatangi oleh utusan Tuhannya (malaikat Jibril), lalu menyampaikan kepada nabi, ‘Ucapkanlah umarah dalam haji’.”   Ini sejalan dengan keterangan dalam kitab Syarh al-Yâqût an-Nafîs (hal. 133), karya habib Ahmad bin Muhammad bin Umar Asy-Syâthiriy:\n\nفنحن قسنا نية الصلاة بنية الحج لأن كلا منهما ركن من أركان الإسلام، هكذا يقول الشافعية\n\nArtinya, “Kami menganalogikan (hukum kesunnahan melafalkan) niat shalat dengan niat haji, karena keduanya sama-sama rukun Islam. Demikianlah pendapat Syafi’i sentris (syafi‘iyul madzhab).”   Sementara sebagian ulama selain Syafi’iyah—dalam Syarh al-Yâqût an-Nafîs (hal. 133)—berpendapat bahwa melafalkan niat shalat itu termasuk laku bid’ah. Golongan ini berlandas pada hadist riwayat Sayidina Anas bin Malik, sebagaimana dalam Syarh al-Yâqût an-Nafîs (hal. 133) yang berbunyi :\n\nصليت خلف رسول الله صلى الله عليه وسلم وأبي بكر وعمر فلم أسمع إلا ألله أكبر\n\nArtinya, “Aku shalat di belakang Rasulullah shallallahu ‘alaihi wasallam, Abu Bakr, dan Umar, dan tiada lain yang kudengar kecuali ‘Allahu Akbar’.”   Hadist ini menjadi dalil kuat bagi segolongan ulama yang memandang lafal niat shalat sebagai amal bid’ah. Terbukti, setiap kali Anas bin Malik bermakmum, tak pernah mendengar mereka melafalkannya. Ibnul Qayyim al-Jauziyah sendiri sangat anti terhadap pendapat yang mengatakan sunnah. Namun, menurut sebagian ahli hadits, riwayat Anas bin Malik di atas adalah hadits yang bermasalah (al-mu’allal atau al-qadh).   Bahkan, sebagian ulama lainnya berusaha menengahi dua pendapat tersebut menggunakan pendekatan kombinasi antara dalil-dalil yang bertentangan (al-jam’u wattaufiq baina al-adillah al-muta’aridhah), mereka mengatakan, sebagaimana yang ditulis habib Ahmad bin Muhammad bin Umar Asy-Syâthiriy di kitab dan halaman yang sama:   وبعضهم قال: إن أنسا لم يسمع التلفظ، ولربما أنه صلى في الصفوف الأخيرة   Artinya, “Sebagian ulama berpendapat, ‘sayidina Anas tidak mendengar (suara nabi, Abu Bakr, dan Umar) yang melafalkan niat shalat, barangkali karena ia shalat di saf-saf bagian belakang'.”   Menyikapi silang pendapat di atas, ada beberapa ulama yang menilai kasus di atas secara lebih realistis, semisal imam Hasan bin Ammar bin Ali al-Hanafi (1069 H). Dalam kitabnya Marâqil Falah Syarh Matni Nuril Îdhâh (juz 1, hal. 84), ia menjelaskan: \n\n فمن قال من مشايخنا إن التلفظ بالنية سنة لم يرد به سنة رسول الله صلى الله عليه وسلم بل سنة بعض المشايخ لإختلاف الزمان وكثرة الشواغل على القلوب فيما بعد زمان التابعين   \n\nArtinya, “Pendapat dari sebagian guru kita yang mengatakan sunnah melafalkan niat (shalat) merupakan sebuah kesunnahan atau anjuran yang datangnya bukan dari Rasulullah SAW, akan tetapi, merupakan anjuran mereka para guru (kepada sekalian muridnya). Mengingat zaman yang tidak lagi sama (dengan kehidupan para tabiin) dan banyaknya faktor yang dapat menyita kekhusyukan umat setelah para tabiin.”", "t": "Susah", "k": "A"}, {"id": "NU-61", "m": "NU", "n": 61, "q": "LAJNAH adalah…………?\nJawab :\nLajnah adalah perangkat organisasi untuk melaksanakan program yang memerlukan penanganan khusus.", "t": "Susah", "k": "A"}, {"id": "NU-62", "m": "NU", "n": 62, "q": "NU mempunyai 14 Lembaga sebutkan……….?\nJawab :\na.\tLDNU : Lembaga Dakwah\nb.\tLPMNU : Lembaga Pendidikan Ma’arif\nc.\tRMI : Robithoh Ma’ahid Al-Islamiyah, melaksanakan di bidang pengembangan pondok pesantren\nd.\tLPNU : Lembaga Perekonomian Warga NU\ne.\tLP2NU : Lembaga Pengembangan Pertanian , lingkungan hidup dan kelautan\nf.\tF. LKKNU. : Lembaga kemaslahatan keluarga\ng.\tLAKPESDAM : Lembaga kajian dan pengembangan sumber daya manusia\nh.\tLPBHNU. : Lembaga penyuluhan dan Bantuan hukum\ni.\tLESBUMI. : Lembaga seniman budayawan Muslimin Indonesia\nj.\tLAZISNU : Lembaga Amil Zakat infaq dan shodaqoh\nk.\tLWPNU : Lembaga Waqof dan Pertanahan , bangunan\nl.\tLBM : Lembaga Bahsul Masail\nm.\tLTMI : Lembaga Ta’mir Masjid Indonesia\nn.\tLPKNU. : Lembaga Pelayanan Kesehatan.", "t": "Susah", "k": "A"}, {"id": "NU-63", "m": "NU", "n": 63, "q": "NU mengikuti paham Ahli Sunnah waljamaah dan menggunakan Jalan pendekatan Madzhab yaitu.:\nJawab :\na.\tDALAM BIDANG AQIDAH , NU mengikuti faham Imam Abul Hasan Al-asy’ari dan Imam Abu Mansur Al-maturidi.\nb.\tDALAM BIDANG FIQIH , NU mengikuti Imam Abu Hanifah an-nu’man , Imam Malik bin Anas , Imam Muhammad bin Idris As-syafi’i , Imam Ahmad bin Hambal.\nc.\tDALAM BIDANG TASAWUF : NU mengikuti Imam Junaedi al-Baghdadi , Imam Al-Ghazali dan Imam-imam lain.", "t": "Mudah", "k": "A"}, {"id": "NU-64", "m": "NU", "n": 64, "q": "Terangkan tentang Sikap Kemasyarakatan NU ……………?\nJawab :\nAda tiga Pendekatan kemasyarakatan NU :\na.\tTAWASSUT dan I’TIDAL : \nyaitu Sikap moderat yang berpijak pada prinsip keadilan serta berusaha menghindari segala bentuk pendekatan dengan Tathoruf ( ekstrim )\nb.\tTASAMMUH : \nyaitu Sikap toleran yang berintikan penghargaan terhadap perbedaan pandangan dan kemajemukan identitas budaya masyarakat.\nc.\tTAWAZUN : \nyaitu sikap seimbang dalam berkhidmat demi terciptanya keserasian hubungan antara sesama umat manusia dan antara manusia dengan Allah SWT.", "t": "Mudah", "k": "A"}, {"id": "NU-65", "m": "NU", "n": 65, "q": "Jelaskan pengertian Israf? \nJawaban:  \nIsraf artinya melampaui batas. Perbuatan Israf bermakna perbuatan yang melampaui batas, seperti dalam hal makanan, minuman, berpakaian, berhias, menggunakan peralatan, atau hidup bermewah-mewahan.", "t": "Mudah", "k": "A"}, {"id": "NU-66", "m": "NU", "n": 66, "q": "Apa yang dimaksud dengan  gibah? \nJawaban: \nGibah yaitu membicarakan aib atau cela ( keburukan ) seseorang atau suatu pihak kepada orang lain. Hukum perbuatan ini adalah dosa besar.", "t": "Mudah", "k": "A"}, {"id": "NU-67", "m": "NU", "n": 67, "q": "Apa yang dimaksud dengan Ijtihad?\nJawab :\nIjtihad adalah usaha yang dilakukan untuk mencapai sesuatu melalui pemikiran yang didasarkan oleh Alquran dan Hadist. Kata Ijtihad menurut bahasa artinya mengerahkan segala kesanggupan untuk mengerjakan sesuatu yang sulit. Kata Ijtihad berasal dari bahasa Arab, “Al-Jahdu” yang artinya “daya upaya atau usaha yang keras.” Dari pemahaman tersebut, dipahami bahwa Ijtihad adalah pengerahan seluruh kemampuan untuk melakukan sebuah proses penafsiran untuk memperluas pemahaman hukum Islam.", "t": "Susah", "k": "A"}, {"id": "NU-68", "m": "NU", "n": 68, "q": "Sebutkan tujuan dan syarat menjadi Mujtahid?\nJawab :\nTujuan Ijtihad adalah untuk memberikan pedoman hidup bagi manusia, ketika menemukan solusi atas sebuah permasalahan yang belum ada dalilnya dalam Al-Qur’an dan Hadist. Maka dari itu tidak bisa sembarangan orang menjadi Mujtahid atau Mujtahida, berikut adalah syarat-syarat melakukan Ijtihad:\n1. Memahami ayat dan sunnah yang berhubungan dengan hukum. \n2. Mengetahui masalah-masalah yang telah diijma’kan oleh para ahlinya. \n3. Memahami Nasikh dan Mansukh. \n4. Memahami Bahasa Arab dan ilmu-ilmunya dengan sempurna. \n5. Memahami Ushul Fiqh.\n6. Memahami dengan jelas rahasia-rahasia Tasyrie’ (Asrarusyayari’ah).\n7. Mengetahui kaidah-kaidah Ushul Fiqh.\n8. Mengetahui seluk beluk Qiyas.", "t": "Susah", "k": "A"}, {"id": "NU-69", "m": "NU", "n": 69, "q": "Sebutkan Jenis-jenis ijtihad dan pengertiannya?\nJawab :\nA. Ijma’ \nB. Qiyas \nC. Maslahah Mursalah .\nD. Sududz Dzariah \nE. Istishab \nF. Urf \nG. Istihsan", "t": "Mudah", "k": "A"}, {"id": "NU-70", "m": "NU", "n": 70, "q": "Apa yang dimaksud dengan Ijma'?\nJawab :\nIjma’ merupakan kesepakatan untuk menetapkan hukum sebuah masalah sesuai dengan ketentuan agama Islam. Kemudian, kesepakatan tersebut menghasilkan Fatwa yang artinya keputusan yang sudah diambil bersama dan harus diikuti oleh semua umat.", "t": "Mudah", "k": "A"}, {"id": "NU-71", "m": "NU", "n": 71, "q": "Apa yang dimaksud dengan Qiyas?\nJawab :\nQiyas sederhananya adalah sebuah pengibaratan atau analogi terhadap hukum sesuatu dengan melihat persamaan prinsip. Misalnya, ketika sebuah perkara yang terjadi di masa kini pernah terjadi di masa sebelumnya dan memiliki kesamaan sebab, akibat, bahaya, dan aspek lainnya. Hasil keputusan Qiyas disamakan dengan hasil ketetapan perkara sebelumnya.", "t": "Mudah", "k": "A"}, {"id": "NU-72", "m": "NU", "n": 72, "q": "Apa yang dimaksud dengan Sududz Dzariah?\nJawab :\nSududz Dzariah adalah sebuah keputusan hukum atas hal mubah, makruh, atau haram demi kepentingan umat Islam. Salah satu contohnya adalah menanam pohon anggur. Dalam Islam, diperbolehkan untuk menanam pohon anggur namun haram hukumnya jika anggur tersebut diproduksi menjadi minuman keras.", "t": "Mudah", "k": "A"}, {"id": "NU-73", "m": "NU", "n": 73, "q": "Jelaskan pengertian Urf?\nJawab :\nUrf adalah penetapan bolehnya suatu adat istiadat dan kebebasan suatu masyarakat selama tidak bertentangan dengan Al-Quran dan Hadist. Misalnya berdasarkan Al Urf al-Khash, yaitu urf yang berlaku pada suatu tempat, contohnya adalah kegiatan halal bihalal yang hanya berlaku di Indonesia.", "t": "Mudah", "k": "A"}, {"id": "NU-74", "m": "NU", "n": 74, "q": "Siapakah tokoh dibalik berdirinya IPNU/IPPNU\nJawab : \nK.H Prof Mohammad Tolhah Mansur. Beliau lahir di Malang 10 september 1930 dan wafat pada 20 Oktober 1986.", "t": "Mudah", "k": "A"}, {"id": "NU-75", "m": "NU", "n": 75, "q": "Siapakah yang memberikan tongkat dan tasbih kepada .H hasyim Asyari sebagai isyarat awal pendirian NU..\nJawab : \nK.H As’ad Samsul Arifin atas perintah syaikhona Holil Bangkalan Madura.\"", "t": "Mudah", "k": "A"}, {"id": "NU-76", "m": "NU", "n": 76, "q": "Siapakah Syaikhona Holil Bangkalan Madura itu..\nJawab :\nbeliau adalah guru dari K.H hasyim Asy’ari pendiri pondok pesantren syaikhona holil\"", "t": "Mudah", "k": "A"}, {"id": "NU-77", "m": "NU", "n": 77, "q": "Jelaskan apa yang dimaksud dengan Mu’tamar NU…..\nJawab : \nForum permusyawaratan tertinggi NU yang dilaksanakan untuk berbagai agenda yakni mengevaluasi kinerja kepengurusan, menyusun program baru, memilih pengurus untuk periode selanjutnya. Pertama kali dilaksanakan di Surabaya 21 Oktober 1926.\"", "t": "Mudah", "k": "A"}, {"id": "NU-78", "m": "NU", "n": 78, "q": "Kapan dan dimanakah Mu’tamar NU pertama kalinya dilaksanakan diluar pulau Jawa…\nJawab : \nDi Banjarmasin , 9 Juni 1936 M dengan hasil diantaranya :\na. Perbedaan antara Al-Quran dan Hadis Qudsi \nb. Kentongan daan bedug yang dipukul untuk memberitahukan waktu solat.", "t": "Mudah", "k": "A"}, {"id": "NU-79", "m": "NU", "n": 79, "q": "Jelaskan hasil Mu’tamar NU yang pertama kalinya dilaksanakan…..\nJawab : \na. Hokum bermadzhab\nb. Sodaqoh untuk mayit\nc. Memperbaiki/memperbaharui nisan dalam kuburan umum", "t": "Mudah", "k": "A"}, {"id": "NU-80", "m": "NU", "n": 80, "q": "Ada 9 tokoh NU yang bergelar pahlawan Nasional, siapakah mereka…..\nJawab :\na.\tK.H Hasyim Asy’ari\nb.\tK.H Abdul Wahid Hasyim\nc.\tK.H Zainul Arifin\nd.\tK.H Zainul Mustafa\ne.\tK.H Idham Chalid\nf.\tK.H Abdul Wahab Hasbullah\ng.\tK.H As’ad Syamsul Arifin\nh.\tK.H Syam’un\ni.\tK.H Masykur", "t": "Mudah", "k": "A"}, {"id": "NU-81", "m": "NU", "n": 81, "q": "NU pernah berpendapat bahwa Indonesia ketika masih dijajah Belanda adalah Darul Islam ( negara Islam) hal ini sesuai dengan mu’tamar yang keberapa….\nJawab :\nHasil mu’tamar ke 11 di Banjar Masin pada tahun 1936.", "t": "Mudah", "k": "A"}, {"id": "NU-82", "m": "NU", "n": 82, "q": "Sebutkan struktur lembaga kepengurusan NU!\nJawab: \na)\tMustasyar (penasehat)\nb)\tSyuriah (pimpinan tertinggi) terdiri dari: -Rois umum, -wakil rois umum, -katib dan a’wan (anggota)\nc)\tTanfidziyah (pelaksana) terdiri dari: - ketua umum, -sekjen, -bendahara, -a’wan.\"", "t": "Mudah", "k": "A"}, {"id": "NU-83", "m": "NU", "n": 83, "q": "Dalam melaksanakan kerjanya, NU mempunyai tiga perangkat organisasi. Sebutkan!\nJawab: \na. Badan otonom\nb. lajnah\nc. Lembaga\"", "t": "Mudah", "k": "A"}, {"id": "NU-84", "m": "NU", "n": 84, "q": "Siapakah Tokoh yang membuat Simbol atau lambang NU?\nJawaban : \nKH. Ridwan dari Surabaya.\"", "t": "Mudah", "k": "A"}, {"id": "HADIS-1", "m": "HADIS", "n": 1, "q": "Apa yang dimaksud dengan hadist?\nJawaban:\nHadits menurut istilah syara' ialah hal-hal yang datang dari Rasulullah SAW, baik itu ucapan, perbuatan, atau pengakuan (taqrir).", "t": "Mudah", "k": "A"}, {"id": "HADIS-2", "m": "HADIS", "n": 2, "q": "Contoh hadits apa saja 6 jenis hadits, mulai dari perkataan hingga Perbuatan Rasulullah…\nJawab:1. Hadits Qauli2. Hadits Fi'li3. Hadits Taqriri4. Hadits Hammi5. Hadits Ahwali6. Hadits Qudsi", "t": "Mudah", "k": "A"}, {"id": "HADIS-3", "m": "HADIS", "n": 3, "q": "Hadis itu ada berapa?\nJawaban:\nSecara umum, macam-macam hadist terbagi menjadi 3 yaitu hadist shahih, hadist hasan, dan hadist dhaif", "t": "Mudah", "k": "A"}, {"id": "HADIS-4", "m": "HADIS", "n": 4, "q": "Dari mana hadis berasal?\nJawaban: \nKata hadis berasal dari bahasa Arab al-hadits yang mempunyai arti di antarannya \"baru\" dan \"kabar\" atau \"berita\". 'Abd al-Baqa' sebagaimana dikutip oleh Suhbi Shalih menyatakan bahwa kata hadis merupakan kata benda dari tahdits yang berarti pembicaraan", "t": "Mudah", "k": "A"}, {"id": "HADIS-5", "m": "HADIS", "n": 5, "q": "Apa saja fungsi hadist?\nJawaban:  \n4 Fungsi Hadis Terhadap Alquran,\n1. Penting Dipahami Bayan At-Taqrir (Memperjelas isi Alquran )\n2. Bayan At-Tafsir (Menafsirkan isi Alquran)\n3. Bayan At-Tasyri (Memberi kepastian hukum Islam yang tidak ada di Al Quran)\n4. Bayan Nasakh (Mengganti ketentuan terdahulu)", "t": "Mudah", "k": "A"}, {"id": "HADIS-6", "m": "HADIS", "n": 6, "q": "Siapa perawi pertama?\nJawaban: \nNama sahabat Nabi yang menjadi saksi atau perawi pertama Hadis ini adalah Umar bin Khatab", "t": "Mudah", "k": "A"}, {"id": "HADIS-7", "m": "HADIS", "n": 7, "q": "Siapa saja ulama hadits?\nJawaban:\nPERAWI HADIS.\n1. IMAM BUKHARI (194-256 H/ 773-835 M)\n2. IMAM MUSLIM (204-261 H/ 783-840 M)\n3. IMAM ABU DAWUD (202-275 H/ 817-889 M)\n4. IMAM AT-TIRMIDZI (209-279 H/ 824-892 M)\n5. IMAM AN-NASA'I (215-303 H/ 830-915 M)\n6. IMAM IBNU MAJAH (209-273 H/ 824-887 M)\n7. IMAM AHMAD (164-241 H/ 780-855 M)", "t": "Susah", "k": "A"}, {"id": "HADIS-8", "m": "HADIS", "n": 8, "q": "Siapa yang menulis hadits?\nJawaban: \nShahih Bukhari, disusun oleh Bukhari (194-256 H). Shahih Muslim, disusun oleh Muslim (204-262 H). Sunan Abu Dawud, disusun oleh Abu Dawud (202-275 H). Sunan at-Tirmidzi, disusun oleh At-Tirmidzi (209-279 H)", "t": "Mudah", "k": "A"}, {"id": "HADIS-9", "m": "HADIS", "n": 9, "q": "Apa saja unsur unsur hadits?\nJawaban:\nSecara umum, sebuah riwayat dapat dikatakan sebagai hadits manakala ia melengkapi setidaknya lima unsur penting berikut, yaitu rawi, sanad, mukharrij, shiyaghul ada' dan matan hadits.", "t": "Mudah", "k": "A"}, {"id": "HADIS-10", "m": "HADIS", "n": 10, "q": "Apa nama lain dari hadits?\nJawaban:\nAda beberapa istilah lain yang merupakan sinonim dari kata hadis, yaitu sunnah, khabar dan atsar.", "t": "Mudah", "k": "A"}, {"id": "HADIS-11", "m": "HADIS", "n": 11, "q": "Apa ciri ciri hadits hasan?\nJawaban:\nKriteria-kriteria hadits hasan dibagi menjadi lima, yakni; Periwayat (sanad) bersambung, Diriwayatkan oleh rawi yang adil, Diriwayatkan oleh rawi yang hafal (dhabith), tetapi tingkat kehafalannya masih di bawah hadits shahih, Tidak bertentangan dengan hadits dengan rawi yang tingkat dipercayanya lebih tinggi", "t": "Mudah", "k": "A"}, {"id": "HADIS-12", "m": "HADIS", "n": 12, "q": "Siapa penulis hadis pertama?\nJawaban:\nAz-Zuhri adalah ulama besar dari kelompok tabiin pertama yang membukukan hadis.", "t": "Mudah", "k": "A"}, {"id": "HADIS-13", "m": "HADIS", "n": 13, "q": "Kapan hadis ada?\nJawaban:\nWalaupun pada masa awal Islam sudah ada catatan-catatan hadis yang ditulis beberapa sahabat, penulisan hadis secara khusus baru dimulai sejak permulaan abad kedua Hijriyah. Waktu itu, Muslimin diperintah oleh Kekhalifahan Bani Umayyah.", "t": "Mudah", "k": "A"}, {"id": "HADIS-14", "m": "HADIS", "n": 14, "q": "Kenapa hadis muncul?\nJawaban:\nHadis muncul dalam kepentingan menafsirkan ayat Al- Qur'an yang masih bersifat umum. Hadis muncul dalam konteks memperkuat dan menetapkan hukum-hukum yang telah ada di dalam Al-Qur'an.", "t": "Mudah", "k": "A"}, {"id": "HADIS-15", "m": "HADIS", "n": 15, "q": "Mengapa hadist penting dipelajari?\nJawaban:\nHadist merupakan sumber kedua dalam pengambilan sebuah hukum setelah Al-qurâ€™an, secara bahasa hadist berarti khabar, yaitu berita, peristwa. Namun secara istilah hadist adalah sesuatu yang disandarkan kepada Rasulullah SAW baik dalam perkataan, perbuatan ataupun taqrir.", "t": "Mudah", "k": "A"}, {"id": "HADIS-16", "m": "HADIS", "n": 16, "q": "Apa perbedaan antara hadis dan sunnah?\nJawaban:\nHadits dan sunnah: hadits terbatas pada perkataan, perbuatan, takrir yang bersumber pada Nabi SAW, sedangkan sunnah segala yang bersumber dari Nabi SAW baik berupa perkataan, perbuatan, takrir, tabiat, budi pekerti atau perjalanan hidupnya, baik sebelum di angkat menjadi rasulmaupun sesudahnya", "t": "Mudah", "k": "A"}, {"id": "HADIS-17", "m": "HADIS", "n": 17, "q": "Bagaimana kedudukan hadits dalam Islam?\nJawaban:\nHadis menempati posisi kedua setelah Al-Quran.", "t": "Mudah", "k": "A"}, {"id": "HADIS-18", "m": "HADIS", "n": 18, "q": "Mengapa hadis sebagai sumber hukum Islam?\nJawaban:\nFungsi hadits sebagai sumber hukum Islam yang pertama yakni adalah Bayan At-Taqrir atau memperjelas isi Al-Qur'an. Hadits berfungsi untuk memperjalas isi Al-Qur'an, agar lebih mudah dipahami dan menjadi petunjuk umat manusia dalam menjalankan perintah dari Allah SWT", "t": "Mudah", "k": "A"}, {"id": "HADIS-19", "m": "HADIS", "n": 19, "q": "Apa syarat hadis yang menjadi sumber hukum Islam?\nJawaban:\nSyarat sebuah hadis yang pertama ialah ittishalus sanad atau sanadnya bersambung. Baik itu marfu' (tersambung sampai Rasulullah SAW) atau mauquf (sampai sahabat saja).", "t": "Mudah", "k": "A"}, {"id": "HADIS-20", "m": "HADIS", "n": 20, "q": "Siapa yang banyak menghafal hadits?\nJawaban:\nAbu Hurairah merupakan orang yang paling banyak menghabiskan waktu bersama Nabi daripada sahabat lainnya. Abu Hurairah mempunyai kelebihan yaitu ingatannya kuat, sehingga mampu menghafal semua hadis Rasul", "t": "Mudah", "k": "A"}, {"id": "HADIS-21", "m": "HADIS", "n": 21, "q": "Bagaimana periwayatan hadis?\nJawaban:\nPeriwayatan (riwayat) Hadis adalah proses penerimaan Hadis oleh seorang Rawi dari seorang gurunya dan setelah dipahami, dihafal, dihayati, diamalkan, ditulis dan disampaikan kepada orang lain sebagai murid dengan menyebutkan sumber pemberitaan riwayat tersebut", "t": "Mudah", "k": "A"}, {"id": "HADIS-22", "m": "HADIS", "n": 22, "q": "Periwayatan hadis ada berapa?\nJawaban:\nMayoritas ulama membagi metode periwayatan hadis menjadi 8 macam: (1) al-sama' (2) al-ardh atau al-qiroah (3) al-ijazah (4) al-munawalah (5) al-mukatabah (6) al-i'lam (7) al-washiyyah dan (8) al-wijadah", "t": "Mudah", "k": "A"}, {"id": "HADIS-23", "m": "HADIS", "n": 23, "q": "Siapa Tokoh Ilmu Hadis?\nJawaban:\nTokoh ilmu hadis beserta kumpulan hadis yang ditulisnya: Imam Bukhari, penyusun Shahih Bukhari. Imam Muslim, penyusun Shahih Muslim. Imam Abu Dawud, penyusun Sunan Abu Dawud", "t": "Mudah", "k": "A"}, {"id": "HADIS-24", "m": "HADIS", "n": 24, "q": "Apa hadis pertama?\nJawaban:\nHadits yang pertama kali diajarkan adalah hadits tentang kasih sayang, bukan hadits tentang akidah, fikih, dan lain sebagainya", "t": "Mudah", "k": "A"}, {"id": "HADIS-25", "m": "HADIS", "n": 25, "q": "Mengapa Nabi melarang sahabat menuliskan hadits?\nJawaban:\nLarangan tersebut dilatarbelakangi karena untuk menghinrdarkan adanya kemungkinan para sahabat menulis wahyu (Al Qur'an) dan memasukkan aI hadits kedalam Iembaran AI Qur'an. Untuk itu Rasulullah mengkhawatirkan akan bercampur aduk antara Al Qur'an dan Hadits.", "t": "Mudah", "k": "A"}, {"id": "HADIS-26", "m": "HADIS", "n": 26, "q": "Apa saja cabang cabang ilmu hadits?\nJawaban:\nCabang-cabang Ilmu Hadits meliputi, Ilmu hadits Riwayah, . Ilmu Jarh Wa Ta'dil, 'Ilmu 'Ilal Al-Hadits, 'Ilmu Ghorib Al-Hadits, Ilm Mukhtalif Al-Hadits, Ilmu Nasikh wa Mansukh, 'Ilmu Fann Al-Mubhamat, 'Ilmu Asbab Wurud Al-Hadits, Ilmu tashif wa Tahrif, Imu Mushalah Al-Hadits, Imu Tarikh al_Ruwah.", "t": "Mudah", "k": "A"}, {"id": "HADIS-27", "m": "HADIS", "n": 27, "q": "Apa saja 3 unsur utama hadis?\nJawaban:\nSanad, matan dan rawi menjadi unsur yang penting untuk menentukan derajat sebuah hadits.", "t": "Mudah", "k": "A"}, {"id": "HADIS-28", "m": "HADIS", "n": 28, "q": "Apa saja ciri ciri Hadits Shahih?\nJawaban:\nHadits sahih ialah hadits yang sanadnya bersambung, diriwayatkan oleh perawi yang berkualitas dan tidak lemah hafalannya, di dalam sanad dan matannya tidak ada syadz dan illat", "t": "Mudah", "k": "A"}, {"id": "HADIS-29", "m": "HADIS", "n": 29, "q": "Mengapa sebuah hadis harus menggunakan sanad?\nJawaban:\nPenggunaan sanad dalam periwayatan hadis menjadi penting karena hadis adalah salahsatu sumber ajaran Islam yang tentu keasliannya harus dijaga antara lain dengan menjaga kevalidan sanad itu sendiri.", "t": "Mudah", "k": "A"}, {"id": "HADIS-30", "m": "HADIS", "n": 30, "q": "Berapa jumlah hadits yang shahih?\nJawaban:\nDi dalam Shahih Al-Bukhari terdapat lebih dari 7.000 hadits termasuk yang diulang di dalam 97 jilid buku. Sedangkan di dalam Shahih Muslim jumlahnya sekitar 7500 hadits termasuk pengulangan dalam 57 jilid. Kedua kitab tersebut belumlah merangkum semua hadits shahih yang ada", "t": "Mudah", "k": "A"}, {"id": "HADIS-31", "m": "HADIS", "n": 31, "q": "Kenapa bisa ada hadits palsu?\nJawaban:\nDalam karyanya yang berjudul Al-Manhalul Lathif fi Ushulil Hadits As-Syarif, Sayyid Alawi Al-Maliki menjelaskan beberapa faktor dibuatnya hadits-hadits palsu: pertama, mempertahankan kepentingan pribadi; kedua, mendekatkan diri kepada pejabat tertentu (orang-orang yang berkepentingan); ketiga, mencari rizki; keempat, membela pendapat terten
